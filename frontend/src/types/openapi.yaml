components:
    schemas:
        v1.AddUserRequest:
            type: object
            properties:
                username:
                    type: string
                    description: 账号
                password:
                    type: string
                    description: 密码
                email:
                    type: string
                    description: 邮箱
                name:
                    type: string
                    description: 昵称
                avatar:
                    type: string
                    description: 头像url
                bio:
                    type: string
                    description: bio
                tags:
                    type: string
                    description: 标签
                status:
                    type: integer
                    description: status
                    format: enum
                roleId:
                    type: string
                    description: 角色id
            description: 添加用户请求
        v1.AddUserResponse:
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/v1.UserInfo'
                    description: 用户信息
            description: 添加用户响应
        v1.AdminAddPermissionsRequest:
            type: object
            properties:
                type:
                    type: integer
                    description: 类型
                    format: enum
                parentId:
                    type: string
                    description: 父级菜单id
                title:
                    type: string
                    description: 标题
                icon:
                    type: string
                    description: 图标
                order:
                    type: integer
                    description: 排序
                    format: int32
                path:
                    type: string
                    description: 路径
                status:
                    type: integer
                    description: 状态
                    format: enum
                permissions:
                    type: string
                    description: 权限标识
            description: 管理员添加权限菜单请求
        v1.AdminAddPermissionsResponse:
            type: object
            properties: {}
            description: 管理员添加权限菜单响应
        v1.AdminAddRoleRequest:
            type: object
            properties:
                description:
                    type: string
                    description: 角色描述
                name:
                    type: string
                    description: 角色昵称
                status:
                    type: integer
                    description: 角色状态
                    format: enum
                menuIds:
                    type: array
                    items:
                        type: string
                    description: 角色菜单id
            description: 添加角色请求
        v1.AdminAddRoleResponse:
            type: object
            properties:
