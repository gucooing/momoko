                  description: 用户id
                  schema:
                    type: array
                    items:
                        type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1.DeleteUserResponse'
    /api/v1/user/list:
        get:
            tags:
                - UserService
            description: 获取用户列表
            operationId: UserService_ListUser
            parameters:
                - name: page
                  in: query
                  description: page
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  description: page size
                  schema:
                    type: string
                - name: status
                  in: query
                  description: status filter
                  schema:
                    type: integer
                    format: enum
                - name: username
                  in: query
                  description: 关键字：匹配用户名 / 昵称 / 邮箱 / 最近登录 IP
                  schema:
                    type: string
                - name: roleId
                  in: query
                  description: 按角色筛选
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1.ListUserResponse'
    /api/v1/user/me:
        get:
            tags:
                - UserService
            description: 获取自己的信息
            operationId: UserService_MeInfo
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1.MeInfoResponse'
    /api/v1/user/me/login-logs:
        get:
            tags:
                - UserService
            description: 获取自己的登录日志
            operationId: UserService_MyLoginLogs
            parameters:
                - name: page
                  in: query
                  description: page
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  description: page size
                  schema:
                    type: string
                - name: success
                  in: query
                  description: 按结果筛选（空为全部）
                  schema:
                    type: boolean
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1.MyLoginLogsResponse'
    /api/v1/user/{userId}:
        get:
            tags:
                - UserService
            description: 获取用户详情
            operationId: UserService_UserInfo
            parameters:
                - name: userId
                  in: path
                  description: 用户id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1.UserInfoResponse'
        put:
            tags:
                - UserService
            description: 更新用户
            operationId: UserService_EditUser
            parameters:
                - name: userId
                  in: path
                  description: 用户id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/v1.EditUserRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1.EditUserResponse'
    /api/v1/user/{userId}/password:
        put:
            tags:
                - UserService
            description: 管理员重置用户密码（重置后该用户所有会话下线）
            operationId: UserService_ResetUserPassword
            parameters:
                - name: userId
                  in: path
                  description: 用户id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/v1.ResetUserPasswordRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1.ResetUserPasswordResponse'
components:
    schemas:
        v1.APIKeyInfo:
            type: object
            properties:
                id:
                    type: string
                    description: API Key id
                name:
                    type: string
                    description: 名称
                apiKey:
                    type: string
                    description: API Key（签名种子）；列表和更新接口不返回完整值
                expiresAt:
                    type: string
                    description: 过期时间；空表示永久有效
                    format: date-time
                createTime:
                    type: string
                    description: 创建时间
                    format: date-time
                updateTime:
                    type: string
                    description: 更新时间
                    format: date-time
                permissions:
                    type: array
                    items:
                        type: string
                    description: 授予的节点权限
                keyId:
                    type: string
                    description: 公开密钥标识（由种子派生），主控请求时携带用于定位密钥
                remark:
                    type: string
                    description: 用途备注
                lastUsedTime:
                    type: string
                    description: 最近一次被远程主控调用的时间；空表示从未使用
                    format: date-time
                lastUsedIp:
                    type: string
                    description: 最近一次调用来源 IP
                status:
                    type: integer
                    description: 有效状态
                    format: enum
        v1.APIKeyPermissionSet:
            type: object
