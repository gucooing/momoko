    - name: IQCheckPublic
      description: 智商检测公开页接口；由站点的随机路径 slug 标识站点，无需登录
    - name: Initialize
      description: 系统初始化
    - name: InstanceManager
      description: 应用管理
    - name: NetworkManager
      description: 网络管理
    - name: NodeService
      description: 节点服务
    - name: OIDCService
      description: OIDC 服务端管理与授权服务
    - name: OpenSSHManager
      description: OpenSSH 管理
    - name: System
      description: 系统管理
    - name: TaskManager
      description: |-
        任务管理：通用任务管理器（pkg/task）的统一对外面板，可见可操作全部任务
         （文件复制/剪切/远端上传收尾、上传 GC、Docker 拉取、常驻任务等）。
    - name: TunnelManager
      description: 内网穿透（frp）管理
    - name: UserService
      description: 用户服务
