tags:
    - name: AuthService
      description: 认证服务
    - name: DockerManager
      description: Docker管理
    - name: FileManager
      description: 文件管理
    - name: Initialize
      description: 系统初始化
    - name: InstanceManager
      description: 应用管理
    - name: NetworkManager
      description: 网络管理
    - name: NodeService
      description: 节点服务
    - name: OpenSSHManager
      description: OpenSSH 管理
    - name: Sub2APIImageGen
      description: |-
        Sub2API Imagine 嵌入式生图。路由全部公开（无 momoko JWT），鉴权由业务层用
         X-Sub2API-Token 调 sub2api /keys 完成；user_id 取自 /keys 响应（可信）。
         每次生图即一个独立 Generation 任务，直接挂 user_id，无会话概念。
    - name: Sub2APIManager
      description: Sub2API 公共首页与管理
    - name: System
      description: 系统管理
    - name: TaskManager
      description: |-
        任务管理：通用任务管理器（pkg/task）的统一对外面板，可见可操作全部任务
         （文件复制/剪切/远端上传收尾、上传 GC、Docker 拉取、常驻任务等）。
    - name: TunnelManager
      description: 内网穿透（frp）管理
    - name: UserService
      description: 用户服务
