<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="每日抽奖">
  <!--
    Sub2API 自定义入口图标 · 每日抽奖（彩色版）
    青绿主色对齐 Momoko primary teal，可直接当站点自定义菜单图。
  -->
  <defs>
    <linearGradient id="box" x1="14" y1="20" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="lid" x1="12" y1="16" x2="52" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="32" y1="12" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- 柔光底圆 -->
  <circle cx="32" cy="32" r="30" fill="#14b8a6" fill-opacity="0.12"/>
  <circle cx="32" cy="32" r="30" stroke="#14b8a6" stroke-width="2" stroke-opacity="0.35"/>
  <!-- 礼盒身 -->
  <rect x="14" y="28" width="36" height="24" rx="4" fill="url(#box)"/>
  <!-- 礼盒盖 -->
  <path d="M12 28h40v-4a4 4 0 0 0-4-4H16a4 4 0 0 0-4 4v4z" fill="url(#lid)"/>
  <!-- 丝带 -->
  <path d="M32 20v32" stroke="url(#ribbon)" stroke-width="4" stroke-linecap="round"/>
  <path d="M14 36h36" stroke="url(#ribbon)" stroke-width="4" stroke-linecap="round"/>
  <!-- 蝴蝶结 -->
  <path d="M32 20c-5-7-12-9-14-6 3 3.5 8 5.5 14 6z" fill="#fbbf24"/>
  <path d="M32 20c5-7 12-9 14-6-3 3.5-8 5.5-14 6z" fill="#f59e0b"/>
  <circle cx="32" cy="20" r="2.6" fill="#fde68a"/>
  <!-- 星光 -->
  <path d="M50 11l1.35 3.5L55 15.85l-3.65 1.35L50 20.7l-1.35-3.5L45 15.85l3.65-1.35L50 11z" fill="#fbbf24"/>
  <path d="M56.5 22l.75 1.95 1.95.75-1.95.75L56.5 27.4l-.75-1.95-1.95-.75 1.95-.75L56.5 22z" fill="#fde68a"/>
</svg>
