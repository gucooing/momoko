<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="每日抽奖">
  <!--
    Sub2API 自定义入口图标 · 每日抽奖
    - 单色：fill/stroke 使用 currentColor，随主题变色
    - 建议尺寸：菜单 20–32px，卡片 48–64px
  -->
  <!-- 外圆底 -->
  <circle cx="32" cy="32" r="30" stroke="currentColor" stroke-width="2.5" opacity="0.18"/>
  <!-- 礼盒身 -->
  <rect x="14" y="28" width="36" height="24" rx="4" stroke="currentColor" stroke-width="2.5" fill="currentColor" fill-opacity="0.08"/>
  <!-- 礼盒盖 -->
  <path d="M12 28h40v-4a4 4 0 0 0-4-4H16a4 4 0 0 0-4 4v4z" stroke="currentColor" stroke-width="2.5" fill="currentColor" fill-opacity="0.12" stroke-linejoin="round"/>
  <!-- 竖丝带 -->
  <path d="M32 20v32" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 横丝带 -->
  <path d="M14 36h36" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 蝴蝶结左 -->
  <path d="M32 20c-4-6-10-8-12-6 2 3 6 5 12 6z" fill="currentColor"/>
  <!-- 蝴蝶结右 -->
  <path d="M32 20c4-6 10-8 12-6-2 3-6 5-12 6z" fill="currentColor"/>
  <!-- 结心 -->
  <circle cx="32" cy="20" r="2.2" fill="currentColor"/>
  <!-- 右上星光 · 抽奖感 -->
  <path d="M50 12l1.2 3.2L54.4 16.4l-3.2 1.2L50 20.8l-1.2-3.2L45.6 16.4l3.2-1.2L50 12z" fill="currentColor"/>
  <path d="M56 22l.7 1.8 1.8.7-1.8.7L56 27l-.7-1.8-1.8-.7 1.8-.7L56 22z" fill="currentColor" opacity="0.7"/>
</svg>
