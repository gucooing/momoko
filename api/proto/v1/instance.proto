syntax = "proto3";

package v1;

option go_package = "momoko/api/gen/v1;v1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "v1/file.proto";

// 应用管理
service InstanceManager {
  // 实例类型管理
  // 获取实例类型
  rpc GetInstanceTypes(GetInstanceTypesRequest) returns (GetInstanceTypesResponse) {
    option (google.api.http) = {
      get: "/api/v1/instance/type"
    };
  }
  // 创建实例类型
  rpc CreateInstanceType(CreateInstanceTypeRequest) returns (CreateInstanceTypeResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/type"
      body: "*"
    };
  }
  // 更新实例类型
  rpc UpdateInstanceType(UpdateInstanceTypeRequest) returns (UpdateInstanceTypeResponse) {
    option (google.api.http) = {
      put: "/api/v1/instance/type/{id}"
      body: "*"
    };
  }
  // 删除实例类型
  rpc DelInstanceType(DelInstanceTypeRequest) returns (DelInstanceTypeResponse) {
    option (google.api.http) = {
      delete: "/api/v1/instance/type/{id}"
    };
  }

  // 终端管理
  // 获取终端详情
  rpc GetTerminalInfo(GetTerminalInfoRequest) returns (GetTerminalInfoResponse){
    option (google.api.http) = {
      get: "/api/v1/instance/terminal"
    };
  }
  // 启动终端
  rpc StartTerminal(StartTerminalRequest) returns (StartTerminalResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/terminal/start"
      body: "*"
    };
  }
  // 停止终端
  rpc StopTerminal(StopTerminalRequest) returns (StopTerminalResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/terminal/stop"
      body: "*"
    };
  }
  // 重启终端
  rpc RestartTerminal(RestartTerminalRequest) returns (RestartTerminalResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/terminal/restart"
      body: "*"
    };
  }


  // 实例管理
  // 获取实例列表
  rpc GetInstances(GetInstancesRequest) returns (GetInstancesResponse) {
    option (google.api.http) = {
      get: "/api/v1/instance"
    };
  }
  // 创建实例
  rpc CreateInstance(CreateInstanceRequest) returns (CreateInstanceResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance"
      body: "*"
    };
  }
  // 获取实例详情
  rpc GetInstanceInfo(GetInstanceInfoRequest) returns (GetInstanceInfoResponse) {
    option (google.api.http) = {
      get: "/api/v1/instance/{id}"
    };
  }
  // 启动实例
  rpc StartInstance(StartInstanceRequest) returns (StartInstanceResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/instance/start/{id}"
      body: "*"
    };
  }
  // 停止实例
  rpc StopInstance(StopInstanceRequest) returns (StopInstanceResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/instance/stop/{id}"
      body: "*"
    };
  }
  // 重启实例
  rpc RestartInstance(RestartInstanceRequest) returns (RestartInstanceResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/instance/restart/{id}"
      body: "*"
    };
  }
  // 删除实例
  rpc DelInstance(DelInstanceRequest) returns (DelInstanceResponse) {
    option (google.api.http) = {
      delete: "/api/v1/instance/instance/del/{id}"
    };
  }
  // 更新实例
  rpc UpdateInstance(UpdateInstanceRequest) returns (UpdateInstanceResponse) {
    option (google.api.http) = {
      put: "/api/v1/instance/instance/{id}"
      body: "*"
    };
  }
  // 清空终端日志
  rpc DelInstanceLog(DelInstanceLogRequest) returns (DelInstanceLogResponse) {
    option (google.api.http) = {
      delete: "/api/v1/instance/instance/del/log/{id}"
    };
  }

  // 获取实例目录文件列表
  rpc GetInstanceFileList(GetInstanceFileListRequest) returns (GetInstanceFileListResponse) {
    option (google.api.http) = {
      get: "/api/v1/instance/file/{id}"
    };
  }
  // 创建实例目录内文件/文件夹
  rpc CreateInstanceFile(CreateInstanceFileRequest) returns (CreateInstanceFileResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/file/create/{id}"
      body: "*"
    };
  }
  // 重命名实例目录内文件/文件夹
  rpc RenameInstanceFile(RenameInstanceFileRequest) returns (RenameInstanceFileResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/file/rename/{id}"
      body: "*"
    };
  }
  // 批量删除实例目录内文件/文件夹
  rpc BatchDeleteInstanceFile(BatchDeleteInstanceFileRequest) returns (BatchDeleteInstanceFileResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/file/deletes/{id}"
      body: "*"
    };
  }
  // 压缩实例目录内文件/文件夹
  rpc BatchCompressInstanceFile(BatchCompressInstanceFileRequest) returns (BatchCompressInstanceFileResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/file/compress/{id}"
      body: "*"
    };
  }
  // 解压实例目录内压缩包
  rpc UnzipInstanceFile(UnzipInstanceFileRequest) returns (UnzipInstanceFileResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/file/unzip/{id}"
      body: "*"
    };
  }
  // 打开实例目录内文件
  rpc OpenInstanceFile(OpenInstanceFileRequest) returns (OpenInstanceFileResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/file/open/{id}"
      body: "*"
    };
  }
  // 实例目录内文件下载预签名
  rpc InstanceFilePreSign(InstanceFilePreSignRequest) returns (InstanceFilePreSignResponse) {
    option (google.api.http) = {
      get: "/api/v1/instance/file/pre-sign/{id}"
    };
  }
  // 实例目录内文件上传预签名
  rpc InstanceFilePreSignUpload(InstanceFilePreSignUploadRequest) returns (InstanceFilePreSignUploadResponse) {
    option (google.api.http) = {
      get: "/api/v1/instance/file/upload/pre-sign/{id}"
    };
  }
}

// 获取实例类型请求
message GetInstanceTypesRequest {}

// 获取实例类型响应
message GetInstanceTypesResponse {
  // 类型列表
  repeated InstanceTypeInfo types = 1;
}

// 创建实例类型请求
message CreateInstanceTypeRequest {
  // 类型名称
  string name = 1;
}

// 创建实例类型响应
message CreateInstanceTypeResponse {
  // 实例信息
  InstanceTypeInfo type = 1;
}

// 更新实例类型请求
message UpdateInstanceTypeRequest {
  // 类型id
  string id = 1;
  // 类型名称
  optional string name = 2;
  // 是否启用
  optional bool is_enable = 3;
}

// 更新实例类型响应
message UpdateInstanceTypeResponse {
  // 实例信息
  InstanceTypeInfo type = 1;
}

// 删除实例类型请求
message DelInstanceTypeRequest {
  // 类型id
  string id = 1;
}

// 删除实例类型响应
message DelInstanceTypeResponse {}

// 实例类型信息
message InstanceTypeInfo {
  // 类型id
  string id = 1;
  // 类型名称
  string name = 2;
  // 是否系统内置
  bool is_system = 3;
  // 是否启用
  bool is_enable = 4;
}

// 获取终端详情请求
message GetTerminalInfoRequest {}

// 获取终端详情响应
message GetTerminalInfoResponse {
  // 信息
  InstanceInfo info = 1;
}

// 启动终端请求
message StartTerminalRequest {}

// 启动终端响应
message StartTerminalResponse {}

// 停止终端请求
message StopTerminalRequest {}

// 停止终端响应
message StopTerminalResponse {}

// 重启终端请求
message RestartTerminalRequest{}

// 重启终端响应
message RestartTerminalResponse{}

// 获取实例列表请求
message GetInstancesRequest{
  // page
  int64 page = 1;
  // page size
  int64 page_size = 2;
  // 实例名称/标签
  optional string keywords = 3;
  // 类型
  optional string type = 4;
  // 状态
  optional InstanceStatus status = 5;
}

// 获取实例列表响应
message GetInstancesResponse{
  // actual page
  int64 page = 1;
  // actual page size
  int64 page_size = 2;
  // 总数
  int64 total = 3;
  // 列表
  repeated InstanceInfo infos = 4;
}

// 创建实例请求
message CreateInstanceRequest {
  // 实例名称
  string name = 1;
  // 备注
  string remark = 2;
  // 标签(,号隔开)
  string tags = 3;
  // 类型
  string type = 4;
  // 所属用户id
  string user_id = 5;
  // 启动命令
  string start_command = 6;
  // 实例路径
  string instance_path = 7;
  // 停止命令
  string stop_command = 8;
  // 是否自启动
  bool auto_start = 9;
  // 环境变量(一行一个 如:GO_WANT_HELPER_PROCESS=1
  repeated string env = 10;
}

// 创建实例响应
message CreateInstanceResponse {
  // 实例详情
  InstanceInfo info = 1;
}

// 获取实例详情请求
message GetInstanceInfoRequest{
  // id
  string id = 1;
}

// 获取实例详情响应
message GetInstanceInfoResponse{
  // 实例详情
  InstanceInfo info = 1;
}

// 获取实例控制台详情请求
message GetInstanceTerminalInfoRequest {
  // 实例id
  string id = 1;
}

// 获取实例控制台详情响应
message GetInstanceTerminalInfoResponse {

}

// 启动实例请求
message StartInstanceRequest {
  // 实例id
  string id = 1;
}

// 启动实例响应
message StartInstanceResponse {
  // 实例详情
  InstanceInfo info = 1;
}

// 停止实例请求
message StopInstanceRequest {
  // 实例id
  string id = 1;
  // 是否强制停止
  bool force = 2;
}

// 停止实例响应
message StopInstanceResponse {}

// 重启实例请求
message RestartInstanceRequest {
  // 实例id
  string id = 1;
  // 是否强制重启
  bool force = 2;
}

// 重启实例响应
message RestartInstanceResponse {}

// 删除实例请求
message DelInstanceRequest {
  // 实例id
  string id = 1;
}

// 删除实例响应
message DelInstanceResponse {}

message UpdateInstanceRequest{
  // 实例id
  string id = 1;
  // 实例名称
  optional string name = 2;
  // 备注
  optional string remark = 3;
  // 标签(,号隔开)
  optional string tags = 4;
  // 类型
  optional string type = 5;
  // 启动命令
  optional string start_command = 6;
  // 实例路径
  optional string instance_path = 7;
  // 停止命令
  optional string stop_command = 8;
  // 是否自启动
  optional bool auto_start = 9;
  // 环境变量(一行一个 如:GO_WANT_HELPER_PROCESS=1
  repeated string env = 10;
}

message UpdateInstanceResponse{
  // 实例详情
  InstanceInfo info = 1;
}

// 删除实例日志请求
message DelInstanceLogRequest {
  // 实例id
  string id = 1;
}

// 删除实例日志响应
message DelInstanceLogResponse {}

// 实例详情
message InstanceInfo {
  // 实例id
  string id = 1;
  // 实例名称
  string name = 2;
  // 实例状态
  InstanceStatus status = 3;
  // 启动时间
  google.protobuf.Timestamp start_time = 4;
  // 创建时间
  google.protobuf.Timestamp create_time = 5;
  // 备注
  string remark = 6;
  // 标签(,号隔开)
  string tags = 7;
  // 类型
  string type = 8;
  // 所属用户id
  string user_id = 9;
  // 启动命令
  string start_command = 10;
  // 实例路径
  string instance_path = 11;
  // ws路径(启动时才有
  string ws_path = 12;
  // 停止命令
  string stop_command = 13;
  // 是否自启动
  bool auto_start = 14;
  // 环境变量(一行一个 如:GO_WANT_HELPER_PROCESS=1
  repeated string env = 15;
}

// 实例状态
enum InstanceStatus {
  // 未指定
  INSTANCE_STATUS_UNSPECIFIED = 0;
  // 停止
  INSTANCE_STATUS_STOPPED = 1;
  // 运行中
  INSTANCE_STATUS_RUNNING = 2;
  // 维护
  INSTANCE_STATUS_MAINTENANCE = 3;
}

// 获取实例文件列表请求
message GetInstanceFileListRequest {
  // 实例id
  string id = 1;
  // 实例目录内相对路径；空值表示实例根目录
  string path = 2;
  // 页码
  int64 page = 3;
  // 每页数量
  int64 page_size = 4;
  // 搜索关键字
  optional string keywords = 5;
  // 搜索时是否包含子目录
  optional bool include_sub_dir = 6;
  // 排序字段
  FileSortField sort_field = 7;
  // 排序是否倒序
  bool is_desc = 8;
}

// 获取实例文件列表响应
message GetInstanceFileListResponse {
  // 当前目录信息
  FileDirectoryInfo directory = 1;
  // 文件列表
  repeated FileEntryInfo items = 2;
  // 当前页码
  int64 page = 3;
  // 每页数量
  int64 page_size = 4;
  // 总数
  int64 total = 5;
}

// 创建实例文件请求
message CreateInstanceFileRequest {
  // 实例id
  string id = 1;
  // 创建信息；path 为实例目录内相对路径
  FileCreateItem info = 2;
}

// 创建实例文件响应
message CreateInstanceFileResponse {}

// 重命名实例文件请求
message RenameInstanceFileRequest {
  // 实例id
  string id = 1;
  // 原路径
  string path = 2;
  // 新名称，不包含路径
  string new_name = 3;
}

// 重命名实例文件响应
message RenameInstanceFileResponse {
  // 重命名后的路径
  string path = 1;
}

// 批量删除实例文件请求
message BatchDeleteInstanceFileRequest {
  // 实例id
  string id = 1;
  // 实例目录内相对路径列表
  repeated string paths = 2;
}

// 批量删除实例文件响应
message BatchDeleteInstanceFileResponse {
  // 删除结果列表
  repeated FileOperationResult items = 1;
}

// 压缩实例文件请求
message BatchCompressInstanceFileRequest {
  // 实例id
  string id = 1;
  // 实例目录内相对路径列表
  repeated string paths = 2;
  // 目标压缩文件相对路径，不传时由服务端自动生成
  optional string target_path = 3;
}

// 压缩实例文件响应
message BatchCompressInstanceFileResponse {
  // 实际生成的相对路径
  string output_path = 1;
}

// 解压实例文件请求
message UnzipInstanceFileRequest {
  // 实例id
  string id = 1;
  // 压缩文件相对路径
  string path = 2;
  // 解压目标目录相对路径，不传时由服务端自动生成
  optional string target_path = 3;
}

// 解压实例文件响应
message UnzipInstanceFileResponse {
  // 实际生成的相对路径
  string output_path = 1;
}

// 打开实例文件请求
message OpenInstanceFileRequest {
  // 实例id
  string id = 1;
  // 文件相对路径
  string path = 2;
}

// 打开实例文件响应
message OpenInstanceFileResponse {
  // 文件内容
  bytes info = 1;
}

// 实例文件下载预签名请求
message InstanceFilePreSignRequest {
  // 实例id
  string id = 1;
  // 文件相对路径
  string path = 2;
}

// 实例文件下载预签名响应
message InstanceFilePreSignResponse {
  // 下载路径
  string download_url_path = 1;
}

// 实例文件上传预签名请求
message InstanceFilePreSignUploadRequest {
  // 实例id
  string id = 1;
  // 上传目录相对路径
  string path = 2;
  // 文件名称
  string file_name = 3;
  // 文件总大小（字节）
  uint64 file_size = 4;
  // 快速hash
  string hash = 5;
  // 分片大小（字节），不传时由服务端自动决定
  optional uint64 part_size = 6;
}

// 实例文件上传预签名响应
message InstanceFilePreSignUploadResponse {
  // 上传信息
  UploadInfo info = 1;
}
