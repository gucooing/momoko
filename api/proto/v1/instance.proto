syntax = "proto3";

package v1;

option go_package = "momoko/api/gen/v1;v1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "v1/file.proto";

// 应用管理
service InstanceManager {
  // 实例类型管理
  // 获取实例类型
  rpc GetInstanceTypes(GetInstanceTypesRequest) returns (GetInstanceTypesResponse) {
    option (google.api.http) = {
      get: "/api/v1/instance/type"
    };
  }
  // 创建实例类型
  rpc CreateInstanceType(CreateInstanceTypeRequest) returns (CreateInstanceTypeResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/type"
      body: "*"
    };
  }
  // 更新实例类型
  rpc UpdateInstanceType(UpdateInstanceTypeRequest) returns (UpdateInstanceTypeResponse) {
    option (google.api.http) = {
      put: "/api/v1/instance/type/{id}"
      body: "*"
    };
  }
  // 删除实例类型(在用的应用变为未分类)
  rpc DelInstanceType(DelInstanceTypeRequest) returns (DelInstanceTypeResponse) {
    option (google.api.http) = {
      delete: "/api/v1/instance/type/{id}"
    };
  }

  // 实例管理
  // 获取实例列表
  rpc GetInstances(GetInstancesRequest) returns (GetInstancesResponse) {
    option (google.api.http) = {
      get: "/api/v1/instance"
    };
  }
  // 创建实例
  rpc CreateInstance(CreateInstanceRequest) returns (CreateInstanceResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance"
      body: "*"
    };
  }
  // 获取全部应用用过的标签(按使用次数排序)
  rpc GetInstanceTags(GetInstanceTagsRequest) returns (GetInstanceTagsResponse) {
    option (google.api.http) = {
      get: "/api/v1/instance/tags"
    };
  }
  // 获取应用最近事件(操作记录 + 进程退出/自动重启)
  rpc GetInstanceEvents(GetInstanceEventsRequest) returns (GetInstanceEventsResponse) {
    option (google.api.http) = {
      get: "/api/v1/instance/events/{id}"
    };
  }
  // 获取实例详情
  rpc GetInstanceInfo(GetInstanceInfoRequest) returns (GetInstanceInfoResponse) {
    option (google.api.http) = {
      get: "/api/v1/instance/{id}"
    };
  }
  // 启动实例
  rpc StartInstance(StartInstanceRequest) returns (StartInstanceResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/instance/start/{id}"
      body: "*"
    };
  }
  // 停止实例
  rpc StopInstance(StopInstanceRequest) returns (StopInstanceResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/instance/stop/{id}"
      body: "*"
    };
  }
  // 重启实例
  rpc RestartInstance(RestartInstanceRequest) returns (RestartInstanceResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/instance/restart/{id}"
      body: "*"
    };
  }
  // 删除实例
  rpc DelInstance(DelInstanceRequest) returns (DelInstanceResponse) {
    option (google.api.http) = {
      delete: "/api/v1/instance/instance/del/{id}"
    };
  }
  // 更新实例
  rpc UpdateInstance(UpdateInstanceRequest) returns (UpdateInstanceResponse) {
    option (google.api.http) = {
      put: "/api/v1/instance/instance/{id}"
      body: "*"
    };
  }
  // 获取实例资源占用(CPU/内存/进程/磁盘)
  rpc GetInstanceStats(GetInstanceStatsRequest) returns (GetInstanceStatsResponse) {
    option (google.api.http) = {
      get: "/api/v1/instance/stats/{id}"
    };
  }
  // 清空终端日志
  rpc DelInstanceLog(DelInstanceLogRequest) returns (DelInstanceLogResponse) {
    option (google.api.http) = {
      delete: "/api/v1/instance/instance/del/log/{id}"
    };
  }

  // 获取实例目录文件列表
  rpc GetInstanceFileList(GetInstanceFileListRequest) returns (GetInstanceFileListResponse) {
    option (google.api.http) = {
      get: "/api/v1/instance/file/{id}"
    };
  }
  // 获取实例目录树(懒加载，供编辑器文件树使用)
  rpc GetInstanceFileTree(GetInstanceFileTreeRequest) returns (GetInstanceFileTreeResponse) {
    option (google.api.http) = {
      get: "/api/v1/instance/file/tree/{id}"
    };
  }
  // 创建实例目录内文件/文件夹
  rpc CreateInstanceFile(CreateInstanceFileRequest) returns (CreateInstanceFileResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/file/create/{id}"
      body: "*"
    };
  }
  // 重命名实例目录内文件/文件夹
  rpc RenameInstanceFile(RenameInstanceFileRequest) returns (RenameInstanceFileResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/file/rename/{id}"
      body: "*"
    };
  }
  // 复制实例目录内文件/文件夹
  rpc CopyInstanceFile(CopyInstanceFileRequest) returns (CopyInstanceFileResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/file/copy/{id}"
      body: "*"
    };
  }
  // 剪贴实例目录内文件/文件夹
  rpc CutInstanceFile(CutInstanceFileRequest) returns (CutInstanceFileResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/file/cut/{id}"
      body: "*"
    };
  }
  // 批量删除实例目录内文件/文件夹
  rpc BatchDeleteInstanceFile(BatchDeleteInstanceFileRequest) returns (BatchDeleteInstanceFileResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/file/deletes/{id}"
      body: "*"
    };
  }
  // 压缩实例目录内文件/文件夹
  rpc BatchCompressInstanceFile(BatchCompressInstanceFileRequest) returns (BatchCompressInstanceFileResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/file/compress/{id}"
      body: "*"
    };
  }
  // 解压实例目录内压缩包
  rpc UnzipInstanceFile(UnzipInstanceFileRequest) returns (UnzipInstanceFileResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/file/unzip/{id}"
      body: "*"
    };
  }
  // 编辑实例目录内文件
  rpc EditInstanceFile(EditInstanceFileRequest) returns (EditInstanceFileResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/file/edit/{id}"
      body: "*"
    };
  }
  // 实例目录内文件下载预签名
  rpc InstanceFilePreSign(InstanceFilePreSignRequest) returns (InstanceFilePreSignResponse) {
    option (google.api.http) = {
      get: "/api/v1/instance/file/pre-sign/{id}"
    };
  }
  // 实例目录内文件上传预签名
  rpc InstanceFilePreSignUpload(InstanceFilePreSignUploadRequest) returns (InstanceFilePreSignUploadResponse) {
    option (google.api.http) = {
      get: "/api/v1/instance/file/upload/pre-sign/{id}"
    };
  }
}

// 获取实例类型请求
message GetInstanceTypesRequest {}

// 获取实例类型响应
message GetInstanceTypesResponse {
  // 类型列表
  repeated InstanceTypeInfo types = 1;
}

// 创建实例类型请求
message CreateInstanceTypeRequest {
  // 类型名称
  string name = 1;
  // 是否启用(不传默认启用)
  optional bool is_enable = 2;
  // 类型说明
  string description = 3;
  // 默认启动命令(新建应用时预填)
  string start_command = 4;
  // 默认停止命令(新建应用时预填)
  string stop_command = 5;
  // 控制台快捷命令（显示在应用控制台输入框上方）
  repeated string quick_commands = 6;
}

// 创建实例类型响应
message CreateInstanceTypeResponse {
  // 实例信息
  InstanceTypeInfo type = 1;
}

// 更新实例类型请求
message UpdateInstanceTypeRequest {
  // 类型id
  string id = 1;
  // 类型名称
  optional string name = 2;
  // 是否启用
  optional bool is_enable = 3;
  // 类型说明
  optional string description = 4;
  // 默认启动命令
  optional string start_command = 5;
  // 默认停止命令
  optional string stop_command = 6;
  // 控制台快捷命令（不传表示不修改）
  InstanceQuickCommands quick_commands = 7;
}

// 控制台快捷命令列表（用于区分「不修改」与「清空」）
message InstanceQuickCommands {
  repeated string items = 1;
}

// 更新实例类型响应
message UpdateInstanceTypeResponse {
  // 实例信息
  InstanceTypeInfo type = 1;
}

// 删除实例类型请求
message DelInstanceTypeRequest {
  // 类型id
  string id = 1;
}

// 删除实例类型响应
message DelInstanceTypeResponse {
  // 因此变为未分类的应用数
  int64 uncategorized_apps = 1;
}

// 实例类型信息
message InstanceTypeInfo {
  // 类型id
  string id = 1;
  // 类型名称
  string name = 2;
  // 是否系统内置
  bool is_system = 3;
  // 是否启用
  bool is_enable = 4;
  // 类型说明
  string description = 5;
  // 默认启动命令
  string start_command = 6;
  // 默认停止命令
  string stop_command = 7;
  // 当前用户可见的、使用该类型的应用数
  int64 app_count = 8;
  // 使用该类型的应用(当前用户可见，最多 8 个)
  repeated InstanceTypeApp apps = 9;
  // 创建时间
  google.protobuf.Timestamp create_time = 10;
  // 更新时间
  google.protobuf.Timestamp update_time = 11;
  // 控制台快捷命令
  repeated string quick_commands = 12;
}

// 使用某类型的应用摘要
message InstanceTypeApp {
  // 实例id
  string id = 1;
  // 实例名称
  string name = 2;
  // 实例状态
  InstanceStatus status = 3;
}

// 获取实例列表请求
message GetInstancesRequest{
  // page
  int64 page = 1;
  // page size
  int64 page_size = 2;
  // 名称/备注/标签/工作目录
  optional string keywords = 3;
  // 类型
  optional string type = 4;
  // 状态
  optional InstanceStatus status = 5;
}

// 获取实例列表响应
message GetInstancesResponse{
  // actual page
  int64 page = 1;
  // actual page size
  int64 page_size = 2;
  // 总数
  int64 total = 3;
  // 列表
  repeated InstanceInfo infos = 4;
  // 各状态数量(按关键字/类型筛选，不按状态筛选)
  InstanceStatusCount counts = 5;
}

// 各状态应用数量
message InstanceStatusCount {
  int64 all = 1;
  int64 running = 2;
  int64 stopped = 3;
  int64 maintenance = 4;
}

// 环境变量
message InstanceEnvVar {
  // 变量名
  string key = 1;
  // 普通变量的值
  string value = 2;
  // 是否按密钥保存(值只写不读，控制台输出里打码)
  bool is_secret = 3;
  // 密钥变量的值：只写，响应中总为空；更新时留空表示保持原值
  string secret = 4;
}

// 环境变量列表(用于更新时区分「不修改」与「清空」)
message InstanceEnvList {
  repeated InstanceEnvVar items = 1;
}

// 获取应用标签请求
message GetInstanceTagsRequest {}

// 应用标签
message InstanceTag {
  string name = 1;
  // 使用该标签的应用数
  int64 count = 2;
}

// 获取应用标签响应
message GetInstanceTagsResponse {
  repeated InstanceTag tags = 1;
}

// 获取应用事件请求
message GetInstanceEventsRequest {
  // 实例id
  string id = 1;
  // 条数(默认 10，最多 50)
  int32 limit = 2;
}

// 应用事件类型
enum InstanceEventKind {
  INSTANCE_EVENT_KIND_UNSPECIFIED = 0;
  // 创建
  INSTANCE_EVENT_KIND_CREATE = 1;
  // 启动
  INSTANCE_EVENT_KIND_START = 2;
  // 停止
  INSTANCE_EVENT_KIND_STOP = 3;
  // 强制停止
  INSTANCE_EVENT_KIND_FORCE_STOP = 4;
  // 重启
  INSTANCE_EVENT_KIND_RESTART = 5;
  // 强制重启
  INSTANCE_EVENT_KIND_FORCE_RESTART = 6;
  // 修改配置
  INSTANCE_EVENT_KIND_UPDATE = 7;
  // 清空控制台日志
  INSTANCE_EVENT_KIND_LOG_CLEAR = 8;
  // 修改文件
  INSTANCE_EVENT_KIND_FILE = 9;
  // 进程自行退出
  INSTANCE_EVENT_KIND_EXIT = 10;
  // 崩溃后自动重启
  INSTANCE_EVENT_KIND_AUTO_RESTART = 11;
  // 进入维护
  INSTANCE_EVENT_KIND_MAINTENANCE_ON = 12;
  // 结束维护
  INSTANCE_EVENT_KIND_MAINTENANCE_OFF = 13;
}

// 应用事件
message InstanceEvent {
  InstanceEventKind kind = 1;
  google.protobuf.Timestamp time = 2;
  // 操作者(进程事件为空)
  string user_name = 3;
  // 是否成功
  bool success = 4;
  // 进程退出码(仅进程事件)
  int32 exit_code = 5;
  // 失败原因
  string error = 6;
}

// 获取应用事件响应
message GetInstanceEventsResponse {
  repeated InstanceEvent events = 1;
}

// 创建实例请求
message CreateInstanceRequest {
  // 实例名称
  string name = 1;
  // 备注
  string remark = 2;
  // 标签(,号隔开)
  string tags = 3;
  // 类型
  string type = 4;
  // 所属用户id
  string user_id = 5;
  // 启动命令
  string start_command = 6;
  // 实例路径
  string instance_path = 7;
  // 停止命令
  string stop_command = 8;
  // 是否自启动
  bool auto_start = 9;
  // 环境变量
  repeated InstanceEnvVar env = 10;
  // 停止超时(秒)：发送停止命令后超时未退出则强制结束，<=0 使用默认值
  int32 stop_timeout = 11;
  // 崩溃后自动重启
  bool auto_restart = 12;
}

// 创建实例响应
message CreateInstanceResponse {
  // 实例详情
  InstanceInfo info = 1;
}

// 获取实例详情请求
message GetInstanceInfoRequest{
  // id
  string id = 1;
}

// 获取实例详情响应
message GetInstanceInfoResponse{
  // 实例详情
  InstanceInfo info = 1;
}

// 获取实例控制台详情请求
message GetInstanceTerminalInfoRequest {
  // 实例id
  string id = 1;
}

// 获取实例控制台详情响应
message GetInstanceTerminalInfoResponse {

}

// 启动实例请求
message StartInstanceRequest {
  // 实例id
  string id = 1;
}

// 启动实例响应
message StartInstanceResponse {
  // 实例详情
  InstanceInfo info = 1;
}

// 停止实例请求
message StopInstanceRequest {
  // 实例id
  string id = 1;
  // 是否强制停止
  bool force = 2;
}

// 停止实例响应
message StopInstanceResponse {}

// 重启实例请求
message RestartInstanceRequest {
  // 实例id
  string id = 1;
  // 是否强制重启
  bool force = 2;
}

// 重启实例响应
message RestartInstanceResponse {}

// 删除实例请求
message DelInstanceRequest {
  // 实例id
  string id = 1;
}

// 删除实例响应
message DelInstanceResponse {}

message UpdateInstanceRequest{
  // 实例id
  string id = 1;
  // 实例名称
  optional string name = 2;
  // 备注
  optional string remark = 3;
  // 标签(,号隔开)
  optional string tags = 4;
  // 类型(空字符串为未分类)
  optional string type = 5;
  // 启动命令
  optional string start_command = 6;
  // 实例路径
  optional string instance_path = 7;
  // 停止命令
  optional string stop_command = 8;
  // 是否自启动
  optional bool auto_start = 9;
  // 环境变量(不传则不修改)
  InstanceEnvList env = 10;
  // 停止超时(秒)
  optional int32 stop_timeout = 11;
  // 崩溃后自动重启
  optional bool auto_restart = 12;
  // 维护中(进入维护会先停止应用)
  optional bool maintenance = 13;
}

message UpdateInstanceResponse{
  // 实例详情
  InstanceInfo info = 1;
}

// 删除实例日志请求
message DelInstanceLogRequest {
  // 实例id
  string id = 1;
}

// 删除实例日志响应
message DelInstanceLogResponse {}

// 实例详情
message InstanceInfo {
  // 实例id
  string id = 1;
  // 实例名称
  string name = 2;
  // 实例状态
  InstanceStatus status = 3;
  // 启动时间
  google.protobuf.Timestamp start_time = 4;
  // 创建时间
  google.protobuf.Timestamp create_time = 5;
  // 备注
  string remark = 6;
  // 标签(,号隔开)
  string tags = 7;
  // 类型
  string type = 8;
  // 所属用户id
  string user_id = 9;
  // 启动命令
  string start_command = 10;
  // 实例路径
  string instance_path = 11;
  // ws路径(启动时才有
  string ws_path = 12;
  // 停止命令
  string stop_command = 13;
  // 是否自启动
  bool auto_start = 14;
  // 环境变量(密钥变量的值不返回)
  repeated InstanceEnvVar env = 15;
  // 停止超时(秒)
  int32 stop_timeout = 16;
  // 崩溃后自动重启
  bool auto_restart = 17;
  // 主进程 PID(运行时才有)
  int32 pid = 18;
  // 类型id
  string type_id = 19;
  // 所属用户名
  string user_name = 20;
  // 更新时间
  google.protobuf.Timestamp update_time = 21;
  // 所属类型的控制台快捷命令
  repeated string quick_commands = 22;
  // 最近一次进程退出时间
  google.protobuf.Timestamp stop_time = 23;
  // 解析后的工作目录绝对路径
  string absolute_path = 24;
  // 维护中
  bool maintenance = 25;
  // 进入维护的时间
  google.protobuf.Timestamp maintenance_time = 26;
}

// 获取实例资源占用请求
message GetInstanceStatsRequest {
  // 实例id
  string id = 1;
}

// 获取实例资源占用响应
message GetInstanceStatsResponse {
  // 是否运行中
  bool running = 1;
  // 主进程 PID
  int32 pid = 2;
  // 进程数(含子进程)
  int32 process_count = 3;
  // CPU 占用(百分比，按单核 100% 计，多核可超过 100)
  double cpu_percent = 4;
  // 逻辑 CPU 核数
  int32 cpu_cores = 5;
  // 常驻内存(字节，含子进程)
  uint64 memory_bytes = 6;
  // 本机内存总量(字节)
  uint64 memory_total = 7;
  // 工作目录占用(字节，定期统计)
  uint64 disk_usage_bytes = 8;
  // 工作目录所在磁盘总量(字节)
  uint64 disk_total = 9;
  // 工作目录所在磁盘剩余(字节)
  uint64 disk_free = 10;
  // 工作目录占用的统计时间
  google.protobuf.Timestamp disk_scan_time = 11;
  // 启动时间
  google.protobuf.Timestamp start_time = 12;
}

// 实例状态
enum InstanceStatus {
  // 未指定
  INSTANCE_STATUS_UNSPECIFIED = 0;
  // 停止
  INSTANCE_STATUS_STOPPED = 1;
  // 运行中
  INSTANCE_STATUS_RUNNING = 2;
  // 维护
  INSTANCE_STATUS_MAINTENANCE = 3;
}

// 获取实例文件列表请求
message GetInstanceFileListRequest {
  // 实例id
  string id = 1;
  // 实例目录内相对路径；空值表示实例根目录
  string path = 2;
  // 页码
  int64 page = 3;
  // 每页数量
  int64 page_size = 4;
  // 搜索关键字
  optional string keywords = 5;
  // 搜索时是否包含子目录
  optional bool include_sub_dir = 6;
  // 排序字段
  FileSortField sort_field = 7;
  // 排序是否倒序
  bool is_desc = 8;
}

// 获取实例文件列表响应
message GetInstanceFileListResponse {
  // 当前目录信息
  FileDirectoryInfo directory = 1;
  // 文件列表
  repeated FileEntryInfo items = 2;
  // 当前页码
  int64 page = 3;
  // 每页数量
  int64 page_size = 4;
  // 总数
  int64 total = 5;
}

// 获取实例目录树请求(复用 file.proto 的 FileTreeNode)
message GetInstanceFileTreeRequest {
  // 实例id
  string id = 1;
  // 实例目录内相对路径；空值表示实例根目录
  string path = 2;
}

// 获取实例目录树响应
message GetInstanceFileTreeResponse {
  // 实际列出的目录路径(回显)
  string path = 1;
  // 直接子项(目录在前，按名称排序)
  repeated FileTreeNode nodes = 2;
}

// 创建实例文件请求
message CreateInstanceFileRequest {
  // 实例id
  string id = 1;
  // 创建信息；path 为实例目录内相对路径
  FileCreateItem info = 2;
}

// 创建实例文件响应
message CreateInstanceFileResponse {}

// 重命名实例文件请求
message RenameInstanceFileRequest {
  // 实例id
  string id = 1;
  // 原路径
  string path = 2;
  // 新名称，不包含路径
  string new_name = 3;
}

// 重命名实例文件响应
message RenameInstanceFileResponse {
  // 重命名后的路径
  string path = 1;
}

// 复制实例文件请求
message CopyInstanceFileRequest {
  // 实例id
  string id = 1;
  // 实例目录内相对路径列表
  repeated string paths = 2;
  // 目标目录相对路径
  string target_path = 3;
}

// 复制实例文件响应
message CopyInstanceFileResponse {
  // 异步任务信息
  FileTaskInfo task = 1;
}

// 剪贴实例文件请求
message CutInstanceFileRequest {
  // 实例id
  string id = 1;
  // 实例目录内相对路径列表
  repeated string paths = 2;
  // 目标目录相对路径
  string target_path = 3;
}

// 剪贴实例文件响应
message CutInstanceFileResponse {
  // 异步任务信息
  FileTaskInfo task = 1;
}

// 批量删除实例文件请求
message BatchDeleteInstanceFileRequest {
  // 实例id
  string id = 1;
  // 实例目录内相对路径列表
  repeated string paths = 2;
}

// 批量删除实例文件响应
message BatchDeleteInstanceFileResponse {
  // 删除结果列表
  repeated FileOperationResult items = 1;
}

// 压缩实例文件请求
message BatchCompressInstanceFileRequest {
  // 实例id
  string id = 1;
  // 实例目录内相对路径列表
  repeated string paths = 2;
  // 目标压缩文件相对路径，不传时由服务端自动生成
  optional string target_path = 3;
}

// 压缩实例文件响应
message BatchCompressInstanceFileResponse {
  // 实际生成的相对路径
  string output_path = 1;
}

// 解压实例文件请求
message UnzipInstanceFileRequest {
  // 实例id
  string id = 1;
  // 压缩文件相对路径
  string path = 2;
  // 解压目标目录相对路径，不传时由服务端自动生成
  optional string target_path = 3;
}

// 解压实例文件响应
message UnzipInstanceFileResponse {
  // 实际生成的相对路径
  string output_path = 1;
}

// 编辑实例文件请求
message EditInstanceFileRequest {
  // 实例id
  string id = 1;
  // 文件相对路径
  string path = 2;
  // 文件内容
  bytes content = 3;
}

// 编辑实例文件响应
message EditInstanceFileResponse {}

// 实例文件下载预签名请求
message InstanceFilePreSignRequest {
  // 实例id
  string id = 1;
  // 文件相对路径
  string path = 2;
}

// 实例文件下载预签名响应
message InstanceFilePreSignResponse {
  // 下载路径
  string download_url_path = 1;
}

// 实例文件上传预签名请求
message InstanceFilePreSignUploadRequest {
  // 实例id
  string id = 1;
  // 上传目录相对路径
  string path = 2;
  // 文件名称
  string file_name = 3;
  // 文件总大小（字节）
  uint64 file_size = 4;
  // 快速hash
  string hash = 5;
  // 分片大小（字节），不传时由服务端自动决定
  optional uint64 part_size = 6;
}

// 实例文件上传预签名响应
message InstanceFilePreSignUploadResponse {
  // 上传信息
  UploadInfo info = 1;
}
