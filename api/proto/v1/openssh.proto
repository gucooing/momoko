syntax = "proto3";

package v1;

option go_package = "momoko/api/gen/v1;v1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// OpenSSH 管理
service OpenSSHManager {
  // 获取 SSH 服务端列表
  rpc GetSSHHosts(GetSSHHostsRequest) returns (GetSSHHostsResponse) {
    option (google.api.http) = {
      get: "/api/v1/openssh/host"
    };
  }
  // 创建 SSH 服务端
  rpc CreateSSHHost(CreateSSHHostRequest) returns (CreateSSHHostResponse) {
    option (google.api.http) = {
      post: "/api/v1/openssh/host"
      body: "*"
    };
  }
  // 获取 SSH 服务端详情
  rpc GetSSHHostInfo(GetSSHHostInfoRequest) returns (GetSSHHostInfoResponse) {
    option (google.api.http) = {
      get: "/api/v1/openssh/host/{id}"
    };
  }
  // 更新 SSH 服务端
  rpc UpdateSSHHost(UpdateSSHHostRequest) returns (UpdateSSHHostResponse) {
    option (google.api.http) = {
      put: "/api/v1/openssh/host/{id}"
      body: "*"
    };
  }
  // 删除 SSH 服务端
  rpc DeleteSSHHost(DeleteSSHHostRequest) returns (DeleteSSHHostResponse) {
    option (google.api.http) = {
      delete: "/api/v1/openssh/host/{id}"
    };
  }
  // 分享 SSH 服务端
  rpc ShareSSHHost(ShareSSHHostRequest) returns (ShareSSHHostResponse) {
    option (google.api.http) = {
      post: "/api/v1/openssh/host/{id}/share"
      body: "*"
    };
  }
  // 测试 SSH 配置连通性（不写库状态）：
  // - 有 id：用已存主机 + 请求体中的覆盖字段（编辑弹窗草稿）
  // - 无 id：纯草稿（新建弹窗）
  rpc TestSSHHost(TestSSHHostRequest) returns (TestSSHHostResponse) {
    option (google.api.http) = {
      post: "/api/v1/openssh/host/test"
      body: "*"
    };
  }
  // 批量测试已保存主机的连通性并记录结果（延迟、成功与否、失败原因）；ids 为空表示测试全部可访问主机
  rpc TestSSHHosts(TestSSHHostsRequest) returns (TestSSHHostsResponse) {
    option (google.api.http) = {
      post: "/api/v1/openssh/host/batch-test"
      body: "*"
    };
  }
}

message GetSSHHostsRequest {
  // page
  int64 page = 1;
  // page size
  int64 page_size = 2;
  // 名称/标签/主机地址
  optional string keywords = 3;
  // 主机地址
  optional string host = 4;
  // 按连通状态/分享筛选
  optional SSHHostFilter filter = 5;
  // 按标签（分组）筛选
  optional string tag = 6;
}

// 列表筛选
enum SSHHostFilter {
  // 全部
  SSH_HOST_FILTER_ALL = 0;
  // 上次测试连通
  SSH_HOST_FILTER_OK = 1;
  // 上次测试失败
  SSH_HOST_FILTER_FAILED = 2;
  // 从未测试
  SSH_HOST_FILTER_UNTESTED = 3;
  // 我分享给他人的
  SSH_HOST_FILTER_SHARED = 4;
  // 他人分享给我的
  SSH_HOST_FILTER_SHARED_WITH_ME = 5;
}

message GetSSHHostsResponse {
  // actual page
  int64 page = 1;
  // actual page size
  int64 page_size = 2;
  // 总数（筛选后）
  int64 total = 3;
  // 列表
  repeated SSHHostInfo infos = 4;
  // 全部可访问主机的统计（不受筛选影响）
  SSHHostStats stats = 5;
}

// SSH 主机统计
message SSHHostStats {
  // 可访问主机总数
  int64 total = 1;
  // 上次测试连通
  int64 ok = 2;
  // 上次测试失败
  int64 failed = 3;
  // 从未测试
  int64 untested = 4;
  // 我分享给他人的
  int64 shared = 5;
  // 他人分享给我的
  int64 shared_with_me = 6;
  // 全部标签（分组），按名称排序
  repeated string tags = 7;
  // 最近一次测试时间
  google.protobuf.Timestamp last_test_time = 8;
  // 连通主机的平均延迟（毫秒）
  int32 avg_latency_ms = 9;
  // 每台主机的上次测试状态（按创建时间排序，用于概览条）
  repeated SSHHostTestMark marks = 10;
}

// 主机上次测试状态标记
message SSHHostTestMark {
  // 主机 id
  string id = 1;
  // 名称
  string name = 2;
  // 是否测试过
  bool tested = 3;
  // 是否连通
  bool ok = 4;
  // 失败原因
  string message = 5;
}

message TestSSHHostsRequest {
  // 要测试的主机 id；为空表示全部可访问主机
  repeated string ids = 1;
}

message TestSSHHostsResponse {
  // 每台主机的测试结果
  repeated SSHHostTestMark results = 1;
}

message CreateSSHHostRequest {
  // 名称
  string name = 1;
  // 主机地址
  string host = 2;
  // 端口
  int32 port = 3;
  // 用户名
  string username = 4;
  // 认证方式
  SSHAuthType auth_type = 5;
  // 密码认证时填写
  string password = 6;
  // 密钥认证时填写
  string private_key = 7;
  // 私钥口令
  string passphrase = 8;
  // 主机指纹
  string fingerprint = 9;
  // 备注
  string remark = 10;
  // 标签
  string tags = 11;
  // 分享给指定用户
  repeated string shared_user_ids = 12;
}

message CreateSSHHostResponse {
  // SSH 服务端详情
  SSHHostInfo info = 1;
}

message GetSSHHostInfoRequest {
  // SSH 服务端 id
  string id = 1;
}

message GetSSHHostInfoResponse {
  // SSH 服务端详情
  SSHHostInfo info = 1;
}

message UpdateSSHHostRequest {
  // SSH 服务端 id
  string id = 1;
  // 名称
  optional string name = 2;
  // 主机地址
  optional string host = 3;
  // 端口
  optional int32 port = 4;
  // 用户名
  optional string username = 5;
  // 认证方式
  optional SSHAuthType auth_type = 6;
  // 密码认证时填写
  optional string password = 7;
  // 密钥认证时填写
  optional string private_key = 8;
  // 私钥口令
  optional string passphrase = 9;
  // 主机指纹
  optional string fingerprint = 10;
  // 备注
  optional string remark = 11;
  // 标签
  optional string tags = 12;
}

message UpdateSSHHostResponse {
  // SSH 服务端详情
  SSHHostInfo info = 1;
}

message DeleteSSHHostRequest {
  // SSH 服务端 id
  string id = 1;
}

message DeleteSSHHostResponse {}

message ShareSSHHostRequest {
  // SSH 服务端 id
  string id = 1;
  // 分享给指定用户；传空数组表示取消全部分享
  repeated string user_ids = 2;
}

message ShareSSHHostResponse {
  // SSH 服务端详情
  SSHHostInfo info = 1;
}

// 连通性测试请求（不持久化状态）。
// 编辑弹窗：传 id + 当前表单草稿字段（空凭据表示沿用库中已存凭据）。
// 新建弹窗：不传 id，必须带齐 host/username/凭据。
message TestSSHHostRequest {
  // 已有主机 id（可选；编辑弹窗带上以便空凭据时回落到库中配置）
  optional string id = 1;
  // 主机地址
  optional string host = 2;
  // 端口
  optional int32 port = 3;
  // 用户名
  optional string username = 4;
  // 认证方式
  optional SSHAuthType auth_type = 5;
  // 密码（密码认证；空=沿用已存）
  optional string password = 6;
  // 私钥（密钥认证；空=沿用已存）
  optional string private_key = 7;
  // 私钥口令
  optional string passphrase = 8;
  // 主机指纹（空=沿用已存）
  optional string fingerprint = 9;
}

message TestSSHHostResponse {
  // 是否连通
  bool ok = 1;
  // 测试结果说明
  string message = 2;
  // 探测到的服务端主机指纹（成功时可能有）
  string fingerprint = 3;
}

message SSHHostInfo {
  // SSH 服务端 id
  string id = 1;
  // 名称
  string name = 2;
  // 主机地址
  string host = 3;
  // 端口
  int32 port = 4;
  // 用户名
  string username = 5;
  // 认证方式
  SSHAuthType auth_type = 6;
  // 主机指纹
  string fingerprint = 7;
  // 备注
  string remark = 8;
  // 标签
  string tags = 9;
  // 所属用户 id
  string owner_user_id = 10;
  // 分享用户信息
  repeated SSHHostSharedUser shared_users = 11;
  // 当前用户访问身份
  SSHHostAccessRole access_role = 12;
  // WebSocket 路径
  string ws_path = 13;
  // 创建时间
  google.protobuf.Timestamp create_time = 14;
  // 更新时间
  google.protobuf.Timestamp update_time = 15;
  // 上次测试时间；未测试过为空
  google.protobuf.Timestamp last_test_time = 16;
  // 上次测试是否连通
  bool last_test_ok = 17;
  // 上次测试延迟（毫秒）
  int32 last_test_latency_ms = 18;
  // 上次测试失败原因
  string last_test_message = 19;
  // 上次打开终端连接的时间；从未连接为空
  google.protobuf.Timestamp last_connect_time = 20;
}

message SSHHostSharedUser {
  // 用户id
  string user_id = 1;
  // 用户名称
  string name = 2;
}

enum SSHAuthType {
  // 未指定
  SSH_AUTH_TYPE_UNSPECIFIED = 0;
  // 密码
  SSH_AUTH_TYPE_PASSWORD = 1;
  // 私钥
  SSH_AUTH_TYPE_KEY = 2;
}

enum SSHHostAccessRole {
  // 未指定
  SSH_HOST_ACCESS_ROLE_UNSPECIFIED = 0;
  // 创建者
  SSH_HOST_ACCESS_ROLE_OWNER = 1;
  // 被分享者
  SSH_HOST_ACCESS_ROLE_SHARED = 2;
}
