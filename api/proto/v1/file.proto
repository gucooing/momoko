syntax = "proto3";

package v1;

option go_package = "momoko/api/gen/v1;v1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// 文件管理
service FileManager {
  // 获取整个系统指定路径的文件
  rpc GetFileSystemList(GetFileSystemListRequest) returns (GetFileSystemListResponse) {
    option (google.api.http) = {
      get: "/api/v1/file/system"
    };
  }
  // 获取目录树(系统级，懒加载，返回指定目录的直接子项，供编辑器文件树使用)
  rpc GetFileSystemTree(GetFileSystemTreeRequest) returns (GetFileSystemTreeResponse) {
    option (google.api.http) = {
      get: "/api/v1/file/system/tree"
    };
  }
  // 批量删除指定文件/文件夹(系统级)
  rpc BatchDeleteFileSystem(BatchDeleteFileSystemRequest) returns (BatchDeleteFileSystemResponse) {
    option (google.api.http) = {
      post: "/api/v1/file/system/deletes"
      body: "*"
    };
  }
  // 创建指定文件/文件夹(系统级)
  rpc CreateFileSystem(CreateFileSystemRequest) returns (CreateFileSystemResponse) {
    option (google.api.http) = {
      post: "/api/v1/file/system/create"
      body: "*"
    };
  }
  // 重命名指定文件/文件夹(系统级)
  rpc RenameFileSystem(RenameFileSystemRequest) returns (RenameFileSystemResponse) {
    option (google.api.http) = {
      post: "/api/v1/file/system/rename"
      body: "*"
    };
  }
  // 复制指定文件/文件夹(系统级)
  rpc CopyFileSystem(CopyFileSystemRequest) returns (CopyFileSystemResponse) {
    option (google.api.http) = {
      post: "/api/v1/file/system/copy"
      body: "*"
    };
  }
  // 剪贴指定文件/文件夹(系统级)
  rpc CutFileSystem(CutFileSystemRequest) returns (CutFileSystemResponse) {
    option (google.api.http) = {
      post: "/api/v1/file/system/cut"
      body: "*"
    };
  }
  // 获取文件任务状态
  rpc GetFileTask(GetFileTaskRequest) returns (GetFileTaskResponse) {
    option (google.api.http) = {
      get: "/api/v1/file/task/{task_id}"
    };
  }
  // 压缩指定文件/文件夹(系统级)
  rpc BatchCompressFileSystem(BatchCompressFileSystemRequest) returns (BatchCompressFileSystemResponse) {
    option (google.api.http) = {
      post: "/api/v1/file/system/compress"
      body: "*"
    };
  }
  // 解压指定压缩包(系统级)
  rpc UnzipFileSystem(UnzipFileSystemRequest) returns (UnzipFileSystemResponse) {
    option (google.api.http) = {
      post: "/api/v1/file/system/unzip"
      body: "*"
    };
  }
  // 打开指定文件(系统级)
  rpc OpenFileSystemFile(OpenFileSystemFileRequest) returns (OpenFileSystemFileResponse) {
    option (google.api.http) = {
      post: "/api/v1/file/system/open/file"
      body: "*"
    };
  }
  // 编辑指定文件(系统级)
  rpc EditFileSystemFile(EditFileSystemFileRequest) returns (EditFileSystemFileResponse) {
    option (google.api.http) = {
      post: "/api/v1/file/system/edit/file"
      body: "*"
    };
  }
  // 文件下载预签名(系统级)
  rpc FileSystemPreSign(FileSystemPreSignRequest) returns (FileSystemPreSignResponse) {
    option (google.api.http) = {
      get: "/api/v1/file/system/file/pre-sign"
    };
  }
  // 文件上传预签名(系统级)
  rpc FileSystemPreSignUpload(FileSystemPreSignUploadRequest) returns (FileSystemPreSignUploadResponse) {
    option (google.api.http) = {
      get: "/api/v1/file/system/file/upload/pre-sign"
    };
  }
  // 获取上传状态
  rpc GetFileUploadStatus(GetFileUploadStatusRequest) returns (GetFileUploadStatusResponse) {
    option (google.api.http) = {
      get: "/api/v1/file/upload/status"
    };
  }
  // 上传完成合并分片
  rpc CompleteFileUpload(CompleteFileUploadRequest) returns (CompleteFileUploadResponse) {
    option (google.api.http) = {
      post: "/api/v1/file/upload/complete"
      body: "*"
    };
  }
  // 取消文件上传
  rpc CancelFileUpload(CancelFileUploadRequest) returns (CancelFileUploadResponse) {
    option (google.api.http) = {
      post: "/api/v1/file/upload/cancel"
      body: "*"
    };
  }
  // 创建分享(系统级)
  rpc CreateShare(CreateShareRequest) returns (CreateShareResponse) {
    option (google.api.http) = {
      post: "/api/v1/file/share/create"
      body: "*"
    };
  }
  // 分享列表(系统级)
  rpc ListShares(ListSharesRequest) returns (ListSharesResponse) {
    option (google.api.http) = {
      get: "/api/v1/file/share/list"
    };
  }
  // 更新分享(系统级)
  rpc UpdateShare(UpdateShareRequest) returns (UpdateShareResponse) {
    option (google.api.http) = {
      post: "/api/v1/file/share/update"
      body: "*"
    };
  }
  // 删除分享(系统级)
  rpc DeleteShare(DeleteShareRequest) returns (DeleteShareResponse) {
    option (google.api.http) = {
      post: "/api/v1/file/share/delete"
      body: "*"
    };
  }
  // 公开：获取分享元信息（无需提取码）
  rpc GetShareMeta(GetShareMetaRequest) returns (GetShareMetaResponse) {
    option (google.api.http) = {
      get: "/api/v1/public/share/meta"
    };
  }
  // 公开：浏览分享目录（需会话签名）
  rpc ListShareDir(ListShareDirRequest) returns (ListShareDirResponse) {
    option (google.api.http) = {
      post: "/api/v1/public/share/list"
      body: "*"
    };
  }
  // 公开：用 token(+提取码) 换取一次性会话签名，后续分享请求只带签名不带提取码
  rpc CreateShareSession(CreateShareSessionRequest) returns (CreateShareSessionResponse) {
    option (google.api.http) = {
      post: "/api/v1/public/share/session"
      body: "*"
    };
  }

  // 文件来源列表(系统级)
  rpc ListFileSources(ListFileSourcesRequest) returns (ListFileSourcesResponse) {
    option (google.api.http) = {
      get: "/api/v1/file/source"
    };
  }
  // 新增文件来源(系统级)
  rpc CreateFileSource(CreateFileSourceRequest) returns (CreateFileSourceResponse) {
    option (google.api.http) = {
      post: "/api/v1/file/source/create"
      body: "*"
    };
  }
  // 更新文件来源(系统级)
  rpc UpdateFileSource(UpdateFileSourceRequest) returns (UpdateFileSourceResponse) {
    option (google.api.http) = {
      post: "/api/v1/file/source/update"
      body: "*"
    };
  }
  // 删除文件来源(系统级)
  rpc DeleteFileSource(DeleteFileSourceRequest) returns (DeleteFileSourceResponse) {
    option (google.api.http) = {
      post: "/api/v1/file/source/delete"
      body: "*"
    };
  }
  // 测试文件来源连通性(系统级)
  rpc TestFileSource(TestFileSourceRequest) returns (TestFileSourceResponse) {
    option (google.api.http) = {
      post: "/api/v1/file/source/test"
      body: "*"
    };
  }
}

// 分享信息（仅创建者可见的管理视图，含提取码）
message ShareInfo {
  // 分享 id
  string id = 1;
  // 展示名称
  string name = 2;
  // 被分享的真实路径
  string target_path = 3;
  // 是否文件夹
  bool is_dir = 4;
  // 公开访问令牌
  string token = 5;
  // 提取码，空=无需
  string code = 6;
  // 过期时间，空=永久
  google.protobuf.Timestamp expires_at = 7;
  // 下载次数上限，0=不限
  int64 max_downloads = 8;
  // 已下载次数
  int64 download_count = 9;
  // 是否启用
  bool enabled = 10;
  // 创建时间
  google.protobuf.Timestamp create_time = 11;
  // 更新时间
  google.protobuf.Timestamp update_time = 12;
}

// 创建分享请求
message CreateShareRequest {
  // 要分享的文件/文件夹路径
  string path = 1;
  // 展示名称，空=路径名
  string name = 2;
  // 提取码，空=公开
  string code = 3;
  // 过期时间，空=永久
  google.protobuf.Timestamp expires_at = 4;
  // 下载次数上限，0=不限
  int64 max_downloads = 5;
  // 是否启用
  bool enabled = 6;
}

// 创建分享响应
message CreateShareResponse {
  // 分享信息
  ShareInfo info = 1;
}

// 分享列表请求
message ListSharesRequest {
  // 页码
  int64 page = 1;
  // 每页数量
  int64 page_size = 2;
  // 搜索关键字（名称/路径）
  optional string keywords = 3;
}

// 分享列表响应
message ListSharesResponse {
  // 列表
  repeated ShareInfo items = 1;
  // 当前页码
  int64 page = 2;
  // 每页数量
  int64 page_size = 3;
  // 总数
  int64 total = 4;
}

// 更新分享请求（全量覆盖可编辑字段）
message UpdateShareRequest {
  // 分享 id
  string id = 1;
  // 展示名称
  string name = 2;
  // 提取码，空=公开
  string code = 3;
  // 过期时间，空=永久
  google.protobuf.Timestamp expires_at = 4;
  // 下载次数上限，0=不限
  int64 max_downloads = 5;
  // 是否启用
  bool enabled = 6;
  // 新的分享目标路径（文件/文件夹），空=不修改；修改不影响原有分享链接（token 不变）
  string path = 7;
}

// 更新分享响应
message UpdateShareResponse {
  // 分享信息
  ShareInfo info = 1;
}

// 删除分享请求
message DeleteShareRequest {
  // 分享 id
  string id = 1;
}

// 删除分享响应
message DeleteShareResponse {}

// 获取分享元信息请求（公开）
message GetShareMetaRequest {
  // 公开访问令牌
  string token = 1;
}

// 获取分享元信息响应（公开，不含提取码本身）
message GetShareMetaResponse {
  // 展示名称
  string name = 1;
  // 是否文件夹
  bool is_dir = 2;
  // 文件大小（文件夹为 0）
  uint64 size = 3;
  // 是否需要提取码
  bool need_code = 4;
  // 过期时间，空=永久
  google.protobuf.Timestamp expires_at = 5;
  // 下载次数上限，0=不限
  int64 max_downloads = 6;
  // 已下载次数
  int64 download_count = 7;
  // 当前是否可用（启用/未过期/未超次数）
  bool available = 8;
  // 分享者昵称（公开展示）
  string owner_name = 9;
  // 分享者头像（公开展示）
  string owner_avatar = 10;
}

// 浏览分享目录请求（公开，需会话签名）
message ListShareDirRequest {
  // 公开访问令牌
  string token = 1;
  // 会话签名（由 CreateShareSession 换取，替代逐次携带提取码）
  string sign = 2;
  // 分享根下的相对子路径，空=根
  string sub_path = 3;
}

// 分享目录条目
message ShareEntry {
  // 名称
  string name = 1;
  // 是否目录
  bool is_dir = 2;
  // 大小
  uint64 size = 3;
  // 修改时间
  google.protobuf.Timestamp update_time = 4;
  // 相对分享根的路径（用于继续浏览/下载）
  string rel_path = 5;
}

// 浏览分享目录响应
message ListShareDirResponse {
  // 条目列表
  repeated ShareEntry items = 1;
  // 当前子路径
  string sub_path = 2;
}

// 换取分享会话签名请求（公开）
message CreateShareSessionRequest {
  // 公开访问令牌
  string token = 1;
  // 提取码（如分享设置了）
  string code = 2;
}

// 换取分享会话签名响应（公开）
message CreateShareSessionResponse {
  // 会话签名；为空表示需要先通过验证（见 need_code/message）
  string sign = 1;
  // 签名过期时间（限时分享下不晚于分享过期时间）
  google.protobuf.Timestamp expires_at = 2;
  // 是否需要提取码（未提供或错误）
  bool need_code = 3;
  // 失败原因（已关闭/已过期/次数用尽/提取码错误等）
  string message = 4;
}

// 文件来源能力（供前端隐藏/禁用不支持的动作）
message FileSourceCaps {
  // 支持预签名直链（启用 302 跳转的前提）
  bool presign = 1;
  // 支持复制
  bool copy = 2;
  // 支持移动/剪切
  bool move = 3;
  // 支持压缩/解压
  bool compress = 4;
  // 支持断点续传上传
  bool resumable_upload = 5;
}

// 文件来源类型相关配置（密钥字段仅写入、响应中恒为空）
message FileSourceConfig {
  // —— OSS / S3 ——
  // 访问端点，如 oss-cn-hangzhou.aliyuncs.com / s3.amazonaws.com / minio:9000
  string endpoint = 1;
  // 区域
  string region = 2;
  // 桶名
  string bucket = 3;
  // Access Key ID
  string access_key = 4;
  // Secret Key（仅写入，响应恒为空；更新时留空=保留原值）
  string secret_key = 5;
  // 基础路径/对象 key 前缀
  string prefix = 6;
  // 是否使用 https
  bool use_ssl = 7;
  // 是否 path-style（MinIO 等需要）
  bool path_style = 8;
  // —— FTP / WebDAV ——
  // 主机
  string host = 9;
  // 端口
  int32 port = 10;
  // 用户名
  string username = 11;
  // 密码（仅写入，响应恒为空；更新时留空=保留原值）
  string password = 12;
  // 基础路径
  string base_path = 13;
  // 是否启用 TLS（FTP over TLS）
  bool tls = 14;
  // —— WebDAV ——
  // 完整 WebDAV 基础 URL，如 https://dav.example.com/remote.php/dav/files/me
  string url = 15;
}

// 文件来源信息
message FileSourceInfo {
  // id
  string id = 1;
  // 展示名称
  string name = 2;
  // 类型 oss/ftp/webdav
  string type = 3;
  // 是否启用
  bool enabled = 4;
  // 是否优先 302 直链
  bool redirect_302 = 5;
  // 配置（密钥字段为空）
  FileSourceConfig config = 6;
  // 能力
  FileSourceCaps caps = 7;
  // 创建者昵称
  string creator_name = 8;
  // 创建时间
  google.protobuf.Timestamp create_time = 9;
  // 更新时间
  google.protobuf.Timestamp update_time = 10;
}

// 文件来源列表请求
message ListFileSourcesRequest {
  // 搜索关键字（名称）
  optional string keywords = 1;
  // 只返回已启用（文件浏览器下拉用）
  optional bool enabled_only = 2;
}

// 文件来源列表响应
message ListFileSourcesResponse {
  // 列表
  repeated FileSourceInfo items = 1;
}

// 新增文件来源请求
message CreateFileSourceRequest {
  // 展示名称
  string name = 1;
  // 类型 oss/ftp/webdav
  string type = 2;
  // 是否启用
  bool enabled = 3;
  // 是否优先 302 直链
  bool redirect_302 = 4;
  // 配置
  FileSourceConfig config = 5;
}

// 新增文件来源响应
message CreateFileSourceResponse {
  // 来源信息
  FileSourceInfo info = 1;
}

// 更新文件来源请求
message UpdateFileSourceRequest {
  // id
  string id = 1;
  // 展示名称
  string name = 2;
  // 是否启用
  bool enabled = 3;
  // 是否优先 302 直链
  bool redirect_302 = 4;
  // 配置（密钥字段留空=保留原值）
  FileSourceConfig config = 5;
}

// 更新文件来源响应
message UpdateFileSourceResponse {
  // 来源信息
  FileSourceInfo info = 1;
}

// 删除文件来源请求
message DeleteFileSourceRequest {
  // id
  string id = 1;
}

// 删除文件来源响应
message DeleteFileSourceResponse {}

// 测试文件来源连通性请求（传 id 测已存在来源；或传 type+config 测未保存配置）
message TestFileSourceRequest {
  // 已存在来源 id（优先）
  string id = 1;
  // 类型 oss/ftp/webdav
  string type = 2;
  // 配置
  FileSourceConfig config = 3;
}

// 测试文件来源连通性响应
message TestFileSourceResponse {
  // 是否连通
  bool ok = 1;
  // 结果消息
  string message = 2;
}

// 文件排序字段
enum FileSortField {
  // 未指定
  FILE_SORT_FIELD_UNSPECIFIED = 0;
  // 名称
  FILE_SORT_FIELD_NAME = 1;
  // 修改时间
  FILE_SORT_FIELD_UPDATE_TIME = 2;
}

// 文件任务状态
enum FileTaskStatus {
  // 未指定
  FILE_TASK_STATUS_UNSPECIFIED = 0;
  // 等待执行
  FILE_TASK_STATUS_PENDING = 1;
  // 执行中
  FILE_TASK_STATUS_RUNNING = 2;
  // 已完成
  FILE_TASK_STATUS_SUCCESS = 3;
  // 执行失败
  FILE_TASK_STATUS_FAILED = 4;
}

// 获取系统文件列表请求
message GetFileSystemListRequest {
  // 目录路径
  string path = 1;
  // 页码
  int64 page = 2;
  // 每页数量
  int64 page_size = 3;
  // 搜索关键字
  optional string keywords = 4;
  // 是否包含子目录-搜索关键字
  optional bool include_sub_dir = 5;
  // 排序字段
  FileSortField sort_field = 6;
  // 排序是否倒序
  bool is_desc = 7;
  // 文件来源id，空=本地磁盘
  string source_id = 8;
}

// 获取系统文件列表响应
message GetFileSystemListResponse {
  // 当前目录信息
  FileDirectoryInfo directory = 1;
  // 文件列表
  repeated FileEntryInfo items = 2;
  // 当前页码
  int64 page = 3;
  // 每页数量
  int64 page_size = 4;
  // 总数
  int64 total = 5;
}

// 目录信息
message FileDirectoryInfo {
  // 目录名称
  string name = 1;
  // 目录路径
  string path = 2;
  // 父级目录路径
  string parent_path = 3;
  // 子目录数量
  int64 dir_count = 4;
  // 文件数量
  int64 file_count = 5;
  // 条目总数
  int64 item_count = 6;
}

// 系统文件条目信息
message FileEntryInfo {
  // 名称
  string name = 1;
  // 完整路径
  string path = 2;
  // 是否目录
  bool is_dir = 3;
  // 权限
  string permission = 4;
  // 用户名
  string user_name = 5;
  // 用户id
  uint32 user_id = 6;
  // 用户组名
  string group_name = 7;
  // 用户组id
  uint32 group_id = 8;
  // 文件大小
  uint64 size = 9;
  // 修改时间
  google.protobuf.Timestamp update_time = 10;
}

// 目录树节点(懒加载，仅含直接子项的轻量信息；instance.proto 已 import 本文件可复用)
message FileTreeNode {
  // 名称
  string name = 1;
  // 完整路径(回传以继续展开/打开)
  string path = 2;
  // 是否目录
  bool is_dir = 3;
}

// 获取目录树请求(系统级)
message GetFileSystemTreeRequest {
  // 目录路径，空=根目录
  string path = 1;
  // 文件来源id，空=本地磁盘
  string source_id = 2;
}

// 获取目录树响应(系统级)
message GetFileSystemTreeResponse {
  // 实际列出的目录路径(回显)
  string path = 1;
  // 直接子项(目录在前，按名称排序)
  repeated FileTreeNode nodes = 2;
}

// 批量计算系统文件夹大小响应
message BatchCalcFileSystemSizeResponse {
  // 计算结果列表
  repeated FileSizeResult items = 1;
}

// 系统文件大小结果
message FileSizeResult {
  // 路径
  string path = 1;
  // 大小
  uint64 size = 2;
  // 是否成功
  bool success = 3;
  // 结果消息
  string message = 4;
}

// 批量删除系统文件请求
message BatchDeleteFileSystemRequest {
  // 路径列表
  repeated string paths = 1;
  // 文件来源id，空=本地磁盘
  string source_id = 2;
}

// 批量删除系统文件响应
message BatchDeleteFileSystemResponse {
  // 删除结果列表
  repeated FileOperationResult items = 1;
}

// 批量创建系统文件请求
message CreateFileSystemRequest {
  // 创建信息
  FileCreateItem info = 1;
  // 文件来源id，空=本地磁盘
  string source_id = 2;
}

// 批量创建系统文件响应
message CreateFileSystemResponse {}

// 重命名系统文件请求
message RenameFileSystemRequest {
  // 原路径
  string path = 1;
  // 新名称，不包含路径
  string new_name = 2;
  // 文件来源id，空=本地磁盘
  string source_id = 3;
}

// 重命名系统文件响应
message RenameFileSystemResponse {
  // 重命名后的路径
  string path = 1;
}

// 复制系统文件请求
message CopyFileSystemRequest {
  // 路径列表
  repeated string paths = 1;
  // 目标目录路径
  string target_path = 2;
  // 文件来源id，空=本地磁盘
  string source_id = 3;
}

// 复制系统文件响应
message CopyFileSystemResponse {
  // 异步任务信息
  FileTaskInfo task = 1;
}

// 剪贴系统文件请求
message CutFileSystemRequest {
  // 路径列表
  repeated string paths = 1;
  // 目标目录路径
  string target_path = 2;
  // 文件来源id，空=本地磁盘
  string source_id = 3;
}

// 剪贴系统文件响应
message CutFileSystemResponse {
  // 异步任务信息
  FileTaskInfo task = 1;
}

// 获取文件任务请求
message GetFileTaskRequest {
  // 任务id
  string task_id = 1;
}

// 获取文件任务响应
message GetFileTaskResponse {
  // 任务信息
  FileTaskInfo task = 1;
}

// 文件异步任务信息
message FileTaskInfo {
  // 任务id
  string task_id = 1;
  // 操作类型
  string operation = 2;
  // 任务状态
  FileTaskStatus status = 3;
  // 总任务数
  int64 total = 4;
  // 已完成任务数
  int64 finished = 5;
  // 消息
  string message = 6;
  // 文件操作结果
  repeated FileOperationResult items = 7;
  // 创建时间
  google.protobuf.Timestamp create_time = 8;
  // 更新时间
  google.protobuf.Timestamp update_time = 9;
}

// 批量压缩系统文件请求
message BatchCompressFileSystemRequest {
  // 路径列表
  repeated string paths = 1;
  // 目标压缩文件路径，不传时由服务端自动生成
  optional string target_path = 2;
  // 文件来源id，空=本地磁盘
  string source_id = 3;
}

// 批量压缩系统文件响应
message BatchCompressFileSystemResponse {
  // 实际生成的压缩文件路径
  string output_path = 1;
}

// 解压系统文件请求
message UnzipFileSystemRequest {
  // 压缩文件路径
  string path = 1;
  // 解压目标目录，不传时由服务端自动生成
  optional string target_path = 2;
  // 文件来源id，空=本地磁盘
  string source_id = 3;
}

// 解压系统文件响应
message UnzipFileSystemResponse {
  // 实际生成的解压目录路径
  string output_path = 1;
}

// 系统文件创建项
message FileCreateItem {
  // 路径
  string path = 1;
  // 是否目录
  bool is_dir = 2;
  // 文件内容，目录时忽略
  bytes content = 3;
}

// 系统文件操作结果
message FileOperationResult {
  // 路径
  string path = 1;
  // 是否成功
  bool success = 2;
  // 结果消息
  string message = 3;
}

// 打开系统文件请求
message OpenFileSystemFileRequest {
  // 文件路径
  string path = 1;
  // 文件来源id，空=本地磁盘
  string source_id = 2;
}

// 打开系统文件响应
message OpenFileSystemFileResponse {
  // 文件内容
  bytes info = 1;
}

// 编辑系统文件请求
message EditFileSystemFileRequest {
  // 文件路径
  string path = 1;
  // 文件内容
  bytes content = 2;
  // 文件来源id，空=本地磁盘
  string source_id = 3;
}

// 编辑系统文件响应
message EditFileSystemFileResponse {}

// 文件下载预签名请求
message FileSystemPreSignRequest {
  // 路径
  string path = 1;
  // 文件来源id，空=本地磁盘
  string source_id = 2;
  // 是否内联预览（true=inline 预览，false=attachment 下载）
  bool inline = 3;
}

// 文件下载预签名响应
message FileSystemPreSignResponse {
  // 下载路径
  string download_url_path =1;
}

// 文件上传预签名(系统级)请求
message FileSystemPreSignUploadRequest {
  // 文件路径
  string path = 1;
  // 文件名称
  string file_name = 2;
  // 文件总大小（字节）
  uint64 file_size = 3;
  // 快速hash
  string hash = 4;
  // 分片大小（字节），不传时由服务端自动决定
  optional uint64 part_size = 5;
  // 文件来源id，空=本地磁盘
  string source_id = 6;
}

// 文件上传预签名(系统级)响应
message FileSystemPreSignUploadResponse {
  // 信息
  UploadInfo info = 1;
}

// 获取上传状态请求
message GetFileUploadStatusRequest {
  // 上传id
  string upload_id = 1;
}

// 获取上传状态响应
message GetFileUploadStatusResponse {
  // 信息
  UploadInfo info = 1;
}

// 上传完成合并分片请求
message CompleteFileUploadRequest {
  // 上传id
  string upload_id = 1;
}

// 上传完成合并分片响应
message CompleteFileUploadResponse {}

// 取消文件上传请求
message CancelFileUploadRequest {
  // 上传id
  string upload_id = 1;
}

// 取消文件上传响应
message CancelFileUploadResponse {}

// 上传信息
message UploadInfo {
  // 上传会话 id
  string upload_id = 1;
  // 分片上传地址模板，客户端需要将 {partNumber} 替换为实际分片序号（从 1 开始）
  string upload_part_url_path_template = 2;
  // 实际分片大小（字节）
  uint64 part_size = 3;
  // 文件总大小（字节）
  uint64 file_size = 4;
  // 总分片数
  uint64 total_parts = 5;
  // 已上传完成的分片序号 <切片,hash>
  map<uint64,string> uploaded_parts = 6;
  // 是否已完成上传
  bool completed = 7;
  // 是否已取消上传
  bool cancel = 8;
  // 预签名过期时间
  google.protobuf.Timestamp expired_at = 9;
}
