syntax = "proto3";

package v1;

option go_package = "momoko/api/gen/v1;v1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// 系统管理
service System {
  // 获取当前角色的全部权限
  rpc MePermissions(MePermissionsRequest) returns (MePermissionsResponse) {
    option (google.api.http) = {
      get: "/api/v1/permissions/me"
    };
  }
  // 管理员获取全部权限菜单
  rpc AdminPermissions(AdminPermissionsRequest) returns (AdminPermissionsResponse) {
    option (google.api.http) = {
      get: "/api/v1/permissions/admin"
    };
  }
  // 管理员获取单个权限菜单
  rpc AdminPermissionsInfo(AdminPermissionsInfoRequest) returns (AdminPermissionsInfoResponse) {
    option (google.api.http) = {
      get: "/api/v1/permissions/admin/{menu_id}"
    };
  }
  // 管理员添加权限菜单
  rpc AdminAddPermissions(AdminAddPermissionsRequest) returns (AdminAddPermissionsResponse) {
    option (google.api.http) = {
      post: "/api/v1/permissions/admin/add"
      body: "*"
    };
  }
  // 管理员编辑权限菜单
  rpc AdminEditPermissions(AdminEditPermissionsRequest) returns (AdminEditPermissionsResponse) {
    option (google.api.http) = {
      post: "/api/v1/permissions/admin/{menu_id}"
      body: "*"
    };
  }
  // 管理员删除权限菜单
  rpc AdminDeletePermissions(AdminDeletePermissionsRequest) returns (AdminDeletePermissionsResponse) {
    option (google.api.http) = {
      delete: "/api/v1/permissions/admin/{menu_id}"
    };
  }
  // 管理员获取角色列表
  rpc AdminRoles(AdminRolesRequest) returns (AdminRolesResponse) {
    option (google.api.http) = {
      get: "/api/v1/role/admin"
    };
  }
  // 获取角色详情
  rpc AdminRole(AdminRoleRequest) returns (AdminRoleResponse) {
    option (google.api.http) = {
      get: "/api/v1/role/admin/{role_id}"
    };
  }
  // 添加角色
  rpc AdminAddRole(AdminAddRoleRequest) returns (AdminAddRoleResponse) {
    option (google.api.http) = {
      post: "/api/v1/role/admin/add"
      body: "*"
    };
  }
  // 修改角色
  rpc AdminEditRole(AdminEditRoleRequest) returns (AdminEditRoleResponse) {
    option (google.api.http) = {
      post: "/api/v1/role/admin/{role_id}"
      body: "*"
    };
  }
  // 删除角色
  rpc AdminDeleteRole(AdminDeleteRoleRequest) returns (AdminDeleteRoleResponse) {
    option (google.api.http) = {
      delete: "/api/v1/role/admin/del"
    };
  }
  // 获取登录配置
  rpc LoginConfig(LoginConfigRequest) returns (LoginConfigResponse) {
    option (google.api.http) = {
      get: "/api/v1/system/login-config"
    };
  }
  // 更新登录配置
  rpc UpdateLoginConfig(UpdateLoginConfigRequest) returns (UpdateLoginConfigResponse) {
    option (google.api.http) = {
      put: "/api/v1/system/login-config"
      body: "*"
    };
  }
  // 获取邮件配置
  rpc EmailConfig(EmailConfigRequest) returns (EmailConfigResponse) {
    option (google.api.http) = {
      get: "/api/v1/system/email-config"
    };
  }
  // 更新邮件配置
  rpc UpdateEmailConfig(UpdateEmailConfigRequest) returns (UpdateEmailConfigResponse) {
    option (google.api.http) = {
      put: "/api/v1/system/email-config"
      body: "*"
    };
  }
  // 更新邮件模板
  rpc UpdateEmailTemplate(UpdateEmailTemplateRequest) returns (UpdateEmailTemplateResponse) {
    option (google.api.http) = {
      put: "/api/v1/system/email-template"
      body: "*"
    };
  }
  // 获取指定邮件模板
  rpc EmailTemplate(EmailTemplateRequest) returns (EmailTemplateResponse) {
    option (google.api.http) = {
      get: "/api/v1/system/email-template"
    };
  }
  // 测试邮件配置
  rpc TestEmailConfig(TestEmailConfigRequest) returns (TestEmailConfigResponse) {
    option (google.api.http) = {
      post: "/api/v1/system/email-config/test"
      body: "*"
    };
  }
  // 获取系统信息概览
  rpc SystemOverview(SystemOverviewRequest) returns (SystemOverviewResponse) {
    option (google.api.http) = {
      get: "/api/v1/system/overview"
    };
  }
  // 获取系统实时状态
  rpc SystemStatus(SystemStatusRequest) returns (SystemStatusResponse) {
    option (google.api.http) = {
      get: "/api/v1/system/status"
    };
  }
  // 获取操作日志
  rpc ListOperationLogs(ListOperationLogsRequest) returns (ListOperationLogsResponse) {
    option (google.api.http) = {
      get: "/api/v1/system/operation-logs"
    };
  }
}

// 获取当前角色的全部权限请求
message MePermissionsRequest {}

// 获取当前角色的全部权限响应
message MePermissionsResponse {
  // 权限按钮
  repeated string permissions = 1;
  // 权限菜单
  repeated MenuInfo menus = 2;
}

// 权限菜单信息
message MenuInfo {
  // 菜单id
  string id = 1;
  // 图标
  string icon = 2;
  // 是否系统内置
  bool is_system = 3;
  // 排序
  int32 order = 4;
  // 父级菜单id
  string parent_id = 5;
  // 路径
  string path = 6;
  // 状态
  MenuStatus status = 7;
  // 标题
  string title = 8;
  // 类型
  MenuType type = 9;
  // 权限标识
  string permissions = 10;
  // 创建时间
  google.protobuf.Timestamp create_time = 11;
  // 更新时间
  google.protobuf.Timestamp update_time = 12;
  // 子权限菜单
  repeated MenuInfo children = 13;
}

// 菜单状态
enum MenuStatus {
  // 禁用
  MenuStatus_InActive = 0;
  // 启用
  MenuStatus_Active = 1;
}

// 菜单类型
enum MenuType {
  // 目录
  MenuType_Directory = 0;
  // 菜单
  MenuType_Menu = 1;
  // 按钮
  MenuType_Button = 2;
}

// 管理员获取全部权限菜单请求
message AdminPermissionsRequest {}

// 管理员获取全部权限菜单响应
message AdminPermissionsResponse {
  // 权限菜单
  repeated MenuInfo menus = 1;
}

// 管理员获取单个权限菜单请求
message AdminPermissionsInfoRequest {
  string menu_id = 1;
}

// 管理员获取单个权限菜单响应
message AdminPermissionsInfoResponse {
  // 权限菜单信息
  MenuInfo menu = 1;
}

// 管理员添加权限菜单请求
message AdminAddPermissionsRequest{
  // 类型
  MenuType type = 1;
  // 父级菜单id
  string parent_id = 2;
  // 标题
  string title = 3;
  // 图标
  string icon = 4;
  // 排序
  int32 order = 5;
  // 路径
  string path = 6;
  // 状态
  MenuStatus status = 7;
  // 权限标识
  string permissions = 8;
}

// 管理员添加权限菜单响应
message AdminAddPermissionsResponse {}

// 管理员编辑权限菜单请求
message AdminEditPermissionsRequest{
  // 菜单id
  string menu_id = 1;
  // 标题
  string title = 2;
  // 图标
  string icon = 3;
  // 排序
  int32 order = 4;
  // 路径
  string path = 5;
  // 状态
  MenuStatus status = 6;
  // 权限标识
  string permissions = 7;
}

// 管理员编辑权限菜单响应
message AdminEditPermissionsResponse {}

// 管理员删除权限菜单请求
message AdminDeletePermissionsRequest {
  string menu_id = 1;
}

// 管理员删除权限菜单响应
message AdminDeletePermissionsResponse {}

// 管理员获取角色列表请求
message AdminRolesRequest {
  // 页
  int64 page = 1;
  // 页数量
  int64 page_size = 2;
  // 状态条件筛选
  optional RoleStatus status = 3;
  // 角色名称筛选
  optional string name = 4;
}

// 管理员获取角色列表响应
message AdminRolesResponse {
  // 角色列表
  repeated RoleInfo roles = 1;
  // 实际页
  int64 page = 2;
  // 实际页
  int64 page_size = 3;
  // 总数
  int64 total = 4;
}

// 角色详情
message RoleInfo {
  // 角色id
  string role_id = 1;
  // 角色描述
  string description = 2;
  // 是否内置角色
  bool is_builtin = 3;
  // 角色昵称
  string name = 4;
  // 角色状态
  RoleStatus status = 5;
  // 创建时间
  google.protobuf.Timestamp create_time = 6;
  // 更新时间
  google.protobuf.Timestamp update_time = 7;
  // 角色菜单id
  repeated string menu_ids = 8;
}

enum RoleStatus {
  // 停用
  RoleStatus_InActive = 0;
  // 启用
  RoleStatus_Active = 1;
}

// 获取角色详情请求
message AdminRoleRequest {
  // 角色id
  string role_id = 1;
}

// 获取角色详情响应
message AdminRoleResponse {
  // 角色信息
  RoleInfo role = 1;
}

// 添加角色请求
message AdminAddRoleRequest {
  // 角色描述
  string description = 1;
  // 角色昵称
  string name = 2;
  // 角色状态
  RoleStatus status = 3;
  // 角色菜单id
  repeated string menu_ids = 4;
}

// 添加角色响应
message AdminAddRoleResponse {
  // 角色信息
  RoleInfo role = 1;
}

// 修改角色请求
message AdminEditRoleRequest {
  // 角色id
  string role_id = 1;
  // 角色描述
  string description = 2;
  // 角色昵称
  string name = 3;
  // 角色状态
  RoleStatus status = 4;
  // 角色菜单id
  repeated string menu_ids = 5;
}

// 修改角色响应
message AdminEditRoleResponse {
  // 角色信息
  RoleInfo role = 1;
}

// 删除角色请求
message AdminDeleteRoleRequest {
  // 角色id
  repeated string role_ids = 1;
}

// 删除角色响应
message AdminDeleteRoleResponse{}

// 登录配置
message LoginConfig {
  // 是否开启注册
  bool register_enabled = 1;
  // 是否开启用户名登录
  bool username_login_enabled = 2;
  // 是否开启邮箱登录
  bool email_login_enabled = 3;
}

// 获取登录配置请求
message LoginConfigRequest {}

// 获取登录配置响应
message LoginConfigResponse {
  // 登录配置
  LoginConfig config = 1;
}

// 更新登录配置请求
message UpdateLoginConfigRequest {
  // 是否开启注册
  bool register_enabled = 1;
  // 是否开启用户名登录
  bool username_login_enabled = 2;
  // 是否开启邮箱登录
  bool email_login_enabled = 3;
}

// 更新登录配置响应
message UpdateLoginConfigResponse {
  // 登录配置
  LoginConfig config = 1;
}

// 邮件配置
message EmailConfig {
  // 是否启用邮件服务
  bool enabled = 1;
  // SMTP 服务地址
  string host = 2;
  // SMTP 服务端口
  int32 port = 3;
  // SMTP 用户名
  string username = 4;
  // SMTP 密码
  string password = 5;
  // 发件邮箱
  string from = 6;
  // 发件人名称
  string from_name = 7;
  // 是否使用 TLS
  bool use_tls = 8;
  // 超时时间，单位秒
  int32 timeout_seconds = 9;
  // 并发发送协程数
  int32 ccs_n = 10;
}

// 邮件模板类型
enum EmailTemplateType {
  // 注册
  EmailTemplateType_Register = 0;
  // 登录
  EmailTemplateType_Login = 1;
}

// 模板配置
message EmailTemplate {
  string subject = 1;// 邮件主题 TEXT 模板
  string template = 2;// 邮件内容 HTML 模板
  EmailTemplateType type = 3;// 模板类型
}

// 获取邮件配置请求
message EmailConfigRequest {}

// 获取邮件配置响应
message EmailConfigResponse {
  // 邮件配置
  EmailConfig config = 1;
}

// 更新邮件配置请求
message UpdateEmailConfigRequest {
  // 是否启用邮件服务
  bool enabled = 1;
  // SMTP 服务地址
  string host = 2;
  // SMTP 服务端口
  int32 port = 3;
  // SMTP 用户名
  string username = 4;
  // SMTP 密码
  string password = 5;
  // 发件邮箱
  string from = 6;
  // 发件人名称
  string from_name = 7;
  // 是否使用 TLS
  bool use_tls = 8;
  // 超时时间，单位秒
  int32 timeout_seconds = 9;
  // 并发发送协程数
  int32 ccs_n = 10;
}

// 更新邮件配置响应
message UpdateEmailConfigResponse {
  // 邮件配置
  EmailConfig config = 1;
}

// 更新邮件模板请求
message UpdateEmailTemplateRequest {
  // 模板类型
  EmailTemplateType type = 1;
  // 邮件主题 TEXT 模板
  string subject = 2;
  // 邮件内容 HTML 模板
  string template = 3;
}

// 更新邮件模板响应
message UpdateEmailTemplateResponse {
  // 邮件模板
  EmailTemplate template = 1;
}

// 获取指定邮件模板请求
message EmailTemplateRequest {
  // 模板类型
  EmailTemplateType type = 1;
}

// 获取指定邮件模板响应
message EmailTemplateResponse {
  // 邮件模板
  EmailTemplate template = 1;
}

// 测试邮件配置请求
message TestEmailConfigRequest {
  // 收件邮箱
  string recipient = 1;
  // 邮件配置；不传时使用数据库中的邮件配置
  EmailConfig config = 2;
  // 测试邮件内容;不传时使用默认配置
  optional EmailTemplate messages = 3;
  // 模板占位符
  map<string,string> Data = 4;
}

// 测试邮件配置响应
message TestEmailConfigResponse {}

// 获取系统信息概览请求
message SystemOverviewRequest {}

// 获取系统信息概览响应
message SystemOverviewResponse {
  // 系统版本信息
  SystemVersionInfo version = 1;
  // 开机时间
  google.protobuf.Timestamp boot_time = 2;
  // 运行时长秒数
  uint64 uptime_seconds = 3;
  // CPU基础信息
  CpuOverview cpu = 4;
  // 内存基础信息
  MemoryOverview memory = 5;
  // 网卡列表
  repeated NetworkInterfaceOverview network_interfaces = 6;
  // 磁盘分区列表
  repeated DiskPartitionOverview disk_partitions = 7;
  // 磁盘IO列表
  repeated DiskIOOverview disk_ios = 8;
  // 采样时间
  google.protobuf.Timestamp sample_time = 9;
}

// 获取系统实时状态请求
message SystemStatusRequest {
  // 网卡名称
  optional string interface_name = 1;
  // 磁盘名称
  optional string disk_name = 2;
  // 挂载点
  optional string mountpoint = 3;
}

// 获取系统实时状态响应
message SystemStatusResponse {
  // CPU实时状态
  CpuStatus cpu = 1;
  // 内存实时状态
  MemoryStatus memory = 2;
  // 网络实时状态
  NetworkStatus network = 3;
  // 磁盘实时状态
  DiskStatus disk = 4;
  // 采样时间
  google.protobuf.Timestamp sample_time = 5;
}

// 系统版本信息
message SystemVersionInfo {
  // 主机名
  string hostname = 1;
  // 操作系统
  string os = 2;
  // 平台名称
  string platform = 3;
  // 平台族
  string platform_family = 4;
  // 平台版本
  string platform_version = 5;
  // 内核版本
  string kernel_version = 6;
  // 内核架构
  string kernel_arch = 7;
}

// CPU基础信息
message CpuOverview {
  // 逻辑核心数
  int32 logical_count = 1;
  // 物理核心数
  int32 physical_count = 2;
  // CPU型号名称
  string model_name = 3;
}

// CPU实时状态
message CpuStatus {
  // 总CPU占用百分比
  double total_percent = 1;
  // 每个核心CPU占用百分比
  repeated CpuCoreStatus cores = 2;
  // 逻辑核心数
  int32 logical_count = 3;
  // 物理核心数
  int32 physical_count = 4;
}

// CPU核心状态
message CpuCoreStatus {
  // 核心编号
  int32 core_id = 1;
  // CPU占用百分比
  double percent = 2;
}

// 内存基础信息
message MemoryOverview {
  // 物理内存基础信息
  PhysicalMemoryOverview physical_memory = 1;
  // 虚拟内存基础信息
  VirtualMemoryOverview virtual_memory = 2;
}

// 内存实时状态
message MemoryStatus {
  // 物理内存实时状态
  PhysicalMemoryStatus physical_memory = 1;
  // 虚拟内存实时状态
  VirtualMemoryStatus virtual_memory = 2;
}

// 物理内存基础信息
message PhysicalMemoryOverview {
  // 物理内存总字节数
  uint64 total_bytes = 1;
}

// 物理内存实时状态
message PhysicalMemoryStatus {
  // 物理内存总字节数
  uint64 total_bytes = 1;
  // 物理内存可用字节数
  uint64 available_bytes = 2;
  // 物理内存已用字节数
  uint64 used_bytes = 3;
  // 物理内存空闲字节数
  uint64 free_bytes = 4;
  // 物理内存占用百分比
  double used_percent = 5;
}

// 虚拟内存基础信息
message VirtualMemoryOverview {
  // 虚拟内存总字节数
  uint64 total_bytes = 1;
}

// 虚拟内存实时状态
message VirtualMemoryStatus {
  // 虚拟内存总字节数
  uint64 total_bytes = 1;
  // 虚拟内存已用字节数
  uint64 used_bytes = 2;
  // 虚拟内存空闲字节数
  uint64 free_bytes = 3;
  // 虚拟内存占用百分比
  double used_percent = 4;
  // 累计换入字节数
  uint64 swap_in_bytes = 5;
  // 累计换出字节数
  uint64 swap_out_bytes = 6;
  // 累计换入页数
  uint64 page_in_count = 7;
  // 累计换出页数
  uint64 page_out_count = 8;
  // 累计缺页次数
  uint64 page_fault_count = 9;
  // 累计主缺页次数
  uint64 page_maj_fault_count = 10;
}

// 网卡概览
message NetworkInterfaceOverview {
  // 网卡名称
  string name = 1;
  // MAC地址
  string hardware_addr = 2;
  // MTU
  int32 mtu = 3;
  // 网卡标记
  repeated string flags = 4;
  // 网卡地址
  repeated string addrs = 5;
  // 是否启用
  bool is_up = 6;
  // 是否为回环网卡
  bool is_loopback = 7;
}

// 网络实时状态
message NetworkStatus {
  // 全部网卡汇总流量
  NetworkInterfaceStatus total = 1;
  // 网卡实时状态列表
  repeated NetworkInterfaceStatus interfaces = 2;
  // 当前选中网卡
  NetworkInterfaceStatus selected_interface = 3;
  // 网络连接统计
  NetworkConnectionStatus connections = 4;
}

// 网卡实时状态
message NetworkInterfaceStatus {
  // 网卡名称
  string name = 1;
  // MAC地址
  string hardware_addr = 2;
  // MTU
  int32 mtu = 3;
  // 网卡标记
  repeated string flags = 4;
  // 网卡地址
  repeated string addrs = 5;
  // 是否启用
  bool is_up = 6;
  // 是否为回环网卡
  bool is_loopback = 7;
  // 累计发送字节数
  uint64 bytes_sent = 8;
  // 累计接收字节数
  uint64 bytes_recv = 9;
  // 累计发送包数
  uint64 packets_sent = 10;
  // 累计接收包数
  uint64 packets_recv = 11;
  // 累计接收错误数
  uint64 err_in = 12;
  // 累计发送错误数
  uint64 err_out = 13;
  // 累计接收丢包数
  uint64 drop_in = 14;
  // 累计发送丢包数
  uint64 drop_out = 15;
  // 当前上传速率字节每秒
  double upload_rate_bytes_per_second = 16;
  // 当前下载速率字节每秒
  double download_rate_bytes_per_second = 17;
}

// 网络连接状态
message NetworkConnectionStatus {
  // 当前平台是否支持连接统计
  bool supported = 1;
  // 连接统计错误信息
  string error = 2;
  // TCP连接数
  int64 tcp_count = 3;
  // UDP连接数
  int64 udp_count = 4;
  // 总连接数
  int64 total_count = 5;
  // TCP状态统计
  map<string, int64> tcp_statuses = 6;
}

// 磁盘分区概览
message DiskPartitionOverview {
  // 设备名称
  string device = 1;
  // 挂载点
  string mountpoint = 2;
  // 文件系统类型
  string fstype = 3;
  // 挂载选项
  repeated string opts = 4;
}

// 磁盘IO概览
message DiskIOOverview {
  // 磁盘名称
  string name = 1;
  // 序列号
  string serial_number = 2;
  // 卷标
  string label = 3;
}

// 磁盘实时状态
message DiskStatus {
  // 全部分区汇总使用情况
  DiskPartitionStatus total = 1;
  // 分区使用情况列表
  repeated DiskPartitionStatus partitions = 2;
  // 当前选中分区使用情况
  DiskPartitionStatus selected_partition = 3;
  // 全部磁盘汇总IO状态
  DiskIOStatus total_io = 4;
  // 磁盘IO状态列表
  repeated DiskIOStatus ios = 5;
  // 当前选中磁盘IO状态
  DiskIOStatus selected_io = 6;
  // 当前平台是否支持磁盘IO统计
  bool io_supported = 7;
  // 磁盘IO统计错误信息
  string io_error = 8;
}

// 磁盘分区实时状态
message DiskPartitionStatus {
  // 设备名称
  string device = 1;
  // 挂载点
  string mountpoint = 2;
  // 文件系统类型
  string fstype = 3;
  // 是否支持使用量统计
  bool supported = 4;
  // 使用量统计错误信息
  string error = 5;
  // 总容量字节数
  uint64 total_bytes = 6;
  // 可用容量字节数
  uint64 free_bytes = 7;
  // 已用容量字节数
  uint64 used_bytes = 8;
  // 容量占用百分比
  double used_percent = 9;
  // inode总数
  uint64 inodes_total = 10;
  // 已用inode数
  uint64 inodes_used = 11;
  // 空闲inode数
  uint64 inodes_free = 12;
  // inode占用百分比
  double inodes_used_percent = 13;
}

// 磁盘IO实时状态
message DiskIOStatus {
  // 磁盘名称
  string name = 1;
  // 序列号
  string serial_number = 2;
  // 卷标
  string label = 3;
  // 累计读取次数
  uint64 read_count = 4;
  // 累计写入次数
  uint64 write_count = 5;
  // 累计读取字节数
  uint64 read_bytes = 6;
  // 累计写入字节数
  uint64 write_bytes = 7;
  // 当前读取速率字节每秒
  double read_rate_bytes_per_second = 8;
  // 当前写入速率字节每秒
  double write_rate_bytes_per_second = 9;
  // 正在进行的IO数量
  uint64 iops_in_progress = 10;
  // 累计IO耗时
  uint64 io_time = 11;
}

