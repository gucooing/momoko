  AvatarStorageConfig avatar = 1;
}

// 更新储存设置响应
message UpdateStorageConfigResponse {
  StorageConfig config = 1;
}

// 获取系统信息概览请求
message SystemOverviewRequest {}

// 获取系统信息概览响应
message SystemOverviewResponse {
