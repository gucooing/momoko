syntax = "proto3";

package v1;

option go_package = "momoko/api/gen/v1;v1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// 系统管理
service System {
  // 获取当前角色的全部权限
  rpc MePermissions(MePermissionsRequest) returns (MePermissionsResponse) {
    option (google.api.http) = {
      get: "/api/v1/permissions/me"
    };
  }
  // 检查更新：查询远程最新发行版并与当前版本比较（需 system:update 权限）
  rpc CheckUpdate(CheckUpdateRequest) returns (CheckUpdateResponse) {
    option (google.api.http) = {
      get: "/api/v1/system/update/check"
    };
  }
  // 管理员获取全部权限菜单
  rpc AdminPermissions(AdminPermissionsRequest) returns (AdminPermissionsResponse) {
    option (google.api.http) = {
      get: "/api/v1/permissions/admin"
    };
  }
  // 管理员获取单个权限菜单
  rpc AdminPermissionsInfo(AdminPermissionsInfoRequest) returns (AdminPermissionsInfoResponse) {
    option (google.api.http) = {
      get: "/api/v1/permissions/admin/{menu_id}"
    };
  }
  // 管理员添加权限菜单
  rpc AdminAddPermissions(AdminAddPermissionsRequest) returns (AdminAddPermissionsResponse) {
    option (google.api.http) = {
      post: "/api/v1/permissions/admin/add"
      body: "*"
    };
  }
  // 管理员编辑权限菜单
  rpc AdminEditPermissions(AdminEditPermissionsRequest) returns (AdminEditPermissionsResponse) {
    option (google.api.http) = {
      post: "/api/v1/permissions/admin/{menu_id}"
      body: "*"
    };
  }
  // 管理员删除权限菜单
  rpc AdminDeletePermissions(AdminDeletePermissionsRequest) returns (AdminDeletePermissionsResponse) {
    option (google.api.http) = {
      delete: "/api/v1/permissions/admin/{menu_id}"
    };
  }
  // 管理员获取角色列表
  rpc AdminRoles(AdminRolesRequest) returns (AdminRolesResponse) {
    option (google.api.http) = {
      get: "/api/v1/role/admin"
    };
  }
  // 获取角色详情
  rpc AdminRole(AdminRoleRequest) returns (AdminRoleResponse) {
    option (google.api.http) = {
      get: "/api/v1/role/admin/{role_id}"
    };
  }
  // 添加角色
  rpc AdminAddRole(AdminAddRoleRequest) returns (AdminAddRoleResponse) {
    option (google.api.http) = {
      post: "/api/v1/role/admin/add"
      body: "*"
    };
  }
  // 修改角色
  rpc AdminEditRole(AdminEditRoleRequest) returns (AdminEditRoleResponse) {
    option (google.api.http) = {
      post: "/api/v1/role/admin/{role_id}"
      body: "*"
    };
  }
  // 删除角色
  rpc AdminDeleteRole(AdminDeleteRoleRequest) returns (AdminDeleteRoleResponse) {
    option (google.api.http) = {
      delete: "/api/v1/role/admin/del"
    };
  }
  // 获取登录配置
  rpc LoginConfig(LoginConfigRequest) returns (LoginConfigResponse) {
    option (google.api.http) = {
      get: "/api/v1/system/login-config"
    };
  }
  // 更新登录配置
  rpc UpdateLoginConfig(UpdateLoginConfigRequest) returns (UpdateLoginConfigResponse) {
    option (google.api.http) = {
      put: "/api/v1/system/login-config"
      body: "*"
    };
  }
  // 获取站点常规配置（站点名称、对外地址、默认语言、版本更新偏好）
  rpc SiteConfig(SiteConfigRequest) returns (SiteConfigResponse) {
    option (google.api.http) = {
      get: "/api/v1/system/site-config"
    };
  }
  // 更新站点常规配置
  rpc UpdateSiteConfig(UpdateSiteConfigRequest) returns (UpdateSiteConfigResponse) {
    option (google.api.http) = {
      put: "/api/v1/system/site-config"
      body: "*"
    };
  }
  // 获取邮件配置
  rpc EmailConfig(EmailConfigRequest) returns (EmailConfigResponse) {
    option (google.api.http) = {
      get: "/api/v1/system/email-config"
    };
  }
  // 更新邮件配置
  rpc UpdateEmailConfig(UpdateEmailConfigRequest) returns (UpdateEmailConfigResponse) {
    option (google.api.http) = {
      put: "/api/v1/system/email-config"
      body: "*"
    };
  }
  // 更新邮件模板
  rpc UpdateEmailTemplate(UpdateEmailTemplateRequest) returns (UpdateEmailTemplateResponse) {
    option (google.api.http) = {
      put: "/api/v1/system/email-template"
      body: "*"
    };
  }
  // 获取指定邮件模板
  rpc EmailTemplate(EmailTemplateRequest) returns (EmailTemplateResponse) {
    option (google.api.http) = {
      get: "/api/v1/system/email-template"
    };
  }
  // 列出全部邮件模板（含是否自定义、最后修改时间）
  rpc ListEmailTemplates(ListEmailTemplatesRequest) returns (ListEmailTemplatesResponse) {
    option (google.api.http) = {
      get: "/api/v1/system/email-templates"
    };
  }
  // 测试邮件配置
  rpc TestEmailConfig(TestEmailConfigRequest) returns (TestEmailConfigResponse) {
    option (google.api.http) = {
      post: "/api/v1/system/email-config/test"
      body: "*"
    };
  }
  // 获取储存设置（头像储存等）
  rpc StorageConfig(StorageConfigRequest) returns (StorageConfigResponse) {
    option (google.api.http) = {
      get: "/api/v1/system/storage-config"
    };
  }
  // 更新储存设置
  rpc UpdateStorageConfig(UpdateStorageConfigRequest) returns (UpdateStorageConfigResponse) {
    option (google.api.http) = {
      put: "/api/v1/system/storage-config"
      body: "*"
    };
  }
  // 获取系统信息概览
  rpc SystemOverview(SystemOverviewRequest) returns (SystemOverviewResponse) {
    option (google.api.http) = {
      get: "/api/v1/system/overview"
    };
  }
  // 获取系统实时状态
  rpc SystemStatus(SystemStatusRequest) returns (SystemStatusResponse) {
    option (google.api.http) = {
      get: "/api/v1/system/status"
    };
  }
  // 获取操作日志
  rpc ListOperationLogs(ListOperationLogsRequest) returns (ListOperationLogsResponse) {
    option (google.api.http) = {
      get: "/api/v1/system/operation-logs"
    };
  }
  // 操作日志统计（今日操作、今日失败、今日活跃用户、今日经主控转发）
  rpc OperationLogStats(OperationLogStatsRequest) returns (OperationLogStatsResponse) {
    option (google.api.http) = {
      get: "/api/v1/system/operation-logs/stats"
    };
  }
  // 修改操作记录保留策略（保留天数，0=永久保留）；超期记录由「操作记录清理」定时任务删除
  rpc UpdateOperationLogRetention(UpdateOperationLogRetentionRequest) returns (UpdateOperationLogRetentionResponse) {
    option (google.api.http) = {
      put: "/api/v1/system/operation-logs/retention"
      body: "*"
    };
  }
}

// 获取当前角色的全部权限请求
message MePermissionsRequest {}

// 获取当前角色的全部权限响应
message MePermissionsResponse {
  // 权限按钮
  repeated string permissions = 1;
  // 权限菜单
  repeated MenuInfo menus = 2;
  // 当前运行版本号（构建期注入，开发构建为 "dev"）
  string current_version = 3;
}

// 检查更新请求
message CheckUpdateRequest {}

// 检查更新响应
message CheckUpdateResponse {
  // 当前运行版本号
  string current_version = 1;
  // 远程最新版本号（tag）
  string latest_version = 2;
  // 是否有可用更新
  bool has_update = 3;
  // 最新发行版页面地址
  string release_url = 4;
  // 最新发行版名称
  string release_name = 5;
  // 最新发行版发布时间
  google.protobuf.Timestamp published_at = 6;
  // 最新发行版 Markdown 更新内容
  string release_body = 7;
  // 本次检查时间
  google.protobuf.Timestamp checked_at = 8;
  // 检查所用的更新通道
  UpdateChannel channel = 9;
}

// 权限菜单信息
message MenuInfo {
  // 菜单id
  string id = 1;
  // 图标
  string icon = 2;
  // 是否系统内置
  bool is_system = 3;
  // 排序
  int32 order = 4;
  // 父级菜单id
  string parent_id = 5;
  // 路径
  string path = 6;
  // 状态
  MenuStatus status = 7;
  // 标题
  string title = 8;
  // 类型
  MenuType type = 9;
  // 权限标识
  string permissions = 10;
  // 创建时间
  google.protobuf.Timestamp create_time = 11;
  // 更新时间
  google.protobuf.Timestamp update_time = 12;
  // 子权限菜单
  repeated MenuInfo children = 13;
  // 在侧边栏隐藏：只影响导航显示，页面与权限仍然有效
  bool hidden = 14;
}

// 菜单状态
enum MenuStatus {
  // 禁用
  MenuStatus_InActive = 0;
  // 启用
  MenuStatus_Active = 1;
}

// 菜单类型
enum MenuType {
  // 目录
  MenuType_Directory = 0;
  // 菜单
  MenuType_Menu = 1;
  // 按钮
  MenuType_Button = 2;
}

// 管理员获取全部权限菜单请求
message AdminPermissionsRequest {}

// 管理员获取全部权限菜单响应
message AdminPermissionsResponse {
  // 权限菜单
  repeated MenuInfo menus = 1;
}

// 管理员获取单个权限菜单请求
message AdminPermissionsInfoRequest {
  string menu_id = 1;
}

// 管理员获取单个权限菜单响应
message AdminPermissionsInfoResponse {
  // 权限菜单信息
  MenuInfo menu = 1;
}

// 管理员添加权限菜单请求
message AdminAddPermissionsRequest{
  // 类型
  MenuType type = 1;
  // 父级菜单id
  string parent_id = 2;
  // 标题
  string title = 3;
  // 图标
  string icon = 4;
  // 排序
  int32 order = 5;
  // 路径
  string path = 6;
  // 状态
  MenuStatus status = 7;
  // 权限标识
  string permissions = 8;
  // 在侧边栏隐藏
  bool hidden = 9;
}

// 管理员添加权限菜单响应
message AdminAddPermissionsResponse {}

// 管理员编辑权限菜单请求
message AdminEditPermissionsRequest{
  // 菜单id
  string menu_id = 1;
  // 标题
  string title = 2;
  // 图标
  string icon = 3;
  // 排序
  int32 order = 4;
  // 路径
  string path = 5;
  // 状态
  MenuStatus status = 6;
  // 权限标识
  string permissions = 7;
  // 在侧边栏隐藏
  bool hidden = 8;
}

// 管理员编辑权限菜单响应
message AdminEditPermissionsResponse {}

// 管理员删除权限菜单请求
message AdminDeletePermissionsRequest {
  string menu_id = 1;
}

// 管理员删除权限菜单响应
message AdminDeletePermissionsResponse {}

// 管理员获取角色列表请求
message AdminRolesRequest {
  // 页
  int64 page = 1;
  // 页数量
  int64 page_size = 2;
  // 状态条件筛选
  optional RoleStatus status = 3;
  // 角色名称筛选
  optional string name = 4;
}

// 管理员获取角色列表响应
message AdminRolesResponse {
  // 角色列表
  repeated RoleInfo roles = 1;
  // 实际页
  int64 page = 2;
  // 实际页
  int64 page_size = 3;
  // 总数
  int64 total = 4;
}

// 角色详情
message RoleInfo {
  // 角色id
  string role_id = 1;
  // 角色描述
  string description = 2;
  // 是否内置角色
  bool is_builtin = 3;
  // 角色昵称
  string name = 4;
  // 角色状态
  RoleStatus status = 5;
  // 创建时间
  google.protobuf.Timestamp create_time = 6;
  // 更新时间
  google.protobuf.Timestamp update_time = 7;
  // 角色菜单id
  repeated string menu_ids = 8;
  // 分配了该角色的用户数
  int64 user_count = 9;
  // 成员预览（最多 5 个，按用户 id 升序）
  repeated RoleMember members = 10;
}

// 角色成员预览
message RoleMember {
  // 用户 id
  string user_id = 1;
  // 昵称（为空时前端显示用户名）
  string name = 2;
  // 用户名
  string username = 3;
  // 头像
  string avatar = 4;
}

enum RoleStatus {
  // 停用
  RoleStatus_InActive = 0;
  // 启用
  RoleStatus_Active = 1;
}

// 获取角色详情请求
message AdminRoleRequest {
  // 角色id
  string role_id = 1;
}

// 获取角色详情响应
message AdminRoleResponse {
  // 角色信息
  RoleInfo role = 1;
}

// 添加角色请求
message AdminAddRoleRequest {
  // 角色描述
  string description = 1;
  // 角色昵称
  string name = 2;
  // 角色状态
  RoleStatus status = 3;
  // 角色菜单id
  repeated string menu_ids = 4;
}

// 添加角色响应
message AdminAddRoleResponse {
  // 角色信息
  RoleInfo role = 1;
}

// 修改角色请求
message AdminEditRoleRequest {
  // 角色id
  string role_id = 1;
  // 角色描述
  string description = 2;
  // 角色昵称
  string name = 3;
  // 角色状态
  RoleStatus status = 4;
  // 角色菜单id
  repeated string menu_ids = 5;
}

// 修改角色响应
message AdminEditRoleResponse {
  // 角色信息
  RoleInfo role = 1;
}

// 删除角色请求
message AdminDeleteRoleRequest {
  // 角色id
  repeated string role_ids = 1;
}

// 删除角色响应
message AdminDeleteRoleResponse{}

// 登录配置
message LoginConfig {
  // 是否开启注册
  bool register_enabled = 1;
  // 是否开启用户名登录
  bool username_login_enabled = 2;
  // 是否开启邮箱登录
  bool email_login_enabled = 3;
  // 注册时是否强制验证邮箱
  bool register_email_verification_required = 4;
  // 访问令牌有效期（分钟）
  int32 access_token_ttl_minutes = 5;
  // 刷新令牌有效期（天）：超过该时长未使用需重新登录
  int32 refresh_token_ttl_days = 6;
  // 登录失败锁定：按账号 + IP 连续失败次数达到该值后锁定；0 表示不锁定
  int32 lockout_threshold = 7;
  // 登录失败锁定时长（分钟）
  int32 lockout_minutes = 8;
}

// 获取登录配置请求
message LoginConfigRequest {}

// 获取登录配置响应（公开接口，登录页使用）
message LoginConfigResponse {
  // 登录配置
  LoginConfig config = 1;
  // 站点名称
  string site_name = 2;
  // 默认语言（zh-CN / zh-HK / en-US；auto 表示跟随浏览器）
  string default_language = 3;
  // 邮件服务是否已启用：关闭时邮箱验证码登录、注册邮箱验证与找回密码都无法发信
  bool mail_enabled = 4;
}

// 更新登录配置请求
message UpdateLoginConfigRequest {
  // 是否开启注册
  bool register_enabled = 1;
  // 是否开启用户名登录
  bool username_login_enabled = 2;
  // 是否开启邮箱登录
  bool email_login_enabled = 3;
  // 注册时是否强制验证邮箱
  bool register_email_verification_required = 4;
  // 访问令牌有效期（分钟）
  int32 access_token_ttl_minutes = 5;
  // 刷新令牌有效期（天）
  int32 refresh_token_ttl_days = 6;
  // 登录失败锁定次数；0 表示不锁定
  int32 lockout_threshold = 7;
  // 登录失败锁定时长（分钟）
  int32 lockout_minutes = 8;
}

// 更新登录配置响应
message UpdateLoginConfigResponse {
  // 登录配置
  LoginConfig config = 1;
}

// 更新通道
enum UpdateChannel {
  // 稳定版：只看正式发行版
  UpdateChannel_Stable = 0;
  // 测试版：包含预发布版本
  UpdateChannel_Beta = 1;
}

// 最近一次检查更新结果
message UpdateCheckResult {
  // 检查时间
  google.protobuf.Timestamp time = 1;
  // 远程最新版本号
  string latest_version = 2;
  // 是否有可用更新
  bool has_update = 3;
  // 失败原因（成功时为空）
  string error = 4;
  // 发行版页面地址
  string release_url = 5;
  // 是否由每日自动检查触发
  bool auto = 6;
}

// 设置的最近修改记录
message SettingsAudit {
  // 修改时间
  google.protobuf.Timestamp time = 1;
  // 修改人
  string user_name = 2;
}

// 站点常规配置
message SiteConfig {
  // 站点名称：显示在浏览器标签、登录页和邮件里（邮件模板变量 {{.site}}）
  string site_name = 1;
  // 对外访问地址（如 https://panel.example.com），邮件模板变量 {{.url}}
  string external_url = 2;
  // 默认语言：zh-CN / zh-HK / en-US / auto（跟随浏览器）
  string default_language = 3;
  // 每天自动检查一次更新
  bool auto_check_update = 4;
  // 更新通道
  UpdateChannel update_channel = 5;
  // 最近一次检查更新结果（只读）
  UpdateCheckResult last_update_check = 6;
  // 系统设置最近一次修改（只读，登录/邮件/模板/常规任一保存都会刷新）
  SettingsAudit last_modified = 7;
}

// 获取站点常规配置请求
message SiteConfigRequest {}

// 获取站点常规配置响应
message SiteConfigResponse {
  SiteConfig config = 1;
}

// 更新站点常规配置请求
message UpdateSiteConfigRequest {
  // 站点名称
  string site_name = 1;
  // 对外访问地址
  string external_url = 2;
  // 默认语言
  string default_language = 3;
  // 每天自动检查一次更新
  bool auto_check_update = 4;
  // 更新通道
  UpdateChannel update_channel = 5;
}

// 更新站点常规配置响应
message UpdateSiteConfigResponse {
  SiteConfig config = 1;
}

// 邮件配置
message EmailConfig {
  // 是否启用邮件服务
  bool enabled = 1;
  // SMTP 服务地址
  string host = 2;
  // SMTP 服务端口
  int32 port = 3;
  // SMTP 用户名
  string username = 4;
  // SMTP 密码
  string password = 5;
  // 发件邮箱
  string from = 6;
  // 发件人名称
  string from_name = 7;
  // 加密方式
  EmailEncryption encryption = 11;
  // 超时时间，单位秒
  int32 timeout_seconds = 9;
  // 并发发送协程数
  int32 ccs_n = 10;
  // 最近一次测试发送结果（只读）
  EmailTestResult last_test = 12;
}

// SMTP 加密方式
enum EmailEncryption {
  // 隐式 TLS（SSL，一般 465 端口）
  EmailEncryption_SSL = 0;
  // 明文连接后升级（STARTTLS，一般 587 端口）
  EmailEncryption_STARTTLS = 1;
  // 不加密（一般 25 端口）
  EmailEncryption_NONE = 2;
}

// 邮件测试发送结果
message EmailTestResult {
  // 测试时间
  google.protobuf.Timestamp time = 1;
  // 收件邮箱
  string recipient = 2;
  // 是否成功
  bool success = 3;
  // 失败原因
  string error = 4;
  // 耗时毫秒
  int64 duration_ms = 5;
}

// 邮件模板类型
enum EmailTemplateType {
  // 注册
  EmailTemplateType_Register = 0;
  // 登录
  EmailTemplateType_Login = 1;
  // 重置密码
  EmailTemplateType_ResetPassword = 2;
}

// 模板配置
message EmailTemplate {
  string subject = 1;// 邮件主题 TEXT 模板
  string template = 2;// 邮件内容 HTML 模板
  EmailTemplateType type = 3;// 模板类型
  bool customized = 4;// 是否已自定义（false 表示仍是内置默认模板）
  google.protobuf.Timestamp update_time = 5;// 最后修改时间（未自定义时为空）
}

// 列出全部邮件模板请求
message ListEmailTemplatesRequest {}

// 列出全部邮件模板响应
message ListEmailTemplatesResponse {
  repeated EmailTemplate templates = 1;
}

// 获取邮件配置请求
message EmailConfigRequest {}

// 获取邮件配置响应
message EmailConfigResponse {
  // 邮件配置
  EmailConfig config = 1;
}

// 更新邮件配置请求
message UpdateEmailConfigRequest {
  // 是否启用邮件服务
  bool enabled = 1;
  // SMTP 服务地址
  string host = 2;
  // SMTP 服务端口
  int32 port = 3;
  // SMTP 用户名
  string username = 4;
  // SMTP 密码
  string password = 5;
  // 发件邮箱
  string from = 6;
  // 发件人名称
  string from_name = 7;
  // 加密方式
  EmailEncryption encryption = 11;
  // 超时时间，单位秒
  int32 timeout_seconds = 9;
  // 并发发送协程数
  int32 ccs_n = 10;
}

// 更新邮件配置响应
message UpdateEmailConfigResponse {
  // 邮件配置
  EmailConfig config = 1;
}

// 更新邮件模板请求
message UpdateEmailTemplateRequest {
  // 模板类型
  EmailTemplateType type = 1;
  // 邮件主题 TEXT 模板
  string subject = 2;
