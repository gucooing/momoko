message ListOperationLogsRequest {
  // 操作用户id
  optional string user_id = 1;
  // 操作类型
  optional OperationType operation_type = 2;
  // 操作是否成功
  optional bool success = 3;
  // 请求路径
  optional string path = 4;
  // page
  int64 page = 5;
  // page size
  int64 page_size = 6;
  // 开始时间
  google.protobuf.Timestamp start_time = 7;
  // 结束时间
  google.protobuf.Timestamp end_time = 8;
  // 关键字：匹配请求路径、IP、详情
  optional string keywords = 9;
  // 模块：操作类型前缀（Auth/User/System/File/Instance/SSHHost/Node/Docker/OIDC/Task）
  optional string module = 10;
}

// 查询操作日志响应
message ListOperationLogsResponse {
  // 操作日志
  repeated OperationLogInfo logs = 1;
  // actual page
  int64 page = 2;
  // actual page size
  int64 page_size = 3;
  // 总数
  int64 total = 4;
  // 同一组条件（忽略「是否成功」）下的成功数
  int64 success_count = 5;
  // 同一组条件（忽略「是否成功」）下的失败数
  int64 failed_count = 6;
}

// 操作日志统计请求
message OperationLogStatsRequest {}

// 操作日志统计响应（统计范围：服务器本地时间今天 0 点起）
message OperationLogStatsResponse {
  // 今日操作数
  int64 today_total = 1;
  // 今日失败数
  int64 today_failed = 2;
  // 今日活跃用户数（去重）
  int64 today_active_users = 3;
  // 今日经主控转发到远程节点（或来自远程主控）的操作数
  int64 today_forwarded = 4;
  // 全部记录数
  int64 total = 5;
  // 最早一条记录的时间
  google.protobuf.Timestamp earliest_time = 6;
  // 记录保留天数（0=永久保留）
  int32 retention_days = 7;
}

// 修改操作记录保留策略请求
message UpdateOperationLogRetentionRequest {
  // 保留天数：0=永久保留，否则 7–3650
  int32 retention_days = 1;
}

// 修改操作记录保留策略响应
message UpdateOperationLogRetentionResponse {
  int32 retention_days = 1;
  // 本次立即清理掉的超期记录数
  int64 deleted = 2;
}
message OperationLogInfo {
  // 操作用户id
  optional string user_id = 1;
  // 操作类型
  OperationType operation_type = 2;
  // 操作是否成功
  bool success = 3;
  // 操作详情
  string detail = 4;
  // ip
  string ip = 5;
  // ua
  string user_agent = 6;
  // 请求路径
  string path = 7;
  // 耗时毫秒
  int64 duration_ms = 8;
  // 操作时间
  google.protobuf.Timestamp operation_time = 9;
  // 记录 id
  int64 id = 10;
  // 来源 IP 归属（loopback / lan / public，空=未知）
  string ip_scope = 11;
  // 响应状态码（HTTP 语义：成功 200，失败取错误码）
  int32 status_code = 12;
}
