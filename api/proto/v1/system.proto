message TestEmailConfigResponse {}

// 储存设置
message StorageConfig {
  // 头像储存
  AvatarStorageConfig avatar = 1;
}

// 头像储存设置：S3 兼容对象存储，开启后允许用户上传头像（单张不超过 20MB）。
// 头像以公开链接存进用户资料，存储桶（或前缀）需允许公开读取。
message AvatarStorageConfig {
  // 是否开启头像上传
  bool enabled = 1;
  // 服务地址（如 s3.amazonaws.com、minio.example.com:9000，不含协议）
  string endpoint = 2;
  // 区域（如 us-east-1，可留空）
  string region = 3;
  // 存储桶
  string bucket = 4;
  // Access Key
  string access_key = 5;
  // Secret Key：读取时恒为空；更新时留空表示保留原值
  string secret_key = 6;
  // 是否已保存过 Secret Key（只读）
  bool secret_key_set = 7;
  // 使用 HTTPS
  bool use_ssl = 8;
  // 路径风格访问（MinIO 等自建服务一般需要开启）
  bool path_style = 9;
  // 对象 key 前缀（如 avatars），可留空
  string prefix = 10;
  // 公开访问地址（自定义域名 / CDN，如 https://cdn.example.com）；留空则按服务地址与存储桶拼接
  string public_url = 11;
}

// 获取储存设置请求
message StorageConfigRequest {}

// 获取储存设置响应
message StorageConfigResponse {
  StorageConfig config = 1;
}

// 更新储存设置请求
message UpdateStorageConfigRequest {
