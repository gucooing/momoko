syntax = "proto3";

package v1;

option go_package = "momoko/api/gen/user/v1;v1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// 用户服务
service UserService {
  // 获取自己的信息
  rpc MeInfo(MeInfoRequest) returns (MeInfoResponse) {
    option (google.api.http) = {
      get: "/api/v1/user/me"
    };
  }
}

// 获取自己信息请求
message MeInfoRequest{}

// 获取自己信息响应
message MeInfoResponse{
  // 用户信息
  UserInfo user = 1;
}

// 用户信息
message UserInfo {
  // 用户id
  string user_id = 1;
  // 个人简介
  string bio = 2;
  // 创建时间
  google.protobuf.Timestamp create_time = 3;
  // 邮箱
  string email = 4;
  // 头像url
  string avatar = 5;
  // 昵称
  string name = 6;
  // 状态
  UserStatus status = 7;
  // 标签
  string tags = 8;
  // 更新时间
  google.protobuf.Timestamp update_time = 9;
  // 账户名
  string username = 10;
  // 角色名称
  string role_name = 11;
}

// 用户状态
enum UserStatus {
  // 未激活
  InActive = 0;
  // 活跃
  Active = 1;
  // 冻结
  Freeze = 2;
}

// 登录信息
message LoginInfo {
  // 设备id
  string device_id = 1;
  // 登录时间
  google.protobuf.Timestamp time = 2;
  // ip
  string ip = 3;
  // 登录状态
  LoginStatus status = 4;
}

// 登录状态
enum LoginStatus {
  // 登录成功
  Success = 0;
  // 密码错误
  Password = 1;
}