syntax = "proto3";

package v1;

option go_package = "momoko/api/gen/v1;v1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "v1/system.proto";

// 用户服务
service UserService {
  // 获取自己的信息
  rpc MeInfo(MeInfoRequest) returns (MeInfoResponse) {
    option (google.api.http) = {
      get: "/api/v1/user/me"
    };
  }
  // 更新个人资料
  rpc UpdateMe(UpdateMeRequest) returns (UpdateMeResponse) {
    option (google.api.http) = {
      put: "/api/v1/auth/me"
      body: "*"
    };
  }
  // 保存自己的外观偏好（跟随账号同步到所有设备；不记操作日志）
  rpc UpdateMyAppearance(UpdateMyAppearanceRequest) returns (UpdateMyAppearanceResponse) {
    option (google.api.http) = {
      put: "/api/v1/user/me/appearance"
      body: "*"
    };
  }
  // 获取自己的登录日志
  rpc MyLoginLogs(MyLoginLogsRequest) returns (MyLoginLogsResponse) {
    option (google.api.http) = {
      get: "/api/v1/user/me/login-logs"
    };
  }
  // 获取用户列表
  rpc ListUser(ListUserRequest) returns (ListUserResponse) {
    option (google.api.http) = {
      get: "/api/v1/user/list"
    };
  }
  // 获取用户详情
  rpc UserInfo(UserInfoRequest) returns (UserInfoResponse) {
    option (google.api.http) = {
      get: "/api/v1/user/{user_id}"
    };
  }
  // 添加用户
  rpc AddUser(AddUserRequest) returns (AddUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/user/add"
      body: "*"
    };
  }
  // 更新用户
  rpc EditUser(EditUserRequest) returns (EditUserResponse) {
    option (google.api.http) = {
      put: "/api/v1/user/{user_id}"
      body: "*"
    };
  }
  // 删除用户
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (google.api.http) = {
      delete: "/api/v1/user/del"
    };
  }
  // 批量修改用户状态 / 角色（内置超级管理员会被跳过）
  rpc BatchUpdateUser(BatchUpdateUserRequest) returns (BatchUpdateUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/user/batch"
      body: "*"
    };
  }
  // 管理员重置用户密码（重置后该用户所有会话下线）
  rpc ResetUserPassword(ResetUserPasswordRequest) returns (ResetUserPasswordResponse) {
    option (google.api.http) = {
      put: "/api/v1/user/{user_id}/password"
      body: "*"
    };
  }
}

// 获取自己信息请求
message MeInfoRequest{}

// 获取自己信息响应
message MeInfoResponse{
  // 用户信息
  UserInfo user = 1;
  // 外观偏好（从未保存过为空，前端沿用本机设置）
  UserAppearance appearance = 2;
}

// 个人外观偏好：只对自己生效，跟随账号同步到所有设备
message UserAppearance {
  // 配色：sakura / mint / volt / grape / sunset / classic
  string palette = 1;
  // 深浅色：light / dark / auto（跟随系统）
  string mode = 2;
  // 紧凑模式
  bool compact = 3;
  // 减少动效
  bool reduce_motion = 4;
  // 圆角：round（圆润） / standard（标准）
  string radius = 5;
  // 显示已打开页面的标签栏
  bool show_tabs = 6;
}

// 更新个人资料请求
message UpdateMeRequest {
  // 个人简介
  optional string bio = 1;
  // 邮箱
  optional string email = 2;
  // 头像url
  optional string avatar = 3;
  // 昵称
  optional string name = 4;
  // 标签
  optional string tags = 5;
  // 账户名
  optional string username = 6;
  // 手机号
  optional string phone = 7;
}

// 保存外观偏好请求
message UpdateMyAppearanceRequest {
  // 外观偏好（整体替换；未知取值落回默认）
  UserAppearance appearance = 1;
}

// 保存外观偏好响应
message UpdateMyAppearanceResponse {
  // 规范化后实际保存的外观偏好
  UserAppearance appearance = 1;
}

// 更新个人资料响应
message UpdateMeResponse {
  // 用户信息
  UserInfo user = 1;
}

// 获取自己的登录日志请求
message MyLoginLogsRequest {
  // page
  int64 page = 1;
  // page size
  int64 page_size = 2;
  // 按结果筛选（空为全部）
  optional bool success = 3;
}

// 获取自己的登录日志响应
message MyLoginLogsResponse {
  // 登录日志
  repeated LoginLogInfo logs = 1;
  // actual page
  int64 page = 2;
  // actual page size
  int64 page_size = 3;
  // 总数（按结果筛选后）
  int64 total = 4;
  // 成功次数（不受结果筛选影响）
  int64 success_count = 5;
  // 失败次数（不受结果筛选影响）
  int64 failed_count = 6;
}

// 登录日志
message LoginLogInfo {
  // 登录时间
  google.protobuf.Timestamp time = 1;
  // ip
  string ip = 2;
  // ip 网络范围：loopback（本机） / lan（局域网） / public（公网）
  string ip_scope = 3;
  // ua
  string user_agent = 4;
  // 登录设备（登录时上报的设备名）
  string device = 5;
  // 设备类型：desktop / mobile / tablet / cli
  string device_type = 6;
  // 登录方式：password（账号密码） / email_code（邮箱验证码）
  string method = 7;
  // 是否成功
  bool success = 8;
  // 失败原因
  string error = 9;
  // 原始操作详情（JSON）
  string detail = 10;
}

// 获取用户列表请求
message ListUserRequest {
  // page
  int64 page = 1;
  // page size
  int64 page_size = 2;
  // status filter
  optional UserStatus status = 3;
  // 关键字：匹配用户名 / 昵称 / 邮箱 / 最近登录 IP
  optional string username = 4;
  // 按角色筛选
  optional string role_id = 5;
}

// 获取用户列表响应
message ListUserResponse {
  // 用户列表
  repeated UserInfo users = 1;
  // actual page
  int64 page = 2;
  // actual page size
  int64 page_size = 3;
  // 总数
  int64 total = 4;
  // 启用数量（按关键字、角色筛选，不受状态筛选影响）
  int64 active_count = 5;
  // 未启用数量
  int64 inactive_count = 6;
  // 今天登录过的用户数量（按关键字、角色筛选）
  int64 today_login_count = 7;
}

// 获取用户详情请求
message UserInfoRequest {
  // 用户id
  string user_id = 1;
}

// 获取用户详情响应
message UserInfoResponse {
  // 用户信息
  UserInfo user = 1;
}

// 用户信息
message UserInfo {
  // 用户id
  string user_id = 1;
  // 个人简介
  string bio = 2;
  // 创建时间
  google.protobuf.Timestamp create_time = 3;
  // 邮箱
  string email = 4;
  // 头像url
  string avatar = 5;
  // 昵称
  string name = 6;
  // 状态
  UserStatus status = 7;
  // 标签
  string tags = 8;
  // 更新时间
  google.protobuf.Timestamp update_time = 9;
  // 账户名
  string username = 10;
  reserved 11, 12;
  // 最近一次登录时间（未登录过为空）
  google.protobuf.Timestamp last_login_time = 13;
  // 最近一次修改密码时间（从未修改为空）
  google.protobuf.Timestamp password_update_time = 14;
  // 手机号
  string phone = 15;
  // 最近一次登录 IP
  string last_login_ip = 16;
  // 最近一次登录方式：password（账号密码） / email_code（邮箱验证码）
  string last_login_method = 17;
  // 是否系统内置账号（初始化时创建的超级管理员；不能删除、停用或修改角色）
  bool is_builtin = 18;
  // 用户拥有的角色（可多个，权限取并集；按角色 id 升序）
  repeated UserRole roles = 19;
}

// 用户拥有的角色
message UserRole {
  // 角色id
  string role_id = 1;
  // 角色名称
  string name = 2;
  // 是否内置角色
  bool is_builtin = 3;
}

// 角色 id 集合（批量分配角色时用；字段存在即表示替换为该集合）
message UserRoleIds {
  repeated string ids = 1;
}

// 用户状态
enum UserStatus {
  // 未激活
  InActive = 0;
  // 活跃
  Active = 1;
}

// 登录信息
message LoginInfo {
  // 设备id
  string device_id = 1;
  // 登录时间
  google.protobuf.Timestamp time = 2;
  // ip
  string ip = 3;
  // 登录状态
  LoginStatus status = 4;
}

// 登录状态
enum LoginStatus {
  // 登录成功
  Success = 0;
  // 密码错误
  Password = 1;
}

// 添加用户请求
message AddUserRequest {
  // 账号
  string username = 1;
  // 密码
  string password = 2;
  // 邮箱
  string email = 3;
  // 昵称
  string name = 4;
  // 头像url
  string avatar = 5;
  // bio
  string bio = 6;
  // 标签
  string tags = 7;
  // status
  UserStatus status = 8;
  reserved 9;
  // 角色id（可多个；为空时分配内置「无权限」角色）
  repeated string role_ids = 10;
}

// 添加用户响应
message AddUserResponse {
  // 用户信息
  UserInfo user = 1;
}

// 更新用户请求
message EditUserRequest {
  // 用户id
  string user_id = 1;
  // 邮箱
  string email = 2;
  // 昵称
  string name = 3;
  // 头像url
  string avatar = 4;
  // bio
  string bio = 5;
  // 标签
  string tags = 6;
  // status
  UserStatus status = 7;
  reserved 8;
  // 角色id（可多个；为空时分配内置「无权限」角色）
  repeated string role_ids = 9;
}

// 更新用户响应
message EditUserResponse {
  // 用户信息
  UserInfo user = 1;
}

// 删除用户请求
message DeleteUserRequest {
  // 用户id
  repeated string user_ids = 1;
}

// 删除用户响应
message DeleteUserResponse {}

// 批量修改用户请求
message BatchUpdateUserRequest {
  // 用户id
  repeated string user_ids = 1;
  // 新状态（不传则不修改）
  optional UserStatus status = 2;
  reserved 3;
  // 新角色集合（不传则不修改；传入即替换为该集合，空集合表示只保留「无权限」）
  UserRoleIds roles = 4;
}

// 批量修改用户响应
message BatchUpdateUserResponse {
  // 实际修改的用户数
  int64 updated = 1;
  // 跳过的用户数（内置账号）
  int64 skipped = 2;
}

// 重置用户密码请求
message ResetUserPasswordRequest {
  // 用户id
  string user_id = 1;
  // 新密码
  string password = 2;
}

// 重置用户密码响应
message ResetUserPasswordResponse {}
