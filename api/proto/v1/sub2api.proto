syntax = "proto3";

package v1;

option go_package = "momoko/api/gen/v1;v1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// Sub2API 公共首页与管理
service Sub2APIManager {
  // 获取 Sub2API 公开首页数据（无需鉴权）
  rpc PublicSub2APIHome(PublicSub2APIHomeRequest) returns (PublicSub2APIHomeResponse) {
    option (google.api.http) = {
      get: "/api/v1/public/sub2api/home"
    };
  }
  // 获取 Sub2API 配置
  rpc GetSub2APIConfig(GetSub2APIConfigRequest) returns (GetSub2APIConfigResponse) {
    option (google.api.http) = {
      get: "/api/v1/sub2api/config"
    };
  }
  // 更新 Sub2API 配置
  rpc UpdateSub2APIConfig(UpdateSub2APIConfigRequest) returns (UpdateSub2APIConfigResponse) {
    option (google.api.http) = {
      put: "/api/v1/sub2api/config"
      body: "*"
    };
  }
  // 测试 Sub2API 管理员连接
  rpc TestSub2APIConnection(TestSub2APIConnectionRequest) returns (TestSub2APIConnectionResponse) {
    option (google.api.http) = {
      post: "/api/v1/sub2api/config/test"
      body: "*"
    };
  }
  // 手动同步 Sub2API 使用记录
  rpc SyncSub2APIUsage(SyncSub2APIUsageRequest) returns (SyncSub2APIUsageResponse) {
    option (google.api.http) = {
      post: "/api/v1/sub2api/sync"
      body: "*"
    };
  }
  // 获取 Sub2API 当前聚合快照
  rpc GetSub2APISnapshot(GetSub2APISnapshotRequest) returns (GetSub2APISnapshotResponse) {
    option (google.api.http) = {
      get: "/api/v1/sub2api/snapshot"
    };
  }
  // 获取指定时间区间的公开用量统计（无需鉴权）
  rpc GetPublicSub2APIStats(GetSub2APIStatsRequest) returns (GetSub2APIStatsResponse) {
    option (google.api.http) = {
      get: "/api/v1/public/sub2api/stats"
    };
  }
  // 获取管理端用量概览（按时间区间统计，需鉴权）
  rpc GetSub2APIStats(GetSub2APIAdminStatsRequest) returns (GetSub2APIAdminStatsResponse) {
    option (google.api.http) = {
      get: "/api/v1/sub2api/stats"
    };
  }
  // 获取管理端最近请求（按时间区间分页，需鉴权）
  rpc GetSub2APIRecentRequests(GetSub2APIRecentRequestsRequest) returns (GetSub2APIRecentRequestsResponse) {
    option (google.api.http) = {
      get: "/api/v1/sub2api/recent-requests"
    };
  }

  // 公告管理
  rpc ListSub2APIAnnouncements(ListSub2APIAnnouncementsRequest) returns (ListSub2APIAnnouncementsResponse) {
    option (google.api.http) = {
      get: "/api/v1/sub2api/announcements"
    };
  }
  rpc CreateSub2APIAnnouncement(CreateSub2APIAnnouncementRequest) returns (Sub2APIAnnouncementResponse) {
    option (google.api.http) = {
      post: "/api/v1/sub2api/announcements"
      body: "*"
    };
  }
  rpc UpdateSub2APIAnnouncement(UpdateSub2APIAnnouncementRequest) returns (Sub2APIAnnouncementResponse) {
    option (google.api.http) = {
      put: "/api/v1/sub2api/announcements/{id}"
      body: "*"
    };
  }
  rpc DeleteSub2APIAnnouncement(DeleteSub2APIAnnouncementRequest) returns (DeleteSub2APIAnnouncementResponse) {
    option (google.api.http) = {
      delete: "/api/v1/sub2api/announcements/{id}"
    };
  }

  // 时间线管理
  rpc ListSub2APITimeline(ListSub2APITimelineRequest) returns (ListSub2APITimelineResponse) {
    option (google.api.http) = {
      get: "/api/v1/sub2api/timeline"
    };
  }
  rpc CreateSub2APITimelineItem(CreateSub2APITimelineItemRequest) returns (Sub2APITimelineItemResponse) {
    option (google.api.http) = {
      post: "/api/v1/sub2api/timeline"
      body: "*"
    };
  }
  rpc UpdateSub2APITimelineItem(UpdateSub2APITimelineItemRequest) returns (Sub2APITimelineItemResponse) {
    option (google.api.http) = {
      put: "/api/v1/sub2api/timeline/{id}"
      body: "*"
    };
  }
  rpc DeleteSub2APITimelineItem(DeleteSub2APITimelineItemRequest) returns (DeleteSub2APITimelineItemResponse) {
    option (google.api.http) = {
      delete: "/api/v1/sub2api/timeline/{id}"
    };
  }

  // ---------- 每日抽奖活动（管理端，需鉴权） ----------
  // 三段概览（累计中 / 报名中 / 配置）
  rpc GetLotteryOverview(GetLotteryOverviewRequest) returns (GetLotteryOverviewResponse) {
    option (google.api.http) = {
      get: "/api/v1/sub2api/lottery/overview"
    };
  }
  // 更新抽奖配置
  rpc UpdateLotterySettings(UpdateLotterySettingsRequest) returns (UpdateLotterySettingsResponse) {
    option (google.api.http) = {
      put: "/api/v1/sub2api/lottery/settings"
      body: "*"
    };
  }
  // 历史轮次分页
  rpc ListLotteryRounds(ListLotteryRoundsRequest) returns (ListLotteryRoundsResponse) {
    option (google.api.http) = {
      get: "/api/v1/sub2api/lottery/rounds"
    };
  }
  // 某轮次详情（含中奖名单）
  rpc GetLotteryRoundDetail(GetLotteryRoundDetailRequest) returns (GetLotteryRoundDetailResponse) {
    option (google.api.http) = {
      get: "/api/v1/sub2api/lottery/rounds/{id}"
    };
  }
  // 手动发放某轮次奖金（autoPayout 关或重试失败时）
  rpc DistributeLotteryRound(DistributeLotteryRoundRequest) returns (DistributeLotteryRoundResponse) {
    option (google.api.http) = {
      post: "/api/v1/sub2api/lottery/rounds/{id}/distribute"
      body: "*"
    };
  }
  // 手动立即结算（测试/补偿）
  rpc TriggerLotterySettle(TriggerLotterySettleRequest) returns (TriggerLotterySettleResponse) {
    option (google.api.http) = {
      post: "/api/v1/sub2api/lottery/settle"
      body: "*"
    };
  }
  // 手动立即开奖（测试/补偿）
  rpc TriggerLotteryDraw(TriggerLotteryDrawRequest) returns (TriggerLotteryDrawResponse) {
    option (google.api.http) = {
      post: "/api/v1/sub2api/lottery/draw"
      body: "*"
    };
  }

  // ---------- 每日抽奖活动（用户端，内嵌 sub2api，X-Sub2API-Token 鉴权） ----------
  // 用户端状态（累计奖池 + 倒计时 + 报名中轮次 + 本人资格/是否已报名）
  rpc GetLotteryStatus(GetLotteryStatusRequest) returns (GetLotteryStatusResponse) {
    option (google.api.http) = {
      get: "/api/v1/public/sub2api/lottery/status"
    };
  }
  // 报名当前轮次
  rpc RegisterLottery(RegisterLotteryRequest) returns (RegisterLotteryResponse) {
    option (google.api.http) = {
      post: "/api/v1/public/sub2api/lottery/register"
      body: "*"
    };
  }
  // 用户端历史 + 本人参与情况
  rpc ListLotteryHistoryPublic(ListLotteryHistoryPublicRequest) returns (ListLotteryHistoryPublicResponse) {
    option (google.api.http) = {
      get: "/api/v1/public/sub2api/lottery/history"
    };
  }
}

message PublicSub2APIHomeRequest {}

message PublicSub2APIHomeResponse {
  Sub2APIHome home = 1;
}

message GetSub2APIConfigRequest {}

message Sub2APIGroup {
  string id = 1;
  string name = 2;
  bool public_enabled = 3;
  // 上游是否已删除；设置页将多个已删除分组合并为「已删除分组」一项
  bool deleted = 4;
}

message GetSub2APIConfigResponse {
  Sub2APIConfig config = 1;
  // 本地已同步分组（含是否公开），配置页直接渲染勾选。
  repeated Sub2APIGroup groups = 2;
}

message UpdateSub2APIConfigRequest {
  Sub2APIConfig config = 1;
}

message UpdateSub2APIConfigResponse {
  Sub2APIConfig config = 1;
}

message TestSub2APIConnectionRequest {
  Sub2APIConfig config = 1;
}

message TestSub2APIConnectionResponse {
  bool connected = 1;
  string message = 2;
}

message SyncSub2APIUsageRequest {
  // 是否强制全量同步
  bool full = 1;
}

message SyncSub2APIUsageResponse {
  Sub2APIUsageSnapshot snapshot = 1;
}

message GetSub2APISnapshotRequest {}

message GetSub2APISnapshotResponse {
  Sub2APIUsageSnapshot snapshot = 1;
}

message GetSub2APIStatsRequest {
  // 统计区间天数：<=1 表示今日，否则为最近 N 天
  int32 range_days = 1;
}

message GetSub2APIStatsResponse {
  Sub2APIStats stats = 1;
}

message GetSub2APIAdminStatsRequest {
  // 统计时间段（Unix 毫秒，精度到分钟）：start_time 起、end_time 止。
  // start_time <= 0 表示不限制起点（全部记录）；end_time <= 0 时按当前时间。
  int64 start_time = 1;
  int64 end_time = 2;
}

message GetSub2APIAdminStatsResponse {
  Sub2APIStats stats = 1;
}

message GetSub2APIRecentRequestsRequest {
  // 统计时间段（Unix 毫秒，精度到分钟）：与管理端用量概览一致。
  // start_time <= 0 表示不限制起点（全部记录）；end_time <= 0 时按当前时间。
  int64 start_time = 1;
  int64 end_time = 2;
  // 页码（从 1 起）与每页条数。
  int32 page = 3;
  int32 page_size = 4;
}

message GetSub2APIRecentRequestsResponse {
  repeated Sub2APIRecentRequest recent_requests = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message Sub2APIStats {
  int32 range_days = 1;
  string range_label = 2;
  int64 request_count = 3;
  int64 success_count = 4;
  double success_rate = 5;
  int64 token_count = 6;
  double average_latency_ms = 7;
  double average_tps = 8;
  repeated Sub2APITrendPoint trend = 9;
  repeated Sub2APITopItem models = 10;
  // UA（User-Agent）维度用量明细，按使用数量降序
  repeated Sub2APITopItem user_agents = 12;
  // 分组维度用量明细，按使用数量降序
  repeated Sub2APITopItem groups = 13;
}

// 仅包含连接与展示配置，公告/时间线为独立资源。
message Sub2APIConfig {
  bool home_enabled = 1;
  bool sync_enabled = 2;
  string base_url = 3;
  string admin_api_key = 4;
  string console_url = 5;
  string title = 6;
  string subtitle = 7;
  string introduction = 8;
  int32 sync_interval_minutes = 9;
  int32 history_days = 10;
  int32 page_size = 11;
  // 允许调用 momoko 生图的 sub2api 站点 origin 列表（留空表示不限制）
  repeated string allowed_src_hosts = 12;
  // 是否启用生图功能
  bool image_enabled = 13;
  // 是否开启站点白名单校验
  bool src_host_whitelist_enabled = 14;
  // 公开页参与统计的分组名称列表（写入分组表 public_enabled，非 KV）。
  // 为空表示不勾选任何分组（公开页统计为空）；由前端勾选后提交。
  repeated string public_groups = 15;
}

message Sub2APIHome {
  bool enabled = 1;
  string console_url = 2;
  string title = 3;
  string subtitle = 4;
  string introduction = 5;
  Sub2APIUsageSnapshot snapshot = 6;
  repeated Sub2APIAnnouncement announcements = 7;
  repeated Sub2APITimelineItem timeline = 8;
}

message Sub2APIAnnouncement {
  string id = 1;
  string title = 2;
  string content = 3;
  string level = 4;
  google.protobuf.Timestamp published_at = 5;
  bool pinned = 6;
}

message Sub2APITimelineItem {
  string id = 1;
  string title = 2;
  string content = 3;
  string category = 4;
  google.protobuf.Timestamp published_at = 5;
}

// 公告管理消息
message ListSub2APIAnnouncementsRequest {}

message ListSub2APIAnnouncementsResponse {
  repeated Sub2APIAnnouncement announcements = 1;
}

message CreateSub2APIAnnouncementRequest {
  string title = 1;
  string content = 2;
  string level = 3;
  bool pinned = 4;
  google.protobuf.Timestamp published_at = 5;
}

message UpdateSub2APIAnnouncementRequest {
  string id = 1;
  string title = 2;
  string content = 3;
  string level = 4;
  bool pinned = 5;
  google.protobuf.Timestamp published_at = 6;
}

message Sub2APIAnnouncementResponse {
  Sub2APIAnnouncement announcement = 1;
}

message DeleteSub2APIAnnouncementRequest {
  string id = 1;
}

message DeleteSub2APIAnnouncementResponse {}

// 时间线管理消息
message ListSub2APITimelineRequest {}

message ListSub2APITimelineResponse {
  repeated Sub2APITimelineItem timeline = 1;
}

message CreateSub2APITimelineItemRequest {
  string title = 1;
  string content = 2;
  string category = 3;
  google.protobuf.Timestamp published_at = 4;
}

message UpdateSub2APITimelineItemRequest {
  string id = 1;
  string title = 2;
  string content = 3;
  string category = 4;
  google.protobuf.Timestamp published_at = 5;
}

message Sub2APITimelineItemResponse {
  Sub2APITimelineItem item = 1;
}

message DeleteSub2APITimelineItemRequest {
  string id = 1;
}

message DeleteSub2APITimelineItemResponse {}

message Sub2APIUsageSnapshot {
  bool configured = 1;
  string status = 2;
  string error = 3;
  google.protobuf.Timestamp last_sync_time = 4;
  google.protobuf.Timestamp next_sync_time = 5;
  google.protobuf.Timestamp latest_record_time = 6;
  int64 synced_records = 7;
  int64 total_records = 8;
  int64 request_count = 9;
  int64 success_count = 10;
  double success_rate = 11;
  double average_latency_ms = 12;
  int64 token_count = 13;
  int64 today_request_count = 14;
  int64 today_success_count = 15;
  double today_success_rate = 16;
  double today_average_latency_ms = 17;
  int64 today_token_count = 18;
  string data_range = 19;
  google.protobuf.Timestamp generated_at = 20;
  repeated Sub2APITrendPoint trend = 21;
  repeated Sub2APITopItem model_usage = 22;
  repeated Sub2APIRecentRequest recent_requests = 24;
  // 最近滑动窗口内的真实吞吐（锚定最新记录时间，避免随墙钟衰减）
  double recent_tps = 25;
  double recent_qps = 26;
  int32 recent_window_seconds = 27;
  // 当日按时间分桶的成功率/生成速度序列（用于首页随时间移动的曲线）
  repeated Sub2APITimePoint today_series = 28;
}

message Sub2APITimePoint {
  google.protobuf.Timestamp time = 1;
  int64 request_count = 2;
  double success_rate = 3;
  double avg_tps = 4;
}

message Sub2APITrendPoint {
  string date = 1;
  int64 request_count = 2;
  int64 success_count = 3;
  double success_rate = 4;
  double average_latency_ms = 5;
  int64 token_count = 6;
}

message Sub2APITopItem {
  string name = 1;
  int64 request_count = 2;
  int64 token_count = 3;
  double success_rate = 4;
  // 该模型的平均 token 生成速度（输出token/秒，按请求平均，不含缓存）
  double avg_tps = 5;
}

message Sub2APIRecentRequest {
  string request_id = 1;
  string model = 2;
  string endpoint = 3;
  string status = 4;
  bool success = 5;
  int64 latency_ms = 6;
  int64 token_count = 7;
  google.protobuf.Timestamp request_time = 8;
  // 详情字段（成功请求）
  double cost = 9;              // 费用（USD）
  int64 first_token_ms = 10;   // 首 token 延迟（毫秒）
  string reasoning_effort = 11; // 推理强度
  string account_name = 12;    // 账号名称
  // 详情字段（失败/上游错误请求）
  string error_message = 13;   // 错误详情
  int32 http_status = 14;      // HTTP 状态码
  string group_name = 15;      // Sub2API 分组名称
}

// ---------- 每日抽奖活动消息 ----------

// 轮次状态
enum LotteryRoundStatus {
  LOTTERY_ROUND_STATUS_UNSPECIFIED = 0;
  // 报名中（00:00 已结算，12:00 前）
  LOTTERY_ROUND_STATUS_REGISTERING = 1;
  // 已开奖
  LOTTERY_ROUND_STATUS_DRAWN = 2;
}

// 派奖状态
enum LotteryPayoutStatus {
  LOTTERY_PAYOUT_STATUS_UNSPECIFIED = 0;
  // 未中奖 / 无需发放
  LOTTERY_PAYOUT_STATUS_NONE = 1;
  // 待发放
  LOTTERY_PAYOUT_STATUS_PENDING = 2;
  // 已发放
  LOTTERY_PAYOUT_STATUS_PAID = 3;
  // 发放失败
  LOTTERY_PAYOUT_STATUS_FAILED = 4;
}

// 用户在某轮的参与情况（用户端历史）
enum LotteryMyStatus {
  LOTTERY_MY_STATUS_UNSPECIFIED = 0;
  // 未参加
  LOTTERY_MY_STATUS_NONE = 1;
  // 已参加未获得
  LOTTERY_MY_STATUS_REGISTERED = 2;
  // 已获得奖金
  LOTTERY_MY_STATUS_WON = 3;
}

// 抽奖配置（存 KV）
message LotterySettings {
  bool enabled = 1;          // 活动是否启用
  double pool_ratio = 2;     // 奖池比例（默认 0.05）
  double threshold = 3;      // 报名门槛金额（默认 2）
  int32 base_winners = 4;    // 基准中奖人数（默认 10）
  int32 max_winners = 5;     // 最大中奖人数（0=无限）
  bool auto_payout = 6;      // 是否自动发放
}

// 一期抽奖轮次
message LotteryRound {
  string id = 1;                              // 轮次日期 YYYY-MM-DD（报名/开奖当天）
  string source_date = 2;                     // 扣费来源日期（前一天）
  google.protobuf.Timestamp settle_time = 3;  // 结算时间
  google.protobuf.Timestamp draw_time = 4;    // 开奖时间
  LotteryRoundStatus status = 5;
  double pool_ratio = 6;                      // 奖池比例快照
  double threshold = 7;                       // 报名门槛快照
  int32 base_winners = 8;
  int32 max_winners = 9;
  double group_spend_total = 10;              // 来源日展示分组扣费之和
  double carry_in = 11;                       // 上一期结转
  double pool_amount = 12;                    // 本轮奖池
  int32 eligible_count = 13;                  // 资格人数
  int32 registered_count = 14;                // 已报名人数
  int32 winner_count = 15;                    // 实际中奖人数
  double per_winner_amount = 16;              // 每位中奖者金额
  double carry_out = 17;                      // 结转到次日
  bool auto_payout = 18;
  bool distributed = 19;                      // 是否已发放
}

// 参与者/中奖记录
message LotteryParticipant {
  int32 id = 1;
  string round_id = 2;
  int64 sub2api_user_id = 3;
  string user_name = 4;
  double spend_snapshot = 5;
  google.protobuf.Timestamp registered_time = 6;
  bool is_winner = 7;
  double prize_amount = 8;
  LotteryPayoutStatus payout_status = 9;
  string payout_error = 10;
}

// 管理端概览
message GetLotteryOverviewRequest {}

message GetLotteryOverviewResponse {
  LotterySettings settings = 1;
  string accum_date = 2;                          // 当前累计日期
  double accum_spend = 3;                         // 今日展示分组扣费
  double accum_pool = 4;                          // 预估奖池 = 比例 × 今日扣费
  int32 accum_eligible = 5;                       // 预估资格人数
  google.protobuf.Timestamp next_settle_time = 6;
  google.protobuf.Timestamp next_draw_time = 7;
  LotteryRound current = 8;                       // 当前报名中轮次（无则为空）
}

message UpdateLotterySettingsRequest {
  LotterySettings settings = 1;
}

message UpdateLotterySettingsResponse {
  LotterySettings settings = 1;
}

message ListLotteryRoundsRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListLotteryRoundsResponse {
  repeated LotteryRound rounds = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetLotteryRoundDetailRequest {
  string id = 1;
}

message GetLotteryRoundDetailResponse {
  LotteryRound round = 1;
  repeated LotteryParticipant winners = 2;
}

message DistributeLotteryRoundRequest {
  string id = 1;
}

message DistributeLotteryRoundResponse {
  LotteryRound round = 1;
}

message TriggerLotterySettleRequest {
  // 为空则结算「今天」
  string date = 1;
}

message TriggerLotterySettleResponse {
  LotteryRound round = 1;
}

message TriggerLotteryDrawRequest {
  // 为空则开奖「今天」
  string date = 1;
}

message TriggerLotteryDrawResponse {
  LotteryRound round = 1;
}

// 用户端状态
message GetLotteryStatusRequest {}

message GetLotteryStatusResponse {
  bool enabled = 1;
  bool authenticated = 2;
  int64 user_id = 3;
  string user_name = 4;
  double accum_pool = 5;                          // 当期累计奖池
  google.protobuf.Timestamp next_settle_time = 6;
  google.protobuf.Timestamp next_draw_time = 7;
  LotteryRound current = 8;                       // 已结算未开奖的轮次
  bool eligible = 9;                              // 是否有资格报名
  double user_spend = 10;                         // 本人来源日扣费
  bool registered = 11;                           // 是否已报名
}

message RegisterLotteryRequest {}

message RegisterLotteryResponse {
  bool enabled = 1;
  bool authenticated = 2;
  int64 user_id = 3;
  string user_name = 4;
  double accum_pool = 5;
  google.protobuf.Timestamp next_settle_time = 6;
  google.protobuf.Timestamp next_draw_time = 7;
  LotteryRound current = 8;
  bool eligible = 9;
  double user_spend = 10;
  bool registered = 11;
}

message ListLotteryHistoryPublicRequest {
  int32 page = 1;
  int32 page_size = 2;
}

// 用户端历史：轮次 + 本人参与情况 + 公开中奖名单（邮箱已打码）
message LotteryHistoryItem {
  LotteryRound round = 1;
  LotteryMyStatus my_status = 2;
  double my_prize = 3;
  bool registered = 4;
  bool is_winner = 5;
  // 中奖名单（公开）；user_name 若为邮箱已脱敏，用户名原样。不含派奖错误等敏感字段语义依赖。
  repeated LotteryParticipant winners = 6;
}

message ListLotteryHistoryPublicResponse {
  repeated LotteryHistoryItem items = 1;
  int64 total = 2;
  int32 page = 3;
