syntax = "proto3";

package v1;

option go_package = "momoko/api/gen/v1;v1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// 节点服务
service NodeService {
  // 创建 API Key
  rpc CreateAPIKey(CreateAPIKeyRequest) returns (CreateAPIKeyResponse) {
    option (google.api.http) = {
      post: "/api/v1/node/api-key"
      body: "*"
    };
  }
  // 获取 API Key 列表
  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse) {
    option (google.api.http) = {
      get: "/api/v1/node/api-key"
    };
  }
  // 复制 API Key
  rpc CopyAPIKey(CopyAPIKeyRequest) returns (CopyAPIKeyResponse) {
    option (google.api.http) = {
      post: "/api/v1/node/api-key/{id}/copy"
      body: "*"
    };
  }
  // 更新 API Key
  rpc UpdateAPIKey(UpdateAPIKeyRequest) returns (UpdateAPIKeyResponse) {
    option (google.api.http) = {
      put: "/api/v1/node/api-key/{id}"
      body: "*"
    };
  }
  // 刷新 API Key
  rpc RefreshAPIKey(RefreshAPIKeyRequest) returns (RefreshAPIKeyResponse) {
    option (google.api.http) = {
      post: "/api/v1/node/api-key/{id}/refresh"
      body: "*"
    };
  }
  // 删除 API Key
  rpc DeleteAPIKey(DeleteAPIKeyRequest) returns (DeleteAPIKeyResponse) {
    option (google.api.http) = {
      delete: "/api/v1/node/api-key/{id}"
    };
  }

  // 获取节点列表
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse) {
    option (google.api.http) = {
      get: "/api/v1/node/nodes"
    };
  }
  // 创建节点
  rpc CreateNode(CreateNodeRequest) returns (CreateNodeResponse) {
    option (google.api.http) = {
      post: "/api/v1/node/nodes"
      body: "*"
    };
  }
  // 更新节点
  rpc UpdateNode(UpdateNodeRequest) returns (UpdateNodeResponse) {
    option (google.api.http) = {
      put: "/api/v1/node/nodes/{id}"
      body: "*"
    };
  }
  // 删除节点
  rpc DeleteNode(DeleteNodeRequest) returns (DeleteNodeResponse) {
    option (google.api.http) = {
      delete: "/api/v1/node/nodes/{id}"
    };
  }
  // 测试节点连接；传 id 时未填写的字段沿用已保存配置
  rpc TestNode(TestNodeRequest) returns (TestNodeResponse) {
    option (google.api.http) = {
      post: "/api/v1/node/nodes/test"
      body: "*"
    };
  }
  // 获取节点上下文：实时状态与当前用户在该节点的生效权限（切换节点时调用）
  rpc GetNodeContext(GetNodeContextRequest) returns (GetNodeContextResponse) {
    option (google.api.http) = {
      get: "/api/v1/node/nodes/{id}/context"
    };
  }
}

message CreateAPIKeyRequest {
  // 名称
  string name = 1;
  // 过期时间；不传表示永久有效
  optional google.protobuf.Timestamp expires_at = 2;
  // 授予的节点权限（权限标识），远程主控调用本节点时以此为上限
  repeated string permissions = 3;
  // 用途备注
  string remark = 4;
}

message CreateAPIKeyResponse {
  // API Key 信息
  APIKeyInfo info = 1;
}

message ListAPIKeysRequest {
  // page
  int64 page = 1;
  // page size
  int64 page_size = 2;
  // 关键字：名称 / 备注 / Key ID 前缀；查看全部用户时还匹配所属用户
  optional string keywords = 3;
  // 按有效状态筛选；不传表示全部
  optional APIKeyStatus status = 4;
  // 查看全部用户的 API Key（需要 api_key:manage）；为 false 只列出自己的
  bool all_users = 5;
  // 按所属用户筛选（仅 all_users 时有效）
  optional string owner_id = 6;
}

// API Key 有效状态
enum APIKeyStatus {
  // 有效（永久有效或距过期超过 30 天）
  APIKeyStatus_Valid = 0;
  // 即将过期（30 天内过期）
  APIKeyStatus_Expiring = 1;
  // 已过期
  APIKeyStatus_Expired = 2;
}

message ListAPIKeysResponse {
  // actual page
  int64 page = 1;
  // actual page size
  int64 page_size = 2;
  // 总数
  int64 total = 3;
  // 列表
  repeated APIKeyInfo infos = 4;
  // 有效数量（按关键字筛选，不受状态筛选影响）
  int64 valid_count = 5;
  // 即将过期数量
  int64 expiring_count = 6;
  // 已过期数量
  int64 expired_count = 7;
  // 所属用户及其密钥数（仅 all_users 时返回，用于「所属用户」筛选）
  repeated APIKeyOwnerStat owners = 8;
}

// API Key 所属用户
message APIKeyOwner {
  // 用户 id
  string user_id = 1;
  // 昵称
  string name = 2;
  // 用户名
  string username = 3;
  // 头像
  string avatar = 4;
}

// 所属用户的密钥数
message APIKeyOwnerStat {
  APIKeyOwner owner = 1;
  int64 count = 2;
}

message CopyAPIKeyRequest {
  // API Key id
  string id = 1;
}

message CopyAPIKeyResponse {
  // API Key 信息
  APIKeyInfo info = 1;
}

// API Key 权限集合；作为更新字段时不传表示不修改
message APIKeyPermissionSet {
  // 权限标识
  repeated string items = 1;
}

message UpdateAPIKeyRequest {
  // API Key id
  string id = 1;
  // 名称
  optional string name = 2;
  // 过期时间
  optional google.protobuf.Timestamp expires_at = 3;
  // 设为永久有效
  optional bool never_expires = 4;
  // 授予的节点权限；不传表示不修改
  APIKeyPermissionSet permissions = 5;
  // 用途备注；不传表示不修改
  optional string remark = 6;
}

message UpdateAPIKeyResponse {
  // API Key 信息
  APIKeyInfo info = 1;
}

message RefreshAPIKeyRequest {
  // API Key id
  string id = 1;
}

message RefreshAPIKeyResponse {
  // API Key 信息
  APIKeyInfo info = 1;
}

message DeleteAPIKeyRequest {
  // API Key id
  string id = 1;
}

message DeleteAPIKeyResponse {}

message APIKeyInfo {
  // API Key id
  string id = 1;
  // 名称
  string name = 2;
  // API Key（签名种子）；列表和更新接口不返回完整值
  string api_key = 3;
  // 过期时间；空表示永久有效
  optional google.protobuf.Timestamp expires_at = 4;
  // 创建时间
  google.protobuf.Timestamp create_time = 5;
  // 更新时间
  google.protobuf.Timestamp update_time = 6;
  // 授予的节点权限
  repeated string permissions = 7;
  // 公开密钥标识（由种子派生），主控请求时携带用于定位密钥
  string key_id = 8;
  // 用途备注
  string remark = 9;
  // 最近一次被远程主控调用的时间；空表示从未使用
  optional google.protobuf.Timestamp last_used_time = 10;
  // 最近一次调用来源 IP
  string last_used_ip = 11;
  // 有效状态
  APIKeyStatus status = 12;
  // 所属用户
  APIKeyOwner owner = 13;
  // 是否当前用户自己的密钥（只有自己的密钥可以复制完整密钥与刷新）
  bool mine = 14;
}

// 节点连接状态
enum NodeState {
  // 未检测
  NodeState_Unknown = 0;
  // 在线
  NodeState_Online = 1;
  // 离线（网络不可达 / 超时）
  NodeState_Offline = 2;
  // 鉴权失败（API Key 无效、过期或时间偏差过大）
  NodeState_Unauthorized = 3;
}

// 节点自报信息（由节点 NodeAgent.AgentInfo 返回）
message NodeRemoteInfo {
  // 主机名
  string hostname = 1;
  // 操作系统
  string os = 2;
  // 架构
  string arch = 3;
  // momoko 版本
  string version = 4;
  // 平台描述（发行版 / 内核）
  string platform = 5;
  // API Key 名称
  string api_key_name = 6;
  // API Key 所属用户 id（节点侧）
  string user_id = 7;
  // API Key 所属用户名（节点侧）
  string username = 8;
  // API Key 在节点上的生效权限（授予范围 ∩ 所属用户权限）
  repeated string permissions = 9;
  // API Key 过期时间
  optional google.protobuf.Timestamp expires_at = 10;
  // 节点当前时间
  google.protobuf.Timestamp server_time = 11;
}

message NodeStatus {
  // 连接状态
  NodeState state = 1;
  // 状态说明（失败原因）
  string message = 2;
  // 检测时间
  optional google.protobuf.Timestamp check_time = 3;
  // 往返延迟（毫秒）
  int64 latency_ms = 4;
  // 节点自报信息（在线时有效）
  NodeRemoteInfo remote = 5;
  // 最近一次探测在线的时间（持久化，离线时用于显示“最后在线”）
  optional google.protobuf.Timestamp last_online_time = 6;
  // 最近一次在线时的节点自报信息（仅当前不在线时返回，用于离线后仍显示版本 / 系统）
  NodeRemoteInfo last_remote = 7;
}

message NodeInfo {
  // 节点 id
  string id = 1;
  // 名称
  string name = 2;
  // 节点 gRPC 地址（host:port）
  string address = 3;
  // 使用 TLS 连接
  bool tls = 4;
  // 跳过 TLS 证书校验（自签证书）
  bool tls_skip_verify = 5;
  // 备注
  string remark = 6;
  // API Key（脱敏）
  string api_key = 7;
  // 公开密钥标识
  string key_id = 8;
  // 最近一次检测状态
  NodeStatus status = 9;
  // 创建时间
  google.protobuf.Timestamp create_time = 10;
  // 更新时间
  google.protobuf.Timestamp update_time = 11;
}

message ListNodesRequest {
  // 名称 / 地址关键字
  optional string keywords = 1;
}

message ListNodesResponse {
  // 节点列表
  repeated NodeInfo infos = 1;
  // 本机（主控）信息：主机名 / 系统 / 架构 / 版本，用于在节点列表中展示本机卡片
  NodeRemoteInfo local = 2;
}

message CreateNodeRequest {
  // 名称
  string name = 1;
  // 节点 gRPC 地址（host:port）
  string address = 2;
  // 节点上创建的 API Key
  string api_key = 3;
  // 使用 TLS 连接
  bool tls = 4;
  // 跳过 TLS 证书校验
  bool tls_skip_verify = 5;
  // 备注
  string remark = 6;
}

message CreateNodeResponse {
  // 节点信息
  NodeInfo info = 1;
}

message UpdateNodeRequest {
  // 节点 id
  string id = 1;
  // 名称
  optional string name = 2;
  // 节点 gRPC 地址
  optional string address = 3;
  // API Key；不传或为空表示不修改
  optional string api_key = 4;
  // 使用 TLS 连接
  optional bool tls = 5;
  // 跳过 TLS 证书校验
  optional bool tls_skip_verify = 6;
  // 备注
  optional string remark = 7;
}

message UpdateNodeResponse {
  // 节点信息
  NodeInfo info = 1;
}

message DeleteNodeRequest {
  // 节点 id
  string id = 1;
}

message DeleteNodeResponse {}

message TestNodeRequest {
  // 已保存节点 id；为空时仅测试下方配置
  optional string id = 1;
  // 节点 gRPC 地址
  optional string address = 2;
  // API Key
  optional string api_key = 3;
  // 使用 TLS 连接
  optional bool tls = 4;
  // 跳过 TLS 证书校验
  optional bool tls_skip_verify = 5;
}

message TestNodeResponse {
  // 检测结果
  NodeStatus status = 1;
}

message GetNodeContextRequest {
  // 节点 id
  string id = 1;
}

message GetNodeContextResponse {
  // 节点信息（含实时状态）
  NodeInfo info = 1;
  // 当前用户在该节点的生效权限（节点授予 ∩ 当前用户在主控的权限）
  repeated string permissions = 2;
}
