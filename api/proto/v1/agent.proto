// ———————————————————————————— 模型供应商 ————————————————————————————

// 推理等级：name 是会话里能选的等级，value 是选中它时实际发给接口的值（空 = 不带这个参数）
message AgentModelLevel {
  string name = 1;
  string value = 2;
}
message AgentModel {
  string id = 1;
  repeated AgentModelLevel levels = 2;
  // 最长上下文和最长输出（token 数），启动 Agent 时交给它；新模型默认 1000000 和 128000
  int64 context_window = 3;
  int64 max_output = 4;
}

// 一种供应商类型：通用的兼容接口，或对某一家的专门适配
message AgentVendor {
  // anthropic（Anthropic 兼容）| openai（OpenAI Responses 兼容）| deepseek（DeepSeek 官方）…
  string id = 1;
  // 能给哪些协议的 Agent 用：anthropic（Claude 系）| openai（Codex 系）
  repeated string protocols = 2;
  // 官方接口地址；不为空表示地址固定，不用填
  string base_url = 3;
  // 能查账户余额
  bool balance = 4;
}

// 第三方接口（官方账号由用户自己在服务器上登录，见运行时的检查）。属于添加它的人，只有他自己用得上；
// 管理员在 Agent 管理页加的是共享的，共享给所有人或指定的人，被共享到的人只能用、看不到密钥和环境变量
message AgentProvider {
  string id = 1;
  // 供应商类型（AgentVendor.id），创建后不能改
  string vendor = 3;
  string name = 4;
  // ok | bad | untested
  string status = 10;
  string status_text = 11;
  // 用户填的接口地址；地址固定的类型为空
  string base_url = 13;
  // 只写；更新时留空表示保留原值
  string api_key = 14;
  // 脱敏后的后四位
  string api_key_tail = 15;
  repeated AgentModel models = 16;
  string main_model = 17;
  string fast_model = 18;
  repeated AgentKV env = 19;
  int64 test_latency_ms = 20;
  google.protobuf.Timestamp tested_at = 21;
  // 所属用户；共享的是 @shared
  string user_id = 22;
  // 共享范围：空 = 只有主人自己用；all = 所有人；users = share_user_ids 里的人。
  // 共享的只能在 Agent 管理页里（要有 agent:admin）新建和修改，别人那里只能用
  string share = 23;
  repeated string share_user_ids = 24;
  // 用这个接口的会话、测试、拉模型、查余额都走的代理（只有 Linux 能配）；不传或 type 为空是不走代理
  AgentProxy proxy = 25;
}

// 代理：配了之后 Agent 的进程（连同它启动的所有子进程）关在只经这个节点联网的沙箱里，看到的时区和语言是这里配的（只有 Linux）
message AgentProxy {
  // 节点：分享链接（vless://、vmess://、trojan://、ss://、hysteria2://、hy2://、hysteria://、tuic://、anytls://、wireguard://、socks5://）
  // 或 sing-box 的出站 JSON；空 = 不走代理。里面有密钥，只给能改的人
  string node = 1;
  // 只读：协议（sing-box 的 type）和节点的「主机:端口」
  string protocol = 2;
  string server = 3;
  // 沙箱里的时区（IANA 名称，如 America/Los_Angeles）；空 = 跟服务器一样
  string timezone = 4;
  // 沙箱里的语言区域（如 en_US.UTF-8）；空 = 跟服务器一样
  string locale = 5;
}

message ListAgentProvidersRequest {
  // 所有人的第三方接口（Agent 管理页，要有 agent:admin）；默认是自己的，加上共享给自己的
  bool all = 1;
}
message ListAgentProvidersResponse {
  repeated AgentProvider providers = 1;
  // 能添加的供应商类型
  repeated AgentVendor vendors = 2;
  // all 时这些接口的主人和共享给的人
  repeated AgentUser users = 3;
  // 这台服务器的沙箱（配代理要用）
  AgentSandbox sandbox = 4;
}

// 沙箱：配了代理的 Agent 在里面跑，只经代理联网（只有 Linux）
message AgentSandbox {
  // 这个系统能不能用沙箱（只有 Linux）；不能时页面上不显示代理
  bool supported = 1;
  // Linux 上现在建不了沙箱的原因（比如没有以 root 运行）
  string unavailable = 2;
  // 已下载的 sing-box 版本；空 = 还没下载
  string sing_box_version = 3;
  // 正在下载或更新 sing-box
  bool installing = 4;
}

message CreateAgentProviderRequest {
  AgentProvider provider = 1;
}
message CreateAgentProviderResponse {
  AgentProvider provider = 1;
}

message UpdateAgentProviderRequest {
  string id = 1;
  AgentProvider provider = 2;
}
message UpdateAgentProviderResponse {
  AgentProvider provider = 1;
}

message DeleteAgentProviderRequest {
  string id = 1;
}
message DeleteAgentProviderResponse {}

message TestAgentProviderRequest {
  string id = 1;
  // 表单草稿；有它就测草稿
  AgentProvider draft = 2;
  // 发给模型的消息；空 = hello
  string message = 3;
}
// 一种协议的测试结果
message AgentProviderTestResult {
  // anthropic | openai
  string protocol = 1;
  bool ok = 2;
  // 失败的原因
  string error = 3;
  int64 latency_ms = 4;
  // 模型回的文字（不含思考过程）
  string reply = 5;
  int64 input_tokens = 6;
  int64 output_tokens = 7;
}
message TestAgentProviderResponse {
  // 用的哪个模型
  string model = 1;
  // 供应商给的每种协议一条
  repeated AgentProviderTestResult results = 2;
}

message FetchAgentProviderModelsRequest {
  string id = 1;
  // 供应商类型（AgentVendor.id）
  string vendor = 2;
  string base_url = 3;
  string api_key = 4;
  // 表单里的代理（密码留空用已保存的）；不传或 type 为空是不走代理
  AgentProxy proxy = 5;
}
message FetchAgentProviderModelsResponse {
  // 接口给了才有推理等级、最长上下文和最长输出（没给的为空或 0）
  repeated AgentModel models = 1;
}

// 一种币种的余额；金额是接口给的十进制字符串
message AgentBalance {
  string currency = 1;
  string total = 2;
  // 赠送的
  string granted = 3;
  // 充值的
  string topped_up = 4;
}
message GetAgentProviderBalanceRequest {
  string id = 1;
}
message GetAgentProviderBalanceResponse {
  // 查询失败的原因；不为空时其余字段无意义
  string error = 1;
  // 余额够不够继续调用
  bool available = 2;
  repeated AgentBalance balances = 3;
}

