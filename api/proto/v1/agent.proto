syntax = "proto3";

package v1;

option go_package = "momoko/api/gen/v1;v1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// Agent：Momoko 作为 ACP（Agent Client Protocol）客户端，在服务器上启动并控制 Claude Code、Codex 等 Agent。
// 会话里的对话事件走 WebSocket（/api/v1/agent/ws），这里只有一元接口；发起一轮的接口立刻返回。
service AgentService {
  // —— 选择器 ——
  // 新会话 / 会话里 / 工作区默认值用的选项：每个 Agent 的供应商、模型、推理强度和权限模式
  rpc GetAgentOptions(GetAgentOptionsRequest) returns (GetAgentOptionsResponse) {
    option (google.api.http) = { get: "/api/v1/agent/options" };
  }
  // 各管理标签的数量
  rpc GetAgentOverview(GetAgentOverviewRequest) returns (GetAgentOverviewResponse) {
    option (google.api.http) = { get: "/api/v1/agent/overview" };
  }

  // —— 会话 ——
  // 会话栏：我的未归档会话，按工作区分层
  rpc GetAgentSidebar(GetAgentSidebarRequest) returns (GetAgentSidebarResponse) {
    option (google.api.http) = { get: "/api/v1/agent/sidebar" };
  }
  // 会话列表（管理页）：状态筛选、标题搜索、分页，都在 SQL 里完成
  rpc ListAgentSessions(ListAgentSessionsRequest) returns (ListAgentSessionsResponse) {
    option (google.api.http) = { get: "/api/v1/agent/sessions" };
  }
  // 新建会话并发出第一条消息
  rpc CreateAgentSession(CreateAgentSessionRequest) returns (CreateAgentSessionResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions" body: "*" };
  }
  rpc GetAgentSession(GetAgentSessionRequest) returns (GetAgentSessionResponse) {
    option (google.api.http) = { get: "/api/v1/agent/sessions/{id}" };
  }
  // 会话的 Agent 进程（命令、进程号、内存、已运行），展开看时才读
  rpc GetAgentSessionProcess(GetAgentSessionProcessRequest) returns (GetAgentSessionProcessResponse) {
    option (google.api.http) = { get: "/api/v1/agent/sessions/{id}/process" };
  }
  // 发一条消息，开始新的一轮；立刻返回，后续靠 WebSocket
  rpc PromptAgentSession(PromptAgentSessionRequest) returns (PromptAgentSessionResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/prompt" body: "*" };
  }
  // 停止当前这一轮
  rpc CancelAgentSession(CancelAgentSessionRequest) returns (CancelAgentSessionResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/cancel" body: "*" };
  }
  // 回答批准卡片
  rpc ResolveAgentPermission(ResolveAgentPermissionRequest) returns (ResolveAgentPermissionResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/permission" body: "*" };
  }
  // 切换权限模式 / 模型 / 推理强度
  rpc SetAgentSessionOption(SetAgentSessionOptionRequest) returns (SetAgentSessionOptionResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/option" body: "*" };
  }
  rpc RenameAgentSession(RenameAgentSessionRequest) returns (RenameAgentSessionResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/rename" body: "*" };
  }
  // 复刻对话；worktree 为 true 时放到自动命名的新工作树里
  rpc ForkAgentSession(ForkAgentSessionRequest) returns (ForkAgentSessionResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/fork" body: "*" };
  }
  // 把复刻出来的会话移到外层
  rpc DetachAgentSession(DetachAgentSessionRequest) returns (DetachAgentSessionResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/detach" body: "*" };
  }
  // 归档 / 取消归档（还在运行或等待批准的不能归档）
  rpc ArchiveAgentSessions(ArchiveAgentSessionsRequest) returns (ArchiveAgentSessionsResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/archive" body: "*" };
  }
  rpc DeleteAgentSessions(DeleteAgentSessionsRequest) returns (DeleteAgentSessionsResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/delete" body: "*" };
  }
  // 删除全部归档会话
  rpc PurgeAgentSessions(PurgeAgentSessionsRequest) returns (PurgeAgentSessionsResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/purge" body: "*" };
  }
  // 导出记录：返回会话的全部事件，由页面排版成 Markdown 下载
  rpc ExportAgentSessions(ExportAgentSessionsRequest) returns (ExportAgentSessionsResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/export" body: "*" };
  }
  // 右侧「改动」：会话目录相对当前分支的未提交改动
  rpc GetAgentSessionChanges(GetAgentSessionChangesRequest) returns (GetAgentSessionChangesResponse) {
    option (google.api.http) = { get: "/api/v1/agent/sessions/{id}/changes" };
  }
  // 撤销某个文件的改动
  rpc RevertAgentSessionFile(RevertAgentSessionFileRequest) returns (RevertAgentSessionFileResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/revert" body: "*" };
  }
  // 右侧「文件」：按目录懒加载
  rpc ListAgentSessionFiles(ListAgentSessionFilesRequest) returns (ListAgentSessionFilesResponse) {
    option (google.api.http) = { get: "/api/v1/agent/sessions/{id}/files" };
  }
  // 打开文件（只读）
  rpc ReadAgentSessionFile(ReadAgentSessionFileRequest) returns (ReadAgentSessionFileResponse) {
    option (google.api.http) = { get: "/api/v1/agent/sessions/{id}/file" };
  }
  // 取回消息里上传过的附件（显示图片）
  rpc GetAgentSessionUpload(GetAgentSessionUploadRequest) returns (GetAgentSessionUploadResponse) {
    option (google.api.http) = { get: "/api/v1/agent/sessions/{id}/upload" };
  }
  // @ 引用文件：按文件名搜索会话目录（新会话还没有会话时按工作区搜）
  rpc SearchAgentFiles(SearchAgentFilesRequest) returns (SearchAgentFilesResponse) {
    option (google.api.http) = { get: "/api/v1/agent/files/search" };
  }

  // —— 工作区 ——
  rpc ListAgentWorkspaces(ListAgentWorkspacesRequest) returns (ListAgentWorkspacesResponse) {
    option (google.api.http) = { get: "/api/v1/agent/workspaces" };
  }
  rpc CreateAgentWorkspace(CreateAgentWorkspaceRequest) returns (CreateAgentWorkspaceResponse) {
    option (google.api.http) = { post: "/api/v1/agent/workspaces" body: "*" };
  }
  rpc UpdateAgentWorkspace(UpdateAgentWorkspaceRequest) returns (UpdateAgentWorkspaceResponse) {
    option (google.api.http) = { put: "/api/v1/agent/workspaces/{id}" body: "*" };
  }
  // 移除工作区：只删记录，目录里的文件不动
  rpc DeleteAgentWorkspace(DeleteAgentWorkspaceRequest) returns (DeleteAgentWorkspaceResponse) {
    option (google.api.http) = { delete: "/api/v1/agent/workspaces/{id}" };
  }
  // 「浏览」：列出服务器上某个目录下的子目录
  rpc ListAgentDirs(ListAgentDirsRequest) returns (ListAgentDirsResponse) {
    option (google.api.http) = { get: "/api/v1/agent/dirs" };
  }
  // 「查看文件」：只读地列出工作区里的目录和文件
  rpc BrowseAgentWorkspace(BrowseAgentWorkspaceRequest) returns (BrowseAgentWorkspaceResponse) {
    option (google.api.http) = { get: "/api/v1/agent/workspaces/{id}/browse" };
  }
  // 项目指令文件（AGENTS.md / CLAUDE.md）；按目录读，新建工作区时目录还没有记录
  rpc GetAgentDocs(GetAgentDocsRequest) returns (GetAgentDocsResponse) {
    option (google.api.http) = { get: "/api/v1/agent/docs" };
  }

  // —— 模型供应商 ——
  rpc ListAgentProviders(ListAgentProvidersRequest) returns (ListAgentProvidersResponse) {
    option (google.api.http) = { get: "/api/v1/agent/providers" };
  }
  // 第三方接口
  rpc CreateAgentProvider(CreateAgentProviderRequest) returns (CreateAgentProviderResponse) {
    option (google.api.http) = { post: "/api/v1/agent/providers" body: "*" };
  }
  rpc UpdateAgentProvider(UpdateAgentProviderRequest) returns (UpdateAgentProviderResponse) {
    option (google.api.http) = { put: "/api/v1/agent/providers/{id}" body: "*" };
  }
  rpc DeleteAgentProvider(DeleteAgentProviderRequest) returns (DeleteAgentProviderResponse) {
    option (google.api.http) = { delete: "/api/v1/agent/providers/{id}" };
  }
  // 测试：用主模型发一条消息，供应商给的每种协议各发一次。有草稿测草稿（地址、密钥留空且有 id 时用已保存的），否则测已保存的
  rpc TestAgentProvider(TestAgentProviderRequest) returns (TestAgentProviderResponse) {
    option (google.api.http) = { post: "/api/v1/agent/providers/test" body: "*" };
  }
  // 获取可用模型
  rpc FetchAgentProviderModels(FetchAgentProviderModelsRequest) returns (FetchAgentProviderModelsResponse) {
    option (google.api.http) = { post: "/api/v1/agent/providers/models" body: "*" };
  }
  // 账户余额：只有能查余额的供应商类型（AgentVendor.balance）才有
  rpc GetAgentProviderBalance(GetAgentProviderBalanceRequest) returns (GetAgentProviderBalanceResponse) {
    option (google.api.http) = { get: "/api/v1/agent/providers/{id}/balance" };
  }

  // —— MCP ——
  rpc ListAgentMcpServers(ListAgentMcpServersRequest) returns (ListAgentMcpServersResponse) {
    option (google.api.http) = { get: "/api/v1/agent/mcp" };
  }
  rpc CreateAgentMcpServer(CreateAgentMcpServerRequest) returns (CreateAgentMcpServerResponse) {
    option (google.api.http) = { post: "/api/v1/agent/mcp" body: "*" };
  }
  rpc UpdateAgentMcpServer(UpdateAgentMcpServerRequest) returns (UpdateAgentMcpServerResponse) {
    option (google.api.http) = { put: "/api/v1/agent/mcp/{id}" body: "*" };
  }
  rpc DeleteAgentMcpServer(DeleteAgentMcpServerRequest) returns (DeleteAgentMcpServerResponse) {
    option (google.api.http) = { delete: "/api/v1/agent/mcp/{id}" };
  }
  // 新会话默认开启的开关
  rpc SetAgentMcpDefault(SetAgentMcpDefaultRequest) returns (SetAgentMcpDefaultResponse) {
    option (google.api.http) = { post: "/api/v1/agent/mcp/{id}/default" body: "*" };
  }
  // 测试连接：由 Momoko 自己连一次，读它的工具列表
  rpc TestAgentMcpServer(TestAgentMcpServerRequest) returns (TestAgentMcpServerResponse) {
    option (google.api.http) = { post: "/api/v1/agent/mcp/test" body: "*" };
  }
  // 粘贴 mcpServers JSON 导入
  rpc ImportAgentMcpServers(ImportAgentMcpServersRequest) returns (ImportAgentMcpServersResponse) {
    option (google.api.http) = { post: "/api/v1/agent/mcp/import" body: "*" };
  }

  // —— 技能 ——
  rpc ListAgentSkills(ListAgentSkillsRequest) returns (ListAgentSkillsResponse) {
    option (google.api.http) = { get: "/api/v1/agent/skills" };
  }
  rpc GetAgentSkill(GetAgentSkillRequest) returns (GetAgentSkillResponse) {
    option (google.api.http) = { get: "/api/v1/agent/skills/{id}" };
  }
  rpc CreateAgentSkill(CreateAgentSkillRequest) returns (CreateAgentSkillResponse) {
    option (google.api.http) = { post: "/api/v1/agent/skills" body: "*" };
  }
  rpc UpdateAgentSkill(UpdateAgentSkillRequest) returns (UpdateAgentSkillResponse) {
    option (google.api.http) = { put: "/api/v1/agent/skills/{id}" body: "*" };
  }
  rpc DeleteAgentSkill(DeleteAgentSkillRequest) returns (DeleteAgentSkillResponse) {
    option (google.api.http) = { delete: "/api/v1/agent/skills/{id}" };
  }
  rpc SetAgentSkillEnabled(SetAgentSkillEnabledRequest) returns (SetAgentSkillEnabledResponse) {
    option (google.api.http) = { post: "/api/v1/agent/skills/{id}/enabled" body: "*" };
  }
  // 导入：压缩包（zip 内容）、Git 地址、服务器上已有的目录
  rpc ImportAgentSkill(ImportAgentSkillRequest) returns (ImportAgentSkillResponse) {
    option (google.api.http) = { post: "/api/v1/agent/skills/import" body: "*" };
  }

  // —— 运行时 ——
  rpc ListAgentRuntimes(ListAgentRuntimesRequest) returns (ListAgentRuntimesResponse) {
    option (google.api.http) = { get: "/api/v1/agent/runtimes" };
  }
  // 安装方式：Momoko 下载并更新 / 用服务器上已有的命令
  rpc SetAgentRuntimeMode(SetAgentRuntimeModeRequest) returns (SetAgentRuntimeModeResponse) {
    option (google.api.http) = { post: "/api/v1/agent/runtimes/{id}/mode" body: "*" };
  }
  // 重新检测
  rpc DetectAgentRuntime(DetectAgentRuntimeRequest) returns (DetectAgentRuntimeResponse) {
    option (google.api.http) = { post: "/api/v1/agent/runtimes/{id}/detect" body: "*" };
  }
  // 服务器上的登录：给检查时读到的模型设最长上下文和最长输出
  rpc SetAgentRuntimeModels(SetAgentRuntimeModelsRequest) returns (SetAgentRuntimeModelsResponse) {
    option (google.api.http) = { post: "/api/v1/agent/runtimes/{id}/models" body: "*" };
  }
  // 检查更新；由 Momoko 下载的会直接更新到最新版本
  rpc UpdateAgentRuntime(UpdateAgentRuntimeRequest) returns (UpdateAgentRuntimeResponse) {
    option (google.api.http) = { post: "/api/v1/agent/runtimes/{id}/update" body: "*" };
  }
  // 添加其它 ACP Agent
  rpc CreateAgentRuntime(CreateAgentRuntimeRequest) returns (CreateAgentRuntimeResponse) {
    option (google.api.http) = { post: "/api/v1/agent/runtimes" body: "*" };
  }
  rpc DeleteAgentRuntime(DeleteAgentRuntimeRequest) returns (DeleteAgentRuntimeResponse) {
    option (google.api.http) = { delete: "/api/v1/agent/runtimes/{id}" };
  }
  // 同时运行的进程上限、空闲后结束进程
  rpc UpdateAgentRunSettings(UpdateAgentRunSettingsRequest) returns (UpdateAgentRunSettingsResponse) {
    option (google.api.http) = { post: "/api/v1/agent/runtimes/settings" body: "*" };
  }

  // —— 通知 ——
  rpc GetAgentNotify(GetAgentNotifyRequest) returns (GetAgentNotifyResponse) {
    option (google.api.http) = { get: "/api/v1/agent/notify" };
  }
  // 三个时机开关
  rpc UpdateAgentNotifyEvents(UpdateAgentNotifyEventsRequest) returns (UpdateAgentNotifyEventsResponse) {
    option (google.api.http) = { post: "/api/v1/agent/notify/events" body: "*" };
  }
  // 保存某种通知方式的配置，保存后自动启用
  rpc SaveAgentNotifyChannel(SaveAgentNotifyChannelRequest) returns (SaveAgentNotifyChannelResponse) {
    option (google.api.http) = { post: "/api/v1/agent/notify/channel" body: "*" };
  }
  rpc SetAgentNotifyChannelEnabled(SetAgentNotifyChannelEnabledRequest) returns (SetAgentNotifyChannelEnabledResponse) {
    option (google.api.http) = { post: "/api/v1/agent/notify/channel/enabled" body: "*" };
  }
  // 发一条测试；fields 为空时用已保存的配置
  rpc TestAgentNotifyChannel(TestAgentNotifyChannelRequest) returns (TestAgentNotifyChannelResponse) {
    option (google.api.http) = { post: "/api/v1/agent/notify/channel/test" body: "*" };
  }
}

// 通知消息里的批准链接打开的公开页：凭一次性令牌查看和回答，不需要登录
service AgentPublic {
  rpc PublicAgentApproval(PublicAgentApprovalRequest) returns (PublicAgentApprovalResponse) {
    option (google.api.http) = { get: "/api/v1/public/agent/approval/{token}" };
  }
  rpc PublicResolveAgentApproval(PublicResolveAgentApprovalRequest) returns (PublicResolveAgentApprovalResponse) {
    option (google.api.http) = { post: "/api/v1/public/agent/approval/{token}" body: "*" };
  }
}

// ———————————————————————————— 通用 ————————————————————————————

message AgentKV {
  string key = 1;
  string value = 2;
}

// 带密文的键值（MCP 的环境变量和请求头）：value 只写，留空表示保留原值；masked 是脱敏后的后几位
message AgentSecretKV {
  string key = 1;
  // 提交时的明文；留空表示保留已保存的值
  string value = 2;
  // 已保存的值的后四位（返回时只给这个）
  string tail = 3;
}

// ———————————————————————————— 选择器 ————————————————————————————

message GetAgentOptionsRequest {}
message GetAgentOptionsResponse {
  repeated AgentRuntimeOptions runtimes = 1;
}

message AgentRuntimeOptions {
  string runtime_id = 1;
  string runtime_name = 2;
  // claude | codex | custom
  string kind = 3;
  bool ready = 4;
  repeated AgentProviderOptions providers = 5;
  // 权限模式由 Agent 提供
  repeated AgentChoice modes = 6;
  string default_mode = 7;
  AgentCapabilities caps = 8;
}

message AgentProviderOptions {
  // 空字符串表示用服务器上已有的登录（用户自己在服务器上登录命令行）
  string provider_id = 1;
  // api：用户起的名称；system：服务器上登录的账号（检查时 Agent 报的，可能为空）
  string name = 2;
  repeated AgentModelOption models = 3;
  string default_model = 4;
  // api | system
  string kind = 5;
  // api：ok | bad | untested
  string status = 6;
  // api：供应商类型（AgentVendor.id）
  string vendor = 7;
}

message AgentModelOption {
  string id = 1;
  string name = 2;
  // 这个模型能选的推理强度；为空表示不可调
  repeated AgentChoice efforts = 3;
  string default_effort = 4;
  // 服务器上的登录：管理页给这个模型设的最长上下文和最长输出（token 数），0 = 用 Agent 自己的
  int64 context_window = 5;
  int64 max_output = 6;
}

message AgentChoice {
  string id = 1;
  string name = 2;
  string description = 3;
  // 批准选项的种类：allow_once | allow_always | reject_once | reject_always
  string kind = 4;
}

// Agent 在初始化时声明的能力；没声明的，对应的界面元素不出现
message AgentCapabilities {
  bool resume = 2;
  bool fork = 3;
  bool additional_dirs = 4;
  bool image = 5;
  bool embedded_context = 6;
  bool mcp_http = 7;
  bool mcp_sse = 8;
  bool close = 9;
  bool subagents = 10;
}

message GetAgentOverviewRequest {}
message GetAgentOverviewResponse {
  int32 sessions = 1;
  int32 sessions_running = 2;
  int32 sessions_waiting = 3;
  int32 workspaces = 4;
  int32 providers = 5;
  int32 mcp_servers = 8;
  int32 mcp_ok = 9;
  int32 skills = 10;
  int32 skills_enabled = 11;
  int32 runtimes = 12;
  int32 runtimes_ready = 13;
  int32 notify_channels = 14;
  int32 notify_enabled = 15;
}

// ———————————————————————————— 会话 ————————————————————————————

message AgentUsage {
  int64 total = 1;
  // 不含缓存命中和缓存写入
  int64 input = 2;
  int64 output = 3;
  int64 cache_read = 4;
  int64 cache_write = 5;
  int64 thought = 6;
}

// Agent 进程的实时状态，不落库；只在有人要看时读（内存要遍历进程树）
message AgentProcess {
  string command = 1;
  int32 pid = 2;
  int64 memory_bytes = 3;
  google.protobuf.Timestamp started_at = 4;
  repeated string args = 5;
}

message AgentSession {
  string id = 1;
  string title = 2;
  string runtime_id = 3;
  string runtime_name = 4;
  // claude | codex | custom
  string runtime_kind = 5;
  string workspace_id = 6;
  string workspace_name = 7;
  // 实际运行目录：工作区目录、工作树目录或临时目录
  string cwd = 8;
  repeated string extra_dirs = 9;
  // 工作树名；不在工作树里为空
  string worktree = 10;
  string provider_id = 11;
  // 供应商的名称（原样）；怎么显示由页面按 provider_kind / provider_vendor 决定
  string provider_name = 12;
  string model = 13;
  string effort = 14;
  string mode = 15;
  string mode_name = 16;
  // running | waiting | idle | error | archived
  string status = 17;
  string error = 18;
  // 复刻来源；detached 表示已移到外层
  string parent_id = 19;
  bool detached = 21;
  string user_id = 22;
  google.protobuf.Timestamp active_at = 24;
  google.protobuf.Timestamp create_time = 25;
  // Agent 侧的会话 ID
  string acp_session_id = 28;
  // 累计用量；Agent 没给过为空
  AgentUsage usage = 30;
  int32 turns = 31;
  // 最近一轮
  AgentUsage last_usage = 32;
  int64 context_used = 33;
  int64 context_size = 34;
  // api | system
  string provider_kind = 39;
  string provider_vendor = 40;
}

// 打开一个会话时才给的信息：每次状态变化都推整份会话，这些不跟着推
message AgentSessionDetail {
  // 当前分支（工作目录是 Git 仓库时）
  string branch = 1;
  repeated string mcp_names = 2;
  repeated string skill_names = 3;
  string parent_title = 4;
  // Agent 自报的名字和版本
  string agent_name = 5;
  string agent_version = 6;
}

message AgentUser {
  string id = 1;
  string name = 2;
  string username = 3;
}

message AgentSidebarWorkspace {
  string id = 1;
  string name = 2;
  string path = 3;
  bool is_git = 4;
  string branch = 5;
  int32 session_count = 6;
}

message GetAgentSidebarRequest {
  string keyword = 1;
}
message GetAgentSidebarResponse {
  repeated AgentSidebarWorkspace workspaces = 1;
  // 未归档的会话，按最近活动倒序；workspace_id 为空的归在「无工作区」
  repeated AgentSession sessions = 2;
}

message ListAgentSessionsRequest {
  // all（默认）| running | waiting | idle | error | archived
  string status = 1;
  string keyword = 2;
  int32 page = 3;
  int32 page_size = 4;
}
message ListAgentSessionsResponse {
  repeated AgentSession sessions = 1;
  int64 total = 2;
  // 各状态的数量（不受 status 筛选影响，受 keyword 影响）
  int64 count_all = 3;
  int64 count_running = 4;
  int64 count_waiting = 5;
  int64 count_idle = 6;
  int64 count_error = 7;
  int64 count_archived = 8;
  // 这一页会话的主人
  repeated AgentUser users = 9;
  // 这一页每个会话复刻出来（没移到外层）的会话数
  map<string, int32> fork_counts = 10;
}

// 附件：图片和文件随消息上传，工作区里的文件用路径引用
message AgentAttachment {
  // image | file | ref
  string kind = 1;
  string name = 2;
  string mime = 3;
  // image / file 的内容
  bytes data = 4;
  // ref：相对会话目录的路径
  string path = 5;
}

message CreateAgentSessionRequest {
  // 空 = 不用工作区，在临时目录里运行
  string workspace_id = 1;
  repeated string extra_dirs = 2;
  // 在独立工作树里运行
