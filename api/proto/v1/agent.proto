// ———————————————————————————— 运行时 ————————————————————————————

message AgentRuntime {
  string id = 1;
  string name = 2;
  // 检测出的系别：claude | codex | antigravity | custom（按 Agent 自报的名字，不看是哪一条）
  string kind = 3;
  // Momoko 下载并更新
  bool managed = 4;
  string command = 5;
  bool ready = 6;
  // Agent 自报的名字和版本（agentInfo）
  string agent_name = 7;
  string error = 8;
  google.protobuf.Timestamp detected_at = 9;
  // 有进程在跑的会话数
  int32 active_sessions = 10;
  // 正在下载或更新
  bool installing = 11;
  AgentCapabilities caps = 12;
  // 服务器上已有的登录（没有为空）：账号名称和说明
  string auth_label = 13;
  // 内置的两条（Claude Code、Codex）：不能移除，命令固定
  bool builtin = 14;
  // 能「Momoko 下载并更新」：只有带单文件发行包的（Claude Code）
  bool can_install = 15;
  string agent_version = 16;
  string auth_detail = 17;
  // 最近一次检查时服务器上已经登录（能开会话）；没登录时选择器里没有「服务器上的登录」
  bool logged_in = 19;
  // 检查时 Agent 给的模型和每个模型的推理强度
  repeated AgentModelOption models = 20;
  // 启动参数（command 是可执行文件）
  repeated string args = 18;
  // 服务器上的登录走的代理（只有 Linux 能配）
  AgentProxy proxy = 21;
  // 能在页面上的终端里登录（有登录命令）
  bool can_login = 22;
}

message AgentRunSettings {
  int32 max_processes = 1;
  // 0 = 不自动结束
  int32 idle_minutes = 2;
}

message ListAgentRuntimesRequest {}
message ListAgentRuntimesResponse {
  repeated AgentRuntime runtimes = 1;
  AgentRunSettings settings = 2;
  // 这台服务器的沙箱（配代理要用）
  AgentSandbox sandbox = 3;
}

message SetAgentRuntimeModeRequest {
  string id = 1;
  bool managed = 2;
}
message SetAgentRuntimeModeResponse {
  AgentRuntime runtime = 1;
}

message DetectAgentRuntimeRequest {
  string id = 1;
}
message DetectAgentRuntimeResponse {
  AgentRuntime runtime = 1;
}

// 服务器上的登录里一个模型在管理页的设置
message AgentRuntimeModelSetting {
  string model = 1;
  // token 数，0 = 用 Agent 自己的
  int64 context_window = 2;
  int64 max_output = 3;
  // 会话里能选的推理等级：name 是显示的名字，value 是交给 Agent 的取值（空则同 name）
  repeated AgentModelLevel levels = 4;
}
message SetAgentRuntimeModelsRequest {
  string id = 1;
  repeated AgentRuntimeModelSetting models = 2;
}
message SetAgentRuntimeModelsResponse {
  AgentRuntime runtime = 1;
}
message GetAgentRuntimeModelLevelsRequest {
  string id = 1;
  string model = 2;
}
message GetAgentRuntimeModelLevelsResponse {
  // name 是 Agent 给的名字，value 是它的取值
  repeated AgentModelLevel levels = 1;
}

message UpdateAgentRuntimeRequest {
  string id = 1;
}
message UpdateAgentRuntimeResponse {
  AgentRuntime runtime = 1;
  // 已安装的版本和最新版本；读不到为空
  string current = 2;
  string latest = 3;
  bool updated = 4;
}

message CreateAgentRuntimeRequest {
  string name = 1;
  string command = 2;
}
message CreateAgentRuntimeResponse {
  AgentRuntime runtime = 1;
}

message DeleteAgentRuntimeRequest {
  string id = 1;
}
message DeleteAgentRuntimeResponse {}

message UpdateAgentRunSettingsRequest {
  AgentRunSettings settings = 1;
}
message UpdateAgentRunSettingsResponse {
  AgentRunSettings settings = 1;
}

message SetAgentRuntimeProxyRequest {
  string id = 1;
  // 不传或 type 为空是不走代理
  AgentProxy proxy = 2;
}
message SetAgentRuntimeProxyResponse {
  AgentRuntime runtime = 1;
}

message TestAgentProxyRequest {
  AgentProxy proxy = 1;
  // 给哪个官方账户（运行时 id）或第三方接口（供应商 id）配的：决定连去哪里，密码留空时用它已保存的
  string runtime_id = 2;
  string provider_id = 3;
  // 第三方接口还没保存时：类型和接口地址
  string vendor = 4;
  string base_url = 5;
}
message TestAgentProxyResponse {
  bool ok = 1;
  string error = 2;
  int64 latency_ms = 3;
  // 请求的是哪里
  string target = 4;
}

message UpdateAgentSandboxRequest {}
message UpdateAgentSandboxResponse {
  AgentSandbox sandbox = 1;
  // 原来的版本（没下载过为空）和最新版本
  string current = 2;
  string latest = 3;
  bool updated = 4;
}

// ———————————————————————————— 通知 ————————————————————————————

message AgentNotifyChannel {
  // discord | telegram | feishu | qq
  string kind = 1;
  bool configured = 2;
  bool enabled = 3;
  // 配置项；密钥类只返回脱敏值，保存时留空表示保留原值
  map<string, string> fields = 4;
}

message AgentNotifyEvents {
  // 等待批准时
  bool ask = 1;
  // 一轮结束时
  bool done = 2;
  // 出错时
  bool error = 3;
}

message GetAgentNotifyRequest {}
message GetAgentNotifyResponse {
  AgentNotifyEvents events = 1;
  repeated AgentNotifyChannel channels = 2;
}

message UpdateAgentNotifyEventsRequest {
  AgentNotifyEvents events = 1;
}
message UpdateAgentNotifyEventsResponse {}

message SaveAgentNotifyChannelRequest {
  string kind = 1;
  map<string, string> fields = 2;
}
message SaveAgentNotifyChannelResponse {
  AgentNotifyChannel channel = 1;
}

message SetAgentNotifyChannelEnabledRequest {
  string kind = 1;
  bool enabled = 2;
  // 别人的（Agent 管理页，要有 agent:admin）；空是自己的
  string user_id = 3;
}
message SetAgentNotifyChannelEnabledResponse {}

message DeleteAgentNotifyChannelRequest {
  string kind = 1;
  // 别人的（Agent 管理页，要有 agent:admin）；空是自己的
  string user_id = 2;
}
message DeleteAgentNotifyChannelResponse {}

// 一个人的通知设置（Agent 管理页）
message AgentNotifyOwner {
  string user_id = 1;
  AgentNotifyEvents events = 2;
  // 只有设置过的通知方式
  repeated AgentNotifyChannel channels = 3;
}

message ListAgentNotifyRequest {}
message ListAgentNotifyResponse {
  repeated AgentNotifyOwner items = 1;
  repeated AgentUser users = 2;
}

message TestAgentNotifyChannelRequest {
  string kind = 1;
  map<string, string> fields = 2;
}
message TestAgentNotifyChannelResponse {}

// ———————————————————————————— 公开批准页 ————————————————————————————

message PublicAgentApprovalRequest {
  string token = 1;
}
message PublicAgentApprovalResponse {
  string session_title = 1;
  string runtime_name = 2;
  string workspace_name = 3;
  // 要批准的事：工具标题和命令
  string title = 4;
  string detail = 5;
  repeated AgentChoice options = 6;
  // pending | resolved | expired
  string state = 7;
  // 已回答时选中的选项名
  string outcome = 8;
}

message PublicResolveAgentApprovalRequest {
  string token = 1;
  string option_id = 2;
}
message PublicResolveAgentApprovalResponse {}
