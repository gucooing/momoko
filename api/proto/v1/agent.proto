  // 只看动过这个文件的（相对仓库）
  string path = 7;
  // 在提交说明里搜
  string keyword = 8;
}
message ListAgentGitLogResponse {
  repeated AgentGitCommit commits = 1;
  // 后面还有
  bool more = 2;
}
message GetAgentGitCommitRequest {
  string id = 1;
  string repo = 2;
  string hash = 3;
  // 是一个储藏：文件列表连同没跟踪的
  bool stash = 4;
}
message GetAgentGitCommitResponse {
  AgentGitCommit commit = 1;
  // 说明标题后面的部分
  string body = 2;
  string committer = 3;
  google.protobuf.Timestamp commit_date = 4;
  repeated AgentGitFile files = 5;
}

