// ———————————————————————————— 工作区 ————————————————————————————

message AgentWorkspace {
  string id = 1;
  string name = 2;
  string path = 3;
  bool is_git = 4;
  string branch = 5;
  // 空 | cloning | failed
  string clone_status = 6;
  string clone_error = 7;
  // 默认模型连带确定供应商和 Agent
  string runtime_id = 8;
  string runtime_name = 9;
  string provider_id = 10;
  string provider_name = 11;
  string model = 12;
  string effort = 13;
  string mode = 14;
  string mode_name = 15;
  repeated string mcp_ids = 16;
  int32 session_count = 17;
  google.protobuf.Timestamp active_at = 18;
  // 目录已经不存在
  bool missing = 19;
  // api | system
  string provider_kind = 20;
  string provider_vendor = 21;
}

message AgentDoc {
  // AGENTS.md | CLAUDE.md
  string name = 1;
  bool exists = 2;
  string content = 3;
}

message ListAgentWorkspacesRequest {}
message ListAgentWorkspacesResponse {
  repeated AgentWorkspace workspaces = 1;
}

message CreateAgentWorkspaceRequest {
  // dir | git
  string source = 1;
  string name = 2;
  // dir：已有目录；git：克隆到哪（空 = 默认位置）
  string path = 3;
  string git_url = 4;
  string git_branch = 5;
  string runtime_id = 6;
  string provider_id = 7;
  string model = 8;
  string effort = 9;
  string mode = 10;
  repeated string mcp_ids = 11;
  // 要写入的项目指令文件
  repeated AgentDoc docs = 12;
}
message CreateAgentWorkspaceResponse {
  AgentWorkspace workspace = 1;
}

message UpdateAgentWorkspaceRequest {
  string id = 1;
  string name = 2;
  string path = 3;
  string runtime_id = 6;
  string provider_id = 7;
  string model = 8;
  string effort = 9;
  string mode = 10;
  repeated string mcp_ids = 11;
  repeated AgentDoc docs = 12;
}
message UpdateAgentWorkspaceResponse {
  AgentWorkspace workspace = 1;
}

message DeleteAgentWorkspaceRequest {
  string id = 1;
}
message DeleteAgentWorkspaceResponse {}

message AgentDir {
  string name = 1;
  string path = 2;
  bool is_git = 3;
  string branch = 4;
}
message ListAgentDirsRequest {
  // 空 = 根（Windows 上是盘符列表）
  string path = 1;
}
message ListAgentDirsResponse {
  string path = 1;
  // 上一级；已经在根为空
  string parent = 2;
  repeated AgentDir dirs = 3;
  // 克隆仓库的默认上级目录
  string clone_base = 4;
}

message BrowseAgentWorkspaceRequest {
  string id = 1;
  string dir = 2;
}
message BrowseAgentWorkspaceResponse {
  repeated AgentFileEntry entries = 1;
}

message GetAgentDocsRequest {
  string path = 1;
}
message GetAgentDocsResponse {
  repeated AgentDoc docs = 1;
}

// ———————————————————————————— 模型供应商 ————————————————————————————

// 推理等级：name 是会话里能选的等级，value 是选中它时实际发给接口的值（空 = 不带这个参数）
message AgentModelLevel {
  string name = 1;
  string value = 2;
}
message AgentModel {
  string id = 1;
  repeated AgentModelLevel levels = 2;
  // 最长上下文和最长输出（token 数），启动 Agent 时交给它；新模型默认 1000000 和 128000
  int64 context_window = 3;
  int64 max_output = 4;
}

// 一种供应商类型：通用的兼容接口，或对某一家的专门适配
message AgentVendor {
  // anthropic（Anthropic 兼容）| openai（OpenAI Responses 兼容）| deepseek（DeepSeek 官方）…
  string id = 1;
  // 能给哪些协议的 Agent 用：anthropic（Claude 系）| openai（Codex 系）
  repeated string protocols = 2;
  // 官方接口地址；不为空表示地址固定，不用填
  string base_url = 3;
  // 能查账户余额
  bool balance = 4;
}

// 第三方接口（官方账号由用户自己在服务器上登录，见运行时的检查）
message AgentProvider {
  string id = 1;
  // 供应商类型（AgentVendor.id），创建后不能改
  string vendor = 3;
  string name = 4;
  // ok | bad | untested
  string status = 10;
  string status_text = 11;
  // 用户填的接口地址；地址固定的类型为空
  string base_url = 13;
  // 只写；更新时留空表示保留原值
  string api_key = 14;
  // 脱敏后的后四位
  string api_key_tail = 15;
  repeated AgentModel models = 16;
  string main_model = 17;
  string fast_model = 18;
  repeated AgentKV env = 19;
  int64 test_latency_ms = 20;
  google.protobuf.Timestamp tested_at = 21;
}

message ListAgentProvidersRequest {}
message ListAgentProvidersResponse {
  repeated AgentProvider providers = 1;
  // 能添加的供应商类型
  repeated AgentVendor vendors = 2;
}

message CreateAgentProviderRequest {
  AgentProvider provider = 1;
}
message CreateAgentProviderResponse {
  AgentProvider provider = 1;
}

message UpdateAgentProviderRequest {
  string id = 1;
  AgentProvider provider = 2;
}
message UpdateAgentProviderResponse {
  AgentProvider provider = 1;
}

message DeleteAgentProviderRequest {
  string id = 1;
}
message DeleteAgentProviderResponse {}

message TestAgentProviderRequest {
  string id = 1;
  // 表单草稿；有它就测草稿
  AgentProvider draft = 2;
  // 发给模型的消息；空 = hello
  string message = 3;
}
// 一种协议的测试结果
message AgentProviderTestResult {
  // anthropic | openai
  string protocol = 1;
  bool ok = 2;
  // 失败的原因
  string error = 3;
  int64 latency_ms = 4;
  // 模型回的文字（不含思考过程）
  string reply = 5;
  int64 input_tokens = 6;
  int64 output_tokens = 7;
}
message TestAgentProviderResponse {
  // 用的哪个模型
  string model = 1;
  // 供应商给的每种协议一条
  repeated AgentProviderTestResult results = 2;
}

message FetchAgentProviderModelsRequest {
  string id = 1;
  // 供应商类型（AgentVendor.id）
  string vendor = 2;
  string base_url = 3;
  string api_key = 4;
}
message FetchAgentProviderModelsResponse {
  // 接口给了才有推理等级、最长上下文和最长输出（没给的为空或 0）
  repeated AgentModel models = 1;
}

// 一种币种的余额；金额是接口给的十进制字符串
message AgentBalance {
  string currency = 1;
  string total = 2;
  // 赠送的
  string granted = 3;
  // 充值的
  string topped_up = 4;
}
message GetAgentProviderBalanceRequest {
  string id = 1;
}
message GetAgentProviderBalanceResponse {
  // 查询失败的原因；不为空时其余字段无意义
  string error = 1;
  // 余额够不够继续调用
  bool available = 2;
  repeated AgentBalance balances = 3;
}

// ———————————————————————————— MCP ————————————————————————————

message AgentMcpServer {
  string id = 1;
  string name = 2;
  string description = 3;
  // stdio | http
  string transport = 4;
  string command = 5;
  repeated string args = 6;
  repeated AgentSecretKV env = 7;
  string url = 8;
  repeated AgentSecretKV headers = 9;
  bool default_on = 10;
  // ok | fail | untested
  string status = 11;
  string status_text = 12;
  int32 tool_count = 13;
  google.protobuf.Timestamp tested_at = 14;
}

message ListAgentMcpServersRequest {}
message ListAgentMcpServersResponse {
