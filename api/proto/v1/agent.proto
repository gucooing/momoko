  string id = 1;
  string repo = 2;
  // push | apply | pop | drop
  string action = 3;
  // apply、pop、drop：储藏的哈希（按哈希找，列表在这期间变了也不会弄错）
  string hash = 4;
  // push：说明
  string message = 5;
  // push：连同没跟踪的文件
  bool untracked = 6;
  // push：只储藏暂存了的
  bool staged = 7;
  // apply、pop：连暂存状态一起恢复
  bool index = 8;
  // push：只储藏这些文件（空 = 全部）
  repeated string paths = 9;
}
message UpdateAgentGitStashResponse {
  string output = 1;
}

message RunAgentGitOperationRequest {
  string id = 1;
  string repo = 2;
