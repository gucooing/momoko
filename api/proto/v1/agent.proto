syntax = "proto3";

package v1;

option go_package = "momoko/api/gen/v1;v1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// Agent：Momoko 作为 ACP（Agent Client Protocol）客户端，在服务器上启动并控制 Claude Code、Codex 等 Agent。
// 会话里的对话事件走 WebSocket（/api/v1/agent/ws），这里只有一元接口；发起一轮的接口立刻返回。
service AgentService {
  // —— 选择器 ——
  // 新会话 / 会话里 / 工作区默认值用的选项：每个 Agent 的供应商、模型、推理强度和权限模式
  rpc GetAgentOptions(GetAgentOptionsRequest) returns (GetAgentOptionsResponse) {
    option (google.api.http) = { get: "/api/v1/agent/options" };
  }
  // 各管理标签的数量：自己的会话、工作区、MCP、技能，加上大家共用的供应商、运行时、通知
  rpc GetAgentOverview(GetAgentOverviewRequest) returns (GetAgentOverviewResponse) {
    option (google.api.http) = { get: "/api/v1/agent/overview" };
  }

  // —— 会话 ——
  // 会话栏：我的未归档会话，按工作区分层
  rpc GetAgentSidebar(GetAgentSidebarRequest) returns (GetAgentSidebarResponse) {
    option (google.api.http) = { get: "/api/v1/agent/sidebar" };
  }
  // 会话列表（管理页）：状态筛选、标题搜索、分页，都在 SQL 里完成；只有自己的，all 为 true 时是所有人的（Agent 管理页）
  rpc ListAgentSessions(ListAgentSessionsRequest) returns (ListAgentSessionsResponse) {
    option (google.api.http) = { get: "/api/v1/agent/sessions" };
  }
  // 新建会话并发出第一条消息
  rpc CreateAgentSession(CreateAgentSessionRequest) returns (CreateAgentSessionResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions" body: "*" };
  }
  rpc GetAgentSession(GetAgentSessionRequest) returns (GetAgentSessionResponse) {
    option (google.api.http) = { get: "/api/v1/agent/sessions/{id}" };
  }
  // 会话的 Agent 进程（命令、进程号、内存、已运行），展开看时才读
  rpc GetAgentSessionProcess(GetAgentSessionProcessRequest) returns (GetAgentSessionProcessResponse) {
    option (google.api.http) = { get: "/api/v1/agent/sessions/{id}/process" };
  }
  // 发一条消息，开始新的一轮；立刻返回，后续靠 WebSocket
  rpc PromptAgentSession(PromptAgentSessionRequest) returns (PromptAgentSessionResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/prompt" body: "*" };
  }
  // 停止当前这一轮
  rpc CancelAgentSession(CancelAgentSessionRequest) returns (CancelAgentSessionResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/cancel" body: "*" };
  }
  // 撤回一条排着队的消息（还没发出去的）
  rpc DeleteAgentQueuedPrompt(DeleteAgentQueuedPromptRequest) returns (DeleteAgentQueuedPromptResponse) {
    option (google.api.http) = { delete: "/api/v1/agent/sessions/{id}/queue/{queue_id}" };
  }
  // 排着队的一条马上发：能插进正在跑的一轮就插进去（ACP v2）；插不进去的停下这一轮，让它作为下一轮发出
  rpc SendAgentQueuedPrompt(SendAgentQueuedPromptRequest) returns (SendAgentQueuedPromptResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/queue/{queue_id}/send" body: "*" };
  }
  // 只停一项（ACP v2，它声明了能单独停时）：一个工具调用，或者一个子 Agent
  rpc StopAgentSessionItem(StopAgentSessionItemRequest) returns (StopAgentSessionItemResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/stop-item" body: "*" };
  }
  // 回答批准卡片
  rpc ResolveAgentPermission(ResolveAgentPermissionRequest) returns (ResolveAgentPermissionResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/permission" body: "*" };
  }
  // 切换权限模式 / 模型 / 推理强度
  rpc SetAgentSessionOption(SetAgentSessionOptionRequest) returns (SetAgentSessionOptionResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/option" body: "*" };
  }
  rpc RenameAgentSession(RenameAgentSessionRequest) returns (RenameAgentSessionResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/rename" body: "*" };
  }
  // 复刻对话；worktree 为 true 时放到自动命名的新工作树里
  rpc ForkAgentSession(ForkAgentSessionRequest) returns (ForkAgentSessionResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/fork" body: "*" };
  }
  // 把复刻出来的会话移到外层
  rpc DetachAgentSession(DetachAgentSessionRequest) returns (DetachAgentSessionResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/detach" body: "*" };
  }
  // 归档 / 取消归档（还在运行或等待批准的不能归档）
  rpc ArchiveAgentSessions(ArchiveAgentSessionsRequest) returns (ArchiveAgentSessionsResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/archive" body: "*" };
  }
  rpc DeleteAgentSessions(DeleteAgentSessionsRequest) returns (DeleteAgentSessionsResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/delete" body: "*" };
  }
  // 删除全部归档会话
  rpc PurgeAgentSessions(PurgeAgentSessionsRequest) returns (PurgeAgentSessionsResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/purge" body: "*" };
  }
  // 导出记录：返回会话的全部事件，由页面排版成 Markdown 下载
  rpc ExportAgentSessions(ExportAgentSessionsRequest) returns (ExportAgentSessionsResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/export" body: "*" };
  }
  // —— 右侧「Git」：会话目录本身是仓库，或者它下面几层里的几个仓库 ——
  // repo 是仓库相对会话目录的路径（会话目录本身为空），文件路径都相对仓库。
  // 每个仓库的状态：分支、上游和领先落后、进行中的合并 / 变基、暂存的 / 没暂存的 / 冲突的文件
  rpc GetAgentGitStatus(GetAgentGitStatusRequest) returns (GetAgentGitStatusResponse) {
    option (google.api.http) = { get: "/api/v1/agent/sessions/{id}/git/status" };
  }
  // 一个文件的 diff：工作区的、暂存区的、冲突的、某次提交里的、某个储藏里的；head 是整个仓库相对 HEAD 的补丁（复制用）
  rpc GetAgentGitDiff(GetAgentGitDiffRequest) returns (GetAgentGitDiffResponse) {
    option (google.api.http) = { get: "/api/v1/agent/sessions/{id}/git/diff" };
  }
  // 文件：暂存、取消暂存、撤销工作区的改动、冲突里采用当前 / 传入、标记已解决、加进 .gitignore
  rpc UpdateAgentGitFiles(UpdateAgentGitFilesRequest) returns (UpdateAgentGitFilesResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/git/files" body: "*" };
  }
  // 按行（或整段）暂存、取消暂存、撤销
  rpc ApplyAgentGitLines(ApplyAgentGitLinesRequest) returns (ApplyAgentGitLinesResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/git/lines" body: "*" };
  }
  // 提交
  rpc CommitAgentGit(CommitAgentGitRequest) returns (CommitAgentGitResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/git/commit" body: "*" };
  }
  // 让会话的 Agent 写提交说明：在同一个 Agent 进程里另开一个一次性会话，不进对话
  rpc GenerateAgentGitMessage(GenerateAgentGitMessageRequest) returns (GenerateAgentGitMessageResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/git/message" body: "*" };
  }
  // 当前分支重置到某个提交（撤销上一次提交是软重置到 HEAD~1）
  rpc ResetAgentGit(ResetAgentGitRequest) returns (ResetAgentGitResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/git/reset" body: "*" };
  }
  // 分支、远程分支、标签、远程仓库
  rpc ListAgentGitRefs(ListAgentGitRefsRequest) returns (ListAgentGitRefsResponse) {
    option (google.api.http) = { get: "/api/v1/agent/sessions/{id}/git/refs" };
  }
  // 分支和标签：切换、新建、改名、删除（本地 / 远程）、合并到当前、把当前变基到；新建、删除、推送标签
  rpc UpdateAgentGitRef(UpdateAgentGitRefRequest) returns (UpdateAgentGitRefResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/git/ref" body: "*" };
  }
  // 获取、拉取、推送
  rpc SyncAgentGit(SyncAgentGitRequest) returns (SyncAgentGitResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/git/sync" body: "*" };
  }
  // 远程仓库：添加、改地址、改名、删除
  rpc UpdateAgentGitRemote(UpdateAgentGitRemoteRequest) returns (UpdateAgentGitRemoteResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/git/remote" body: "*" };
  }
  rpc ListAgentGitStashes(ListAgentGitStashesRequest) returns (ListAgentGitStashesResponse) {
    option (google.api.http) = { get: "/api/v1/agent/sessions/{id}/git/stashes" };
  }
  // 储藏：存、应用、弹出、删除
  rpc UpdateAgentGitStash(UpdateAgentGitStashRequest) returns (UpdateAgentGitStashResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/git/stash" body: "*" };
  }
  // 拣选、还原一个提交；进行中的合并 / 变基 / 拣选 / 还原：继续、跳过、中止
  rpc RunAgentGitOperation(RunAgentGitOperationRequest) returns (RunAgentGitOperationResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/git/operation" body: "*" };
  }
  // 提交历史（分页、搜说明、只看某个文件）
  rpc ListAgentGitLog(ListAgentGitLogRequest) returns (ListAgentGitLogResponse) {
    option (google.api.http) = { get: "/api/v1/agent/sessions/{id}/git/log" };
  }
  // 一个提交（或储藏）的详情：完整说明、作者、改了哪些文件
  rpc GetAgentGitCommit(GetAgentGitCommitRequest) returns (GetAgentGitCommitResponse) {
    option (google.api.http) = { get: "/api/v1/agent/sessions/{id}/git/commits/{hash}" };
  }
  // 在会话目录（或它下面的某个目录）初始化仓库
  rpc InitAgentGitRepo(InitAgentGitRepoRequest) returns (InitAgentGitRepoResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sessions/{id}/git/init" body: "*" };
  }
  // 右侧「文件」：按目录懒加载
  rpc ListAgentSessionFiles(ListAgentSessionFilesRequest) returns (ListAgentSessionFilesResponse) {
    option (google.api.http) = { get: "/api/v1/agent/sessions/{id}/files" };
  }
  // 打开文件（只读）
  rpc ReadAgentSessionFile(ReadAgentSessionFileRequest) returns (ReadAgentSessionFileResponse) {
    option (google.api.http) = { get: "/api/v1/agent/sessions/{id}/file" };
  }
  // 取回消息里上传过的附件（显示图片）
  rpc GetAgentSessionUpload(GetAgentSessionUploadRequest) returns (GetAgentSessionUploadResponse) {
    option (google.api.http) = { get: "/api/v1/agent/sessions/{id}/upload" };
  }
  // 回复里引用的本机文件（Agent 写的绝对路径）：在会话目录、工作目录或附加目录里才给，页面拿来显示图片
  rpc GetAgentSessionLocalFile(GetAgentSessionLocalFileRequest) returns (GetAgentSessionUploadResponse) {
    option (google.api.http) = { get: "/api/v1/agent/sessions/{id}/local" };
  }
  // @ 引用文件：按文件名搜索会话目录（新会话还没有会话时按工作区搜）
  rpc SearchAgentFiles(SearchAgentFilesRequest) returns (SearchAgentFilesResponse) {
    option (google.api.http) = { get: "/api/v1/agent/files/search" };
  }
  // —— 文件树里的编辑：有会话按会话目录，新会话页还没有会话时按工作区（和 @ 搜索一样给 session_id 或 workspace_id）——
  // 保存文本文件：编辑后保存，或者新建一个文件
  rpc SaveAgentFile(SaveAgentFileRequest) returns (SaveAgentFileResponse) {
    option (google.api.http) = { post: "/api/v1/agent/files/save" body: "*" };
  }
  // 新建文件夹
  rpc CreateAgentDir(CreateAgentDirRequest) returns (CreateAgentDirResponse) {
    option (google.api.http) = { post: "/api/v1/agent/files/mkdir" body: "*" };
  }
  // 改名或挪到另一个文件夹
  rpc MoveAgentFile(MoveAgentFileRequest) returns (MoveAgentFileResponse) {
    option (google.api.http) = { post: "/api/v1/agent/files/move" body: "*" };
  }
  // 删除文件或文件夹（整个删掉，不进回收站）
  rpc DeleteAgentFiles(DeleteAgentFilesRequest) returns (DeleteAgentFilesResponse) {
    option (google.api.http) = { post: "/api/v1/agent/files/delete" body: "*" };
  }
  // 原样读一个文件（预览图片，Markdown 里用到的图片）
  rpc GetAgentFileRaw(GetAgentFileRawRequest) returns (GetAgentSessionUploadResponse) {
    option (google.api.http) = { get: "/api/v1/agent/files/raw" };
  }
  // HTML 预览的签名：iframe 按 /api/v1/public/agent/preview/{节点}/{签名}/{相对路径} 把目录当静态站点加载
  rpc GetAgentPreviewToken(GetAgentPreviewTokenRequest) returns (GetAgentPreviewTokenResponse) {
    option (google.api.http) = { get: "/api/v1/agent/files/preview-token" };
  }

  // —— 工作区 ——
  rpc ListAgentWorkspaces(ListAgentWorkspacesRequest) returns (ListAgentWorkspacesResponse) {
    option (google.api.http) = { get: "/api/v1/agent/workspaces" };
  }
  rpc CreateAgentWorkspace(CreateAgentWorkspaceRequest) returns (CreateAgentWorkspaceResponse) {
    option (google.api.http) = { post: "/api/v1/agent/workspaces" body: "*" };
  }
  rpc UpdateAgentWorkspace(UpdateAgentWorkspaceRequest) returns (UpdateAgentWorkspaceResponse) {
    option (google.api.http) = { put: "/api/v1/agent/workspaces/{id}" body: "*" };
  }
  // 移除工作区：只删记录，目录里的文件不动
  rpc DeleteAgentWorkspace(DeleteAgentWorkspaceRequest) returns (DeleteAgentWorkspaceResponse) {
    option (google.api.http) = { delete: "/api/v1/agent/workspaces/{id}" };
  }
  // 「浏览」：列出服务器上某个目录下的子目录
  rpc ListAgentDirs(ListAgentDirsRequest) returns (ListAgentDirsResponse) {
    option (google.api.http) = { get: "/api/v1/agent/dirs" };
  }
  // 「查看文件」：只读地列出工作区里的目录和文件
  rpc BrowseAgentWorkspace(BrowseAgentWorkspaceRequest) returns (BrowseAgentWorkspaceResponse) {
    option (google.api.http) = { get: "/api/v1/agent/workspaces/{id}/browse" };
  }
  // 新会话页里打开工作区的文件（只读，和会话里打开文件一样的返回）
  rpc ReadAgentWorkspaceFile(ReadAgentWorkspaceFileRequest) returns (ReadAgentSessionFileResponse) {
    option (google.api.http) = { get: "/api/v1/agent/workspaces/{id}/file" };
  }
  // 项目指令文件（AGENTS.md / CLAUDE.md）；按目录读，新建工作区时目录还没有记录
  rpc GetAgentDocs(GetAgentDocsRequest) returns (GetAgentDocsResponse) {
    option (google.api.http) = { get: "/api/v1/agent/docs" };
  }

  // —— 模型供应商（第三方接口）：每个人自己的，加上管理员共享给他的 ——
  rpc ListAgentProviders(ListAgentProvidersRequest) returns (ListAgentProvidersResponse) {
    option (google.api.http) = { get: "/api/v1/agent/providers" };
  }
  // 第三方接口
  rpc CreateAgentProvider(CreateAgentProviderRequest) returns (CreateAgentProviderResponse) {
    option (google.api.http) = { post: "/api/v1/agent/providers" body: "*" };
  }
  rpc UpdateAgentProvider(UpdateAgentProviderRequest) returns (UpdateAgentProviderResponse) {
    option (google.api.http) = { put: "/api/v1/agent/providers/{id}" body: "*" };
  }
  rpc DeleteAgentProvider(DeleteAgentProviderRequest) returns (DeleteAgentProviderResponse) {
    option (google.api.http) = { delete: "/api/v1/agent/providers/{id}" };
  }
  // 测试：用主模型发一条消息，供应商给的每种协议各发一次。有草稿测草稿（地址、密钥留空且有 id 时用已保存的），否则测已保存的
  rpc TestAgentProvider(TestAgentProviderRequest) returns (TestAgentProviderResponse) {
    option (google.api.http) = { post: "/api/v1/agent/providers/test" body: "*" };
  }
  // 获取可用模型
  rpc FetchAgentProviderModels(FetchAgentProviderModelsRequest) returns (FetchAgentProviderModelsResponse) {
    option (google.api.http) = { post: "/api/v1/agent/providers/models" body: "*" };
  }
  // 账户余额：只有能查余额的供应商类型（AgentVendor.balance）才有
  rpc GetAgentProviderBalance(GetAgentProviderBalanceRequest) returns (GetAgentProviderBalanceResponse) {
    option (google.api.http) = { get: "/api/v1/agent/providers/{id}/balance" };
  }

  // —— MCP ——
  rpc ListAgentMcpServers(ListAgentMcpServersRequest) returns (ListAgentMcpServersResponse) {
    option (google.api.http) = { get: "/api/v1/agent/mcp" };
  }
  rpc CreateAgentMcpServer(CreateAgentMcpServerRequest) returns (CreateAgentMcpServerResponse) {
    option (google.api.http) = { post: "/api/v1/agent/mcp" body: "*" };
  }
  rpc UpdateAgentMcpServer(UpdateAgentMcpServerRequest) returns (UpdateAgentMcpServerResponse) {
    option (google.api.http) = { put: "/api/v1/agent/mcp/{id}" body: "*" };
  }
  rpc DeleteAgentMcpServer(DeleteAgentMcpServerRequest) returns (DeleteAgentMcpServerResponse) {
    option (google.api.http) = { delete: "/api/v1/agent/mcp/{id}" };
  }
  // 新会话默认开启的开关
  rpc SetAgentMcpDefault(SetAgentMcpDefaultRequest) returns (SetAgentMcpDefaultResponse) {
    option (google.api.http) = { post: "/api/v1/agent/mcp/{id}/default" body: "*" };
  }
  // 测试连接：由 Momoko 自己连一次，读它的工具列表
  rpc TestAgentMcpServer(TestAgentMcpServerRequest) returns (TestAgentMcpServerResponse) {
    option (google.api.http) = { post: "/api/v1/agent/mcp/test" body: "*" };
  }
  // 粘贴 mcpServers JSON 导入
  rpc ImportAgentMcpServers(ImportAgentMcpServersRequest) returns (ImportAgentMcpServersResponse) {
    option (google.api.http) = { post: "/api/v1/agent/mcp/import" body: "*" };
  }

  // —— 技能 ——
  rpc ListAgentSkills(ListAgentSkillsRequest) returns (ListAgentSkillsResponse) {
    option (google.api.http) = { get: "/api/v1/agent/skills" };
  }
  rpc GetAgentSkill(GetAgentSkillRequest) returns (GetAgentSkillResponse) {
    option (google.api.http) = { get: "/api/v1/agent/skills/{id}" };
  }
  rpc CreateAgentSkill(CreateAgentSkillRequest) returns (CreateAgentSkillResponse) {
    option (google.api.http) = { post: "/api/v1/agent/skills" body: "*" };
  }
  rpc UpdateAgentSkill(UpdateAgentSkillRequest) returns (UpdateAgentSkillResponse) {
    option (google.api.http) = { put: "/api/v1/agent/skills/{id}" body: "*" };
  }
  rpc DeleteAgentSkill(DeleteAgentSkillRequest) returns (DeleteAgentSkillResponse) {
    option (google.api.http) = { delete: "/api/v1/agent/skills/{id}" };
  }
  rpc SetAgentSkillEnabled(SetAgentSkillEnabledRequest) returns (SetAgentSkillEnabledResponse) {
    option (google.api.http) = { post: "/api/v1/agent/skills/{id}/enabled" body: "*" };
  }
  // 导入：压缩包（zip 内容）、Git 地址、服务器上已有的目录
  rpc ImportAgentSkill(ImportAgentSkillRequest) returns (ImportAgentSkillResponse) {
    option (google.api.http) = { post: "/api/v1/agent/skills/import" body: "*" };
  }

  // Agent 管理页给共享的 MCP、技能选人用：所有用户的名称（要有 agent:admin）
  rpc ListAgentUsers(ListAgentUsersRequest) returns (ListAgentUsersResponse) {
    option (google.api.http) = { get: "/api/v1/agent/users" };
  }

  // —— 运行时 ——
  rpc ListAgentRuntimes(ListAgentRuntimesRequest) returns (ListAgentRuntimesResponse) {
    option (google.api.http) = { get: "/api/v1/agent/runtimes" };
  }
  // 安装方式：Momoko 下载并更新 / 用服务器上已有的命令
  rpc SetAgentRuntimeMode(SetAgentRuntimeModeRequest) returns (SetAgentRuntimeModeResponse) {
    option (google.api.http) = { post: "/api/v1/agent/runtimes/{id}/mode" body: "*" };
  }
  // 重新检测
  rpc DetectAgentRuntime(DetectAgentRuntimeRequest) returns (DetectAgentRuntimeResponse) {
    option (google.api.http) = { post: "/api/v1/agent/runtimes/{id}/detect" body: "*" };
  }
  // 服务器上的登录：给检查时读到的模型设推理等级、最长上下文和最长输出
  rpc SetAgentRuntimeModels(SetAgentRuntimeModelsRequest) returns (SetAgentRuntimeModelsResponse) {
    option (google.api.http) = { post: "/api/v1/agent/runtimes/{id}/models" body: "*" };
  }
  // 服务器上的登录：开一个会话切到这个模型，读 Agent 给它的推理等级（不保存，页面填进表单）
  rpc GetAgentRuntimeModelLevels(GetAgentRuntimeModelLevelsRequest) returns (GetAgentRuntimeModelLevelsResponse) {
    option (google.api.http) = { get: "/api/v1/agent/runtimes/{id}/levels" };
  }
  // 检查更新；由 Momoko 下载的会直接更新到最新版本
  rpc UpdateAgentRuntime(UpdateAgentRuntimeRequest) returns (UpdateAgentRuntimeResponse) {
    option (google.api.http) = { post: "/api/v1/agent/runtimes/{id}/update" body: "*" };
  }
  // 添加其它 ACP Agent
  rpc CreateAgentRuntime(CreateAgentRuntimeRequest) returns (CreateAgentRuntimeResponse) {
    option (google.api.http) = { post: "/api/v1/agent/runtimes" body: "*" };
  }
  rpc DeleteAgentRuntime(DeleteAgentRuntimeRequest) returns (DeleteAgentRuntimeResponse) {
    option (google.api.http) = { delete: "/api/v1/agent/runtimes/{id}" };
  }
  // 同时运行的进程上限、空闲后结束进程
  rpc UpdateAgentRunSettings(UpdateAgentRunSettingsRequest) returns (UpdateAgentRunSettingsResponse) {
    option (google.api.http) = { post: "/api/v1/agent/runtimes/settings" body: "*" };
  }
  // 服务器上的登录走的代理（只有 Linux 能配）：检查、会话、登录终端、下载和更新都经它，别的路都断掉
  rpc SetAgentRuntimeProxy(SetAgentRuntimeProxyRequest) returns (SetAgentRuntimeProxyResponse) {
    option (google.api.http) = { post: "/api/v1/agent/runtimes/{id}/proxy" body: "*" };
  }
  // 试一下代理：在沙箱里经它请求要用的那一家（官方账户是 Agent 的官方地址，第三方接口是接口地址）
  rpc TestAgentProxy(TestAgentProxyRequest) returns (TestAgentProxyResponse) {
    option (google.api.http) = { post: "/api/v1/agent/proxy/test" body: "*" };
  }
  // 沙箱用的 sing-box：没下载时下载最新版本，下载过时更新到最新版本（只有 Linux）
  rpc UpdateAgentSandbox(UpdateAgentSandboxRequest) returns (UpdateAgentSandboxResponse) {
    option (google.api.http) = { post: "/api/v1/agent/sandbox/update" body: "*" };
  }

  // —— 通知：每个人自己的 ——
  rpc GetAgentNotify(GetAgentNotifyRequest) returns (GetAgentNotifyResponse) {
    option (google.api.http) = { get: "/api/v1/agent/notify" };
  }
  // 三个时机开关
  rpc UpdateAgentNotifyEvents(UpdateAgentNotifyEventsRequest) returns (UpdateAgentNotifyEventsResponse) {
    option (google.api.http) = { post: "/api/v1/agent/notify/events" body: "*" };
  }
  // 保存某种通知方式的配置，保存后自动启用
  rpc SaveAgentNotifyChannel(SaveAgentNotifyChannelRequest) returns (SaveAgentNotifyChannelResponse) {
    option (google.api.http) = { post: "/api/v1/agent/notify/channel" body: "*" };
  }
  rpc SetAgentNotifyChannelEnabled(SetAgentNotifyChannelEnabledRequest) returns (SetAgentNotifyChannelEnabledResponse) {
    option (google.api.http) = { post: "/api/v1/agent/notify/channel/enabled" body: "*" };
  }
  // 移除某种通知方式的配置
  rpc DeleteAgentNotifyChannel(DeleteAgentNotifyChannelRequest) returns (DeleteAgentNotifyChannelResponse) {
    option (google.api.http) = { post: "/api/v1/agent/notify/channel/delete" body: "*" };
  }
  // 所有人的通知设置（Agent 管理页，要有 agent:admin）：只列设置过通知方式的人，密钥只给脱敏值
  rpc ListAgentNotify(ListAgentNotifyRequest) returns (ListAgentNotifyResponse) {
    option (google.api.http) = { get: "/api/v1/agent/notify/all" };
  }
  // 发一条测试；fields 为空时用已保存的配置
  rpc TestAgentNotifyChannel(TestAgentNotifyChannelRequest) returns (TestAgentNotifyChannelResponse) {
    option (google.api.http) = { post: "/api/v1/agent/notify/channel/test" body: "*" };
  }
}

// 通知消息里的批准链接打开的公开页：凭一次性令牌查看和回答，不需要登录
service AgentPublic {
  rpc PublicAgentApproval(PublicAgentApprovalRequest) returns (PublicAgentApprovalResponse) {
    option (google.api.http) = { get: "/api/v1/public/agent/approval/{token}" };
  }
  rpc PublicResolveAgentApproval(PublicResolveAgentApprovalRequest) returns (PublicResolveAgentApprovalResponse) {
    option (google.api.http) = { post: "/api/v1/public/agent/approval/{token}" body: "*" };
  }
}

// ———————————————————————————— 通用 ————————————————————————————

message AgentKV {
  string key = 1;
  string value = 2;
}

// 带密文的键值（MCP 的环境变量和请求头）：value 只写，留空表示保留原值；masked 是脱敏后的后几位
message AgentSecretKV {
  string key = 1;
  // 提交时的明文；留空表示保留已保存的值
  string value = 2;
  // 已保存的值的后四位（返回时只给这个）
  string tail = 3;
}

// ———————————————————————————— 选择器 ————————————————————————————

message GetAgentOptionsRequest {}
message GetAgentOptionsResponse {
  repeated AgentRuntimeOptions runtimes = 1;
}

message AgentRuntimeOptions {
  string runtime_id = 1;
  string runtime_name = 2;
  // claude | codex | antigravity | custom
  string kind = 3;
  bool ready = 4;
  repeated AgentProviderOptions providers = 5;
  // 权限模式由 Agent 提供
  repeated AgentChoice modes = 6;
  string default_mode = 7;
  AgentCapabilities caps = 8;
  // 开始会话前能选 Turbo：启动时就不再询问任何操作，开始后不能改
  bool unrestricted = 9;
}

message AgentProviderOptions {
  // 空字符串表示用服务器上已有的登录（用户自己在服务器上登录命令行）
  string provider_id = 1;
  // api：用户起的名称；system：服务器上登录的账号（检查时 Agent 报的，可能为空）
  string name = 2;
  repeated AgentModelOption models = 3;
  string default_model = 4;
  // api | system
  string kind = 5;
  // api：ok | bad | untested
  string status = 6;
  // api：供应商类型（AgentVendor.id）
  string vendor = 7;
}

message AgentModelOption {
  string id = 1;
  string name = 2;
  // 这个模型能选的推理强度；为空表示不可调
  repeated AgentChoice efforts = 3;
  string default_effort = 4;
  // 服务器上的登录：管理页给这个模型设的最长上下文和最长输出（token 数），0 = 用 Agent 自己的
  int64 context_window = 5;
  int64 max_output = 6;
}

message AgentChoice {
  string id = 1;
  string name = 2;
  string description = 3;
  // 批准选项的种类：allow_once | allow_always | reject_once | reject_always
  string kind = 4;
}

// Agent 在初始化时声明的能力；没声明的，对应的界面元素不出现
message AgentCapabilities {
  bool resume = 2;
  bool fork = 3;
  bool additional_dirs = 4;
  bool image = 5;
  bool embedded_context = 6;
  bool mcp_http = 7;
  bool mcp_sse = 8;
  bool close = 9;
  bool subagents = 10;
  // 一轮还没结束时能把消息插进去（ACP v2）；不能的只能排队
  bool steer = 11;
}

message GetAgentOverviewRequest {
  // Agent 管理页：会话、工作区、MCP、技能数所有人的（要有 agent:admin，且是直接登录的）
  bool all = 1;
}
message GetAgentOverviewResponse {
  int32 sessions = 1;
  int32 sessions_running = 2;
  int32 sessions_waiting = 3;
  int32 workspaces = 4;
  int32 providers = 5;
  int32 mcp_servers = 8;
  int32 mcp_ok = 9;
  int32 skills = 10;
  int32 skills_enabled = 11;
  int32 runtimes = 12;
  int32 runtimes_ready = 13;
  int32 notify_channels = 14;
  int32 notify_enabled = 15;
}

// ———————————————————————————— 会话 ————————————————————————————

message AgentUsage {
  int64 total = 1;
  // 不含缓存命中和缓存写入
  int64 input = 2;
  int64 output = 3;
  int64 cache_read = 4;
  int64 cache_write = 5;
  int64 thought = 6;
}

// Agent 进程的实时状态，不落库；只在有人要看时读（内存要遍历进程树）
message AgentProcess {
  string command = 1;
  int32 pid = 2;
  int64 memory_bytes = 3;
  google.protobuf.Timestamp started_at = 4;
  repeated string args = 5;
  // 这个进程里派出过的子 Agent，按派出的先后
  repeated AgentProcessSubagent subagents = 6;
}

// Agent 进程里的一个子 Agent
message AgentProcessSubagent {
  string id = 1;
  string title = 2;
  // running | requires_action | idle（做完了）
  string state = 3;
}

message AgentSession {
  string id = 1;
  string title = 2;
  string runtime_id = 3;
  string runtime_name = 4;
  // claude | codex | antigravity | custom
  string runtime_kind = 5;
  string workspace_id = 6;
  string workspace_name = 7;
  // 实际运行目录：工作区目录、工作树目录或临时目录
  string cwd = 8;
  repeated string extra_dirs = 9;
  // 工作树名；不在工作树里为空
  string worktree = 10;
  string provider_id = 11;
  // 供应商的名称（原样）；怎么显示由页面按 provider_kind / provider_vendor 决定
  string provider_name = 12;
  string model = 13;
  string effort = 14;
  string mode = 15;
  string mode_name = 16;
  // running | waiting | idle | error | archived
  string status = 17;
  string error = 18;
  // 复刻来源；detached 表示已移到外层
  string parent_id = 19;
  bool detached = 21;
  string user_id = 22;
  google.protobuf.Timestamp active_at = 24;
  google.protobuf.Timestamp create_time = 25;
  // Agent 侧的会话 ID
  string acp_session_id = 28;
  // 累计用量；Agent 没给过为空
  AgentUsage usage = 30;
  int32 turns = 31;
  // 最近一轮
  AgentUsage last_usage = 32;
  int64 context_used = 33;
  int64 context_size = 34;
  // api | system
  string provider_kind = 39;
  string provider_vendor = 40;
  // 有 Agent 进程在跑；一轮结束后进程还留着，空闲超时才结束，所以空闲的会话也可能有
  bool live = 41;
  // 以 Turbo 开始的：不再询问任何操作，权限模式不起作用
  bool unrestricted = 42;
}

// 打开一个会话时才给的信息：每次状态变化都推整份会话，这些不跟着推
message AgentSessionDetail {
  // 当前分支（工作目录是 Git 仓库时）
  string branch = 1;
  repeated string mcp_names = 2;
  repeated string skill_names = 3;
  string parent_title = 4;
  // Agent 自报的名字和版本
  string agent_name = 5;
  string agent_version = 6;
}

message AgentUser {
  string id = 1;
  string name = 2;
  string username = 3;
}

message AgentSidebarWorkspace {
  string id = 1;
  string name = 2;
  string path = 3;
  bool is_git = 4;
  string branch = 5;
  int32 session_count = 6;
}

message GetAgentSidebarRequest {
  string keyword = 1;
}
message GetAgentSidebarResponse {
  repeated AgentSidebarWorkspace workspaces = 1;
  // 未归档的会话，按最近活动倒序；workspace_id 为空的归在「无工作区」
  repeated AgentSession sessions = 2;
}

message ListAgentSessionsRequest {
  // all（默认）| running | waiting | idle | error | archived
  string status = 1;
  string keyword = 2;
  int32 page = 3;
  int32 page_size = 4;
  // 所有人的会话（Agent 管理页，要有 agent:admin）；默认只有自己的
  bool all = 5;
}
message ListAgentSessionsResponse {
  repeated AgentSession sessions = 1;
  int64 total = 2;
  // 各状态的数量（不受 status 筛选影响，受 keyword 影响）
  int64 count_all = 3;
  int64 count_running = 4;
  int64 count_waiting = 5;
  int64 count_idle = 6;
  int64 count_error = 7;
  int64 count_archived = 8;
  // 这一页会话的主人
  repeated AgentUser users = 9;
  // 这一页每个会话复刻出来（没移到外层）的会话数
  map<string, int32> fork_counts = 10;
}

// 附件：图片和文件随消息上传，工作区里的文件用路径引用
message AgentAttachment {
  // image | file | paste（粘贴的一大段文字，存成会话临时目录里的文本文件）| ref | snippet（打开的文件里选中的一段）
  string kind = 1;
  // snippet 是「路径:起止行」
  string name = 2;
  string mime = 3;
  // image / file / paste 的内容；snippet 是选中的文字
  bytes data = 4;
  // ref / snippet：相对会话目录的路径
  string path = 5;
}

message CreateAgentSessionRequest {
  // 空 = 不用工作区，在临时目录里运行
  string workspace_id = 1;
  repeated string extra_dirs = 2;
  // 在独立工作树里运行
  bool worktree = 3;
  string runtime_id = 4;
  string provider_id = 5;
  string model = 6;
  string effort = 7;
  string mode = 8;
  repeated string mcp_ids = 9;
  string text = 10;
  repeated AgentAttachment attachments = 11;
  // Turbo（见 AgentRuntimeOptions.unrestricted）
  bool unrestricted = 12;
}
message CreateAgentSessionResponse {
  AgentSession session = 1;
}

message GetAgentSessionRequest {
  string id = 1;
}
message GetAgentSessionResponse {
  AgentSession session = 1;
  AgentSessionDetail detail = 2;
}

message GetAgentSessionProcessRequest {
  string id = 1;
}
// 会话没有进程在跑时 process 为空
message GetAgentSessionProcessResponse {
  AgentProcess process = 1;
}

message PromptAgentSessionRequest {
  string id = 1;
  string text = 2;
  repeated AgentAttachment attachments = 3;
  // 一轮还没结束时：steer 插进正在做的事里（ACP v2，capabilities.steer），queue 排队、等这一轮结束再发；空同 steer
  string mode = 4;
}
message PromptAgentSessionResponse {}

message CancelAgentSessionRequest {
  string id = 1;
}
message CancelAgentSessionResponse {}

message StopAgentSessionItemRequest {
  string id = 1;
  // 工具调用所在的子 Agent 会话 id，主会话为空；只停子 Agent 时是它的会话 id
  string sub = 2;
  // 要停的工具调用 id；为空表示停 sub 这个子 Agent
  string tool_id = 3;
}
message StopAgentSessionItemResponse {}

message DeleteAgentQueuedPromptRequest {
  string id = 1;
  string queue_id = 2;
}
message DeleteAgentQueuedPromptResponse {}

message SendAgentQueuedPromptRequest {
  string id = 1;
  string queue_id = 2;
}
message SendAgentQueuedPromptResponse {}

message ResolveAgentPermissionRequest {
  string id = 1;
  string request_id = 2;
  // Agent 给的选项之一
  string option_id = 3;
}
message ResolveAgentPermissionResponse {}

message SetAgentSessionOptionRequest {
  string id = 1;
  // mode | model | effort
  string kind = 2;
  string value = 3;
  // kind = model 时：模型所属的供应商
  string provider_id = 4;
}
message SetAgentSessionOptionResponse {
  AgentSession session = 1;
}

message RenameAgentSessionRequest {
  string id = 1;
  string title = 2;
}
message RenameAgentSessionResponse {}

message ForkAgentSessionRequest {
  string id = 1;
  bool worktree = 2;
}
message ForkAgentSessionResponse {
  AgentSession session = 1;
}

message DetachAgentSessionRequest {
  string id = 1;
}
message DetachAgentSessionResponse {}

message ArchiveAgentSessionsRequest {
  repeated string ids = 1;
  bool archived = 2;
}
message ArchiveAgentSessionsResponse {
  int32 changed = 1;
  // 还在运行、没有归档的数量
  int32 skipped = 2;
}

message DeleteAgentSessionsRequest {
  repeated string ids = 1;
  // 连同复刻出来的会话一起删；否则把它们移到外层保留
  bool with_forks = 2;
}
message DeleteAgentSessionsResponse {
  int32 deleted = 1;
}

message PurgeAgentSessionsRequest {}
message PurgeAgentSessionsResponse {
  int32 deleted = 1;
}

message ExportAgentSessionsRequest {
  repeated string ids = 1;
}
message ExportAgentSessionsResponse {
  repeated AgentSessionExport sessions = 1;
}

message AgentSessionExport {
  AgentSession session = 1;
  // 这个会话的全部事件（JSON 数组，和 WebSocket 里的事件同一个格式）
  string events = 2;
}

// —— Git ——

// 改动列表里的一个文件（路径都相对仓库，正斜杠）
message AgentGitFile {
  string path = 1;
  // 改名、复制前的路径
  string orig_path = 2;
  // M 修改 | A 新增 | D 删除 | R 改名 | C 复制 | T 类型变了 | U 没跟踪；冲突的是两边的状态（UU、AA、DU……）
  string kind = 3;
  int32 added = 4;
  int32 deleted = 5;
  // 不是文本，没有增删行数
  bool binary = 6;
}

// 一个仓库的状态
message AgentGitStatus {
  // 仓库相对会话目录的路径；会话目录本身是仓库时为空
  string repo = 1;
  // 当前分支；游离 HEAD 时为空
  string branch = 2;
  // HEAD 的短哈希；还没有提交时为空
  string head = 3;
  string upstream = 4;
  // 上游分支已经在远程上删掉了
  bool upstream_gone = 5;
  int32 ahead = 6;
  int32 behind = 7;
  // 进行中的操作：merge | rebase | am | cherry-pick | revert | bisect，没有为空
  string operation = 8;
  // 合并进来的分支、拣选 / 还原的提交，或者正在变基的分支
  string operation_ref = 9;
  // 变基到的提交
  string operation_onto = 10;
  // 变基进行到第几个、一共几个
  int32 operation_step = 11;
  int32 operation_total = 12;
  repeated AgentGitFile staged = 13;
  // 工作区的改动，包括没跟踪的新文件
  repeated AgentGitFile unstaged = 14;
  repeated AgentGitFile conflicted = 15;
  int32 stashes = 16;
  repeated string remotes = 17;
  // 改动的文件太多，只列了前面一部分
  bool truncated = 18;
  // 上一次提交的完整说明（修改上一次提交时放进输入框）
  string last_message = 19;
}
message GetAgentGitStatusRequest {
  string id = 1;
}
message GetAgentGitStatusResponse {
  // 会话目录本身是仓库时只有它一个；否则是它下面几层里找到的仓库；都没有时为空
  repeated AgentGitStatus repos = 1;
}

message GetAgentGitDiffRequest {
  string id = 1;
  string repo = 2;
  string path = 3;
  // 改名前的路径（暂存区里的改名、提交里的改名）
  string orig_path = 4;
  // unstaged（工作区相对暂存区）| staged（暂存区相对 HEAD）| conflict（冲突的文件现在的内容）|
  // commit（某次提交相对它的第一个父提交）| stash（某个储藏）| head（整个仓库相对 HEAD 的补丁，path 为空）
  string source = 5;
  // commit、stash 时的哈希
  string ref = 6;
}
message GetAgentGitDiffResponse {
  // 从 @@ 开始的各段；head 时是带文件头的完整补丁
  string patch = 1;
  bool binary = 2;
  // 太大，没给
  bool too_large = 3;
}

message UpdateAgentGitFilesRequest {
  string id = 1;
  string repo = 2;
  // stage | unstage | discard | ours（采用当前）| theirs（采用传入）| resolve（标记已解决）| ignore（加进 .gitignore）
  string action = 3;
  repeated string paths = 4;
  // stage、unstage、discard 时对全部文件
  bool all = 5;
}
message UpdateAgentGitFilesResponse {}

message ApplyAgentGitLinesRequest {
  string id = 1;
  string repo = 2;
  string path = 3;
  // stage（从工作区的 diff 暂存）| unstage（从暂存区的 diff 取消暂存）| discard（撤销工作区里的这几行）
  string action = 4;
  // 页面上显示的那份 diff（从 @@ 开始）；文件在这期间又改过的话 git 会拒绝
  string patch = 5;
  // 选中的行：patch 按换行拆开后的序号（只算 + 和 - 行）
  repeated int32 lines = 6;
}
message ApplyAgentGitLinesResponse {}

message CommitAgentGitRequest {
  string id = 1;
  string repo = 2;
  string message = 3;
  // 修改上一次提交；说明为空时沿用原来的
  bool amend = 4;
  // 先暂存全部改动
  bool all = 5;
  // 不跑提交钩子
  bool no_verify = 6;
  // 加上 Signed-off-by
  bool signoff = 7;
}
message CommitAgentGitResponse {
  // 新提交的短哈希
  string head = 1;
}

message GenerateAgentGitMessageRequest {
  string id = 1;
  string repo = 2;
}
message GenerateAgentGitMessageResponse {
  string message = 1;
}

message ResetAgentGitRequest {
  string id = 1;
  string repo = 2;
  // 提交：哈希、HEAD~1……
  string target = 3;
  // soft（改动留在暂存区）| mixed（留在工作区）| hard（全部丢掉）
  string mode = 4;
}
message ResetAgentGitResponse {}

message AgentGitBranch {
  // 本地分支名，或者远程分支的「远程/分支」
  string name = 1;
  // 指向的提交（短哈希）和它的说明、时间
  string commit = 2;
  string subject = 3;
  google.protobuf.Timestamp date = 4;
  bool current = 5;
  string upstream = 6;
  bool upstream_gone = 7;
  int32 ahead = 8;
  int32 behind = 9;
}
message AgentGitTag {
  string name = 1;
  string commit = 2;
  // 附注标签的说明，轻量标签是它指向的提交的说明
  string subject = 3;
  google.protobuf.Timestamp date = 4;
}
message AgentGitRemote {
  string name = 1;
  string fetch_url = 2;
  string push_url = 3;
}
message ListAgentGitRefsRequest {
  string id = 1;
  string repo = 2;
}
message ListAgentGitRefsResponse {
  // 当前分支在前，其余按最近提交
  repeated AgentGitBranch branches = 1;
  repeated AgentGitBranch remote_branches = 2;
  repeated AgentGitTag tags = 3;
  repeated AgentGitRemote remotes = 4;
}

message UpdateAgentGitRefRequest {
  string id = 1;
  string repo = 2;
  // checkout | create-branch | rename-branch | delete-branch | delete-remote-branch | merge | rebase |
  // create-tag | delete-tag | push-tag | delete-remote-tag
  string action = 3;
  // 分支、标签名；checkout 时也可以是远程分支、提交哈希
  string name = 4;
  // 改名后的名字
  string new_name = 5;
  // 新建分支、标签时从哪开始（空 = HEAD）
  string from = 6;
  // 新建分支后切过去
  bool checkout = 7;
  // 删除没合并过的分支
  bool force = 8;
  // 附注标签的说明（空 = 轻量标签）
  string message = 9;
  // 推送 / 删除远程标签时用哪个远程（空 = 默认的）
  string remote = 10;
}
message UpdateAgentGitRefResponse {
  // git 说的话（合并、变基的结果）
  string output = 1;
}

message SyncAgentGitRequest {
  string id = 1;
  string repo = 2;
  // fetch | pull | push
  string action = 3;
  // 远程；fetch 时为空是全部，push 时为空是上游的（没有上游时是默认的）
  string remote = 4;
  // pull：merge | rebase | ff-only，空 = 按仓库的设置（没设过用 merge）
  string mode = 5;
  // push：强制推送（--force-with-lease，远程上有别人新推的提交时会拒绝）
  bool force = 6;
  // push：连同标签
  bool tags = 7;
}
