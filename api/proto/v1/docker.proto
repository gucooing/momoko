message DeleteDockerNetworkResponse {}

// 连接容器到网络请求
message ConnectDockerNetworkRequest {
  // 网络ID或名称
  string network_id = 1;
  // 容器ID或名称
  string container_id = 2;
  // 网络别名
  repeated string aliases = 3;
  // 固定IPv4地址
  string ipv4_address = 4;
  // 固定IPv6地址
  string ipv6_address = 5;
}

// 连接容器到网络响应
message ConnectDockerNetworkResponse {}

// 断开容器网络请求
message DisconnectDockerNetworkRequest {
  // 网络ID或名称
  string network_id = 1;
  // 容器ID或名称
  string container_id = 2;
  // 是否强制断开
  bool force = 3;
}

// 断开容器网络响应
message DisconnectDockerNetworkResponse {}

// 网络创建参数
message DockerNetworkCreateOptions {
  // 网络名称
  string name = 1;
  // 网络驱动
  string driver = 2;
  // 作用域
  string scope = 3;
  // 是否启用IPv4
  optional bool enable_ipv4 = 4;
  // 是否启用IPv6
  optional bool enable_ipv6 = 5;
  // 是否内部网络
  bool internal = 6;
  // 是否可附加
  bool attachable = 7;
  // 是否入口网络
  bool ingress = 8;
  // IPAM配置
  DockerIPAM ipam = 9;
  // 驱动参数
  map<string, string> options = 10;
  // 标签
  map<string, string> labels = 11;
}

// 网络详情
message DockerNetworkInfo {
  // 网络ID
  string id = 1;
  // 网络名称
  string name = 2;
  // 创建时间
  string created = 3;
  // 作用域
  string scope = 4;
  // 驱动
  string driver = 5;
  // 是否启用IPv4
  bool enable_ipv4 = 6;
  // 是否启用IPv6
  bool enable_ipv6 = 7;
  // 是否内部网络
  bool internal = 8;
  // 是否可附加
  bool attachable = 9;
  // 是否入口网络
  bool ingress = 10;
  // IPAM配置
  DockerIPAM ipam = 11;
  // 已连接容器
  map<string, DockerNetworkContainer> containers = 12;
  // 驱动参数
  map<string, string> options = 13;
  // 标签
  map<string, string> labels = 14;
  // 是否 Docker 内置网络（bridge / host / none 等，不能删除或重建）
  bool builtin = 15;
}

// IPAM配置
message DockerIPAM {
  // 驱动
  string driver = 1;
  // 参数
  map<string, string> options = 2;
  // 地址配置
  repeated DockerIPAMConfig config = 3;
}

// IPAM地址配置
message DockerIPAMConfig {
  // 子网
  string subnet = 1;
  // IP范围
  string ip_range = 2;
  // 网关
  string gateway = 3;
  // 辅助地址
  map<string, string> aux_address = 4;
}

// 网络容器
message DockerNetworkContainer {
  // 容器名称
  string name = 1;
  // 端点ID
  string endpoint_id = 2;
  // MAC地址
  string mac_address = 3;
  // IPv4地址
  string ipv4_address = 4;
  // IPv6地址
  string ipv6_address = 5;
  // 容器状态（running / exited ...）
  string state = 6;
  // 网络别名
  repeated string aliases = 7;
}
