name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version. Leave empty to use VERSION."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease."
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: momoko
  DOCKERHUB_IMAGE: gucooing/momoko
  GHCR_IMAGE: ghcr.io/gucooing/momoko
  GO_VERSION: "1.26.3"
  NODE_VERSION: "25.9.0"
  PNPM_VERSION: "10.30.3"

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      version_no_v: ${{ steps.version.outputs.version_no_v }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease || 'true' }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="$(tr -d '[:space:]' < VERSION)"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version"
            echo "Expected a semantic version like v0.0.1 or v0.0.1-dev."
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            prerelease="$INPUT_PRERELEASE"
          elif [[ "$version" == *-* ]]; then
            prerelease="true"
          else
            prerelease="false"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_no_v=${version#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  binaries:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs:
      - prepare
      - frontend

    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin-amd64
          - darwin-arm64
          - windows-amd64
          - windows-arm64
          - linux-amd64
          - linux-arm64
          - linux-ppc64le
          - linux-riscv64
          - linux-s390x
          - netbsd-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build binary
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          goos="${TARGET%-*}"
          goarch="${TARGET##*-}"
          ext=""
          archive_ext="tar.gz"
          if [ "$goos" = "windows" ]; then
            ext=".exe"
            archive_ext="zip"
          fi

          mkdir -p release
          dir="${APP_NAME}_${VERSION}_${TARGET}"
          mkdir -p "release/$dir/configs"
          cp configs/*.yaml "release/$dir/configs/"
          cp README.md LICENSE "release/$dir/"

          CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
            -trimpath \
            -ldflags="-s -w -X main.Name=${APP_NAME} -X main.Version=${VERSION}" \
            -o "release/$dir/${APP_NAME}${ext}" \
            ./cmd/momoko

          if [ "$archive_ext" = "zip" ]; then
            (cd release && zip -qr "${dir}.zip" "$dir")
          else
            tar -C release -czf "release/${dir}.tar.gz" "$dir"
          fi

          rm -rf "release/$dir"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ needs.prepare.outputs.version }}-${{ matrix.target }}
          path: release/*.*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - binaries

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.APP_NAME }}-${{ needs.prepare.outputs.version }}-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          (cd release && sha256sum * > "${APP_NAME}_${VERSION}_checksums.txt")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Momoko ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          generate_release_notes: true
          files: release/*

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.version_no_v }}
            type=raw,value=dev,enable=${{ contains(needs.prepare.outputs.version, '-') }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NAME=${{ env.APP_NAME }}
            VERSION=${{ needs.prepare.outputs.version }}
