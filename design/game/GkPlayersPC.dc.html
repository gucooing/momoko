<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>学マス GM · 玩家 · PC</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./momoko-game.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--pInk)}a:hover{color:var(--ink)}
.hint{font-size:12px;color:var(--ink2);line-height:1.5}
.bulk-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--bg);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.bulk-btn:hover{background:color-mix(in srgb, var(--bg) 14%, transparent)}
</style>
</helmet>
<div class="root th-{{palette}}-{{mode}} gk-{{mode}}" style="min-height: 1240px; display: flex; flex-wrap: wrap; align-items: stretch">

  <aside style="flex: 1 1 248px; max-width: 100%; background: var(--s); border-right: 1px solid var(--line); padding: 20px 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 4px 8px">
      <div style="width: 40px; height: 40px; border-radius: 13px; background: var(--p); color: var(--pOn); display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 800; transform: rotate(-6deg)">M</div>
      <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.01em">Momoko</span>
    </div>
    <button style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 8px 12px; border-radius: 16px; border: 1.5px dashed var(--line); background: var(--bg); font: inherit; color: var(--ink); cursor: pointer; text-align: left">
      <span class="av av-a2" style="width: 36px; height: 36px; border-radius: 11px"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.server}}"></path></svg></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-size: 11px; font-weight: 700; color: var(--ok)">● 本机 · 在线</span>
        <span style="font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">DESKTOP-K5K9BBC</span>
      </span>
      <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ink2)"><path d="{{i.updown}}"></path></svg>
    </button>
    <nav aria-label="主导航" style="display: flex; flex-direction: column; gap: 14px; flex: 1">
      <sc-for list="{{nav}}" as="g" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <sc-if value="{{g.title}}" hint-placeholder-val="{{true}}">
            <div class="lbl" style="padding: 0 12px 4px">{{g.title}}</div>
          </sc-if>
          <sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
            <a class="nav {{n.cls}}" href="{{n.href}}">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{n.d}}"></path></svg>
              <span style="flex: 1">{{n.t}}</span>
              <sc-if value="{{n.badge}}" hint-placeholder-val="{{false}}"><span class="gtag" style="height: 20px; padding: 0 7px; font-size: 11px">{{n.badge}}</span></sc-if>
            </a>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 18px; background: var(--bg)">
      <span class="av av-a" style="width: 40px; height: 40px; border-radius: 50%; font-size: 16px">超</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-size: 14px; font-weight: 700">超级管理员</span>
        <span style="font-size: 12px; color: var(--ink2)">设置 · 语言 · 退出</span>
      </span>
      <button class="ib ib-sm" aria-label="账号菜单"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="{{i.more}}"></path></svg></button>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; padding: 24px 32px 40px; display: flex; flex-direction: column; gap: 20px; position: relative">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
      <button style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 14px 6px 6px; border-radius: 999px; border: 1.5px solid var(--gLine); background: var(--gSoft); font: inherit; color: var(--ink); cursor: pointer" aria-label="切换服务器：当前 学マス · 正式服">
        <img src="./assets/hatsuboshi-logo.webp" alt="" style="width: 40px; height: 40px; border-radius: 50%; background: var(--s)">
        <span style="display: flex; flex-direction: column; align-items: flex-start"><span style="font-size: 15px; font-weight: 800">学マス · 正式服</span><span style="font-size: 12px; color: var(--gInk); font-weight: 700">托管 · 在线 12 · MGP 正常</span></span>
        <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--gInk)"><path d="{{i.updown}}"></path></svg>
      </button>
      <span style="flex: 1"></span>
      <button class="ib" aria-label="切换深浅色" onClick="{{toggleDark}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{modeIcon}}"></path></svg></button>
      <button class="ib" aria-label="通知"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.bell}}"></path></svg><span class="dot"></span></button>
    </div>

    <nav aria-label="GM 运营" class="hs" style="display: flex; gap: 6px; overflow-x: auto; padding: 6px; border-radius: 999px; background: var(--s); border: 1px solid var(--line); align-self: flex-start; max-width: 100%">
      <sc-for list="{{gtabs}}" as="t" hint-placeholder-count="10">
        <a class="gtab {{t.cls}}" href="{{t.href}}"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{t.d}}"></path></svg>{{t.t}}</a>
      </sc-for>
    </nav>

    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px">
      <div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.01em">玩家</h1>
        <div style="font-size: 14px; color: var(--ink2)">共 86 个账号 · <span style="color: var(--ok); font-weight: 700">12 人在线</span> · 55 人已绑定通行证</div>
      </div>
      <button class="btn btn-o"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.download}}"></path></svg>导出</button>
      <a class="btn btn-g" href="GkPlayerPC.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.gift}}"></path></svg>发送礼物</a>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
      <div role="tablist" aria-label="筛选玩家" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
          <button class="chip {{f.cls}}" role="tab" aria-selected="{{f.on}}" onClick="{{f.pick}}">{{f.t}} <span class="n num">{{f.n}}</span></button>
        </sc-for>
      </div>
      <span style="flex: 1"></span>
      <label class="inp" style="flex: 0 1 320px; min-height: 40px">
        <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.search}}"></path></svg>
        <input type="search" placeholder="账号、User ID、昵称、通行证" aria-label="搜索玩家">
      </label>
      <button class="chip">排序：最后登录<svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.chevD}}"></path></svg></button>
    </div>

    <div class="card" style="overflow-x: auto">
      <div style="min-width: 1040px">
        <div class="row row-h" style="grid-template-columns: 28px minmax(0, 1.6fr) 90px 130px minmax(0, 1fr) 130px 110px 150px">
          <input class="cb" type="checkbox" aria-label="全选" checked="{{allSel}}" onChange="{{toggleAll}}"><span>玩家</span><span>制作人等级</span><span>钻石（免费 / 付费）</span><span>通行证</span><span>最后登录</span><span>状态</span><span style="text-align: right">操作</span>
        </div>
        <sc-for list="{{players}}" as="p" hint-placeholder-count="10">
          <div class="row" style="grid-template-columns: 28px minmax(0, 1.6fr) 90px 130px minmax(0, 1fr) 130px 110px 150px; min-height: 68px; background: {{p.rowBg}}">
            <input class="cb" type="checkbox" checked="{{p.sel}}" onChange="{{p.toggle}}" aria-label="选择 {{p.n}}">
            <a href="GkPlayerPC.dc.html" style="display: flex; align-items: center; gap: 12px; min-width: 0; text-decoration: none; color: var(--ink)">
              <span style="position: relative; flex: none"><img src="{{p.img}}" alt="担当：{{p.chara}}" style="width: 44px; height: 44px; border-radius: 50%; display: block"><sc-if value="{{p.online}}" hint-placeholder-val="{{true}}"><span style="position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--ok); border: 2px solid var(--s)"></span></sc-if></span>
              <span style="min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{p.n}}</span><span class="num hint">ID {{p.id}} · {{p.acc}}</span></span>
            </a>
            <span class="num" style="font-weight: 800; font-size: 16px">{{p.lv}}</span>
            <span style="display: flex; align-items: center; gap: 6px"><img src="./assets/item-jewel-free.webp" alt="" style="width: 22px; height: 22px"><span class="num" style="font-weight: 700">{{p.jf}}</span><span class="num hint">/ {{p.jp}}</span></span>
            <span style="min-width: 0">
              <sc-if value="{{p.pp}}" hint-placeholder-val="{{true}}"><a href="PassportPC.dc.html" style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; text-decoration: none"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.link}}"></path></svg>{{p.pp}}</a></sc-if>
              <sc-if value="{{p.noPp}}" hint-placeholder-val="{{false}}"><span class="hint">未绑定</span></sc-if>
            </span>
            <span style="display: flex; flex-direction: column"><span class="num" style="font-size: 13px; font-weight: 600">{{p.last}}</span><span class="hint">{{p.dev}}</span></span>
            <span class="pill {{p.st}}" style="justify-self: start">{{p.stT}}</span>
            <span style="display: flex; justify-content: flex-end; gap: 2px">
              <a class="ib ib-sm" href="GkPlayerPC.dc.html" aria-label="给 {{p.n}} 发送礼物"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.gift}}"></path></svg></a>
              <button class="ib ib-sm" aria-label="强制 {{p.n}} 下线" disabled="{{p.offline}}" style="color: {{p.kickC}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.logout}}"></path></svg></button>
              <a class="ib ib-sm" href="GkPlayerPC.dc.html" aria-label="查看 {{p.n}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.eye}}"></path></svg></a>
              <button class="ib ib-sm" aria-label="{{p.n}} 更多操作"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="{{i.more}}"></path></svg></button>
            </span>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink2)">
      <span style="flex: 1">显示 1–10，共 86 个</span>
      <div class="seg"><button aria-label="上一页"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.chevL}}"></path></svg></button><button class="on num">1</button><button class="num">2</button><button class="num">3</button><button class="num">…</button><button class="num">9</button><button aria-label="下一页"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.chevR}}"></path></svg></button></div>
    </div>

    <sc-if value="{{hasSel}}" hint-placeholder-val="{{true}}">
      <div style="position: sticky; bottom: 24px; align-self: center; display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 20px; border-radius: 999px; background: var(--ink); color: var(--bg); box-shadow: 0 16px 40px -12px rgba(20,10,30,.45)">
        <span style="font-size: 14px; font-weight: 700; margin-right: 10px">已选 <span class="num">{{selCount}}</span> 名玩家</span>
        <a class="bulk-btn" href="GkPlayerPC.dc.html" style="text-decoration: none"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.gift}}"></path></svg>发送礼物</a>
        <button class="bulk-btn"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.logout}}"></path></svg>强制下线</button>
        <button class="bulk-btn"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.download}}"></path></svg>导出存档</button>
        <button class="bulk-btn" style="color: var(--a)"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.ban}}"></path></svg>封禁</button>
        <button class="bulk-btn" aria-label="取消选择" onClick="{{clearSel}}" style="width: 40px; padding: 0; justify-content: center"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.x}}"></path></svg></button>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>

    { title: '游戏', items: [{ t: '游戏服务器', d: IC.gamepad, href: 'GameServersPC.dc.html', key: 'gs' }, { t: 'GM 运营', d: IC.wand, href: 'GkHomePC.dc.html', key: 'gm', badge: '学マス' }, { t: '用户通行证', d: IC.idcard, href: 'PassportPC.dc.html', key: 'pp' }] },
