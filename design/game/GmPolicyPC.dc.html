<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>GM 运营 · 玩家自助</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./momoko-game.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--pInk)}a:hover{color:var(--ink)}
.hint{font-size:12px;color:var(--ink2);line-height:1.5}
.bulk-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--bg);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.bulk-btn:hover{background:color-mix(in srgb, var(--bg) 14%, transparent)}

.cr{display:grid;grid-template-columns:44px minmax(0,1.7fr) 96px minmax(0,1.2fr) 110px 36px;gap:14px;align-items:center;min-height:72px;padding:0 18px;border-top:1px solid var(--line)}
.cr-h{min-height:40px;border-top:0;font-size:12px;font-weight:700;color:var(--ink2)}
.cr-on{background:var(--gSoft)}
.ex{display:flex;flex-wrap:wrap;gap:20px;padding:4px 18px 20px 76px;background:var(--gSoft)}
.fl{display:flex;flex-direction:column;gap:6px}
.fl>span:first-child{font-size:13px;font-weight:700}
.stp{display:inline-flex;align-items:center;border-radius:999px;border:1.5px solid var(--line);background:var(--s);overflow:hidden}
.stp button{width:36px;height:36px;border:0;background:transparent;font:inherit;font-size:18px;color:var(--ink);cursor:pointer}
.stp span{min-width:34px;text-align:center;font-weight:800}
.lim{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}

</style>
</helmet>
<div class="root th-{{palette}}-{{mode}} gk-{{mode}}" style="min-height: 1240px; display: flex; flex-wrap: wrap; align-items: stretch">

  <aside style="flex: 1 1 248px; max-width: 100%; background: var(--s); border-right: 1px solid var(--line); padding: 20px 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 4px 8px">
      <div style="width: 40px; height: 40px; border-radius: 13px; background: var(--p); color: var(--pOn); display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 800; transform: rotate(-6deg)">M</div>
      <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.01em">Momoko</span>
    </div>
    <button style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 8px 12px; border-radius: 16px; border: 1.5px dashed var(--line); background: var(--bg); font: inherit; color: var(--ink); cursor: pointer; text-align: left">
      <span class="av av-a2" style="width: 36px; height: 36px; border-radius: 11px"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.server}}"></path></svg></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-size: 11px; font-weight: 700; color: var(--ok)">● 本机 · 在线</span>
        <span style="font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">DESKTOP-K5K9BBC</span>
      </span>
      <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ink2)"><path d="{{i.updown}}"></path></svg>
    </button>
    <nav aria-label="主导航" style="display: flex; flex-direction: column; gap: 14px; flex: 1">
      <sc-for list="{{nav}}" as="g" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <sc-if value="{{g.title}}" hint-placeholder-val="{{true}}">
            <div class="lbl" style="padding: 0 12px 4px">{{g.title}}</div>
          </sc-if>
          <sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
            <a class="nav {{n.cls}}" href="{{n.href}}">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{n.d}}"></path></svg>
              <span style="flex: 1">{{n.t}}</span>
              <sc-if value="{{n.badge}}" hint-placeholder-val="{{false}}"><span class="gtag" style="height: 20px; padding: 0 7px; font-size: 11px">{{n.badge}}</span></sc-if>
            </a>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 18px; background: var(--bg)">
      <span class="av av-a" style="width: 40px; height: 40px; border-radius: 50%; font-size: 16px">超</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-size: 14px; font-weight: 700">超级管理员</span>
        <span style="font-size: 12px; color: var(--ink2)">设置 · 语言 · 退出</span>
      </span>
      <button class="ib ib-sm" aria-label="账号菜单"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="{{i.more}}"></path></svg></button>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; padding: 24px 32px 40px; display: flex; flex-direction: column; gap: 20px; position: relative">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
      <button style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 14px 6px 6px; border-radius: 999px; border: 1.5px solid var(--gLine); background: var(--gSoft); font: inherit; color: var(--ink); cursor: pointer" aria-label="切换服务器：当前 学マス · 正式服">
        <img src="./assets/hatsuboshi-logo.webp" alt="" style="width: 40px; height: 40px; border-radius: 50%; background: var(--s)">
        <span style="display: flex; flex-direction: column; align-items: flex-start"><span style="font-size: 15px; font-weight: 800">学マス · 正式服</span><span style="font-size: 12px; color: var(--gInk); font-weight: 700">托管 · 在线 12 · MGP 正常</span></span>
        <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--gInk)"><path d="{{i.updown}}"></path></svg>
      </button>
      <span style="flex: 1"></span>
      <button class="ib" aria-label="切换深浅色" onClick="{{toggleDark}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{modeIcon}}"></path></svg></button>
      <button class="ib" aria-label="通知"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.bell}}"></path></svg><span class="dot"></span></button>
    </div>

    <nav aria-label="GM 运营" class="hs" style="display: flex; gap: 6px; overflow-x: auto; padding: 6px; border-radius: 999px; background: var(--s); border: 1px solid var(--line); align-self: flex-start; max-width: 100%">
      <sc-for list="{{gtabs}}" as="t" hint-placeholder-count="10">
        <a class="gtab {{t.cls}}" href="{{t.href}}"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{t.d}}"></path></svg>{{t.t}}</a>
      </sc-for>
    </nav>

    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px">
      <div style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.01em">玩家自助</h1>
        <div style="font-size: 14px; color: var(--ink2)">玩家在通行证「自助服务」里能执行的 GM 指令 · <span style="color: var(--ok); font-weight: 700">已开放 {{openCount}} 条</span> · 改完立即生效</div>
      </div>
    </div>


    <section class="card" style="overflow-x: auto">
      <div style="min-width: 880px">
        <div class="cr cr-h"><span></span><span>指令</span><span>开放给玩家</span><span>限制</span><span>需要我审批</span><span></span></div>
        <sc-for list="{{cmds}}" as="c" hint-placeholder-count="8">
          <div>
            <div class="cr {{c.rowCls}}">
              <sc-if value="{{c.img}}" hint-placeholder-val="{{true}}"><img src="{{c.img}}" alt="" style="width: 44px; height: 44px; border-radius: {{c.r}}; object-fit: cover"></sc-if>
              <sc-if value="{{c.d}}" hint-placeholder-val="{{false}}"><span class="av {{c.av}}" style="width: 44px; height: 44px; border-radius: 14px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{c.d}}"></path></svg></span></sc-if>
              <span style="min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 800">{{c.t}}</span><span class="hint" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{c.s}}</span></span>
              <span><input class="tg" type="checkbox" checked="{{c.open}}" onChange="{{c.toggle}}" aria-label="{{c.t}} 开放给玩家"></span>
              <span class="lim"><sc-for list="{{c.rules}}" as="r" hint-placeholder-count="2"><span class="tag">{{r}}</span></sc-for><sc-if value="{{c.closed}}" hint-placeholder-val="{{false}}"><span class="hint">未开放</span></sc-if></span>
              <span><input class="tg tg-sm" type="checkbox" checked="{{c.appr}}" disabled="{{c.closed}}" aria-label="{{c.t}} 需要我审批"></span>
              <button class="ib ib-sm" onClick="{{c.pick}}" aria-label="编辑 {{c.t}}" aria-expanded="{{c.on}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{c.chev}}"></path></svg></button>
            </div>
            <sc-if value="{{c.on}}" hint-placeholder-val="{{false}}">
              <div class="ex">
                <div class="fl"><span>每个玩家每天</span><span style="display: flex; align-items: center; gap: 10px"><span class="stp"><button aria-label="减少">−</button><span class="num">3</span><button aria-label="增加">+</button></span><span class="hint">次</span></span></div>
                <div class="fl"><span>两次之间至少间隔</span><div class="seg"><button>不限</button><button class="on">1 小时</button><button>6 小时</button><button>24 小时</button></div></div>
                <label class="fl" style="flex: 1 1 280px"><span>玩家看到的说明</span><span class="inp inp-sq"><input type="text" placeholder="{{c.note}}" aria-label="玩家看到的说明"></span></label>
                <div style="flex: 0 0 280px; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 20px; background: var(--s); border: 1.5px solid var(--gLine)">
                  <sc-if value="{{c.img}}" hint-placeholder-val="{{true}}"><img src="{{c.img}}" alt="" style="width: 44px; height: 44px; flex: none; border-radius: {{c.r}}"></sc-if><sc-if value="{{c.d}}" hint-placeholder-val="{{false}}"><span class="av {{c.av}}" style="width: 44px; height: 44px; border-radius: 14px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{c.d}}"></path></svg></span></sc-if>
                  <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 800">{{c.t}}</span><span style="font-size: 12px; color: var(--gInk); font-weight: 700">{{c.pv}}</span><span class="hint">玩家端预览</span></span>
                  <span class="btn btn-g btn-sm" style="pointer-events: none">{{c.btn}}</span>
                </div>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </section>

    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 18px; background: var(--s2); font-size: 13px; line-height: 1.7; color: var(--ink2)">
      <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; margin-top: 3px"><path d="{{i.info}}"></path></svg>
      <span>只列出服务端声明「允许玩家自助」的指令。玩家执行时目标固定是自己绑定的游戏账号；需要审批的申请在 <a href="GkLogPC.dc.html">GM 记录</a> 里处理。</span>
    </div>

  </main>
</div>
</x-dc>

function pageVals(self, st) {
  const openMap = st.openMap || {};
  const cur = st.cur === undefined ? 'ap' : st.cur;
  const list = CMDS.map((c) => {
    const open = openMap[c.k] != null ? openMap[c.k] : c.open;
    return { ...c, open, closed: !open, rules: open ? c.rules : [], appr: open && c.appr, on: c.k === cur, rowCls: c.k === cur ? 'cr-on' : '', chev: c.k === cur ? IC.chevD : IC.chevR,
      toggle: () => self.setState({ openMap: { ...openMap, [c.k]: !open } }), pick: () => self.setState({ cur: c.k === cur ? '' : c.k }) };
  });

}
