<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>通行证 · 首页 · 手机</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./momoko-game.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--pInk)}a:hover{color:var(--ink)}
.hint{font-size:12px;color:var(--ink2);line-height:1.5}
.bn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex:1;min-height:56px;border-radius:16px;color:var(--ink2);text-decoration:none;font-size:11px;font-weight:700}
.bn-on{color:var(--pInk)}
.gr{display:flex;align-items:center;gap:12px;min-height:60px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
</style>
</helmet>
<div class="root th-{{palette}}-{{mode}} gk-{{mode}}" style="width: 390px; min-height: 1600px; position: relative; display: flex; flex-direction: column">
  <header style="position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line)">
    <span style="width: 32px; height: 32px; border-radius: 10px; background: var(--p); color: var(--pOn); display: flex; align-items: center; justify-content: center; font-weight: 800; transform: rotate(-6deg)">M</span>
    <span style="flex: 1; font-size: 17px; font-weight: 800">用户通行证</span>
    <button class="ib" aria-label="切换深浅色" onClick="{{toggleDark}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{modeIcon}}"></path></svg></button>
    <button class="ib" aria-label="消息，2 条未读"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.bell}}"></path></svg><span class="dot"></span></button>
  </header>

  <div style="flex: 1; padding: 16px 16px 96px; display: flex; flex-direction: column; gap: 22px">
    <section class="card" style="padding: 18px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 14px">
        <span class="av av-p" style="width: 68px; height: 68px; border-radius: 22px; font-size: 30px; transform: rotate(-5deg); box-shadow: 4px 4px 0 var(--a)">G</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 22px; font-weight: 800">gucooing</span><span class="tag" style="height: 22px">玩家</span></span><span class="hint">@gucooing · 2026-10-02 加入</span></span>
      </div>
      <dl style="margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 12px 14px; border-radius: 16px; background: var(--s2)">
        <div><dt class="hint">邮箱</dt><dd style="margin: 0; font-size: 13px; font-weight: 700">已验证</dd></div>
        <div><dt class="hint">最近登录</dt><dd style="margin: 0; font-size: 13px; font-weight: 700">今天 21:12</dd></div>
      </dl>
      <a href="PassportAccountPC.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--warnSoft); color: var(--ink); text-decoration: none; font-size: 13px"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--warn)"><path d="{{i.alert}}"></path></svg><span style="flex: 1">两步验证还没开启</span><b style="color: var(--warn)">去开启</b></a>
    </section>

    <section style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center"><h2 style="margin: 0; font-size: 19px; font-weight: 800; flex: 1">我的游戏</h2><a class="btn btn-s btn-sm" href="PortalBindMobile.dc.html"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.plus}}"></path></svg>绑定</a></div>
      <article class="card" style="overflow: hidden">
        <div style="position: relative; height: 110px; background: var(--gSoft)"><img class="ph" src="./assets/meishi-live01.webp" alt="" style="width: 100%; height: 110px; object-position: 70% 40%"></div>
        <div style="padding: 0 16px 8px">
          <div style="display: flex; align-items: flex-end; gap: 12px; margin-top: -24px; position: relative; margin-bottom: 6px"><span style="width: 52px; height: 52px; border-radius: 16px; background: var(--s); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; box-shadow: 3px 3px 0 var(--g); flex: none"><img src="./assets/hatsuboshi-logo.webp" alt="" style="width: 40px; height: 40px"></span><span style="font-size: 16px; font-weight: 800; padding-bottom: 4px">学園アイドルマスター</span></div>
          <sc-for list="{{gk}}" as="a" hint-placeholder-count="2">
            <a class="gr" href="GameHomeMobile.dc.html"><img src="{{a.img}}" alt="" style="width: 40px; height: 40px; border-radius: 50%"><span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 800">{{a.server}}</span><span class="hint">{{a.who}}</span></span><sc-if value="{{a.badge}}" hint-placeholder-val="{{true}}"><span class="gtag" style="height: 22px; font-size: 11px">{{a.badge}}</span></sc-if><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ink2)"><path d="{{i.chevR}}"></path></svg></a>
          </sc-for>
        </div>
      </article>
      <article class="card" style="padding: 12px 16px 8px">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 6px"><span class="av av-ok" style="width: 52px; height: 52px; border-radius: 16px; font-size: 16px">MC</span><span style="font-size: 16px; font-weight: 800">Minecraft 基岩版</span></div>
        <a class="gr" href="GameHomeMobile.dc.html"><span class="av av-ok" style="width: 40px; height: 40px; border-radius: 50%">G</span><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 800">生存服</span><span class="hint">gucooing · 白名单已通过</span></span><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ink2)"><path d="{{i.chevR}}"></path></svg></a>
      </article>
    </section>

    <section style="display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 0 0 8px; font-size: 19px; font-weight: 800">消息</h2>
      <sc-for list="{{msgs}}" as="m" hint-placeholder-count="3">
        <div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line)"><img src="{{m.img}}" alt="" style="width: 34px; height: 34px; flex: none"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">{{m.t}}</span><span class="hint">{{m.src}} · {{m.at}}</span></span></div>
      </sc-for>
    </section>
  </div>

  <nav aria-label="通行证导航" style="position: sticky; bottom: 0; display: flex; gap: 4px; padding: 6px 8px 10px; background: var(--s); border-top: 1px solid var(--line)">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><a class="bn {{t.cls}}" href="{{t.href}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{t.d}}"></path></svg>{{t.t}}</a></sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["sakura","mint","volt","grape","sunset","classic"],"default":"sakura"},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1600}}'>
const IC = {
  sun: 'M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',
  moon: 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z',
  bell: 'M6 16v-5a6 6 0 1 1 12 0v5l2 2H4zM10 21h4',
  alert: 'M12 3 2 21h20zM12 10v5M12 18h.01',
  plus: 'M12 5v14M5 12h14',
  chevR: 'M9 6l6 6-6 6',
  home: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
  gamepad: 'M7 7h10a5 5 0 0 1 0 10h-3l-2-2-2 2H7A5 5 0 0 1 7 7zM7 10v4M5 12h4M16 11h.01M18 13h.01',
  mail: 'M3 5h18v14H3zM3 6l9 7 9-7',
  user: 'M12 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM4 21a8 8 0 0 1 16 0'
};
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const palette = this.props.palette ?? 'sakura';
    const dark = st.dark != null ? st.dark : (this.props.dark ?? false);
    return {
      palette,
      mode: dark ? 'dark' : 'light',
      i: IC,
      modeIcon: dark ? IC.sun : IC.moon,
      toggleDark: () => this.setState({ dark: !dark }),
      gk: [
        { server: '正式服', who: 'P_gucooing · PLv 52', img: './assets/chr-hski.webp', badge: '礼物 6' },
        { server: '测试服', who: 'gucooing_dev · PLv 3', img: './assets/chr-ttmr.webp', badge: '' }
      ],
      msgs: [
        { img: './assets/item-money.webp', t: '「金币 ×10,000」今天到期', src: '学マス · 正式服', at: '1 小时前' },
        { img: './assets/item-jewel-free.webp', t: '收到运营补偿 3 件', src: '学マス · 正式服', at: '22 分钟前' },
        { img: './assets/hatsuboshi-logo.webp', t: '「全部偶像卡」申请已通过', src: '学マス · 正式服', at: '11-03' }
      ],
      tabs: [['home', '首页', IC.home, 'PassportHomeMobile.dc.html'], ['games', '游戏', IC.gamepad, 'GameHomeMobile.dc.html'], ['msg', '消息', IC.mail, 'PassportHomeMobile.dc.html'], ['me', '账号', IC.user, 'PassportAccountPC.dc.html']].map(([k, t, d, href]) => ({ t, d, href, cls: k === 'home' ? 'bn-on' : '' }))
    };
  }
}
</script>
</body>
</html>
