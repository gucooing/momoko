<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>GM 运营 · 工作台</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./momoko-game.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--pInk)}a:hover{color:var(--ink)}
.hint{font-size:12px;color:var(--ink2);line-height:1.5}
.bulk-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--bg);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.bulk-btn:hover{background:color-mix(in srgb, var(--bg) 14%, transparent)}

.sec-h{display:flex;align-items:baseline;gap:12px}
.sec-h h2{margin:0;font-size:18px;font-weight:800;flex:1}
.more{font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap}
.today{display:flex;flex-wrap:wrap;align-items:center;gap:6px 28px;padding:14px 22px}
.today a{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink)}
.today b{font-size:22px;font-weight:800}
.todo{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.todo:first-of-type{border-top:0}
.next{display:grid;grid-template-columns:96px minmax(0,1fr) auto;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.next:first-of-type{border-top:0}
.next:hover .next-t{color:var(--pInk)}
.qa{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border-radius:16px;background:var(--s2);text-decoration:none;color:var(--ink);font-size:14px;font-weight:700}
.qa:hover{background:var(--pSoft);color:var(--pInk)}

</style>
</helmet>
<div class="root th-{{palette}}-{{mode}} gk-{{mode}}" style="min-height: 1040px; display: flex; flex-wrap: wrap; align-items: stretch">

  <aside style="flex: 1 1 248px; max-width: 100%; background: var(--s); border-right: 1px solid var(--line); padding: 20px 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 4px 8px">
      <div style="width: 40px; height: 40px; border-radius: 13px; background: var(--p); color: var(--pOn); display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 800; transform: rotate(-6deg)">M</div>
      <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.01em">Momoko</span>
    </div>
    <button style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 8px 12px; border-radius: 16px; border: 1.5px dashed var(--line); background: var(--bg); font: inherit; color: var(--ink); cursor: pointer; text-align: left">
      <span class="av av-a2" style="width: 36px; height: 36px; border-radius: 11px"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.server}}"></path></svg></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-size: 11px; font-weight: 700; color: var(--ok)">● 本机 · 在线</span>
        <span style="font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">DESKTOP-K5K9BBC</span>
      </span>
      <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ink2)"><path d="{{i.updown}}"></path></svg>
    </button>
    <nav aria-label="主导航" style="display: flex; flex-direction: column; gap: 14px; flex: 1">
      <sc-for list="{{nav}}" as="g" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <sc-if value="{{g.title}}" hint-placeholder-val="{{true}}">
            <div class="lbl" style="padding: 0 12px 4px">{{g.title}}</div>
          </sc-if>
          <sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
            <a class="nav {{n.cls}}" href="{{n.href}}">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{n.d}}"></path></svg>
              <span style="flex: 1">{{n.t}}</span>
              <sc-if value="{{n.badge}}" hint-placeholder-val="{{false}}"><span class="gtag" style="height: 20px; padding: 0 7px; font-size: 11px">{{n.badge}}</span></sc-if>
            </a>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 18px; background: var(--bg)">
      <span class="av av-a" style="width: 40px; height: 40px; border-radius: 50%; font-size: 16px">超</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-size: 14px; font-weight: 700">超级管理员</span>
        <span style="font-size: 12px; color: var(--ink2)">设置 · 语言 · 退出</span>
      </span>
      <button class="ib ib-sm" aria-label="账号菜单"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="{{i.more}}"></path></svg></button>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; padding: 24px 32px 40px; display: flex; flex-direction: column; gap: 20px; position: relative">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
      <button style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 14px 6px 6px; border-radius: 999px; border: 1.5px solid var(--gLine); background: var(--gSoft); font: inherit; color: var(--ink); cursor: pointer" aria-label="切换服务器：当前 学マス · 正式服">
        <img src="./assets/hatsuboshi-logo.webp" alt="" style="width: 40px; height: 40px; border-radius: 50%; background: var(--s)">
        <span style="display: flex; flex-direction: column; align-items: flex-start"><span style="font-size: 15px; font-weight: 800">学マス · 正式服</span><span style="font-size: 12px; color: var(--gInk); font-weight: 700">托管 · 在线 12 · MGP 正常</span></span>
        <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--gInk)"><path d="{{i.updown}}"></path></svg>
      </button>
      <span style="flex: 1"></span>
      <button class="ib" aria-label="切换深浅色" onClick="{{toggleDark}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{modeIcon}}"></path></svg></button>
      <button class="ib" aria-label="通知"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.bell}}"></path></svg><span class="dot"></span></button>
    </div>

    <!-- GM 子导航：一行，放不下时横向滑动；不显示滚动条，鼠标滚轮在上面就是横滑，当前页的标签自动滚到看得见的地方 -->
    <nav aria-label="GM 运营" class="gtabs" onWheel="{{gtabsWheel}}" style="display: flex; gap: 6px; overflow-x: auto; padding: 6px; border-radius: 999px; background: var(--s); border: 1px solid var(--line); align-self: flex-start; max-width: 100%">
      <sc-for list="{{gtabs}}" as="t" hint-placeholder-count="10">
        <a class="gtab {{t.cls}}" href="{{t.href}}"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{t.d}}"></path></svg>{{t.t}}</a>
      </sc-for>
    </nav>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.01em">工作台</h1>
      <div style="font-size: 14px; color: var(--ink2)">学マス · 正式服 · 截至 11-11 21:40</div>
    </div>

    <!-- 今天：只放数字，点进对应页面 -->
    <section class="card today" aria-label="今天">
      <span class="hint" style="font-weight: 700">今天</span>
      <sc-for list="{{today}}" as="k" hint-placeholder-count="4">
        <a href="{{k.href}}"><sc-if value="{{k.live}}" hint-placeholder-val="{{false}}"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--okSoft); align-self: center"></span></sc-if><span class="hint">{{k.t}}</span><b class="num">{{k.v}}</b><span class="hint">{{k.s}}</span></a>
      </sc-for>
    </section>

    <section style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
      <div style="flex: 3 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
        <!-- 待处理：要人去做的事，每条一个按钮直接去处理；没有时只显示一行「没有待处理的事」 -->
        <div class="card" style="padding: 18px 20px 8px">
          <div class="sec-h" style="margin-bottom: 4px"><h2>待处理 <span class="num" style="color: var(--pInk)">{{todoCount}}</span></h2></div>
          <sc-for list="{{todos}}" as="a" hint-placeholder-count="3">
            <div class="todo">
              <span class="av {{a.av}}" style="width: 36px; height: 36px; border-radius: 12px"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{a.d}}"></path></svg></span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">{{a.t}}</span><span class="hint">{{a.s}}</span></span>
              <a class="btn btn-o btn-sm" href="{{a.href}}">{{a.btn}}</a>
            </div>
          </sc-for>
        </div>

        <!-- 接下来：已经安排好、快到点的事，按时间排；点一条去对应页面 -->
        <div class="card" style="padding: 18px 20px 8px">
          <div class="sec-h" style="margin-bottom: 4px"><h2>接下来</h2><a class="more" href="GkCalendarPC.dc.html">运营日历 →</a></div>
          <sc-for list="{{upcoming}}" as="u" hint-placeholder-count="4">
            <a class="next" href="{{u.href}}">
              <span class="num" style="font-size: 13px; font-weight: 700; color: var(--ink2)">{{u.when}}</span>
              <span class="next-t" style="min-width: 0; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{u.t}}</span>
              <span class="tag">{{u.where}}</span>
            </a>
          </sc-for>
        </div>
      </div>

      <div style="flex: 2 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
        <!-- 常用操作：找玩家 + 常去的页面 -->
        <div class="card" style="padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
          <div class="sec-h"><h2>常用操作</h2></div>
          <label class="inp" style="min-height: 48px"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ink2)"><path d="{{i.search}}"></path></svg><input type="text" placeholder="找玩家：昵称、PID、通行证账号" aria-label="找玩家"></label>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
            <sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
              <a class="qa" href="{{q.href}}"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{q.d}}"></path></svg>{{q.t}}</a>
            </sc-for>
          </div>
        </div>

        <!-- 最近 GM 操作：最多 4 条；没有记录时整块不显示 -->
        <div class="card" style="padding: 18px 20px 8px">
          <div class="sec-h" style="margin-bottom: 4px"><h2>最近 GM 操作</h2><a class="more" href="GkLogPC.dc.html">全部记录 →</a></div>
          <sc-for list="{{logs}}" as="l" hint-placeholder-count="4">
            <a href="GkLogPC.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink)">
              <span class="av {{l.av}}" style="width: 30px; height: 30px; border-radius: 50%; font-size: 12px">{{l.who1}}</span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{l.cmd}}</span><span class="hint">{{l.who}} · {{l.at}}</span></span>
              <span class="risk {{l.rc}}">{{l.r}}</span>
            </a>
          </sc-for>
        </div>
      </div>
    </section>

  </main>
</div>
</x-dc>

function buildGtabs(active) {

    ['home', '工作台', IC.pulse, 'GkHomePC.dc.html'], ['players', '玩家', IC.users, 'GkPlayersPC.dc.html'], ['gasha', '卡池', IC.dice, 'GkGashaPC.dc.html'], ['modes', '玩法', IC.trophy, 'GkModesPC.dc.html'], ['cal', '运营日历', IC.calendar, 'GkCalendarPC.dc.html'],

// 子导航上的滚轮：竖向滚动换成横向滑动
function gtabsWheel(e) {
  if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
  e.currentTarget.scrollLeft += e.deltaY;
  e.preventDefault();
}

      palette,
