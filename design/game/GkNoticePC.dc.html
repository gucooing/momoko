<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>GM 运营 · 公告</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./momoko-game.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--pInk)}a:hover{color:var(--ink)}
.hint{font-size:12px;color:var(--ink2);line-height:1.5}
.bulk-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--bg);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.bulk-btn:hover{background:color-mix(in srgb, var(--bg) 14%, transparent)}

.nt{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border:0;border-top:1px solid var(--line);background:transparent;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.nt:hover{background:var(--s2)}
.nt-on,.nt-on:hover{background:var(--gSoft);box-shadow:inset 3px 0 0 var(--g)}
.fl{display:flex;flex-direction:column;gap:6px}
.fl>span:first-child{font-size:13px;font-weight:700}
.tr{display:flex;align-items:center;gap:12px;min-height:48px;border-top:1px solid var(--line);font-size:14px}
.phone{width:300px;border-radius:36px;padding:10px;background:#141018;box-shadow:0 24px 50px -20px rgba(20,10,30,.45)}
.scr{border-radius:28px;overflow:hidden;background:var(--bg);height:560px;display:flex;flex-direction:column}
.ntab{flex:1;min-height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--ink2)}
.ntab-on{background:var(--g);color:var(--gOn)}

</style>
</helmet>
<div class="root th-{{palette}}-{{mode}} gk-{{mode}}" style="min-height: 1240px; display: flex; flex-wrap: wrap; align-items: stretch">

  <aside style="flex: 1 1 248px; max-width: 100%; background: var(--s); border-right: 1px solid var(--line); padding: 20px 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 4px 8px">
      <div style="width: 40px; height: 40px; border-radius: 13px; background: var(--p); color: var(--pOn); display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 800; transform: rotate(-6deg)">M</div>
      <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.01em">Momoko</span>
    </div>
    <button style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 8px 12px; border-radius: 16px; border: 1.5px dashed var(--line); background: var(--bg); font: inherit; color: var(--ink); cursor: pointer; text-align: left">
      <span class="av av-a2" style="width: 36px; height: 36px; border-radius: 11px"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.server}}"></path></svg></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-size: 11px; font-weight: 700; color: var(--ok)">● 本机 · 在线</span>
        <span style="font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">DESKTOP-K5K9BBC</span>
      </span>
      <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ink2)"><path d="{{i.updown}}"></path></svg>
    </button>
    <nav aria-label="主导航" style="display: flex; flex-direction: column; gap: 14px; flex: 1">
      <sc-for list="{{nav}}" as="g" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <sc-if value="{{g.title}}" hint-placeholder-val="{{true}}">
            <div class="lbl" style="padding: 0 12px 4px">{{g.title}}</div>
          </sc-if>
          <sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
            <a class="nav {{n.cls}}" href="{{n.href}}">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{n.d}}"></path></svg>
              <span style="flex: 1">{{n.t}}</span>
              <sc-if value="{{n.badge}}" hint-placeholder-val="{{false}}"><span class="gtag" style="height: 20px; padding: 0 7px; font-size: 11px">{{n.badge}}</span></sc-if>
            </a>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 18px; background: var(--bg)">
      <span class="av av-a" style="width: 40px; height: 40px; border-radius: 50%; font-size: 16px">超</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-size: 14px; font-weight: 700">超级管理员</span>
        <span style="font-size: 12px; color: var(--ink2)">设置 · 语言 · 退出</span>
      </span>
      <button class="ib ib-sm" aria-label="账号菜单"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="{{i.more}}"></path></svg></button>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; padding: 24px 32px 40px; display: flex; flex-direction: column; gap: 20px; position: relative">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
      <button style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 14px 6px 6px; border-radius: 999px; border: 1.5px solid var(--gLine); background: var(--gSoft); font: inherit; color: var(--ink); cursor: pointer" aria-label="切换服务器：当前 学マス · 正式服">
        <img src="./assets/hatsuboshi-logo.webp" alt="" style="width: 40px; height: 40px; border-radius: 50%; background: var(--s)">
        <span style="display: flex; flex-direction: column; align-items: flex-start"><span style="font-size: 15px; font-weight: 800">学マス · 正式服</span><span style="font-size: 12px; color: var(--gInk); font-weight: 700">托管 · 在线 12 · MGP 正常</span></span>
        <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--gInk)"><path d="{{i.updown}}"></path></svg>
      </button>
      <span style="flex: 1"></span>
      <button class="ib" aria-label="切换深浅色" onClick="{{toggleDark}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{modeIcon}}"></path></svg></button>
      <button class="ib" aria-label="通知"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.bell}}"></path></svg><span class="dot"></span></button>
    </div>

    <nav aria-label="GM 运营" class="hs" style="display: flex; gap: 6px; overflow-x: auto; padding: 6px; border-radius: 999px; background: var(--s); border: 1px solid var(--line); align-self: flex-start; max-width: 100%">
      <sc-for list="{{gtabs}}" as="t" hint-placeholder-count="10">
        <a class="gtab {{t.cls}}" href="{{t.href}}"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{t.d}}"></path></svg>{{t.t}}</a>
      </sc-for>
    </nav>

    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px">
      <div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.01em">公告</h1>
        <div style="font-size: 14px; color: var(--ink2)">游戏内公告栏、登录弹窗与卡池说明页 · 4 条展示中</div>
      </div>
      <button class="btn btn-g"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.plus}}"></path></svg>新建公告</button>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
      <section class="card" style="flex: 1 1 400px; min-width: 0; overflow: hidden">
        <div style="padding: 14px; display: flex; flex-direction: column; gap: 10px">
          <div role="tablist" aria-label="公告分类" class="hs" style="display: flex; gap: 6px; overflow-x: auto"><sc-for list="{{cats}}" as="c" hint-placeholder-count="5"><button class="chip {{c.cls}}" role="tab" aria-selected="{{c.on}}" onClick="{{c.pick}}" style="min-height: 36px; padding: 0 12px; font-size: 13px">{{c.t}} <span class="n num">{{c.n}}</span></button></sc-for></div>
        </div>
        <sc-for list="{{notices}}" as="n" hint-placeholder-count="6">
          <button class="nt {{n.cls}}" onClick="{{n.pick}}" aria-pressed="{{n.on}}">
            <img class="ph" src="{{n.img}}" alt="" style="width: 112px; height: 52px; border-radius: 12px; flex: none; object-fit: {{n.fit}}">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 14px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{n.t}}</span>
              <span style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap"><span class="gtag" style="height: 20px; font-size: 11px">{{n.cat}}</span><span class="pill {{n.st}}" style="height: 20px; font-size: 11px">{{n.stT}}</span><sc-if value="{{n.pin}}" hint-placeholder-val="{{false}}"><span class="tag" style="height: 20px; font-size: 11px">置顶</span></sc-if><sc-if value="{{n.pop}}" hint-placeholder-val="{{false}}"><span class="tag" style="height: 20px; font-size: 11px">登录弹窗</span></sc-if></span>
              <span class="num hint">{{n.span}}</span>
            </span>
          </button>
        </sc-for>
      </section>

      <section class="card" style="flex: 2 1 660px; min-width: 0; padding: 20px 24px; display: flex; flex-wrap: wrap; gap: 24px">
        <div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
          <div style="display: flex; align-items: center; gap: 10px"><span style="flex: 1; font-size: 20px; font-weight: 800">编辑公告</span><span class="pill {{cur.st}}">{{cur.stT}}</span></div>
          <div class="fl"><span>分类</span><div class="seg" role="radiogroup" aria-label="分类" style="align-self: flex-start"><sc-for list="{{catPick}}" as="c" hint-placeholder-count="4"><button class="{{c.cls}}" role="radio" aria-checked="{{c.on}}">{{c.t}}</button></sc-for></div></div>
          <label class="fl"><span>标题</span><span class="inp inp-sq"><input type="text" placeholder="{{cur.t}}" aria-label="标题"></span></label>
          <div class="fl"><span>横幅</span>
            <div style="display: flex; gap: 12px; align-items: center"><img class="ph" src="{{cur.img}}" alt="当前横幅" style="width: 160px; height: 74px; border-radius: 14px; object-fit: {{cur.fit}}"><span style="display: flex; flex-direction: column; gap: 6px"><button class="btn btn-s btn-sm"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.search}}"></path></svg>从游戏素材选</button><button class="btn btn-o btn-sm">上传图片</button></span></div>
            <span class="hint">「从游戏素材选」读前端自带的学マス素材包：卡池横幅、活动 Logo、偶像卡面。</span>
          </div>
          <label class="fl"><span>正文</span><textarea class="ta" placeholder="{{cur.body}}" aria-label="正文" style="min-height: 120px"></textarea></label>
          <div class="fl"><span>点击后跳转</span><button class="sel" style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--s); font: inherit; font-size: 14px; color: var(--ink); cursor: pointer">{{cur.link}}<svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.chevD}}"></path></svg></button></div>
          <div style="display: flex; gap: 12px"><label class="fl" style="flex: 1"><span>开始展示</span><span class="inp inp-sq"><input type="text" placeholder="{{cur.from}}" aria-label="开始展示"></span></label><label class="fl" style="flex: 1"><span>结束展示</span><span class="inp inp-sq"><input type="text" placeholder="{{cur.to}}" aria-label="结束展示"></span></label></div>
          <div style="display: flex; flex-direction: column">
            <label class="tr"><span style="flex: 1">在公告栏置顶</span><input class="tg tg-sm" type="checkbox" checked="{{pin}}" onChange="{{togglePin}}"></label>
            <label class="tr"><span style="flex: 1; display: flex; flex-direction: column"><span>登录时弹出</span><span class="hint">每个玩家每天弹一次</span></span><input class="tg tg-sm" type="checkbox" checked="{{pop}}" onChange="{{togglePop}}"></label>
          </div>
          <div style="display: flex; gap: 10px; flex-wrap: wrap; padding-top: 4px"><button class="btn btn-o">存为草稿</button><span style="flex: 1"></span><button class="btn btn-stop">下线</button><button class="btn btn-g"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.send}}"></path></svg>保存并发布</button></div>
        </div>

        <div style="flex: 0 0 300px; display: flex; flex-direction: column; gap: 10px; align-items: center">
          <span class="lbl" style="align-self: flex-start">游戏内预览</span>
          <div class="phone">
            <div class="scr">
              <div style="display: flex; align-items: center; gap: 8px; padding: 14px 14px 10px; background: var(--s)"><img src="./assets/hatsuboshi-logo.webp" alt="" style="width: 28px; height: 28px"><span style="flex: 1; font-size: 15px; font-weight: 800">お知らせ</span><span style="width: 24px; height: 24px; border-radius: 50%; background: var(--s2); display: flex; align-items: center; justify-content: center"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px"><path d="{{i.x}}"></path></svg></span></div>
              <div style="display: flex; gap: 4px; padding: 0 12px 10px; background: var(--s)"><sc-for list="{{pvTabs}}" as="t" hint-placeholder-count="4"><span class="ntab {{t.cls}}">{{t.t}}</span></sc-for></div>
              <div class="hs" style="flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px">
                <img class="ph" src="{{cur.img}}" alt="" style="width: 100%; aspect-ratio: 920 / 320; border-radius: 14px; object-fit: {{cur.fit}}">
                <span style="font-size: 15px; font-weight: 800; line-height: 1.4">{{cur.t}}</span>
                <span class="num" style="font-size: 11px; color: var(--gInk); font-weight: 700">{{cur.from}} 〜 {{cur.to}}</span>
                <span style="font-size: 12px; line-height: 1.75; color: var(--ink)">{{cur.body}}</span>
                <span class="btn btn-g btn-sm" style="align-self: center; margin-top: 4px; pointer-events: none">{{cur.cta}}</span>
              </div>
            </div>
          </div>
          <span class="hint" style="text-align: center">预览按 1080×1920 等比缩放；正文支持粗体、颜色与道具图标。</span>
        </div>
      </section>
    </div>

  </main>
</div>
</x-dc>
