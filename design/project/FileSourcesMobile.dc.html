.root{font-family:'Outfit','HarmonyOS Sans SC','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.root *{box-sizing:border-box}
.card{background:var(--s);border:1px solid var(--line);border-radius:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:0;font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--p);color:var(--pOn)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:var(--ink2);cursor:pointer;position:relative;flex:none}
.ib:hover{background:var(--s2);color:var(--ink)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--s);color:var(--ink2);font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.chip-on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{font-size:12px;opacity:.7}
.utab{display:inline-flex;align-items:center;min-height:44px;padding:0 2px;border-bottom:3px solid transparent;color:var(--ink2);text-decoration:none;font-size:15px;font-weight:700;flex:none}
.utab-on,.utab-on:hover{color:var(--ink);border-bottom-color:var(--p)}
.av{display:flex;align-items:center;justify-content:center;flex:none;font-weight:800}
.av-p{background:var(--pSoft);color:var(--pInk)}.av-a{background:var(--aSoft);color:var(--aOn)}.av-a2{background:var(--a2Soft);color:var(--ink)}.av-ok{background:var(--okSoft);color:var(--ok)}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
.num{font-family:'Outfit',sans-serif;font-variant-numeric:tabular-nums}
.tg{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
.tg::after{content:'';position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.tg:checked{background:var(--p)}
.tg:checked::after{transform:translateX(20px)}
.cap{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:8px;font-size:12px;font-weight:700;white-space:nowrap}
.cap-on{background:var(--a2Soft);color:var(--ink)}
.cap-off{background:var(--s2);color:var(--ink2);text-decoration:line-through}
.cap-302{background:var(--okSoft);color:var(--ok)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px;padding-top:6px;color:var(--ink2);text-decoration:none;font-size:11px;font-weight:600}
.tab .tb{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:999px}
.tab-on{color:var(--pInk)}.tab-on .tb{background:var(--pSoft)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
.hs{scrollbar-width:none;-ms-overflow-style:none}.hs::-webkit-scrollbar{display:none}
</style>
</helmet>
<div class="root th-{{palette}}-{{mode}}" style="width: 390px; min-height: 2140px; display: flex; flex-direction: column">
  <header style="display: flex; align-items: flex-end; gap: 6px; padding: 22px 12px 8px 20px">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.01em">文件源</h1>
      <div style="font-size: 13px; color: var(--ink2)"><span class="num">5</span> 个存储 · <span style="color: var(--ok); font-weight: 700"><span class="num">{{onCount}}</span> 个已启用</span></div>
    </div>
    <button class="ib" aria-label="切换深浅色" onClick="{{toggleDark}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{modeIcon}}"></path></svg></button>
    <button class="ib" aria-label="全部测试连接" onClick="{{testAll}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.zap}}"></path></svg></button>
  </header>
  <nav class="hs" aria-label="文件分类" style="display: flex; gap: 24px; padding: 0 20px; border-bottom: 1px solid var(--line); overflow-x: auto">
    <a class="utab" href="FilesMobile.dc.html">文件</a>
    <a class="utab" href="SharesMobile.dc.html">分享</a>
    <a class="utab utab-on" href="FileSourcesMobile.dc.html">文件源</a>
  </nav>

  <div class="hs" role="tablist" aria-label="按类型筛选" style="display: flex; gap: 8px; padding: 14px 16px; overflow-x: auto">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
      <button class="chip {{f.cls}}" role="tab" aria-selected="{{f.on}}" onClick="{{f.pick}}">{{f.t}} <span class="n num">{{f.n}}</span></button>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 0 16px 20px">
    <sc-for list="{{cards}}" as="s" hint-placeholder-count="5">
      <article class="card" style="padding: 16px 12px 6px 16px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 12px; padding-right: 4px">
          <span class="av {{s.av}}" style="width: 46px; height: 46px; border-radius: 15px; transform: rotate({{s.rot}})"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><path d="{{s.d}}"></path></svg></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; font-weight: 800; color: {{s.nameFg}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{s.n}}</span>
            <span style="font-size: 12px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{s.typeT}} · {{s.sub}}</span>
          </span>
          <input class="tg" type="checkbox" role="switch" checked="{{s.on}}" onChange="{{s.toggle}}" aria-label="启用 {{s.n}}">
        </div>
        <dl style="margin: 0 4px 0 0; padding: 10px 12px; border-radius: 14px; background: var(--s2); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px">
          <div style="grid-column: 1 / -1; min-width: 0">
            <dt style="font-size: 11px; font-weight: 700; color: var(--ink2)">地址</dt>
            <dd class="mono" style="margin: 2px 0 0; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{s.ep}}</dd>
          </div>
          <div style="grid-column: 1 / -1; min-width: 0">
            <dt style="font-size: 11px; font-weight: 700; color: var(--ink2)">{{s.rootLabel}}</dt>
            <dd class="mono" style="margin: 2px 0 0; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{s.root}}</dd>
          </div>
          <div style="min-width: 0">
            <dt style="font-size: 11px; font-weight: 700; color: var(--ink2)">已用空间</dt>
            <dd class="num" style="margin: 2px 0 0; font-size: 13px; font-weight: 700">{{s.used}}</dd>
          </div>
          <div style="min-width: 0">
            <dt style="font-size: 11px; font-weight: 700; color: var(--ink2)">上次测试</dt>
            <dd class="num" style="margin: 2px 0 0; font-size: 13px; font-weight: 700">{{s.whenT}}</dd>
          </div>
        </dl>
        <div style="display: flex; flex-wrap: wrap; gap: 6px; padding-right: 4px">
          <span class="cap {{s.c302}}"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px"><path d="{{i.zap}}"></path></svg>{{s.t302}}</span>
          <sc-for list="{{s.caps}}" as="cp" hint-placeholder-count="3">
            <span class="cap {{cp.cls}}"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px"><path d="{{cp.d}}"></path></svg>{{cp.t}}</span>
          </sc-for>
        </div>
        <div style="display: flex; align-items: center; gap: 2px; padding-top: 6px; border-top: 1px solid var(--line)">
          <div style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; color: {{s.resFg}}">
            <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.4"><path d="{{s.resD}}"></path></svg>
            <span class="num" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{s.resT}}</span>
          </div>
          <button class="ib" aria-label="测试 {{s.n}} 的连接" onClick="{{s.test}}" style="color: var(--pInk)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.zap}}"></path></svg></button>
          <a class="ib" href="FilesMobile.dc.html" aria-label="浏览 {{s.n}} 的文件"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.folder}}"></path></svg></a>
          <button class="ib" aria-label="编辑 {{s.n}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.edit}}"></path></svg></button>
          <button class="ib" aria-label="{{s.n}} 更多操作"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="{{i.more}}"></path></svg></button>
        </div>
      </article>
    </sc-for>
  </div>

  <div style="position: sticky; bottom: 92px; margin-top: auto; display: flex; justify-content: flex-end; padding: 0 16px 12px; pointer-events: none">
    <button class="btn btn-p" style="pointer-events: auto; min-height: 56px; padding: 0 22px; font-size: 15px; box-shadow: 0 12px 28px -10px var(--p)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.plus}}"></path></svg>新增文件源</button>
  </div>

  <nav aria-label="底部导航" style="position: sticky; bottom: 0; display: flex; padding: 6px 8px 22px; background: var(--s); border-top: 1px solid var(--line)">
    <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="5">
      <a class="tab {{tb.cls}}" href="{{tb.href}}"><span class="tb"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{tb.d}}"></path></svg></span>{{tb.t}}</a>
    </sc-for>
  </nav>
</div>
</x-dc>

const ROTS = ['-4deg', '3deg', '-2deg', '4deg', '-3deg'];
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const palette = this.props.palette ?? 'sakura';
    const dark = st.dark != null ? st.dark : (this.props.dark ?? false);
    const filter = st.filter || 'all';
    const enabled = st.enabled || {};
    const tested = st.tested || {};
    const isOn = (s) => enabled[s.id] != null ? enabled[s.id] : s.on;
    const cap = (on, t, d) => ({ t, cls: on ? 'cap-on' : 'cap-off', d: on ? d : IC.minus });
    const count = (k) => SOURCES.filter((s) => k === 'all' || s.k === k).length;
    return {
      palette,
      mode: dark ? 'dark' : 'light',
      i: IC,
      modeIcon: dark ? IC.sun : IC.moon,
      toggleDark: () => this.setState({ dark: !dark }),
      onCount: SOURCES.filter(isOn).length,
      testAll: () => this.setState({ tested: { 1: true, 2: true, 3: true, 4: true, 5: true } }),
      filters: [['all', '全部'], ['local', '本地磁盘'], ['s3', 'OSS-S3'], ['ftp', 'FTP'], ['dav', 'WebDAV']].map(([k, t]) => ({ t, n: count(k), on: k === filter, cls: k === filter ? 'chip-on' : '', pick: () => this.setState({ filter: k }) })),
      cards: SOURCES.filter((s) => filter === 'all' || s.k === filter).map((s) => {
        const ty = TYPES[s.k];
        const on = isOn(s);
        const re = !!tested[s.id];
        return {
          ...s,
          d: ty.d, av: ty.av, typeT: ty.t, rootLabel: ty.rootLabel, rot: ROTS[s.id % 5],
          on, nameFg: on ? 'var(--ink)' : 'var(--ink2)',
          toggle: () => this.setState({ enabled: { ...enabled, [s.id]: !on } }),
          c302: s.s302 ? 'cap-302' : 'cap-off', t302: s.s302 ? '302 直链' : '无 302',
          caps: [cap(s.up, '上传', IC.upload), cap(s.pre, '预签名', IC.key), cap(s.chunk, '分片', IC.pieces)],
          whenT: re ? '刚刚' : s.when,
          resT: !on ? '已停用' : (s.ok ? '延迟 ' + (re ? s.ms + 3 : s.ms) + ' ms' : '连接失败 · ' + s.err),
          resFg: !on ? 'var(--ink2)' : (s.ok ? 'var(--ok)' : 'var(--bad)'),
          resD: !on ? IC.minus : (s.ok ? IC.check : IC.alert),
          test: () => this.setState({ tested: { ...tested, [s.id]: true } })
        };
      }),
      tabs: [
        { t: '首页', d: IC.home, href: 'DashboardMobile.dc.html', cls: '' },
        { t: '应用', d: IC.apps, href: 'AppsMobile.dc.html', cls: '' },
        { t: '容器', d: IC.box, href: 'ContainersMobile.dc.html', cls: '' },
        { t: '文件', d: IC.folder, href: 'FilesMobile.dc.html', cls: 'tab-on' },
        { t: '更多', d: IC.grid, href: 'MoreMobile.dc.html', cls: '' }
      ]
    };
  }
}
</script>
</body>
