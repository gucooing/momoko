.root{font-family:'Outfit','HarmonyOS Sans SC','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.root *{box-sizing:border-box}
.card{background:var(--s);border:1px solid var(--line);border-radius:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:0;font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--p);color:var(--pOn)}
.btn-s{background:var(--s2);color:var(--ink)}
.btn-del{background:var(--bad);color:var(--s)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:var(--ink2);cursor:pointer;position:relative;flex:none;text-decoration:none}
.ib:hover{background:var(--s2);color:var(--ink)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--s);color:var(--ink2);font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.chip-on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{font-size:12px;opacity:.7}
.inp{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 16px;border-radius:999px;background:var(--s);border:1.5px solid var(--line);color:var(--ink2)}
.inp:focus-within{border-color:var(--p)}
.inp input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);outline:none}
.inp input::placeholder{color:var(--ink2)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:7px;font-size:11px;font-weight:700;white-space:nowrap}
.av{display:flex;align-items:center;justify-content:center;flex:none;font-weight:800}
.av-p{background:var(--pSoft);color:var(--pInk)}.av-a{background:var(--aSoft);color:var(--aOn)}.av-a2{background:var(--a2Soft);color:var(--ink)}.av-ok{background:var(--okSoft);color:var(--ok)}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
.num{font-family:'Outfit',sans-serif;font-variant-numeric:tabular-nums}
.ml{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;font-weight:800;border:2px solid var(--s);margin-left:-6px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
.hs{scrollbar-width:none;-ms-overflow-style:none}.hs::-webkit-scrollbar{display:none}
</style>
</helmet>
<div class="root th-{{palette}}-{{mode}}" style="width: 390px; min-height: 2300px; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 4px; padding: 14px 8px 4px 4px">
    <a class="ib" href="AppsMobile.dc.html" aria-label="返回应用列表"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.chevL}}"></path></svg></a>
    <span style="flex: 1"></span>
    <button class="ib" aria-label="切换深浅色" onClick="{{toggleDark}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{modeIcon}}"></path></svg></button>
  </header>
  <div style="padding: 0 20px 14px; display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.01em">应用类型</h1>
    <div style="font-size: 13px; color: var(--ink2); line-height: 1.5">6 种 · 被 8 个应用使用。新建应用时按类型预填启动命令。</div>
  </div>
  <div style="padding: 0 16px 10px">
    <label class="inp">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.search}}"></path></svg>
      <input type="search" placeholder="类型名称或命令" aria-label="搜索应用类型">
    </label>
  </div>
  <div class="hs" role="tablist" aria-label="按来源筛选" style="display: flex; gap: 8px; padding: 2px 16px 14px; overflow-x: auto">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
      <button class="chip {{f.cls}}" role="tab" aria-selected="{{f.on}}" onClick="{{f.pick}}">{{f.t}} <span class="n num">{{f.n}}</span></button>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 0 16px 20px">
    <sc-for list="{{types}}" as="t" hint-placeholder-count="6">
      <article class="card" style="padding: 16px 12px 6px 16px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 12px; padding-right: 4px">
          <span class="av {{t.av}}" style="width: 48px; height: 48px; border-radius: 16px; transform: rotate({{t.rot}})"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px"><path d="{{t.d}}"></path></svg></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 17px; font-weight: 800">{{t.n}}</span>
            <span><span class="tag" style="background: {{t.srcBg}}; color: {{t.srcFg}}">{{t.src}}</span></span>
          </span>
          <span style="display: flex; flex-direction: column; align-items: flex-end">
            <span class="num" style="font-size: 24px; font-weight: 800; line-height: 1">{{t.count}}</span>
            <span style="font-size: 11px; font-weight: 700; color: var(--ink2)">个应用</span>
          </span>
        </div>
        <div style="font-size: 14px; line-height: 1.5; padding-right: 4px">{{t.desc}}</div>
        <dl style="margin: 0 4px 0 0; padding: 10px 12px; border-radius: 14px; background: var(--s2); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px">
          <div style="grid-column: 1 / -1; min-width: 0">
            <dt style="font-size: 11px; font-weight: 700; color: var(--ink2)">默认启动命令</dt>
            <dd class="mono" style="margin: 3px 0 0; font-size: 12px; line-height: 1.5; word-break: break-all">{{t.cmd}}</dd>
          </div>
          <div style="min-width: 0">
            <dt style="font-size: 11px; font-weight: 700; color: var(--ink2)">停止方式</dt>
            <dd class="mono" style="margin: 3px 0 0; font-size: 12px; font-weight: 600">{{t.stop}}</dd>
          </div>
          <div style="min-width: 0">
            <dt style="font-size: 11px; font-weight: 700; color: var(--ink2)">更新</dt>
            <dd style="margin: 3px 0 0; font-size: 13px; font-weight: 700">{{t.upd}}</dd>
          </div>
          <div style="grid-column: 1 / -1; min-width: 0">
            <dt style="font-size: 11px; font-weight: 700; color: var(--ink2)">在用的应用</dt>
            <dd class="mono" style="margin: 3px 0 0; font-size: 12px; font-weight: 600">{{t.appNames}}</dd>
          </div>
        </dl>
        <sc-if value="{{t.confirm}}" hint-placeholder-val="{{false}}">
          <div role="alert" style="display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; margin-right: 4px; border-radius: 16px; background: var(--badSoft)">
            <span style="font-size: 13px; font-weight: 600; color: var(--bad); line-height: 1.5">还有 {{t.count}} 个应用在用「{{t.n}}」，删除后它们会变成「未分类」。</span>
            <span style="display: flex; gap: 8px">
              <button class="btn btn-s" onClick="{{t.cancel}}" style="flex: 1">取消</button>
              <button class="btn btn-del" onClick="{{t.cancel}}" style="flex: 1">确认删除</button>
            </span>
          </div>
        </sc-if>
        <div style="display: flex; align-items: center; gap: 2px; padding-top: 6px; border-top: 1px solid var(--line)">
          <div style="flex: 1; min-width: 0; display: flex; align-items: center; padding-left: 6px">
            <sc-for list="{{t.apps}}" as="a" hint-placeholder-count="2">
              <span class="ml {{a.av}}" title="{{a.n}}">{{a.l}}</span>
            </sc-for>
          </div>
          <button class="ib" aria-label="以 {{t.n}} 新建应用"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.plus}}"></path></svg></button>
          <button class="ib" aria-label="复制 {{t.n}} 的启动命令"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.copy}}"></path></svg></button>
          <button class="ib" aria-label="编辑 {{t.n}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.edit}}"></path></svg></button>
          <button class="ib" aria-label="删除 {{t.n}}" onClick="{{t.del}}" style="color: var(--bad)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.trash}}"></path></svg></button>
        </div>
      </article>
    </sc-for>
  </div>

  <div style="position: sticky; bottom: 24px; margin-top: auto; display: flex; justify-content: flex-end; padding: 0 16px 12px; pointer-events: none">
    <button class="btn btn-p" style="pointer-events: auto; min-height: 56px; padding: 0 22px; font-size: 15px; box-shadow: 0 12px 28px -10px var(--p)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.plus}}"></path></svg>新建类型</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["sakura","mint","volt","grape","sunset","classic"],"default":"sakura"},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":2300}}'>
const IC = {
  search: 'M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zM20 20l-4-4',

  moon: 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z',

  chevL: 'M15 6l-6 6 6 6',
  coffee: 'M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM17 10h1.5a2.5 2.5 0 0 1 0 5H17M8 3c0 1.5 1 1.5 1 3M12 3c0 1.5 1 1.5 1 3',
  hex: 'M12 2.5l8.5 5v9L12 21.5l-8.5-5v-9zM9 9.5v5M9 9.5l3.5 5V9.5M15.5 9.5h-1a1.2 1.2 0 0 0 0 2.5h.5a1.2 1.2 0 0 1 0 2.5h-1',
  code: 'M8 8l-4 4 4 4M16 8l4 4-4 4M14 5l-4 14',
  chip: 'M7 7h10v10H7zM10 2v5M14 2v5M10 17v5M14 17v5M2 10h5M2 14h5M17 10h5M17 14h5',
  gamepad: 'M6 8h12a4 4 0 0 1 4 4v1a4 4 0 0 1-7 2.6L14 15h-4l-1 .6A4 4 0 0 1 2 13v-1a4 4 0 0 1 4-4zM7 11v3M5.5 12.5h3M16 12h.01M18 13.5h.01',
  globe: 'M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zM3 12h18M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9s1-6.5 3.5-9z'
};
const APPAV = { 'mc-survival': 'av-p', 'blog-api': 'av-a2', 'qq-bot': 'av-a', 'rsshub': 'av-ok', 'alist-mirror': 'av-p', 'palworld': 'av-a2', 'test-worker': 'av-a', 'legacy-cms': 'av-ok' };
const TYPES = [
  { id: 'java', n: 'Java 应用', src: 'b', d: IC.coffee, av: 'av-p', rot: '-5deg', desc: '运行 .jar 程序，自动查找 JAVA_HOME。适合 Minecraft、Spring Boot。', cmd: 'java -Xms1G -Xmx4G -jar ${JAR_FILE} nogui', stop: 'stop 命令', apps: ['mc-survival'], upd: '内置' },
  { id: 'node', n: 'Node.js', src: 'b', d: IC.hex, av: 'av-ok', rot: '4deg', desc: '运行 Node 服务或 npm / pnpm 脚本，读取 .nvmrc 选择版本。', cmd: 'node ${ENTRY}', stop: 'SIGTERM', apps: ['blog-api', 'rsshub'], upd: '内置' },
  { id: 'py', n: 'Python', src: 'b', d: IC.code, av: 'av-a2', rot: '-3deg', desc: '运行 Python 脚本，可自动激活工作目录下的 venv。', cmd: 'python -u ${SCRIPT}', stop: 'SIGINT', apps: ['qq-bot', 'test-worker'], upd: '内置' },

  { id: 'game', n: '游戏服务器', src: 'c', d: IC.gamepad, av: 'av-p', rot: '5deg', desc: '专用服务器通用模板，带端口和人数变量。', cmd: '${EXE} -port=${PORT} -players=${MAX_PLAYERS}', stop: 'SIGTERM · 60 秒', apps: ['palworld'], upd: '10 月 12 日' },
  { id: 'php', n: 'PHP', src: 'c', d: IC.globe, av: 'av-a2', rot: '-4deg', desc: 'PHP-FPM 前台运行，通常配合 nginx-proxy 反代。', cmd: 'php-fpm -F -c ${WORK_DIR}/php.ini', stop: 'SIGQUIT', apps: ['legacy-cms'], upd: '2025-12-11' }
];
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const palette = this.props.palette ?? 'sakura';
    const dark = st.dark != null ? st.dark : (this.props.dark ?? false);
    const filter = st.filter || 'all';
    const confirm = st.confirm || null;
    const count = (k) => TYPES.filter((t) => k === 'all' || t.src === k).length;
    return {
      palette,
      mode: dark ? 'dark' : 'light',
      i: IC,
      modeIcon: dark ? IC.sun : IC.moon,
      toggleDark: () => this.setState({ dark: !dark }),
      filters: [['all', '全部'], ['b', '内置'], ['c', '自定义']].map(([k, t]) => ({ t, n: count(k), on: k === filter, cls: k === filter ? 'chip-on' : '', pick: () => this.setState({ filter: k }) })),
      types: TYPES.filter((t) => filter === 'all' || t.src === filter).map((t) => ({
        ...t,
        src: t.src === 'b' ? '内置' : '自定义',
        srcBg: t.src === 'b' ? 'var(--s2)' : 'var(--aSoft)',
        srcFg: t.src === 'b' ? 'var(--ink2)' : 'var(--aOn)',
        count: t.apps.length,
        appNames: t.apps.join('、'),
        apps: t.apps.map((n) => ({ n, l: n[0].toUpperCase(), av: APPAV[n] })),
        confirm: confirm === t.id,
        del: () => this.setState({ confirm: t.id }),
        cancel: () => this.setState({ confirm: null })
      }))
    };
  }
}
</script>
