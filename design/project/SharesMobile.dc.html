.root{font-family:'Outfit','HarmonyOS Sans SC','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.root *{box-sizing:border-box}
.card{background:var(--s);border:1px solid var(--line);border-radius:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:0;font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--p);color:var(--pOn)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:var(--ink2);cursor:pointer;position:relative;flex:none}
.ib:hover{background:var(--s2);color:var(--ink)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.ok{background:var(--okSoft);color:var(--ok)}.off{background:var(--s2);color:var(--ink2)}.warn{background:var(--warnSoft);color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--s);color:var(--ink2);font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.chip-on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{font-size:12px;opacity:.7}
.utab{display:inline-flex;align-items:center;min-height:44px;padding:0 2px;border-bottom:3px solid transparent;color:var(--ink2);text-decoration:none;font-size:15px;font-weight:700;flex:none}
.utab-on,.utab-on:hover{color:var(--ink);border-bottom-color:var(--p)}
.inp{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 16px;border-radius:999px;background:var(--s);border:1.5px solid var(--line);color:var(--ink2)}
.inp:focus-within{border-color:var(--p)}
.inp input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);outline:none}
.inp input::placeholder{color:var(--ink2)}
.av{display:flex;align-items:center;justify-content:center;flex:none;font-weight:800}
.av-p{background:var(--pSoft);color:var(--pInk)}.av-a{background:var(--aSoft);color:var(--aOn)}.av-a2{background:var(--a2Soft);color:var(--ink)}.av-ok{background:var(--okSoft);color:var(--ok)}
.k-warn{background:var(--warnSoft);color:var(--warn)}.k-off{background:var(--s2);color:var(--ink2)}
.code{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:8px;background:var(--a2Soft);color:var(--ink);font-size:13px;font-weight:700;letter-spacing:.08em}
.bar{height:5px;border-radius:999px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;border-radius:999px}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
.num{font-family:'Outfit',sans-serif;font-variant-numeric:tabular-nums}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px;padding-top:6px;color:var(--ink2);text-decoration:none;font-size:11px;font-weight:600}
.tab .tb{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:999px}
.tab-on{color:var(--pInk)}.tab-on .tb{background:var(--pSoft)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
.hs{scrollbar-width:none;-ms-overflow-style:none}.hs::-webkit-scrollbar{display:none}
</style>
</helmet>
<div class="root th-{{palette}}-{{mode}}" style="width: 390px; min-height: 3100px; display: flex; flex-direction: column">
  <header style="display: flex; align-items: flex-end; gap: 6px; padding: 22px 12px 8px 20px">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.01em">分享</h1>
      <div style="font-size: 13px; color: var(--ink2)"><span class="num">9</span> 个链接 · <span style="color: var(--ok); font-weight: 700"><span class="num">5</span> 个有效</span> · 本月下载 <span class="num">326</span> 次</div>
    </div>
    <button class="ib" aria-label="切换深浅色" onClick="{{toggleDark}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{modeIcon}}"></path></svg></button>
  </header>
  <nav class="hs" aria-label="文件分类" style="display: flex; gap: 24px; padding: 0 20px; border-bottom: 1px solid var(--line); overflow-x: auto">
    <a class="utab" href="FilesMobile.dc.html">文件</a>
    <a class="utab utab-on" href="SharesMobile.dc.html">分享</a>
    <a class="utab" href="FileSourcesMobile.dc.html">文件源</a>
  </nav>

  <div style="padding: 14px 16px 10px">
    <label class="inp">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.search}}"></path></svg>
      <input type="search" placeholder="文件名、链接或提取码" aria-label="搜索分享">
    </label>
  </div>

  <div class="hs" role="tablist" aria-label="按状态筛选" style="display: flex; gap: 8px; padding: 2px 16px 14px; overflow-x: auto">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
      <button class="chip {{f.cls}}" role="tab" aria-selected="{{f.on}}" onClick="{{f.pick}}">{{f.t}} <span class="n num">{{f.n}}</span></button>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 0 16px 20px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
      <article class="card" style="padding: 16px 12px 6px 16px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 12px; padding-right: 4px">
          <span class="av {{r.av}}" style="width: 44px; height: 44px; border-radius: 15px; transform: rotate({{r.rot}})"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{r.d}}"></path></svg></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.n}}</span>
            <span class="num" style="font-size: 12px; color: var(--ink2)">{{r.src}} · 创建于 {{r.created}}</span>
          </span>
          <span class="pill {{r.st}}">{{r.stT}}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; margin-right: 4px; padding-left: 12px; border-radius: 14px; background: var(--s2)">
          <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ink2)"><path d="{{i.link}}"></path></svg>
          <span class="mono" style="flex: 1; min-width: 0; font-size: 12px; color: {{r.linkFg}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.link}}</span>
          <button class="ib" aria-label="{{r.copyT}}" onClick="{{r.copy}}" style="color: {{r.copyFg}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{r.copyD}}"></path></svg></button>
        </div>
        <dl style="margin: 0 4px 0 0; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); display: grid; grid-template-columns: 0.8fr 1.1fr 1.1fr; gap: 10px">
          <div style="min-width: 0">
            <dt style="font-size: 11px; font-weight: 700; color: var(--ink2)">提取码</dt>
            <dd style="margin: 4px 0 0">
              <sc-if value="{{r.hasCode}}" hint-placeholder-val="{{true}}"><span class="code mono">{{r.code}}</span></sc-if>
              <sc-if value="{{r.noCode}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; font-weight: 700; color: var(--ink2)">无</span></sc-if>
            </dd>
          </div>
          <div style="min-width: 0">
            <dt style="font-size: 11px; font-weight: 700; color: var(--ink2)">过期时间</dt>
            <dd class="num" style="margin: 2px 0 0; font-size: 13px; font-weight: 700; white-space: nowrap">{{r.expT}}</dd>
            <dd style="margin: 1px 0 0; font-size: 11px; font-weight: 600; color: {{r.leftFg}}; white-space: nowrap">{{r.left}}</dd>
          </div>
          <div style="min-width: 0">
            <dt style="font-size: 11px; font-weight: 700; color: var(--ink2)">下载次数</dt>
            <dd class="num" style="margin: 2px 0 0; font-size: 13px; font-weight: 700; white-space: nowrap">{{r.used}} <span style="color: var(--ink2); font-weight: 600">/ {{r.limitT}}</span></dd>
            <dd style="margin: 6px 0 0"><div class="bar"><span style="width: {{r.pctW}}; background: {{r.barBg}}"></span></div></dd>
          </div>
        </dl>
        <div style="display: flex; align-items: center; gap: 2px; padding-top: 6px; border-top: 1px solid var(--line)">
          <div style="flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px">
            <span style="display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 8px; background: var(--s2); color: var(--ink2); font-size: 12px; font-weight: 600">{{r.kindT}}</span>
          </div>
          <button class="ib" aria-label="{{r.n}} 二维码"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.qr}}"></path></svg></button>
          <button class="ib" aria-label="编辑 {{r.n}} 的分享"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.edit}}"></path></svg></button>
          <button class="ib" aria-label="删除 {{r.n}} 的分享" style="color: var(--bad)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.trash}}"></path></svg></button>
          <button class="ib" aria-label="{{r.n}} 更多操作"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="{{i.more}}"></path></svg></button>
        </div>
      </article>
    </sc-for>
  </div>

  <div style="position: sticky; bottom: 92px; margin-top: auto; display: flex; justify-content: flex-end; padding: 0 16px 12px; pointer-events: none">
    <button class="btn btn-p" style="pointer-events: auto; min-height: 56px; padding: 0 22px; font-size: 15px; box-shadow: 0 12px 28px -10px var(--p)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.plus}}"></path></svg>新建分享</button>
  </div>

  <nav aria-label="底部导航" style="position: sticky; bottom: 0; display: flex; padding: 6px 8px 22px; background: var(--s); border-top: 1px solid var(--line)">
    <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="5">
      <a class="tab {{tb.cls}}" href="{{tb.href}}"><span class="tb"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{tb.d}}"></path></svg></span>{{tb.t}}</a>
    </sc-for>
  </nav>
</div>
</x-dc>
