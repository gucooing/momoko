<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Docker 连接配置 · 手机</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--pInk)}a:hover{color:var(--ink)}
.th-sakura-light{--p:#D6245F;--pOn:#FFFFFF;--pInk:#C8195A;--pSoft:#FFE3EE;--a:#FFC93C;--aOn:#2A1630;--aSoft:#FFF3CC;--a2:#7B5CFF;--a2Soft:#ECE6FF;--bg:#FFF6F9;--s:#FFFFFF;--s2:#FFF0F5;--line:#F6DCE6;--ink:#2A1630;--ink2:#6E5A72;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#B25E00;--warnSoft:#FFF0D9;--bad:#D21F3C;--badSoft:#FFE2E6}
.th-sakura-dark{--p:#FF4F8B;--pOn:#1A0B14;--pInk:#FF85AE;--pSoft:#3A1A2C;--a:#FFD25A;--aOn:#1A0B14;--aSoft:#3A3016;--a2:#A08BFF;--a2Soft:#2A2245;--bg:#140E17;--s:#1E1622;--s2:#271D2C;--line:#33263A;--ink:#F8EEF4;--ink2:#B9A6BE;--ok:#3DDC97;--okSoft:#123326;--warn:#FFB547;--warnSoft:#3A2A12;--bad:#FF6B81;--badSoft:#3A1720}
.th-mint-light{--p:#00805F;--pOn:#FFFFFF;--pInk:#007A5A;--pSoft:#D9F7EC;--a:#FFE14D;--aOn:#0F2A21;--aSoft:#FFF8CC;--a2:#2E9BFF;--a2Soft:#E0F0FF;--bg:#F3FBF7;--s:#FFFFFF;--s2:#EAF7F1;--line:#D3EDE2;--ink:#0F2A21;--ink2:#4F6B61;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#A35B00;--warnSoft:#FFF2D6;--bad:#D2263B;--badSoft:#FFE3E6}
.th-mint-dark{--p:#1FD3A0;--pOn:#0C1512;--pInk:#4BE3B6;--pSoft:#0F3329;--a:#FFE14D;--aOn:#0C1512;--aSoft:#33300F;--a2:#5BB4FF;--a2Soft:#12283A;--bg:#0C1512;--s:#13201B;--s2:#192A23;--line:#22362E;--ink:#EAF7F2;--ink2:#9DB8AE;--ok:#4BE3B6;--okSoft:#0F3329;--warn:#FFC14D;--warnSoft:#3A2E12;--bad:#FF6B7D;--badSoft:#3A1820}
.th-volt-light{--p:#3450FF;--pOn:#FFFFFF;--pInk:#2A44E6;--pSoft:#E3E8FF;--a:#FF7A1A;--aOn:#11163A;--aSoft:#FFE9D9;--a2:#00B8A9;--a2Soft:#D9F6F3;--bg:#F4F6FF;--s:#FFFFFF;--s2:#EDF0FF;--line:#DDE2F7;--ink:#11163A;--ink2:#555C80;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#B4530A;--warnSoft:#FFEBD9;--bad:#D32448;--badSoft:#FFE2E8}
.th-volt-dark{--p:#5B74FF;--pOn:#0D1024;--pInk:#8C9DFF;--pSoft:#1C2350;--a:#FF8A33;--aOn:#0D1024;--aSoft:#3A2312;--a2:#2FD9C8;--a2Soft:#10302F;--bg:#0D1024;--s:#161A35;--s2:#1D2242;--line:#272D52;--ink:#EEF0FF;--ink2:#A3A9CC;--ok:#3EDC9A;--okSoft:#113024;--warn:#FFAA55;--warnSoft:#3A2812;--bad:#FF6B86;--badSoft:#3A1626}
.th-grape-light{--p:#7C3AED;--pOn:#FFFFFF;--pInk:#6D28D9;--pSoft:#EFE6FF;--a:#FFD23F;--aOn:#1F1436;--aSoft:#FFF6CC;--a2:#E8457A;--a2Soft:#FFE3EC;--bg:#F8F5FF;--s:#FFFFFF;--s2:#F2ECFF;--line:#E4DAFA;--ink:#1F1436;--ink2:#625878;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#A35B00;--warnSoft:#FFF2D6;--bad:#D2263B;--badSoft:#FFE3E6}
.th-grape-dark{--p:#A78BFA;--pOn:#120C1F;--pInk:#C4B1FF;--pSoft:#2A1F4A;--a:#FFD23F;--aOn:#120C1F;--aSoft:#37300F;--a2:#FF7BA6;--a2Soft:#3A1A2A;--bg:#120C1F;--s:#1B1430;--s2:#241B3D;--line:#30264D;--ink:#F2EEFF;--ink2:#B2A8CC;--ok:#3DDC97;--okSoft:#123326;--warn:#FFB547;--warnSoft:#3A2A12;--bad:#FF6B81;--badSoft:#3A1720}
.th-sunset-light{--p:#C2410C;--pOn:#FFFFFF;--pInk:#B23A0A;--pSoft:#FFE6D6;--a:#FFC93C;--aOn:#2B1708;--aSoft:#FFF3CC;--a2:#2F6FED;--a2Soft:#E1EBFF;--bg:#FFF7F0;--s:#FFFFFF;--s2:#FFF0E5;--line:#F7DFCC;--ink:#2B1708;--ink2:#735A4B;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#9A5A00;--warnSoft:#FFF2D6;--bad:#C81E3A;--badSoft:#FFE3E6}
.th-sunset-dark{--p:#FF7A3D;--pOn:#1A0F08;--pInk:#FFA06E;--pSoft:#3A2114;--a:#FFD25A;--aOn:#1A0F08;--aSoft:#3A3016;--a2:#6EA0FF;--a2Soft:#172440;--bg:#150E09;--s:#22160E;--s2:#2C1D13;--line:#3A281B;--ink:#FFF1E8;--ink2:#C7AE9E;--ok:#3DDC97;--okSoft:#123326;--warn:#FFC14D;--warnSoft:#3A2E12;--bad:#FF6B7D;--badSoft:#3A1820}
.th-classic-light{--p:#0F7F72;--pOn:#FFFFFF;--pInk:#0B7266;--pSoft:#DDF3EF;--a:#FFB020;--aOn:#1B2333;--aSoft:#FFF1D6;--a2:#5B6CFF;--a2Soft:#E6E9FF;--bg:#F3F5F9;--s:#FFFFFF;--s2:#EEF1F6;--line:#E2E7EE;--ink:#1B2333;--ink2:#5F6878;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#A35B00;--warnSoft:#FFF2D6;--bad:#D2263B;--badSoft:#FFE3E6}
.th-classic-dark{--p:#2CC4AE;--pOn:#0E1116;--pInk:#5ED8C5;--pSoft:#12302C;--a:#FFB020;--aOn:#0E1116;--aSoft:#3A2E12;--a2:#8C98FF;--a2Soft:#1E2348;--bg:#0E1116;--s:#171B22;--s2:#1C212B;--line:#2B323D;--ink:#E8EBF1;--ink2:#9AA2B1;--ok:#3DDC97;--okSoft:#123326;--warn:#FFC14D;--warnSoft:#3A2E12;--bad:#FF6B7D;--badSoft:#3A1820}
.root{font-family:'Outfit','HarmonyOS Sans SC','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.root *{box-sizing:border-box}
.card{background:var(--s);border:1px solid var(--line);border-radius:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:0;font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--p);color:var(--pOn)}
.btn-s{background:var(--s2);color:var(--ink)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:var(--ink2);cursor:pointer;position:relative;flex:none}
.ib:hover{background:var(--s2);color:var(--ink)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.ok{background:var(--okSoft);color:var(--ok)}.off{background:var(--s2);color:var(--ink2)}.warn{background:var(--warnSoft);color:var(--warn)}.bad{background:var(--badSoft);color:var(--bad)}
.utab{display:inline-flex;align-items:center;min-height:44px;padding:0 2px;border-bottom:3px solid transparent;color:var(--ink2);text-decoration:none;font-size:15px;font-weight:700;flex:none}
.utab-on,.utab-on:hover{color:var(--ink);border-bottom-color:var(--p)}
.seg{display:flex;padding:4px;border-radius:999px;background:var(--s2);gap:2px}
.seg button{flex:1;min-height:44px;border-radius:999px;border:0;background:transparent;font:inherit;font-size:14px;font-weight:700;color:var(--ink2);cursor:pointer}
.seg .on{background:var(--s);color:var(--ink);box-shadow:0 1px 3px rgba(20,10,30,.12)}
.tg{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;flex:none}
.tg::after{content:'';position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.tg:checked{background:var(--p)}
.tg:checked::after{transform:translateX(20px)}
.row{display:flex;align-items:center;gap:14px;min-height:60px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.fs{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.rt{font-size:15px;font-weight:700}
.rd{font-size:12px;color:var(--ink2)}
.fld{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;padding:0 14px;border-radius:14px;background:var(--s2);border:1.5px solid transparent;color:var(--ink2)}
.fld:focus-within{border-color:var(--p);background:var(--s)}
.fld input,.fld select{flex:1;min-width:0;height:44px;border:0;background:transparent;font:inherit;font-size:15px;font-weight:600;color:var(--ink);outline:none;appearance:none;-webkit-appearance:none}
.fld .sfx{font-size:13px;font-weight:700;color:var(--ink2)}
.fp{display:flex;align-items:center;gap:10px;min-height:60px;padding:8px 4px 8px 10px;border-radius:16px;background:var(--s2);border:1.5px solid transparent}
.fp-empty{background:var(--s);border:1.5px dashed var(--line)}
.h{margin:0;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--ink2)}
.av{display:flex;align-items:center;justify-content:center;flex:none;font-weight:800}
.av-p{background:var(--pSoft);color:var(--pInk)}.av-a{background:var(--aSoft);color:var(--aOn)}.av-a2{background:var(--a2Soft);color:var(--ink)}.av-ok{background:var(--okSoft);color:var(--ok)}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
.num{font-family:'Outfit',sans-serif;font-variant-numeric:tabular-nums}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px;padding-top:6px;color:var(--ink2);text-decoration:none;font-size:11px;font-weight:600}
.tab .tb{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:999px}
.tab-on{color:var(--pInk)}.tab-on .tb{background:var(--pSoft)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
.hs{scrollbar-width:none;-ms-overflow-style:none}.hs::-webkit-scrollbar{display:none}
</style>
</helmet>
<div class="root th-{{palette}}-{{mode}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div class="hs" style="flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 180px">
    <header style="display: flex; align-items: center; gap: 10px; padding: 22px 12px 4px 20px">
      <h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.01em">Docker</h1>
      <span class="pill {{engSt}}">{{engStT}}</span>
      <span style="flex: 1"></span>
      <button class="ib" aria-label="切换深浅色" onClick="{{toggleDark}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{modeIcon}}"></path></svg></button>
    </header>
    <nav class="hs" aria-label="Docker 分类" style="display: flex; gap: 24px; padding: 0 20px; border-bottom: 1px solid var(--line); overflow-x: auto">
      <a class="utab" href="ContainersMobile.dc.html">容器 12</a>
      <a class="utab" href="ImagesMobile.dc.html">镜像 14</a>
      <a class="utab" href="NetworksMobile.dc.html">网络 5</a>
      <a class="utab utab-on" href="DockerConfigMobile.dc.html" aria-current="page">连接配置</a>
    </nav>

    <div style="padding: 16px; display: flex; flex-direction: column; gap: 22px">
      <article class="card" aria-label="引擎状态" style="padding: 16px 12px 6px 16px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 12px; padding-right: 4px">
          <span class="av av-a2" style="width: 46px; height: 46px; border-radius: 15px; transform: rotate(-5deg)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px"><path d="{{i.box}}"></path></svg></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 17px; font-weight: 800">Docker 引擎</span>
            <span class="mono" style="font-size: 12px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{addr}}</span>
          </span>
          <span class="pill {{engSt}}">{{engStT}}</span>
        </div>
        <dl style="margin: 0 4px 0 0; padding: 10px 12px; border-radius: 14px; background: var(--s2); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px">
          <sc-for list="{{engine}}" as="e" hint-placeholder-count="8">
            <div style="min-width: 0">
              <dt style="font-size: 11px; font-weight: 700; color: var(--ink2)">{{e.k}}</dt>
              <dd class="num" style="margin: 2px 0 0; font-size: 14px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{e.v}}</dd>
            </div>
          </sc-for>
        </dl>
        <div style="display: flex; align-items: center; gap: 8px; padding-top: 6px; border-top: 1px solid var(--line)">
          <span style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: {{testFg}}"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{testD}}"></path></svg>{{testT}}</span>
          <button class="btn" onClick="{{test}}" style="background: transparent; color: var(--pInk); padding: 0 12px"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.plug}}"></path></svg>测试连接</button>
        </div>
      </article>

      <section style="display: flex; flex-direction: column; gap: 10px">
        <h2 class="h">连接</h2>
        <div class="card" style="padding: 4px 16px">
          <label class="row" style="cursor: pointer">
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span class="rt">启用 Docker 管理</span><span class="rd">关闭后容器、镜像、网络页面不可用</span></span>
            <input class="tg" type="checkbox" role="switch" checked="{{enabled}}" onChange="{{toggleEnabled}}">
          </label>
          <div class="fs">
            <span class="rt">连接方式</span>
            <div class="seg" role="radiogroup" aria-label="连接方式">
              <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
                <button class="{{m.cls}}" role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}">{{m.t}}</button>
              </sc-for>
            </div>
          </div>
          <div class="fs">
            <label class="rt" for="m-addr">连接地址</label>
            <span class="fld"><input id="m-addr" class="mono" value="{{addr}}" style="font-size: 13px"></span>
            <span class="rd">{{addrHint}}</span>
          </div>
          <div class="fs">
            <label class="rt" for="m-api">API 版本</label>
            <span class="fld">
              <select id="m-api">
                <option>自动协商（当前 1.47）</option>
                <option>1.47</option>
                <option>1.45</option>
                <option>1.43</option>
              </select>
              <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="pointer-events: none"><path d="{{i.chevD}}"></path></svg>
            </span>
          </div>
          <div class="row">
            <label for="m-to" style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span class="rt">请求超时</span><span class="rd">单次 API 请求的最长等待</span></label>
            <span class="fld" style="width: 112px"><input id="m-to" class="num" value="30" inputmode="numeric"><span class="sfx">秒</span></span>
          </div>
        </div>
      </section>

      <section style="display: flex; flex-direction: column; gap: 10px">
        <h2 class="h">TLS</h2>
        <div class="card" style="padding: 4px 16px 8px">
          <label class="row" style="cursor: pointer">
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span class="rt">启用 TLS</span><span class="rd">TCP 连接用证书双向认证</span></span>
            <input class="tg" type="checkbox" role="switch" checked="{{tls}}" onChange="{{toggleTls}}">
          </label>
          <sc-if value="{{tlsShown}}" hint-placeholder-val="{{true}}">
            <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 0 8px; border-top: 1px solid var(--line)">
              <sc-for list="{{files}}" as="f" hint-placeholder-count="3">
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <span style="font-size: 12px; font-weight: 700; color: var(--ink2)">{{f.t}} <span class="mono">{{f.flag}}</span></span>
                  <div class="fp {{f.cls}}">
                    <span class="av {{f.av}}" style="width: 38px; height: 38px; border-radius: 12px"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{f.icon}}"></path></svg></span>
                    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
                      <span class="mono" style="font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{f.name}}</span>
                      <span style="font-size: 12px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{f.meta}}</span>
                    </span>
                    <button class="ib" aria-label="{{f.btn}}{{f.t}}" onClick="{{f.pick}}" style="color: {{f.pickC}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{f.pickD}}"></path></svg></button>
                    <sc-if value="{{f.has}}" hint-placeholder-val="{{true}}">
                      <button class="ib" aria-label="移除{{f.t}}" onClick="{{f.remove}}" style="color: var(--bad)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.trash}}"></path></svg></button>
                    </sc-if>
                  </div>
                </div>
              </sc-for>
            </div>
            <label class="row" style="cursor: pointer">
              <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span class="rt">跳过证书校验</span><span class="rd" style="color: var(--warn)">仅调试自签名证书时使用</span></span>
              <input class="tg" type="checkbox" role="switch">
            </label>
          </sc-if>
          <sc-if value="{{tlsHint}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; gap: 10px; margin: 4px 0 8px; padding: 12px 14px; border-radius: 14px; background: var(--s2); font-size: 13px; color: var(--ink2)">
              <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="margin-top: 1px"><path d="{{i.info}}"></path></svg>
              <span>{{tlsHintT}}</span>
            </div>
          </sc-if>
        </div>
      </section>

      <section style="display: flex; flex-direction: column; gap: 10px">
        <h2 class="h">默认</h2>
        <div class="card" style="padding: 4px 16px">
          <div class="fs" style="border-top: 0">
            <label class="rt" for="m-plat">默认平台</label>
            <span class="fld">
              <select id="m-plat" class="mono" style="font-size: 14px">
                <option>linux/amd64</option>
                <option>linux/arm64</option>
                <option>linux/arm/v7</option>
              </select>
              <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="pointer-events: none"><path d="{{i.chevD}}"></path></svg>
            </span>
          </div>
          <div class="row">
            <label for="m-job" style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span class="rt">任务超时</span><span class="rd">拉取、构建超时自动取消</span></label>
            <span class="fld" style="width: 124px"><input id="m-job" class="num" value="30" inputmode="numeric"><span class="sfx">分钟</span></span>
          </div>
        </div>
      </section>

      <section style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center">
          <h2 class="h" style="flex: 1">仓库认证 · {{regCount}}</h2>
        </div>
        <div class="card" style="padding: 4px 4px 12px 16px">
          <sc-for list="{{regs}}" as="r" hint-placeholder-count="4">
            <div class="row" style="padding-right: 0">
              <span class="av {{r.av}}" style="width: 40px; height: 40px; border-radius: 13px; font-size: 16px; transform: rotate({{r.rot}})">{{r.l}}</span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
                <span class="mono" style="font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.host}}</span>
                <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink2); min-width: 0"><span class="mono" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.user}}</span><span style="color: {{r.fg}}; font-weight: 700; white-space: nowrap">· {{r.stT}}</span></span>
              </span>
              <button class="ib" aria-label="移除 {{r.host}}" onClick="{{r.remove}}" style="color: var(--bad)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.trash}}"></path></svg></button>

          </sc-for>
          <div style="padding: 4px 12px 0 0">
            <button class="btn" style="width: 100%; min-height: 48px; background: transparent; border: 1.5px dashed var(--line); color: var(--pInk)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.plus}}"></path></svg>添加仓库凭据</button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <sc-if value="{{dirty}}" hint-placeholder-val="{{true}}">
    <div role="status" style="position: absolute; left: 12px; right: 12px; bottom: 96px; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 18px; border-radius: 999px; background: var(--ink); color: var(--bg); box-shadow: 0 16px 40px -12px rgba(20,10,30,.5)">
      <span style="flex: 1; min-width: 0; font-size: 14px; font-weight: 700">{{changes}} 项修改未保存</span>
      <button class="btn" onClick="{{discard}}" style="background: transparent; color: var(--bg); padding: 0 12px">放弃</button>
      <button class="btn" onClick="{{save}}" style="background: var(--a); color: var(--aOn)">保存并重连</button>
    </div>
  </sc-if>

  <nav aria-label="底部导航" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; padding: 6px 8px 22px; background: var(--s); border-top: 1px solid var(--line)">
    <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="5">

    </sc-for>
  </nav>
</div>
