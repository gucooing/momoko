<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>OIDC 授权确认 · PC</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--pInk)}a:hover{color:var(--ink)}
.th-sakura-light{--p:#D6245F;--pOn:#FFFFFF;--pInk:#C8195A;--pSoft:#FFE3EE;--a:#FFC93C;--aOn:#2A1630;--aSoft:#FFF3CC;--a2:#7B5CFF;--a2Soft:#ECE6FF;--bg:#FFF6F9;--s:#FFFFFF;--s2:#FFF0F5;--line:#F6DCE6;--ink:#2A1630;--ink2:#6E5A72;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#B25E00;--warnSoft:#FFF0D9;--bad:#D21F3C;--badSoft:#FFE2E6}
.th-sakura-dark{--p:#FF4F8B;--pOn:#1A0B14;--pInk:#FF85AE;--pSoft:#3A1A2C;--a:#FFD25A;--aOn:#1A0B14;--aSoft:#3A3016;--a2:#A08BFF;--a2Soft:#2A2245;--bg:#140E17;--s:#1E1622;--s2:#271D2C;--line:#33263A;--ink:#F8EEF4;--ink2:#B9A6BE;--ok:#3DDC97;--okSoft:#123326;--warn:#FFB547;--warnSoft:#3A2A12;--bad:#FF6B81;--badSoft:#3A1720}
.th-mint-light{--p:#00805F;--pOn:#FFFFFF;--pInk:#007A5A;--pSoft:#D9F7EC;--a:#FFE14D;--aOn:#0F2A21;--aSoft:#FFF8CC;--a2:#2E9BFF;--a2Soft:#E0F0FF;--bg:#F3FBF7;--s:#FFFFFF;--s2:#EAF7F1;--line:#D3EDE2;--ink:#0F2A21;--ink2:#4F6B61;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#A35B00;--warnSoft:#FFF2D6;--bad:#D2263B;--badSoft:#FFE3E6}
.th-mint-dark{--p:#1FD3A0;--pOn:#0C1512;--pInk:#4BE3B6;--pSoft:#0F3329;--a:#FFE14D;--aOn:#0C1512;--aSoft:#33300F;--a2:#5BB4FF;--a2Soft:#12283A;--bg:#0C1512;--s:#13201B;--s2:#192A23;--line:#22362E;--ink:#EAF7F2;--ink2:#9DB8AE;--ok:#4BE3B6;--okSoft:#0F3329;--warn:#FFC14D;--warnSoft:#3A2E12;--bad:#FF6B7D;--badSoft:#3A1820}
.th-volt-light{--p:#3450FF;--pOn:#FFFFFF;--pInk:#2A44E6;--pSoft:#E3E8FF;--a:#FF7A1A;--aOn:#11163A;--aSoft:#FFE9D9;--a2:#00B8A9;--a2Soft:#D9F6F3;--bg:#F4F6FF;--s:#FFFFFF;--s2:#EDF0FF;--line:#DDE2F7;--ink:#11163A;--ink2:#555C80;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#B4530A;--warnSoft:#FFEBD9;--bad:#D32448;--badSoft:#FFE2E8}
.th-volt-dark{--p:#5B74FF;--pOn:#0D1024;--pInk:#8C9DFF;--pSoft:#1C2350;--a:#FF8A33;--aOn:#0D1024;--aSoft:#3A2312;--a2:#2FD9C8;--a2Soft:#10302F;--bg:#0D1024;--s:#161A35;--s2:#1D2242;--line:#272D52;--ink:#EEF0FF;--ink2:#A3A9CC;--ok:#3EDC9A;--okSoft:#113024;--warn:#FFAA55;--warnSoft:#3A2812;--bad:#FF6B86;--badSoft:#3A1626}
.th-grape-light{--p:#7C3AED;--pOn:#FFFFFF;--pInk:#6D28D9;--pSoft:#EFE6FF;--a:#FFD23F;--aOn:#1F1436;--aSoft:#FFF6CC;--a2:#E8457A;--a2Soft:#FFE3EC;--bg:#F8F5FF;--s:#FFFFFF;--s2:#F2ECFF;--line:#E4DAFA;--ink:#1F1436;--ink2:#625878;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#A35B00;--warnSoft:#FFF2D6;--bad:#D2263B;--badSoft:#FFE3E6}
.th-grape-dark{--p:#A78BFA;--pOn:#120C1F;--pInk:#C4B1FF;--pSoft:#2A1F4A;--a:#FFD23F;--aOn:#120C1F;--aSoft:#37300F;--a2:#FF7BA6;--a2Soft:#3A1A2A;--bg:#120C1F;--s:#1B1430;--s2:#241B3D;--line:#30264D;--ink:#F2EEFF;--ink2:#B2A8CC;--ok:#3DDC97;--okSoft:#123326;--warn:#FFB547;--warnSoft:#3A2A12;--bad:#FF6B81;--badSoft:#3A1720}
.th-sunset-light{--p:#C2410C;--pOn:#FFFFFF;--pInk:#B23A0A;--pSoft:#FFE6D6;--a:#FFC93C;--aOn:#2B1708;--aSoft:#FFF3CC;--a2:#2F6FED;--a2Soft:#E1EBFF;--bg:#FFF7F0;--s:#FFFFFF;--s2:#FFF0E5;--line:#F7DFCC;--ink:#2B1708;--ink2:#735A4B;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#9A5A00;--warnSoft:#FFF2D6;--bad:#C81E3A;--badSoft:#FFE3E6}
.th-sunset-dark{--p:#FF7A3D;--pOn:#1A0F08;--pInk:#FFA06E;--pSoft:#3A2114;--a:#FFD25A;--aOn:#1A0F08;--aSoft:#3A3016;--a2:#6EA0FF;--a2Soft:#172440;--bg:#150E09;--s:#22160E;--s2:#2C1D13;--line:#3A281B;--ink:#FFF1E8;--ink2:#C7AE9E;--ok:#3DDC97;--okSoft:#123326;--warn:#FFC14D;--warnSoft:#3A2E12;--bad:#FF6B7D;--badSoft:#3A1820}
.th-classic-light{--p:#0F7F72;--pOn:#FFFFFF;--pInk:#0B7266;--pSoft:#DDF3EF;--a:#FFB020;--aOn:#1B2333;--aSoft:#FFF1D6;--a2:#5B6CFF;--a2Soft:#E6E9FF;--bg:#F3F5F9;--s:#FFFFFF;--s2:#EEF1F6;--line:#E2E7EE;--ink:#1B2333;--ink2:#5F6878;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#A35B00;--warnSoft:#FFF2D6;--bad:#D2263B;--badSoft:#FFE3E6}
.th-classic-dark{--p:#2CC4AE;--pOn:#0E1116;--pInk:#5ED8C5;--pSoft:#12302C;--a:#FFB020;--aOn:#0E1116;--aSoft:#3A2E12;--a2:#8C98FF;--a2Soft:#1E2348;--bg:#0E1116;--s:#171B22;--s2:#1C212B;--line:#2B323D;--ink:#E8EBF1;--ink2:#9AA2B1;--ok:#3DDC97;--okSoft:#123326;--warn:#FFC14D;--warnSoft:#3A2E12;--bad:#FF6B7D;--badSoft:#3A1820}
.root{font-family:'Outfit','HarmonyOS Sans SC','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.root *{box-sizing:border-box}
.card{background:var(--s);border:1px solid var(--line);border-radius:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:0;font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none;transition:transform .15s,filter .15s}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--p);color:var(--pOn)}.btn-p:hover{filter:brightness(1.08);color:var(--pOn)}
.btn-o{background:var(--s);color:var(--ink);border:1.5px solid var(--line)}.btn-o:hover{border-color:var(--p);color:var(--pInk)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:var(--ink2);cursor:pointer;flex:none}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.ok{background:var(--okSoft);color:var(--ok)}
.av{display:flex;align-items:center;justify-content:center;flex:none;font-weight:800}
.av-p{background:var(--pSoft);color:var(--pInk)}.av-a{background:var(--aSoft);color:var(--aOn)}.av-a2{background:var(--a2Soft);color:var(--ink)}.av-ok{background:var(--okSoft);color:var(--ok)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink2)}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
.sc{display:flex;align-items:center;gap:14px;min-height:64px;padding:8px 0}
.sc + .sc{border-top:1px solid var(--line)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
.hs{scrollbar-width:none;-ms-overflow-style:none}.hs::-webkit-scrollbar{display:none}
</style>
</helmet>
<div class="root th-{{palette}}-{{mode}}" style="min-height: 1000px; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 400px; background: var(--p); overflow: hidden">
    <div style="position: absolute; left: -90px; bottom: -150px; width: 380px; height: 380px; border-radius: 50%; background: var(--a)"></div>
    <div style="position: absolute; right: 12%; top: 70px; width: 150px; height: 150px; border-radius: 50%; border: 22px solid var(--a2)"></div>
    <svg viewBox="0 0 24 24" width="56" height="56" style="position: absolute; left: 24%; top: 120px; fill: var(--pOn)"><path d="M12 1.5l2.6 7.9 7.9 2.6-7.9 2.6L12 22.5l-2.6-7.9L1.5 12l7.9-2.6z"></path></svg>
  </div>

  <header style="position: relative; display: flex; align-items: center; gap: 12px; padding: 28px 48px; color: var(--pOn)">
    <div style="width: 44px; height: 44px; border-radius: 14px; background: var(--pOn); color: var(--p); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; transform: rotate(-6deg)">M</div>
    <span style="font-size: 24px; font-weight: 800">Momoko</span>
    <span style="font-size: 15px; font-weight: 700; padding-left: 12px; margin-left: 4px; border-left: 2px solid var(--pOn)">账号授权</span>
    <span style="flex: 1"></span>
    <button class="btn" style="min-height: 40px; padding: 0 14px; font-size: 13px; background: var(--pOn); color: var(--p)"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.globe}}"></path></svg>简体中文</button>
    <button class="ib" aria-label="切换深浅色" onClick="{{toggleDark}}" style="color: var(--aOn); background: var(--a)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{modeIcon}}"></path></svg></button>
  </header>

  <main style="position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; padding: 12px 24px 40px">
    <section class="card" aria-labelledby="authTitle" style="width: 100%; max-width: 540px; padding: 32px; display: flex; flex-direction: column; gap: 22px; box-shadow: 0 30px 60px -30px rgba(20,10,30,.35)">
      <div style="display: flex; align-items: center; justify-content: center; gap: 14px">
        <span class="av av-a" style="width: 68px; height: 68px; border-radius: 22px; font-size: 30px; transform: rotate(-6deg)">G</span>
        <span aria-hidden="true" style="display: flex; gap: 6px">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--line)"></span>
          <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--ink2)"></span>
          <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--line)"></span>
        </span>
        <span style="width: 40px; height: 40px; border-radius: 50%; background: var(--okSoft); color: var(--ok); display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.shield}}"></path></svg></span>
        <span aria-hidden="true" style="display: flex; gap: 6px">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--line)"></span>
          <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--ink2)"></span>
          <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--line)"></span>
        </span>
        <span style="width: 68px; height: 68px; border-radius: 22px; background: var(--p); color: var(--pOn); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; transform: rotate(5deg)">M</span>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
        <h1 id="authTitle" style="margin: 0; font-size: 26px; line-height: 1.3; font-weight: 800; letter-spacing: -0.01em">Grafana 想要使用你的<br>Momoko 账号登录</h1>
        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center">
          <span class="mono" style="font-size: 13px; font-weight: 600; color: var(--ink2)">grafana.[你的域名]</span>
          <span class="pill ok">已登记的应用</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; border-radius: 18px; background: var(--s2)">
        <span class="av av-a" style="width: 44px; height: 44px; border-radius: 50%; font-size: 17px">超</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 800">超级管理员</span>
          <span style="font-size: 13px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap">admin@[你的域名]</span>
        </span>
        <a href="LoginPC.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; font-size: 14px; font-weight: 700; text-decoration: none">切换账号</a>
      </div>

      <div style="display: flex; flex-direction: column">
        <div class="lbl" style="margin-bottom: 4px">Grafana 将获得以下信息</div>
        <ul style="list-style: none; margin: 0; padding: 0">
          <sc-for list="{{scopes}}" as="s" hint-placeholder-count="3">
            <li class="sc">
              <span class="av {{s.av}}" style="width: 42px; height: 42px; border-radius: 14px; transform: rotate({{s.rot}})"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{s.d}}"></path></svg></span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="display: flex; align-items: center; gap: 8px">
                  <span style="font-size: 15px; font-weight: 800">{{s.t}}</span>
                  <span class="mono" style="font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: var(--s2); color: var(--ink2)">{{s.k}}</span>
                </span>
                <span style="font-size: 13px; color: var(--ink2)">{{s.desc}}</span>
              </span>
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ok); stroke-width: 2.6"><path d="{{i.check}}"></path></svg>
            </li>
          </sc-for>
        </ul>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; border: 1.5px dashed var(--line)">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ink2)"><path d="{{i.redirect}}"></path></svg>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; font-weight: 700; color: var(--ink2)">授权后将跳转到</span>
          <span class="mono" style="font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap"><b>https://grafana.[你的域名]</b>/login/generic_oauth</span>
        </span>
      </div>

      <sc-if value="{{pending}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; gap: 12px">
          <button type="button" class="btn btn-o" onClick="{{deny}}" style="flex: 1; min-height: 56px; font-size: 16px">拒绝</button>
          <button type="button" class="btn btn-p" onClick="{{allow}}" style="flex: 1.4; min-height: 56px; font-size: 16px">允许<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.arrowR}}"></path></svg></button>
        </div>
      </sc-if>
      <sc-if value="{{decided}}" hint-placeholder-val="{{false}}">
        <div role="status" style="display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 16px; border-radius: 18px; background: {{resBg}}; color: {{resFg}}">
          <span style="width: 36px; height: 36px; border-radius: 12px; background: {{resFg}}; color: var(--s); display: flex; align-items: center; justify-content: center; flex: none; transform: rotate(-5deg)"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="{{resD}}"></path></svg></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 800">{{resT}}</span>
            <span style="font-size: 13px; color: var(--ink)">{{resSub}}</span>
          </span>
          <button type="button" class="btn btn-o" onClick="{{reset}}" style="min-height: 40px; padding: 0 14px; font-size: 13px">重新选择</button>
        </div>
      </sc-if>

      <p style="margin: 0; font-size: 12px; line-height: 1.6; color: var(--ink2); text-align: center">Momoko 不会把你的密码告诉 Grafana。<br>你可以随时在 <a href="ProfilePC.dc.html" style="font-weight: 700; text-decoration: none">个人中心</a> 撤销对它的授权。</p>
    </section>
    <div style="margin-top: 22px; font-size: 12px; color: var(--ink2)">Momoko 身份服务 · https://[你的域名]</div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["sakura","mint","volt","grape","sunset","classic"],"default":"sakura"},"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1000}}'>
const IC = {
  globe: 'M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zM3 12h18M12 3c2.4 2.5 3.6 5.5 3.6 9s-1.2 6.5-3.6 9c-2.4-2.5-3.6-5.5-3.6-9S9.6 5.5 12 3z',
  sun: 'M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',
  moon: 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z',
  shield: 'M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6zM9 12l2 2 4-4',
  check: 'M5 12.5l4.5 4.5L19 7.5',
  x: 'M6 6l12 12M18 6 6 18',
  arrowR: 'M5 12h14M13 6l6 6-6 6',
  idcard: 'M3 5h18v14H3zM8.5 9a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM5.5 16.5a3 3 0 0 1 6 0M14 10h4M14 14h3',
  user: 'M12 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM4 21a8 8 0 0 1 16 0',
  mail: 'M3 5h18v14H3zM3 6l9 7 9-7',
  redirect: 'M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5'
};
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const palette = this.props.palette ?? 'sakura';
    const dark = st.dark != null ? st.dark : (this.props.dark ?? false);
    const dec = st.dec || '';
    const allowed = dec === 'allow';
    return {
      palette,
      mode: dark ? 'dark' : 'light',
      i: IC,
      modeIcon: dark ? IC.sun : IC.moon,
      toggleDark: () => this.setState({ dark: !dark }),
      scopes: [
        { k: 'openid', t: '基本身份', desc: '确认是你本人，并提供一个唯一的用户 ID', d: IC.idcard, av: 'av-a2', rot: '-4deg' },
        { k: 'profile', t: '个人资料', desc: '用户名、昵称和头像', d: IC.user, av: 'av-p', rot: '3deg' },
        { k: 'email', t: '邮箱', desc: '邮箱地址及是否已验证', d: IC.mail, av: 'av-a', rot: '-2deg' }
      ],
      pending: !dec,
      decided: !!dec,
      allow: () => this.setState({ dec: 'allow' }),
      deny: () => this.setState({ dec: 'deny' }),
      reset: () => this.setState({ dec: '' }),
      resBg: allowed ? 'var(--okSoft)' : 'var(--badSoft)',
      resFg: allowed ? 'var(--ok)' : 'var(--bad)',
      resD: allowed ? IC.check : IC.x,
      resT: allowed ? '已允许，正在跳转到 Grafana…' : '已拒绝授权',
      resSub: allowed ? '几秒内没有跳转的话，回到 Grafana 重新点一次登录' : 'Grafana 不会获得你的任何信息，正在返回…'
    };
  }
}
</script>
</body>
</html>
