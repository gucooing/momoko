<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>工作台 · 手机</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--pInk)}a:hover{color:var(--ink)}
.th-sakura-light{--p:#D6245F;--pOn:#FFFFFF;--pInk:#C8195A;--pSoft:#FFE3EE;--a:#FFC93C;--aOn:#2A1630;--aSoft:#FFF3CC;--a2:#7B5CFF;--a2Soft:#ECE6FF;--bg:#FFF6F9;--s:#FFFFFF;--s2:#FFF0F5;--line:#F6DCE6;--ink:#2A1630;--ink2:#6E5A72;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#B25E00;--warnSoft:#FFF0D9;--bad:#D21F3C;--badSoft:#FFE2E6}
.th-sakura-dark{--p:#FF4F8B;--pOn:#1A0B14;--pInk:#FF85AE;--pSoft:#3A1A2C;--a:#FFD25A;--aOn:#1A0B14;--aSoft:#3A3016;--a2:#A08BFF;--a2Soft:#2A2245;--bg:#140E17;--s:#1E1622;--s2:#271D2C;--line:#33263A;--ink:#F8EEF4;--ink2:#B9A6BE;--ok:#3DDC97;--okSoft:#123326;--warn:#FFB547;--warnSoft:#3A2A12;--bad:#FF6B81;--badSoft:#3A1720}
.th-mint-light{--p:#00805F;--pOn:#FFFFFF;--pInk:#007A5A;--pSoft:#D9F7EC;--a:#FFE14D;--aOn:#0F2A21;--aSoft:#FFF8CC;--a2:#2E9BFF;--a2Soft:#E0F0FF;--bg:#F3FBF7;--s:#FFFFFF;--s2:#EAF7F1;--line:#D3EDE2;--ink:#0F2A21;--ink2:#4F6B61;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#A35B00;--warnSoft:#FFF2D6;--bad:#D2263B;--badSoft:#FFE3E6}
.th-mint-dark{--p:#1FD3A0;--pOn:#0C1512;--pInk:#4BE3B6;--pSoft:#0F3329;--a:#FFE14D;--aOn:#0C1512;--aSoft:#33300F;--a2:#5BB4FF;--a2Soft:#12283A;--bg:#0C1512;--s:#13201B;--s2:#192A23;--line:#22362E;--ink:#EAF7F2;--ink2:#9DB8AE;--ok:#4BE3B6;--okSoft:#0F3329;--warn:#FFC14D;--warnSoft:#3A2E12;--bad:#FF6B7D;--badSoft:#3A1820}
.th-volt-light{--p:#3450FF;--pOn:#FFFFFF;--pInk:#2A44E6;--pSoft:#E3E8FF;--a:#FF7A1A;--aOn:#11163A;--aSoft:#FFE9D9;--a2:#00B8A9;--a2Soft:#D9F6F3;--bg:#F4F6FF;--s:#FFFFFF;--s2:#EDF0FF;--line:#DDE2F7;--ink:#11163A;--ink2:#555C80;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#B4530A;--warnSoft:#FFEBD9;--bad:#D32448;--badSoft:#FFE2E8}
.th-volt-dark{--p:#5B74FF;--pOn:#0D1024;--pInk:#8C9DFF;--pSoft:#1C2350;--a:#FF8A33;--aOn:#0D1024;--aSoft:#3A2312;--a2:#2FD9C8;--a2Soft:#10302F;--bg:#0D1024;--s:#161A35;--s2:#1D2242;--line:#272D52;--ink:#EEF0FF;--ink2:#A3A9CC;--ok:#3EDC9A;--okSoft:#113024;--warn:#FFAA55;--warnSoft:#3A2812;--bad:#FF6B86;--badSoft:#3A1626}
.th-grape-light{--p:#7C3AED;--pOn:#FFFFFF;--pInk:#6D28D9;--pSoft:#EFE6FF;--a:#FFD23F;--aOn:#1F1436;--aSoft:#FFF6CC;--a2:#E8457A;--a2Soft:#FFE3EC;--bg:#F8F5FF;--s:#FFFFFF;--s2:#F2ECFF;--line:#E4DAFA;--ink:#1F1436;--ink2:#625878;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#A35B00;--warnSoft:#FFF2D6;--bad:#D2263B;--badSoft:#FFE3E6}
.th-grape-dark{--p:#A78BFA;--pOn:#120C1F;--pInk:#C4B1FF;--pSoft:#2A1F4A;--a:#FFD23F;--aOn:#120C1F;--aSoft:#37300F;--a2:#FF7BA6;--a2Soft:#3A1A2A;--bg:#120C1F;--s:#1B1430;--s2:#241B3D;--line:#30264D;--ink:#F2EEFF;--ink2:#B2A8CC;--ok:#3DDC97;--okSoft:#123326;--warn:#FFB547;--warnSoft:#3A2A12;--bad:#FF6B81;--badSoft:#3A1720}
.th-sunset-light{--p:#C2410C;--pOn:#FFFFFF;--pInk:#B23A0A;--pSoft:#FFE6D6;--a:#FFC93C;--aOn:#2B1708;--aSoft:#FFF3CC;--a2:#2F6FED;--a2Soft:#E1EBFF;--bg:#FFF7F0;--s:#FFFFFF;--s2:#FFF0E5;--line:#F7DFCC;--ink:#2B1708;--ink2:#735A4B;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#9A5A00;--warnSoft:#FFF2D6;--bad:#C81E3A;--badSoft:#FFE3E6}
.th-sunset-dark{--p:#FF7A3D;--pOn:#1A0F08;--pInk:#FFA06E;--pSoft:#3A2114;--a:#FFD25A;--aOn:#1A0F08;--aSoft:#3A3016;--a2:#6EA0FF;--a2Soft:#172440;--bg:#150E09;--s:#22160E;--s2:#2C1D13;--line:#3A281B;--ink:#FFF1E8;--ink2:#C7AE9E;--ok:#3DDC97;--okSoft:#123326;--warn:#FFC14D;--warnSoft:#3A2E12;--bad:#FF6B7D;--badSoft:#3A1820}
.th-classic-light{--p:#0F7F72;--pOn:#FFFFFF;--pInk:#0B7266;--pSoft:#DDF3EF;--a:#FFB020;--aOn:#1B2333;--aSoft:#FFF1D6;--a2:#5B6CFF;--a2Soft:#E6E9FF;--bg:#F3F5F9;--s:#FFFFFF;--s2:#EEF1F6;--line:#E2E7EE;--ink:#1B2333;--ink2:#5F6878;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#A35B00;--warnSoft:#FFF2D6;--bad:#D2263B;--badSoft:#FFE3E6}
.th-classic-dark{--p:#2CC4AE;--pOn:#0E1116;--pInk:#5ED8C5;--pSoft:#12302C;--a:#FFB020;--aOn:#0E1116;--aSoft:#3A2E12;--a2:#8C98FF;--a2Soft:#1E2348;--bg:#0E1116;--s:#171B22;--s2:#1C212B;--line:#2B323D;--ink:#E8EBF1;--ink2:#9AA2B1;--ok:#3DDC97;--okSoft:#123326;--warn:#FFC14D;--warnSoft:#3A2E12;--bad:#FF6B7D;--badSoft:#3A1820}
.root{font-family:'Outfit','HarmonyOS Sans SC','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.root *{box-sizing:border-box}
.card{background:var(--s);border:1px solid var(--line);border-radius:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:0;font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn-s{background:var(--s2);color:var(--ink)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:var(--ink2);cursor:pointer;position:relative;flex:none}
.ib:hover{background:var(--s2);color:var(--ink)}
.ib-bad:hover{background:var(--badSoft);color:var(--bad)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.ok{background:var(--okSoft);color:var(--ok)}.bad{background:var(--badSoft);color:var(--bad)}
.seg{display:flex;padding:4px;border-radius:999px;background:var(--s2);gap:2px}
.seg button{flex:1;min-height:40px;padding:0 6px;border-radius:999px;border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg .on{background:var(--s);color:var(--ink);box-shadow:0 1px 3px rgba(20,10,30,.12)}
.av{display:flex;align-items:center;justify-content:center;flex:none;font-weight:800}
.av-p{background:var(--pSoft);color:var(--pInk)}.av-a{background:var(--aSoft);color:var(--aOn)}.av-a2{background:var(--a2Soft);color:var(--ink)}.av-ok{background:var(--okSoft);color:var(--ok)}
.num{font-family:'Outfit',sans-serif;font-variant-numeric:tabular-nums}
.dot{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--p);border:2px solid var(--bg)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px;padding-top:6px;color:var(--ink2);text-decoration:none;font-size:11px;font-weight:600}
.tab .tb{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:999px}
.tab-on{color:var(--pInk)}.tab-on .tb{background:var(--pSoft)}
.tab:hover{color:var(--ink)}
button:focus-visible,a:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
</style>
</helmet>
<div class="root th-{{palette}}-{{mode}}" style="width: 390px; min-height: 1760px; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 10px; padding: 18px 16px 8px 20px">
    <span class="av av-a" style="width: 44px; height: 44px; border-radius: 50%; font-size: 17px">超</span>
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <span style="font-size: 13px; color: var(--ink2)">晚上好</span>
      <span style="font-size: 18px; font-weight: 800">超级管理员</span>
    </span>
    <button class="ib" aria-label="搜索"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.search}}"></path></svg></button>
    <a class="ib" href="ThemeMobile.dc.html" aria-label="外观与主题"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.1"><path d="{{i.palette}}"></path></svg></a>
    <button class="ib" aria-label="通知，3 条未读"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.bell}}"></path></svg><span class="dot"></span></button>
  </header>

  <div style="padding: 4px 16px 14px">
    <button style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px dashed var(--line); background: var(--s); font: inherit; font-size: 13px; font-weight: 700; color: var(--ink); cursor: pointer">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--ok)"></span>本机 · DESKTOP-K5K9BBC
      <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ink2)"><path d="{{i.updown}}"></path></svg>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 0 16px 24px">
    <section style="background: var(--p); color: var(--pOn); border-radius: 28px; padding: 22px; position: relative; overflow: hidden">
      <div aria-hidden="true" style="position: absolute; right: -50px; top: -60px; width: 170px; height: 170px; border-radius: 50%; background: var(--a)"></div>
      <div aria-hidden="true" style="position: absolute; right: 90px; top: 40px; width: 48px; height: 48px; border-radius: 50%; border: 9px solid var(--a2)"></div>
      <div style="position: relative; display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 13px; font-weight: 600; opacity: 0.9">周二 · 11 月 3 日</div>
        <h1 style="margin: 0; font-size: 28px; font-weight: 800; line-height: 1.15">一切运行正常</h1>
        <div style="font-size: 14px; opacity: 0.92">5 个应用在跑 · 已运行 7 天 1 小时</div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px">
          <a href="AppsMobile.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; border-radius: 18px; background: var(--pOn); color: var(--p); text-decoration: none; font-size: 13px; font-weight: 700"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.plus}}"></path></svg>新建应用</a>
          <button style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; border-radius: 18px; border: 0; background: color-mix(in srgb, var(--pOn) 18%, transparent); color: var(--pOn); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.terminal}}"></path></svg>终端</button>
          <button style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; border-radius: 18px; border: 0; background: color-mix(in srgb, var(--pOn) 18%, transparent); color: var(--pOn); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.upload}}"></path></svg>上传</button>
        </div>
      </div>
    </section>

    <section class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px">
        <h2 style="margin: 0; font-size: 16px; font-weight: 800">需要你看一眼</h2>
        <span class="num" style="min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--p); color: var(--pOn); font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center">3</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px">
        <span class="av bad" style="width: 40px; height: 40px; border-radius: 13px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.alert}}"></path></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
          <span style="font-size: 14px; font-weight: 700">redis-cache 已退出</span>
          <span style="font-size: 12px; color: var(--ink2)">退出码 137 · 12 分钟前</span>
        </span>
        <button class="btn btn-s" style="min-height: 40px; padding: 0 14px; font-size: 13px">重启</button>
      </div>
      <a href="#" style="font-size: 13px; font-weight: 700; text-decoration: none">还有 2 条 →</a>
    </section>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{stats}}" as="st" hint-placeholder-count="4">
        <div class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 10px; border-radius: 22px">
          <div style="display: flex; align-items: center; justify-content: space-between">
            <span style="font-size: 13px; font-weight: 700; color: var(--ink2)">{{st.label}}</span>
            <svg viewBox="0 0 64 64" width="36" height="36" aria-hidden="true"><circle cx="32" cy="32" r="26" style="fill: none; stroke: var(--s2); stroke-width: 10"></circle><circle cx="32" cy="32" r="26" transform="rotate(-90 32 32)" stroke-dasharray="{{st.dash}}" stroke-linecap="round" style="fill: none; stroke: {{st.color}}; stroke-width: 10"></circle></svg>
          </div>
          <div class="num" style="font-size: 26px; line-height: 1; font-weight: 800">{{st.value}}</div>
          <div style="font-size: 12px; color: var(--ink2)">{{st.sub}}</div>
        </div>
      </sc-for>
    </div>

    <section class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center">
        <h2 style="margin: 0; font-size: 16px; font-weight: 800">实时监控</h2>
        <span style="flex: 1"></span>
        <span class="num" style="font-size: 12px; font-weight: 700; color: var(--ink2)">每 3 秒</span>
      </div>
      <div class="seg" role="tablist" aria-label="监控指标">
        <sc-for list="{{metrics}}" as="m" hint-placeholder-count="4">
          <button class="{{m.cls}}" role="tab" onClick="{{m.pick}}">{{m.t}}</button>
        </sc-for>
      </div>
      <div style="display: flex; align-items: baseline; gap: 8px">
        <span class="num" style="font-size: 30px; font-weight: 800">{{chart.now}}</span>
        <span style="font-size: 12px; color: var(--ink2)">峰值 {{chart.peak}}</span>
      </div>
      <svg viewBox="0 0 600 194" preserveAspectRatio="none" role="img" aria-label="{{chart.label}} 趋势" style="width: 100%; height: 130px; display: block">
        <line x1="0" y1="97" x2="600" y2="97" style="stroke: var(--line); stroke-dasharray: 4 6"></line>
        <line x1="0" y1="193" x2="600" y2="193" style="stroke: var(--line)"></line>
        <path d="{{chart.area}}" style="fill: var(--p); opacity: 0.14"></path>
        <path d="{{chart.line}}" vector-effect="non-scaling-stroke" style="fill: none; stroke: var(--p); stroke-width: 3; stroke-linejoin: round"></path>
      </svg>
    </section>

    <section class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px">
        <h2 style="margin: 0; font-size: 16px; font-weight: 800">运行中</h2>
        <span class="pill ok">5</span>
        <span style="flex: 1"></span>
        <a href="AppsMobile.dc.html" style="font-size: 13px; font-weight: 700; text-decoration: none">全部 →</a>
      </div>
      <sc-for list="{{running}}" as="r" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; padding: 6px 0">
          <span class="av {{r.cls}}" style="width: 40px; height: 40px; border-radius: 13px; font-size: 16px">{{r.l}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <span style="font-size: 14px; font-weight: 700">{{r.n}}</span>
            <span style="font-size: 12px; color: var(--ink2)">{{r.s}}</span>
          </span>
          <button class="ib" aria-label="打开 {{r.n}} 控制台"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.terminal}}"></path></svg></button>
          <button class="ib ib-bad" aria-label="停止 {{r.n}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.stop}}"></path></svg></button>
        </div>
      </sc-for>
    </section>

    <section class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 800">快捷入口</h2>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 4px">
        <sc-for list="{{quick}}" as="q" hint-placeholder-count="8">
          <a href="{{q.href}}" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 4px 0; text-decoration: none; color: var(--ink); font-size: 12px; font-weight: 600">
            <span style="width: 52px; height: 52px; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: {{q.bg}}; color: {{q.fg}}; transform: rotate({{q.rot}})"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{q.d}}"></path></svg></span>
            {{q.t}}
          </a>
        </sc-for>
      </div>
    </section>
  </div>

  <nav aria-label="底部导航" style="position: sticky; bottom: 0; margin-top: auto; display: flex; padding: 6px 8px 22px; background: var(--s); border-top: 1px solid var(--line)">
    <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="5">
      <a class="tab {{tb.cls}}" href="{{tb.href}}"><span class="tb"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{tb.d}}"></path></svg></span>{{tb.t}}</a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["sakura","mint","volt","grape","sunset","classic"],"default":"sakura"},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1760}}'>
const IC = {

  forward: 'M4 6v12M8 12h12M15 7l5 5-5 5',
  tunnel: 'M3 20v-8a9 9 0 0 1 18 0v8M8 20v-7a4 4 0 0 1 8 0v7',
  terminal: 'M4 4h16v16H4zM8 9l3 3-3 3M13 15h3',
  spark: 'M12 3l2.2 6.3L20.5 12l-6.3 2.2L12 20.5l-2.2-6.3L3.5 12l6.3-2.7z',
  server: 'M3 4h18v7H3zM3 13h18v7H3zM7 7.5h.01M7 16.5h.01',
  image: 'M3 5h18v14H3zM3 16l5-5 4 4 3-3 6 6M15.5 9h.01',

function build(s) {

  const fmt = (v) => (v >= 100 ? Math.round(v) : v.toFixed(1)) + s.unit;
