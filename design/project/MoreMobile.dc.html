.th-sunset-dark{--p:#FF7A3D;--pOn:#1A0F08;--pInk:#FFA06E;--pSoft:#3A2114;--a:#FFD25A;--aOn:#1A0F08;--aSoft:#3A3016;--a2:#6EA0FF;--a2Soft:#172440;--bg:#150E09;--s:#22160E;--s2:#2C1D13;--line:#3A281B;--ink:#FFF1E8;--ink2:#C7AE9E;--ok:#3DDC97;--okSoft:#123326;--warn:#FFC14D;--warnSoft:#3A2E12;--bad:#FF6B7D;--badSoft:#3A1820}
.th-classic-light{--p:#0F7F72;--pOn:#FFFFFF;--pInk:#0B7266;--pSoft:#DDF3EF;--a:#FFB020;--aOn:#1B2333;--aSoft:#FFF1D6;--a2:#5B6CFF;--a2Soft:#E6E9FF;--bg:#F3F5F9;--s:#FFFFFF;--s2:#EEF1F6;--line:#E2E7EE;--ink:#1B2333;--ink2:#5F6878;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#A35B00;--warnSoft:#FFF2D6;--bad:#D2263B;--badSoft:#FFE3E6}
.th-classic-dark{--p:#2CC4AE;--pOn:#0E1116;--pInk:#5ED8C5;--pSoft:#12302C;--a:#FFB020;--aOn:#0E1116;--aSoft:#3A2E12;--a2:#8C98FF;--a2Soft:#1E2348;--bg:#0E1116;--s:#171B22;--s2:#1C212B;--line:#2B323D;--ink:#E8EBF1;--ink2:#9AA2B1;--ok:#3DDC97;--okSoft:#123326;--warn:#FFC14D;--warnSoft:#3A2E12;--bad:#FF6B7D;--badSoft:#3A1820}
.root{font-family:'Outfit','HarmonyOS Sans SC','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.root *{box-sizing:border-box}
.card{background:var(--s);border:1px solid var(--line);border-radius:24px}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:var(--ink2);cursor:pointer;position:relative;flex:none;text-decoration:none}
.ib:hover{background:var(--s2);color:var(--ink)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:16px;height:16px}
.av{display:flex;align-items:center;justify-content:center;flex:none;font-weight:800}
.num{font-family:'Outfit',sans-serif;font-variant-numeric:tabular-nums}
.dot{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--p);border:2px solid var(--bg)}
.inp{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 16px;border-radius:999px;background:var(--s);border:1.5px solid var(--line);color:var(--ink2)}
.inp:focus-within{border-color:var(--p)}
.inp input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);outline:none}
.inp input::placeholder{color:var(--ink2)}
.h{margin:0 0 8px 6px;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--ink2)}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 2px 6px;border-radius:18px;color:var(--ink);text-decoration:none;font-size:12px;font-weight:700;text-align:center;line-height:1.25}
.tile:hover{background:var(--s2);color:var(--ink)}
.stk{position:relative;width:52px;height:52px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.bdg{position:absolute;top:-6px;right:-8px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--p);color:var(--pOn);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--s)}
.grp{background:var(--s);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 14px;border:0;background:transparent;font:inherit;color:var(--ink);text-decoration:none;text-align:left;cursor:pointer}
a.srow:hover,button.srow:hover{background:var(--s2);color:var(--ink)}
.srow + .srow{border-top:1px solid var(--line)}
.sk{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:11px;flex:none}
.sk .ic{width:18px;height:18px}
.nd{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 12px;border:0;border-radius:14px;background:transparent;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.nd:hover{background:var(--s2)}
.nd-on,.nd-on:hover{background:var(--pSoft)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px;padding-top:6px;color:var(--ink2);text-decoration:none;font-size:11px;font-weight:600}
.tab .tb{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:999px}
.tab-on{color:var(--pInk)}.tab-on .tb{background:var(--pSoft)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
.hs{scrollbar-width:none;-ms-overflow-style:none}.hs::-webkit-scrollbar{display:none}
</style>
</helmet>
<div class="root th-{{palette}}-{{mode}}" style="width: 390px; min-height: 1680px; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 4px; padding: 22px 12px 10px 20px">
    <h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.01em; flex: 1">更多</h1>
    <button class="ib" aria-label="切换深浅色" onClick="{{toggleDark}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{modeIcon}}"></path></svg></button>
    <button class="ib" aria-label="通知，3 条未读"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.bell}}"></path></svg><span class="dot"></span></button>
  </header>

  <div style="display: flex; flex-direction: column; gap: 20px; padding: 0 16px 28px">
    <section aria-label="账号与节点" style="background: var(--p); color: var(--pOn); border-radius: 28px; padding: 18px; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 14px">
      <div aria-hidden="true" style="position: absolute; right: -46px; top: -62px; width: 160px; height: 160px; border-radius: 50%; background: var(--a)"></div>
      <div aria-hidden="true" style="position: absolute; right: 110px; bottom: -26px; width: 54px; height: 54px; border-radius: 50%; border: 10px solid var(--a2)"></div>
      <a href="ProfileMobile.dc.html" style="position: relative; display: flex; align-items: center; gap: 14px; color: var(--pOn); text-decoration: none; min-height: 64px">
        <span class="av" style="width: 60px; height: 60px; border-radius: 20px; font-size: 26px; background: var(--a); color: var(--aOn); border: 3px solid var(--pOn); transform: rotate(-5deg)">超</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <span style="font-size: 20px; font-weight: 800">超级管理员</span>
          <span style="font-size: 13px; opacity: 0.95">admin@momoko.local · 个人中心</span>
        </span>
        <span style="width: 36px; height: 36px; border-radius: 50%; background: var(--pOn); color: var(--p); display: flex; align-items: center; justify-content: center; flex: none"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.4"><path d="{{i.chevR}}"></path></svg></span>
      </a>
      <button aria-expanded="{{nodeExp}}" onClick="{{toggleNode}}" style="position: relative; align-self: flex-start; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 0; background: color-mix(in srgb, var(--pOn) 20%, transparent); color: var(--pOn); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--a)"></span>{{node.tag}} · {{node.n}}
        <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.updown}}"></path></svg>
      </button>
    </section>

    <sc-if value="{{nodeOpen}}" hint-placeholder-val="{{false}}">
      <div class="card" role="listbox" aria-label="切换节点" style="padding: 8px; margin-top: -8px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 16px 36px -18px rgba(20,10,30,.35)">
        <sc-for list="{{nodes}}" as="nd" hint-placeholder-count="3">
          <button class="nd {{nd.cls}}" role="option" aria-selected="{{nd.sel}}" onClick="{{nd.pick}}">
            <span class="av" style="width: 34px; height: 34px; border-radius: 11px; background: var(--a2Soft); color: var(--ink)"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.server}}"></path></svg></span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
              <span style="font-size: 14px; font-weight: 700">{{nd.n}}</span>
              <span style="font-size: 12px; font-weight: 700; color: {{nd.c}}">● {{nd.tag}} · {{nd.s}}</span>
            </span>
            <sc-if value="{{nd.on}}" hint-placeholder-val="{{false}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--pInk); stroke-width: 2.6"><path d="{{i.check}}"></path></svg></sc-if>
          </button>
        </sc-for>
        <a href="NodesMobile.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 13px; font-weight: 700; text-decoration: none">管理节点 →</a>
      </div>
    </sc-if>

    <label class="inp">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.search}}"></path></svg>
      <input type="search" placeholder="搜索功能，例如 端口转发" aria-label="搜索功能">
    </label>

    <div style="display: flex; flex-wrap: wrap; gap: 20px 12px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
        <section aria-label="{{g.t}}" style="flex: {{g.flex}}; min-width: 0">
          <h2 class="h">{{g.t}}</h2>
          <div class="card" style="padding: 10px 8px; border-radius: 22px; display: grid; grid-template-columns: repeat({{g.cols}}, minmax(0, 1fr)); gap: 6px 2px">
            <sc-for list="{{g.items}}" as="it" hint-placeholder-count="4">
              <a class="tile" href="{{it.href}}">
                <span class="stk" style="background: {{it.bg}}; color: {{it.fg}}; transform: rotate({{it.rot}})">
                  <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><path d="{{it.d}}"></path></svg>
                  <sc-if value="{{it.badge}}" hint-placeholder-val="{{false}}"><span class="bdg num" aria-label="{{it.badge}} 个进行中">{{it.badge}}</span></sc-if>
                </span>
                {{it.t}}
              </a>
            </sc-for>
          </div>
        </section>
      </sc-for>
    </div>

    <section aria-labelledby="mine-h">
      <h2 id="mine-h" class="h">我的</h2>
      <div class="grp">
        <a class="srow" href="ProfileMobile.dc.html">
          <span class="sk" style="background: var(--p); color: var(--pOn); transform: rotate(-3deg)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.user}}"></path></svg></span>
          <span style="flex: 1; font-size: 15px; font-weight: 700">个人中心</span>
          <span style="font-size: 13px; color: var(--ink2)">资料 · 安全 · 设备</span>
          <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ink2)"><path d="{{i.chevR}}"></path></svg>
        </a>
        <a class="srow" href="ThemeMobile.dc.html">
          <span class="sk" style="background: var(--a); color: var(--aOn); transform: rotate(3deg)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.1"><path d="{{i.palette}}"></path></svg></span>
          <span style="flex: 1; font-size: 15px; font-weight: 700">外观</span>
          <span style="font-size: 13px; color: var(--ink2)">樱桃汽水 · 浅色</span>
          <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ink2)"><path d="{{i.chevR}}"></path></svg>
        </a>
        <a class="srow" href="#">
          <span class="sk" style="background: var(--a2); color: #FFFFFF; transform: rotate(-2deg)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.globe}}"></path></svg></span>
          <span style="flex: 1; font-size: 15px; font-weight: 700">语言</span>
          <span style="font-size: 13px; color: var(--ink2)">简体中文</span>
          <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ink2)"><path d="{{i.chevR}}"></path></svg>
        </a>
        <button class="srow" style="color: var(--bad)">
          <span class="sk" style="background: var(--badSoft); color: var(--bad)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.logout}}"></path></svg></span>
          <span style="flex: 1; font-size: 15px; font-weight: 800">退出登录</span>
        </button>
      </div>
    </section>

    <div style="text-align: center; font-size: 12px; color: var(--ink2)">Momoko [版本号] · 已连接 3 个节点</div>
  </div>

  <nav aria-label="底部导航" style="position: sticky; bottom: 0; margin-top: auto; display: flex; padding: 6px 8px 22px; background: var(--s); border-top: 1px solid var(--line)">
    <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="5">
      <a class="tab {{tb.cls}}" href="{{tb.href}}"><span class="tb"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{tb.d}}"></path></svg></span>{{tb.t}}</a>
    </sc-for>
  </nav>
</div>
</x-dc>
