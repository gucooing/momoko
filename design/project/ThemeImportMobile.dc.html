.gsw{width:64px;height:44px;border-radius:14px;border:2px solid var(--line);cursor:pointer;padding:0}
.gsw-on{border-color:var(--p);box-shadow:0 0 0 3px var(--pSoft)}
.stopc{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 7px;border-radius:999px;background:var(--s);border:1px solid var(--line)}
.pat{display:flex;flex-direction:column;gap:6px;padding:6px 6px 8px;border-radius:16px;border:2px solid var(--line);background:var(--s);font:inherit;color:var(--ink);cursor:pointer;text-align:center}
.pat-on{border-color:var(--p);box-shadow:0 0 0 3px var(--pSoft)}
.tagc{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:var(--s2);font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.mb{position:absolute;top:0;left:0;right:0;height:1000px;z-index:50;background:rgba(20,10,30,.45);display:flex;align-items:center;justify-content:center;padding:24px}
.dlg{display:flex;flex-direction:column;max-width:100%;max-height:100%;overflow:hidden;box-shadow:0 30px 70px -30px rgba(20,10,30,.6);background:var(--s)!important;backdrop-filter:none!important}
.dlg-h{display:flex;align-items:center;gap:12px;padding:20px 16px 14px 24px}
.dlg-f{display:flex;align-items:center;gap:10px;padding:14px 24px 20px;border-top:1px solid var(--line)}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
.hs{scrollbar-width:none;-ms-overflow-style:none}.hs::-webkit-scrollbar{display:none}
.tg:disabled{opacity:.55;cursor:not-allowed}
.ipv{position:relative;height:230px;border-radius:18px;overflow:hidden;color:var(--ink);border:1px solid var(--line)}
.ipg{background:color-mix(in srgb,var(--s) 72%,transparent);backdrop-filter:blur(10px);border-radius:12px;border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.ipchips{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(15,10,25,.62);backdrop-filter:blur(8px)}
.ipchips button,.pvseg button{min-height:28px;padding:0 11px;border-radius:999px;border:0;background:transparent;color:rgba(255,255,255,.75);font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.ipchips .on,.pvseg .on{background:#FFFFFF;color:#2A1630}
.pvbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 8px;border-radius:999px;background:rgba(15,10,25,.9);color:#FFFFFF;box-shadow:0 18px 40px -16px rgba(0,0,0,.6);backdrop-filter:blur(10px)}
.pvseg{display:inline-flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.12)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--s);color:var(--ink2);font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.chip:hover{border-color:var(--p);color:var(--pInk)}
.chip-on,.chip-on:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip-sm{min-height:34px;padding:0 12px;font-size:13px}
.seg button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-on{background:var(--ink);color:var(--bg)}
.sheet{max-height:92%;background:var(--s);border-radius:28px 28px 0 0;display:flex;flex-direction:column;overflow:hidden}
.tg:disabled{opacity:.55;cursor:not-allowed}
.btn-p{background:var(--p);color:var(--pOn)}
.mini{height:auto}
.btn{text-decoration:none}
.btn-s{background:var(--s2);color:var(--ink)}
.btn-sm{min-height:36px;padding:0 14px;font-size:13px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink2)}
.num{font-family:'Outfit',sans-serif;font-variant-numeric:tabular-nums}
.av{display:flex;align-items:center;justify-content:center;flex:none;font-weight:800}
.seg button{white-space:nowrap}
.inp{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border-radius:999px;background:var(--s);border:1.5px solid var(--line);color:var(--ink2)}
.inp input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);outline:none}
.tchip{display:inline-flex;align-items:center;gap:6px;flex:none;min-height:38px;padding:0 12px 0 8px;border-radius:999px;border:1.5px solid var(--line);background:var(--s);font:inherit;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;white-space:nowrap}
.tchip.tok-on{border-color:var(--p);background:var(--pSoft)}
.btn-on{background:var(--ink);color:var(--bg)}
.tname{border:0;background:transparent;font:inherit;font-size:17px;font-weight:800;color:var(--ink);padding:0;width:200px;outline:none}
.tok{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 8px;border-radius:14px;border:0;background:transparent;font:inherit;color:var(--ink);cursor:pointer;width:100%}
.tok:hover{background:var(--s2)}
.tok-on,.tok-on:hover{background:var(--pSoft)}
.sw{width:30px;height:30px;border-radius:10px;border:1px solid rgba(0,0,0,.1);flex:none}
.tagx{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:999px;background:var(--aSoft);color:var(--aOn);font-size:10px;font-weight:800;white-space:nowrap}
.dotx{width:7px;height:7px;border-radius:50%;background:var(--p);display:inline-block;flex:none}
.menu{padding:6px;box-shadow:0 20px 50px -20px rgba(20,10,30,.4)}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:6px 8px;border:0;border-radius:12px;background:transparent;font:inherit;color:var(--ink);cursor:pointer}
.mi:hover{background:var(--s2)}
.frame{background:#FFFFFF;border:1px solid var(--line);overflow:hidden;box-shadow:0 24px 50px -30px rgba(20,10,30,.35);max-width:100%;flex:none}
.frame-bar{display:flex;align-items:center;gap:10px;height:30px;padding:0 12px;background:#F4F1F6;border-bottom:1px solid #E6E0EA}
.frame-bar i{width:9px;height:9px;border-radius:50%;display:block}
.pv{color:var(--ink);background:var(--bg);font-size:13px}
.pv-card{background:var(--s);border:1px solid var(--line);border-radius:var(--r)}
.pv-sb{background:var(--s)}
.glass .pv-card,.glass .pv-sb,.glass .pv-tabbar{background:color-mix(in srgb,var(--s) var(--cardA),transparent);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3)}
.pv-nav{display:flex;align-items:center;min-height:30px;padding:0 10px;border-radius:10px;font-size:12px;color:var(--ink2)}
.pv-nav-on{background:var(--pSoft);color:var(--pInk);font-weight:700}
.pv-btn{display:inline-flex;align-items:center;min-height:30px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:700}
.pv-chip{display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--s);font-size:11px;font-weight:600;color:var(--ink2)}
.pv-pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.pv-pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pv-ib{width:24px;height:24px;border-radius:8px;background:var(--s2)}
.pv-tabbar{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;padding:6px 6px 18px;background:var(--s);border-top:1px solid var(--line)}
.pv-tabbar span{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--ink2)}
.pv-tabbar i{width:40px;height:22px;border-radius:999px;background:var(--s2);display:block}
.pv-tabbar .on{color:var(--pInk)}.pv-tabbar .on i{background:var(--pSoft)}
.hot{outline:2px dashed #7B5CFF;outline-offset:3px}
.picking{cursor:crosshair}
.pv-note{position:absolute;right:12px;z-index:5;display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:rgba(20,10,30,.8);color:#FFFFFF;font-size:11px;font-weight:700}
.sv{position:relative;height:150px;border-radius:14px}
.sv span{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:3px solid #FFFFFF;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.hue{position:relative;height:14px;border-radius:999px;background:linear-gradient(90deg,#F00,#FF0,#0F0,#0FF,#00F,#F0F,#F00)}
.hue span{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.sgw{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);cursor:pointer;padding:0}
.sgw-on{box-shadow:0 0 0 2px var(--s),0 0 0 4px var(--p)}
.tg:disabled{opacity:.55;cursor:not-allowed}
</style>
</helmet>
<div class="root th-{{palette}}-{{mode}} {{glassCls}}" style="position: relative; width: 390px; min-height: {{rootMin}}; height: {{rootH}}; overflow: hidden; display: flex; flex-direction: column; --cardA: {{cardA}}%">
  <div aria-hidden="true" style="position: absolute; inset: -40px; z-index: 0; background: {{bgCss}}; filter: blur({{blurPx}})"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 0; background: color-mix(in srgb, var(--bg) {{dim}}%, transparent)"></div>

  <header style="position: relative; z-index: 1; display: flex; align-items: center; gap: 4px; padding: 14px 12px 8px">
    <a class="ib" href="MoreMobile.dc.html" aria-label="返回"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.chevL}}"></path></svg></a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 800; flex: 1">外观</h1>
    <button class="ib" aria-label="导入主题包" onClick="{{openImport}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.upload}}"></path></svg></button>
    <button class="ib" onClick="{{reset}}" style="width: auto; padding: 0 12px; font: inherit; font-size: 14px; font-weight: 700; color: var(--pInk)">恢复默认</button>
  </header>

  <div style="position: relative; z-index: 1; padding: 4px 16px 32px; display: flex; flex-direction: column; gap: 22px">
    <!-- 当前主题 -->
    <section class="card" style="padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; gap: 12px; align-items: center">
        <span class="mini" style="flex: none; width: 112px; height: 76px; background: {{bgCss}}; padding: 6px">
          <span class="mini-main"><span class="mini-hero" style="background: var(--p)"><span style="background: var(--a)"></span></span><span class="mini-row"><span class="mini-glass"></span><span class="mini-glass"></span></span></span>
        </span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <span class="lbl">当前主题</span>
          <span style="font-size: 18px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{cur.n}}</span>
          <span style="font-size: 12px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">背景 · {{bgName}} · {{cur.pagesT}}</span>
        </span>
      </div>
      <div style="display: flex; gap: 8px">
        <a class="btn btn-p" href="ThemeEditorMobile.dc.html" style="flex: 1"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.pen}}"></path></svg>在线编辑</a>
        <button class="btn btn-s" style="flex: 1" onClick="{{openExport}}"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.download}}"></path></svg>导出主题包</button>
      </div>
    </section>

    <!-- 主题 -->
    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center"><h2 class="h" style="flex: 1">主题</h2><a href="ThemeEditorMobile.dc.html" style="font-size: 14px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; min-height: 44px"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.4"><path d="{{i.plus}}"></path></svg>新建</a></div>
      <div class="hs" style="display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 6px">
        <sc-for list="{{themes}}" as="t" hint-placeholder-count="10">
          <button class="pc {{t.cls}}" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="flex: none; width: 136px; gap: 8px; padding: 8px">
            <span class="th-{{t.base}}-{{mode}} mini" style="height: 70px; background: {{t.bg}}; position: relative">
              <span class="mini-main"><span class="mini-hero" style="background: var(--p)"><span style="background: var(--a)"></span></span><span class="mini-row"><span class="{{t.glass}}"></span><span class="{{t.glass}}"></span><span style="background: var(--a2); flex: none; width: 12px"></span></span></span>
              <sc-if value="{{t.mine}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: 6px; top: 6px; height: 18px; padding: 0 6px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 10px; font-weight: 800; display: inline-flex; align-items: center">{{t.tag}}</span></sc-if>
            </span>
            <span style="display: flex; align-items: center; gap: 6px; padding: 0 2px">
              <span style="flex: 1; min-width: 0; font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left">{{t.n}}</span>
              <span class="chk {{t.chk}}" style="width: 22px; height: 22px"><sc-if value="{{t.on}}" hint-placeholder-val="{{false}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 13px; height: 13px; stroke-width: 3"><path d="{{i.check}}"></path></svg></sc-if></span>
            </span>
          </button>
        </sc-for>
      </div>
    </section>

    <!-- 背景 -->
    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 class="h">背景</h2>
      <div class="hs" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px">
        <sc-for list="{{bgTypes}}" as="bt" hint-placeholder-count="5"><button class="chip {{bt.cls}}" aria-pressed="{{bt.on}}" onClick="{{bt.pick}}">{{bt.t}}</button></sc-for>
      </div>
      <div class="card" style="padding: 14px; display: flex; flex-direction: column; gap: 14px">
        <sc-if value="{{isImage}}" hint-placeholder-val="{{true}}">
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
            <sc-for list="{{imgs}}" as="im" hint-placeholder-count="4"><button class="thumb {{im.cls}}" aria-label="{{im.n}}" aria-pressed="{{im.on}}" onClick="{{im.pick}}" style="background: {{im.css}}; aspect-ratio: 3 / 4"></button></sc-for>
            <button class="thumb thumb-up" style="aspect-ratio: 3 / 4; flex-direction: column; justify-content: center; padding: 0; gap: 4px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.upload}}"></path></svg><b style="font-size: 12px">上传</b></button>
          </div>
          <sc-for list="{{sliders}}" as="sl" hint-placeholder-count="3">
            <label style="display: flex; flex-direction: column; gap: 4px">
              <span style="display: flex; font-size: 13px; font-weight: 700"><span style="flex: 1">{{sl.t}}</span><span class="num" style="color: var(--pInk)">{{sl.vT}}</span></span>
              <input class="rng" type="range" min="{{sl.min}}" max="{{sl.max}}" value="{{sl.v}}" onInput="{{sl.set}}" aria-label="{{sl.t}}" style="height: 30px">
            </label>
          </sc-for>
        </sc-if>
        <sc-if value="{{isGradient}}" hint-placeholder-val="{{false}}">
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><sc-for list="{{grads}}" as="gr" hint-placeholder-count="6"><button class="gsw {{gr.cls}}" onClick="{{gr.pick}}" style="background: {{gr.css}}; width: auto; height: 56px"></button></sc-for></div>
          <div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{stops}}" as="sp" hint-placeholder-count="3"><span class="stopc"><span style="width: 20px; height: 20px; border-radius: 7px; background: {{sp.c}}"></span><span class="mono" style="font-size: 12px">{{sp.c}}</span></span></sc-for></div>
        </sc-if>
        <sc-if value="{{isPattern}}" hint-placeholder-val="{{false}}">
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><sc-for list="{{pats}}" as="pt" hint-placeholder-count="5"><button class="pat {{pt.cls}}" onClick="{{pt.pick}}"><span style="display: block; height: 52px; border-radius: 10px; background: {{pt.css}}"></span><span style="font-size: 12px; font-weight: 700">{{pt.t}}</span></button></sc-for></div>
        </sc-if>
        <sc-if value="{{isSolid}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-wrap: wrap; gap: 10px"><sc-for list="{{solids}}" as="so" hint-placeholder-count="7"><button class="gsw {{so.cls}}" onClick="{{so.pick}}" style="background: {{so.c}}; width: 44px"></button></sc-for></div>
        </sc-if>
        <sc-if value="{{isTheme}}" hint-placeholder-val="{{false}}">
          <div style="font-size: 13px; color: var(--ink2)">使用主题自带的背景色，卡片保持不透明。</div>
        </sc-if>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 class="h">深浅色</h2>
      <div class="seg" style="display: flex"><sc-for list="{{prefs}}" as="pf" hint-placeholder-count="3"><button class="{{pf.cls}}" style="flex: 1" onClick="{{pf.pick}}">{{pf.t}}</button></sc-for></div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 4px">
      <h2 class="h" style="margin-bottom: 4px">细节</h2>
      <div class="card" style="padding: 4px 16px">
        <label class="row"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">紧凑模式</span><span style="font-size: 12px; color: var(--ink2)">列表行高更小，一屏看更多</span></span><input class="tg" type="checkbox" role="switch"></label>
        <label class="row"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">减少动效</span><span style="font-size: 12px; color: var(--ink2)">关闭浮动、背景流动和切换动画</span></span><input class="tg" type="checkbox" role="switch"></label>
      </div>
    </section>
    <div style="text-align: center; font-size: 12px; color: var(--ink2)">外观跟着账号走 · 已自动保存</div>
  </div>

  <!-- 导入 / 导出：底部面板 -->
  <sc-if value="{{dlgOpen}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; z-index: 20; background: rgba(20,10,30,.45); display: flex; flex-direction: column; justify-content: flex-end">
      <section class="sheet" role="dialog" aria-modal="true" aria-label="{{dlgTitle}}">
        <div style="display: flex; justify-content: center; padding: 10px 0 2px"><span style="width: 40px; height: 5px; border-radius: 999px; background: var(--line)"></span></div>
        <header style="display: flex; align-items: center; padding: 4px 8px 8px 20px"><span style="flex: 1; font-size: 18px; font-weight: 800">{{dlgTitle}}</span><button class="ib" aria-label="关闭" onClick="{{closeDlg}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.x}}"></path></svg></button></header>
        <sc-if value="{{dlgImport}}" hint-placeholder-val="{{false}}">
          <div style="padding: 0 20px 16px; display: flex; flex-direction: column; gap: 12px">
            <div class="th-grape-dark" style="height: 120px; border-radius: 18px; position: relative; overflow: hidden; background: {{nightCss}}"><div style="position: absolute; inset: 12px; display: flex; gap: 8px"><span style="width: 26%; border-radius: 10px; background: color-mix(in srgb, var(--s) 70%, transparent)"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 6px"><span style="flex: 1.2; border-radius: 10px; background: var(--p)"></span><span style="flex: 1; border-radius: 10px; background: color-mix(in srgb, var(--s) 70%, transparent)"></span></span></div></div>
            <div style="display: flex; gap: 6px"><button class="chip chip-sm chip-on">工作台</button><button class="chip chip-sm">登录页</button><button class="chip chip-sm">终端</button><span style="flex: 1"></span><button class="btn btn-sm btn-s"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.eye}}"></path></svg>全屏</button></div>
            <div style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 17px">夜樱 Night Sakura</b><span style="font-size: 12px; color: var(--ink2)">@momo · v1.2 · 1.4 MB · 含背景图和 2 个页面设置</span></div>
            <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 14px; background: var(--s2); font-size: 12px">
              <span style="display: flex; gap: 6px; align-items: center"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ok); stroke-width: 2.6"><path d="{{i.check}}"></path></svg>格式正确，不含脚本</span>
              <span style="display: flex; gap: 6px; align-items: flex-start; color: var(--warn)"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.4"><path d="{{i.alert}}"></path></svg>浅色下次要文字对比度偏低，导入后可一键修正</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; font-size: 13px"><span style="flex: 1">已有同名主题</span><div class="seg seg-sm"><button class="on">另存副本</button><button>覆盖</button></div></div>
          </div>
        </sc-if>
        <sc-if value="{{dlgExport}}" hint-placeholder-val="{{false}}">
