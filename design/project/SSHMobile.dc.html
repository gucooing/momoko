.root{font-family:'Outfit','HarmonyOS Sans SC','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.root *{box-sizing:border-box}
.card{background:var(--s);border:1px solid var(--line);border-radius:24px}
.card-bad{border-color:color-mix(in srgb, var(--bad) 45%, var(--line))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:0;font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--p);color:var(--pOn)}
.btn-s{background:var(--s2);color:var(--ink)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:var(--ink2);cursor:pointer;position:relative;flex:none;text-decoration:none}
.ib:hover{background:var(--s2);color:var(--ink)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.ok{background:var(--okSoft);color:var(--ok)}.off{background:var(--s2);color:var(--ink2)}.warn{background:var(--warnSoft);color:var(--warn)}.bad{background:var(--badSoft);color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--s);color:var(--ink2);font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.chip-on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{font-size:12px;opacity:.7}
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:8px;background:var(--s2);color:var(--ink2);font-size:12px;font-weight:600;white-space:nowrap}
.tag-share{background:var(--a2Soft);color:var(--ink)}
.inp{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 16px;border-radius:999px;background:var(--s);border:1.5px solid var(--line);color:var(--ink2)}
.inp:focus-within{border-color:var(--p)}
.inp input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);outline:none}
.inp input::placeholder{color:var(--ink2)}
.av{display:flex;align-items:center;justify-content:center;flex:none;font-weight:800}
.av-p{background:var(--pSoft);color:var(--pInk)}.av-a{background:var(--aSoft);color:var(--aOn)}.av-a2{background:var(--a2Soft);color:var(--ink)}.av-ok{background:var(--okSoft);color:var(--ok)}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
.num{font-family:'Outfit',sans-serif;font-variant-numeric:tabular-nums}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px;padding-top:6px;color:var(--ink2);text-decoration:none;font-size:11px;font-weight:600}
.tab .tb{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:999px}
.tab-on{color:var(--pInk)}.tab-on .tb{background:var(--pSoft)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
.hs{scrollbar-width:none;-ms-overflow-style:none}.hs::-webkit-scrollbar{display:none}

<div class="root th-{{palette}}-{{mode}}" style="width: 390px; min-height: 2700px; display: flex; flex-direction: column">
  <header style="display: flex; align-items: flex-end; gap: 6px; padding: 22px 12px 12px 20px">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.01em">SSH 主机</h1>
      <div style="font-size: 13px; color: var(--ink2)">8 台 · 3 个分组 · <span style="color: var(--pInk); font-weight: 700">2 台已分享</span></div>
    </div>
    <button class="ib" aria-label="切换深浅色" onClick="{{toggleDark}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{modeIcon}}"></path></svg></button>
    <button class="ib" aria-label="批量测试全部主机" onClick="{{runBatch}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.pulse}}"></path></svg></button>
  </header>

  <div style="padding: 0 16px 12px">
    <section class="card" aria-label="批量测试结果" style="padding: 14px 14px 14px 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span class="av av-ok" style="width: 42px; height: 42px; border-radius: 14px; transform: rotate(-4deg)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.pulse}}"></path></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
          <span style="font-size: 12px; font-weight: 600; color: var(--ink2)">{{batchWhen}}</span>
          <span class="num" style="font-size: 20px; font-weight: 800">8 台 · <span style="color: var(--ok)">7 通</span> · <span style="color: var(--bad)">1 失败</span></span>
        </span>
      </div>
      <div aria-hidden="true" style="display: flex; gap: 4px">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="8">
          <span style="flex: 1; height: 8px; border-radius: 4px; background: {{b}}"></span>
        </sc-for>
      </div>
      <button onClick="{{showBad}}" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 14px; border: 0; background: var(--badSoft); color: var(--bad); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; text-align: left">
        <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.alert}}"></path></svg>
        <span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">hk-relay · 连接超时（10 秒）</span>
        <span style="font-weight: 800">只看失败</span>
      </button>
    </section>
  </div>

  <div style="padding: 0 16px 10px">
    <label class="inp">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.search}}"></path></svg>
      <input type="search" placeholder="名称、地址或用户名" aria-label="搜索主机">
    </label>
  </div>

  <div class="hs" role="tablist" aria-label="按状态筛选" style="display: flex; gap: 8px; padding: 2px 16px 14px; overflow-x: auto">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
      <button class="chip {{f.cls}}" role="tab" onClick="{{f.pick}}">{{f.t}} <span class="n num">{{f.n}}</span></button>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 0 16px 20px">
    <sc-for list="{{hosts}}" as="h" hint-placeholder-count="8">
      <article class="card {{h.cardCls}}" style="padding: 16px 12px 6px 16px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 12px; padding-right: 4px">
          <span class="av {{h.av}}" style="width: 46px; height: 46px; border-radius: 15px; font-size: 19px; transform: rotate({{h.rot}})">{{h.l}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{h.n}}</span>
            <span class="mono" style="font-size: 12px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{h.addr}}</span>
          </span>
          <span class="pill {{h.st}}">{{h.stT}}</span>
        </div>
        <dl style="margin: 0 4px 0 0; padding: 10px 12px; border-radius: 14px; background: var(--s2); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px">
          <div style="min-width: 0">
            <dt style="font-size: 11px; font-weight: 700; color: var(--ink2)">认证方式</dt>
            <dd style="margin: 2px 0 0; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 5px"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px; color: var(--ink2)"><path d="{{h.authD}}"></path></svg>{{h.auth}}</dd>
          </div>
          <div style="min-width: 0">
            <dt style="font-size: 11px; font-weight: 700; color: var(--ink2)">上次连接</dt>
            <dd class="num" style="margin: 2px 0 0; font-size: 13px; font-weight: 700">{{h.last}}</dd>
          </div>
          <div style="grid-column: 1 / -1; min-width: 0">
            <dt style="font-size: 11px; font-weight: 700; color: var(--ink2)">上次测试 · 今天 14:32</dt>
            <dd class="num" style="margin: 2px 0 0; font-size: 13px; font-weight: 700; color: {{h.testFg}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{h.test}}</dd>
          </div>
        </dl>
        <div style="display: flex; align-items: center; gap: 0; padding-top: 6px; border-top: 1px solid var(--line)">
          <div style="flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px">
            <span class="tag">#{{h.group}}</span>
            <sc-if value="{{h.shared}}" hint-placeholder-val="{{false}}">
              <span class="tag tag-share">已分享</span>
            </sc-if>
          </div>
          <a class="ib" href="TerminalMobile.dc.html" aria-label="打开 {{h.n}} 终端" style="color: var(--pInk)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.terminal}}"></path></svg></a>
          <button class="ib" aria-label="测试 {{h.n}} 连接"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.pulse}}"></path></svg></button>
          <button class="ib" aria-label="分享 {{h.n}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.share}}"></path></svg></button>
          <button class="ib" aria-label="编辑 {{h.n}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.edit}}"></path></svg></button>
          <button class="ib" aria-label="{{h.n}} 更多操作"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="{{i.more}}"></path></svg></button>
        </div>
      </article>
    </sc-for>
  </div>

  <div style="position: sticky; bottom: 92px; margin-top: auto; display: flex; justify-content: flex-end; padding: 0 16px 12px; pointer-events: none">
    <button class="btn btn-p" style="pointer-events: auto; min-height: 56px; padding: 0 22px; font-size: 15px; box-shadow: 0 12px 28px -10px var(--p)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.plus}}"></path></svg>添加主机</button>
  </div>

  <nav aria-label="底部导航" style="position: sticky; bottom: 0; display: flex; padding: 6px 8px 22px; background: var(--s); border-top: 1px solid var(--line)">
    <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="5">
      <a class="tab {{tb.cls}}" href="{{tb.href}}"><span class="tb"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{tb.d}}"></path></svg></span>{{tb.t}}</a>
    </sc-for>
  </nav>
</div>
</x-dc>
