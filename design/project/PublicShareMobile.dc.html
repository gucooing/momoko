          </div>
        </sc-for>
      </div>
      <div style="flex: none; padding: 12px 16px 24px; border-top: 1px solid var(--line); background: var(--s); display: flex; flex-direction: column; gap: 8px">
        <button class="btn btn-p" style="min-height: 56px; font-size: 16px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.archive}}"></path></svg>全部下载 · ZIP <span class="num">1.36 GB</span></button>

      </div>
    </sc-if>
  </section>
</div>

      mode: dark ? 'dark' : 'light',
      i: IC,
      modeIcon: dark ? IC.sun : IC.moon,
      toggleDark: () => this.setState({ dark: !dark }),
      locked: !unlocked,
      unlocked,
      unlock: () => this.setState({ unlocked: true }),
      relock: () => this.setState({ unlocked: false, sub: 0 }),
      inSub: !!sub,
      subName: sub ? sub.n : '',
      rootCls: sub ? '' : 'crumb-on',
      goRoot: () => this.setState({ sub: 0 }),
      countT: sub ? sub.sub : '2 个文件夹 · 6 个文件',
      rows: list.map((f) => {
        const isDir = f.k === 'dir';
        return {
          ...f,
          d: KIND[f.k][0], av: KIND[f.k][1], rot: ROTS[f.id % 4],
          isDir, isFile: !isDir,
          openT: isDir ? '打开 ' + f.n : '预览 ' + f.n,
          sizeT: isDir ? f.sub : f.size,
          mShort: f.m.slice(5),
          open: () => { if (isDir) this.setState({ sub: f.id }); }
        };
      })
    };
  }
}
</script>
</body>
</html>
