.th-sunset-dark{--p:#FF7A3D;--pOn:#1A0F08;--pInk:#FFA06E;--pSoft:#3A2114;--a:#FFD25A;--aOn:#1A0F08;--aSoft:#3A3016;--a2:#6EA0FF;--a2Soft:#172440;--bg:#150E09;--s:#22160E;--s2:#2C1D13;--line:#3A281B;--ink:#FFF1E8;--ink2:#C7AE9E;--ok:#3DDC97;--okSoft:#123326;--warn:#FFC14D;--warnSoft:#3A2E12;--bad:#FF6B7D;--badSoft:#3A1820}

.root{font-family:'Outfit','HarmonyOS Sans SC','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.root *{box-sizing:border-box}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:0;font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none;transition:transform .15s,filter .15s}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--p);color:var(--pOn)}.btn-p:hover{filter:brightness(1.08);color:var(--pOn)}
.btn-s{background:var(--s);color:var(--ink);border:1.5px solid var(--line)}.btn-s:hover{border-color:var(--p);color:var(--pInk)}
.btn-wait{background:var(--s);color:var(--ink2);border:1.5px solid var(--line);cursor:default}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:var(--ink2);cursor:pointer;flex:none}
.ib:hover{background:var(--s2);color:var(--ink)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:16px;height:16px}
.seg{display:flex;padding:4px;border-radius:999px;background:var(--s2);gap:2px}
.seg button{flex:1;min-height:44px;border-radius:999px;border:0;background:transparent;font:inherit;font-size:14px;font-weight:700;color:var(--ink2);cursor:pointer}
.seg .on{background:var(--s);color:var(--ink);box-shadow:0 1px 3px rgba(20,10,30,.12)}
.fl{display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700;color:var(--ink)}
.fld{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 6px 0 16px;border-radius:16px;background:var(--s2);border:1.5px solid transparent;color:var(--ink2)}
.fld:focus-within{border-color:var(--p);background:var(--s)}
.fld input{flex:1;min-width:0;height:48px;border:0;background:transparent;font:inherit;font-size:15px;font-weight:500;color:var(--ink);outline:none}
.fld input::placeholder{color:var(--ink2)}
.sticker{position:absolute;display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 20px;border-radius:999px;font-size:17px;font-weight:800;white-space:nowrap;box-shadow:0 10px 24px -12px rgba(0,0,0,.35)}
.cb{width:20px;height:20px;accent-color:var(--p);margin:0;flex:none}
.meter{display:flex;gap:6px;flex:1}
.meter span{flex:1;height:6px;border-radius:999px}
.num{font-family:'Outfit',sans-serif;font-variant-numeric:tabular-nums}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
.hs{scrollbar-width:none;-ms-overflow-style:none}.hs::-webkit-scrollbar{display:none}
</style>
</helmet>
<div class="root th-{{palette}}-{{mode}}" style="min-height: 960px; display: flex; flex-wrap: wrap">
  <section style="flex: 1 1 560px; min-height: 560px; background: var(--p); color: var(--pOn); padding: 48px 56px; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; gap: 40px">
    <div aria-hidden="true" style="position: absolute; right: -120px; bottom: -160px; width: 460px; height: 460px; border-radius: 50%; background: var(--a)"></div>
    <div aria-hidden="true" style="position: absolute; left: 46%; top: 54%; width: 150px; height: 150px; border-radius: 50%; border: 22px solid var(--a2)"></div>
    <svg aria-hidden="true" viewBox="0 0 24 24" width="64" height="64" style="position: absolute; right: 80px; top: 120px; fill: var(--pOn)"><path d="M12 1.5l2.6 7.9 7.9 2.6-7.9 2.6L12 22.5l-2.6-7.9L1.5 12l7.9-2.6z"></path></svg>
    <div style="position: relative; display: flex; align-items: center; gap: 12px">
      <div style="width: 48px; height: 48px; border-radius: 15px; background: var(--pOn); color: var(--p); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; transform: rotate(-6deg)">M</div>
      <span style="font-size: 26px; font-weight: 800">Momoko</span>
    </div>
    <div style="position: relative; display: flex; flex-direction: column; gap: 18px; max-width: 560px">
      <h1 style="margin: 0; font-size: 58px; line-height: 1.08; font-weight: 800; letter-spacing: -0.02em">{{heroT1}}<br>{{heroT2}}</h1>
      <p style="margin: 0; font-size: 18px; line-height: 1.6">{{heroP}}</p>
    </div>
    <div aria-hidden="true" style="position: relative; height: 200px">
      <span class="sticker" style="left: 0; top: 10px; background: var(--pOn); color: var(--p); transform: rotate(-5deg)">多节点</span>
      <span class="sticker" style="left: 132px; top: 70px; background: var(--ink); color: var(--bg); transform: rotate(4deg)">Docker</span>
      <span class="sticker" style="left: 20px; top: 128px; background: var(--a2); color: #FFFFFF; transform: rotate(3deg)">Web 终端</span>
      <span class="sticker" style="left: 270px; top: 4px; background: var(--aSoft); color: var(--aOn); transform: rotate(6deg)">文件分享</span>
      <span class="sticker" style="left: 250px; top: 136px; background: var(--pOn); color: var(--p); transform: rotate(-3deg)">内网穿透</span>
    </div>
  </section>

  <section style="flex: 1 1 480px; min-width: 0; background: var(--s); padding: 28px 32px 40px; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: flex-end; gap: 6px">
      <button class="btn btn-s" style="min-height: 40px; padding: 0 14px; font-size: 13px"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.globe}}"></path></svg>简体中文</button>
      <button class="ib" aria-label="切换深浅色" onClick="{{toggleDark}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{modeIcon}}"></path></svg></button>
    </div>
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 0">
      <form style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <h2 style="margin: 0; font-size: 36px; font-weight: 800; letter-spacing: -0.01em">{{formT}}</h2>
          <p style="margin: 0; font-size: 15px; color: var(--ink2)">{{formP}}</p>
        </div>
        <div class="seg" role="tablist" aria-label="注册或找回密码">
          <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
            <button type="button" role="tab" class="{{m.cls}}" aria-selected="{{m.on}}" onClick="{{m.pick}}">{{m.t}}</button>
          </sc-for>
        </div>

        <sc-if value="{{isReg}}" hint-placeholder-val="{{true}}">
          <label class="fl">用户名
            <span class="fld"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.user}}"></path></svg><input type="text" placeholder="3–20 位字母、数字或下划线" autocomplete="username"></span>
          </label>
        </sc-if>

        <label class="fl">邮箱
          <span class="fld"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.mail}}"></path></svg><input type="email" placeholder="name@example.com" autocomplete="email"><button type="button" class="btn {{codeCls}}" aria-disabled="{{sent}}" onClick="{{sendCode}}" style="min-height: 40px; padding: 0 14px; font-size: 13px">{{codeT}}</button></span>
        </label>
        <label class="fl">验证码
          <span class="fld"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.shield}}"></path></svg><input type="text" inputmode="numeric" maxlength="6" placeholder="6 位数字" autocomplete="one-time-code"></span>
          <sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
            <span role="status" style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ok)"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.6"><path d="{{i.check}}"></path></svg>验证码已发送，10 分钟内有效。没收到？看看垃圾邮件</span>
          </sc-if>
        </label>

        <div style="display: flex; flex-direction: column; gap: 10px">
          <label class="fl">{{pwLabel}}
            <span class="fld"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.lock}}"></path></svg><input type="{{pwType}}" value="{{pw}}" onChange="{{setPw}}" placeholder="至少 8 位" autocomplete="new-password"><button type="button" class="ib" aria-label="{{eyeT}}" onClick="{{toggleEye}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{eyeIcon}}"></path></svg></button></span>
          </label>
          <div style="display: flex; align-items: center; gap: 12px">
            <span class="meter" aria-hidden="true">
              <sc-for list="{{meter}}" as="m" hint-placeholder-count="4"><span style="background: {{m.bg}}"></span></sc-for>
            </span>
            <span style="font-size: 13px; font-weight: 800; color: {{lvC}}">强度：{{lvT}}</span>
          </div>
          <span style="font-size: 12px; color: var(--ink2)">至少 8 位，混合大小写字母、数字和符号会更安全</span>
        </div>

        <sc-if value="{{isReg}}" hint-placeholder-val="{{true}}">
          <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; font-weight: 600; cursor: pointer">
            <input class="cb" type="checkbox" checked="{{agree}}" onChange="{{toggleAgree}}">
            <span>我已阅读并同意 <a href="#" style="font-weight: 700; text-decoration: none">《用户协议》</a> 和 <a href="#" style="font-weight: 700; text-decoration: none">《隐私政策》</a></span>
          </label>
          <button type="button" class="btn btn-p" style="min-height: 56px; font-size: 16px">注册<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.arrowR}}"></path></svg></button>
          <div style="text-align: center; font-size: 14px; color: var(--ink2)">已有账号？ <a href="LoginPC.dc.html" style="font-weight: 700; text-decoration: none">去登录</a></div>
        </sc-if>

        <sc-if value="{{isReset}}" hint-placeholder-val="{{false}}">
          <button type="button" class="btn btn-p" style="min-height: 56px; font-size: 16px; margin-top: 6px">重置密码<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.arrowR}}"></path></svg></button>
          <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 16px; background: var(--a2Soft); font-size: 13px; line-height: 1.55">
            <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="margin-top: 2px"><path d="{{i.info}}"></path></svg>
            <span>重置后，其它设备上的登录会全部失效，需要用新密码重新登录。</span>
          </div>
          <div style="text-align: center; font-size: 14px; color: var(--ink2)">想起来了？ <a href="LoginPC.dc.html" style="font-weight: 700; text-decoration: none">返回登录</a></div>
        </sc-if>
      </form>
    </div>
    <div style="text-align: center; font-size: 12px; color: var(--ink2)">Momoko · MIT License</div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["sakura","mint","volt","grape","sunset","classic"],"default":"sakura"},"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":960}}'>
const IC = {
  globe: 'M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zM3 12h18M12 3c2.4 2.5 3.6 5.5 3.6 9s-1.2 6.5-3.6 9c-2.4-2.5-3.6-5.5-3.6-9S9.6 5.5 12 3z',
  sun: 'M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',
  moon: 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z',
  user: 'M12 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM4 21a8 8 0 0 1 16 0',
  lock: 'M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4',
  eye: 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6z',
  eyeOff: 'M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 3.9M6.6 6.6C3.8 8.4 2 12 2 12s4 7 10 7c1.8 0 3.4-.6 4.8-1.4M9.9 9.9a3 3 0 0 0 4.2 4.2',
  mail: 'M3 5h18v14H3zM3 6l9 7 9-7',
  shield: 'M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6zM9 12l2 2 4-4',
  check: 'M5 12.5l4.5 4.5L19 7.5',
  info: 'M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zM12 11v5M12 7.5h.01',
  arrowR: 'M5 12h14M13 6l6 6-6 6'
};
const LV = [['太弱', 'var(--bad)'], ['弱', 'var(--bad)'], ['一般', 'var(--warn)'], ['强', 'var(--ok)'], ['很强', 'var(--ok)']];
function scorePw(pw) {
  let s = [pw.length >= 8, /[a-z]/.test(pw) && /[A-Z]/.test(pw), /\d/.test(pw), /[^A-Za-z0-9]/.test(pw)].filter(Boolean).length;
  if (pw.length < 6) s = Math.min(s, 1);
  return s;
}
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const palette = this.props.palette ?? 'sakura';
    const dark = st.dark != null ? st.dark : (this.props.dark ?? false);
    const way = st.way || 'reg';
    const isReg = way === 'reg';
    const sent = !!st.sent;
    const show = !!st.show;
    const agree = st.agree != null ? st.agree : true;
    const pw = st.pw != null ? st.pw : 'momoko2026';
    const sc = scorePw(pw);
    const val = (e) => (e && e.target && typeof e.target.value === 'string') ? e.target.value : '';
    return {
      palette,
      mode: dark ? 'dark' : 'light',
      i: IC,
      modeIcon: dark ? IC.sun : IC.moon,
      toggleDark: () => this.setState({ dark: !dark }),
      modes: [['reg', '注册账号'], ['reset', '找回密码']].map(([k, t]) => ({ t, on: k === way, cls: k === way ? 'on' : '', pick: () => this.setState({ way: k, sent: false }) })),
      isReg,
      isReset: !isReg,
      heroT1: isReg ? '加入 Momoko' : '别着急',
      heroT2: isReg ? '一起把服务器管起来' : '密码马上找回来',
      heroP: isReg ? '注册后由管理员分配角色，就能管理你负责的应用、容器和文件。' : '输入注册时用的邮箱，我们会发一封带验证码的邮件给你。',
      formT: isReg ? '创建账号' : '找回密码',
      formP: isReg ? '只需要一分钟，填好下面几项就行' : '验证邮箱后设置一个新密码',
      pwLabel: isReg ? '密码' : '新密码',
      sent,
      codeCls: sent ? 'btn-wait' : 'btn-p',
      codeT: sent ? '58 秒后重发' : '获取验证码',
      sendCode: () => { if (!sent) this.setState({ sent: true }); },
      pw,
      setPw: (e) => this.setState({ pw: val(e) }),
      pwType: show ? 'text' : 'password',
      eyeIcon: show ? IC.eyeOff : IC.eye,
      eyeT: show ? '隐藏密码' : '显示密码',
      toggleEye: () => this.setState({ show: !show }),
      meter: [0, 1, 2, 3].map((k) => ({ bg: (pw.length && k < sc) ? LV[sc][1] : 'var(--line)' })),
      lvT: pw.length ? LV[sc][0] : '—',
      lvC: pw.length ? LV[sc][1] : 'var(--ink2)',
      agree,
      toggleAgree: () => this.setState({ agree: !agree })
    };
  }
}
</script>
</body>
</html>
