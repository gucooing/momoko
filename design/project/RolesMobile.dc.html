.th-grape-dark{--p:#A78BFA;--pOn:#120C1F;--pInk:#C4B1FF;--pSoft:#2A1F4A;--a:#FFD23F;--aOn:#120C1F;--aSoft:#37300F;--a2:#FF7BA6;--a2Soft:#3A1A2A;--bg:#120C1F;--s:#1B1430;--s2:#241B3D;--line:#30264D;--ink:#F2EEFF;--ink2:#B2A8CC;--ok:#3DDC97;--okSoft:#123326;--warn:#FFB547;--warnSoft:#3A2A12;--bad:#FF6B81;--badSoft:#3A1720}

.th-classic-light{--p:#0F7F72;--pOn:#FFFFFF;--pInk:#0B7266;--pSoft:#DDF3EF;--a:#FFB020;--aOn:#1B2333;--aSoft:#FFF1D6;--a2:#5B6CFF;--a2Soft:#E6E9FF;--bg:#F3F5F9;--s:#FFFFFF;--s2:#EEF1F6;--line:#E2E7EE;--ink:#1B2333;--ink2:#5F6878;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#A35B00;--warnSoft:#FFF2D6;--bad:#D2263B;--badSoft:#FFE3E6}
.th-classic-dark{--p:#2CC4AE;--pOn:#0E1116;--pInk:#5ED8C5;--pSoft:#12302C;--a:#FFB020;--aOn:#0E1116;--aSoft:#3A2E12;--a2:#8C98FF;--a2Soft:#1E2348;--bg:#0E1116;--s:#171B22;--s2:#1C212B;--line:#2B323D;--ink:#E8EBF1;--ink2:#9AA2B1;--ok:#3DDC97;--okSoft:#123326;--warn:#FFC14D;--warnSoft:#3A2E12;--bad:#FF6B7D;--badSoft:#3A1820}
.root{font-family:'Outfit','HarmonyOS Sans SC','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.root *{box-sizing:border-box}
.card{background:var(--s);border:1px solid var(--line);border-radius:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:0;font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn:disabled{cursor:not-allowed;transform:none}
.btn-p{background:var(--p);color:var(--pOn)}
.btn-p:disabled{background:var(--s2);color:var(--ink2)}
.btn-s{background:var(--s2);color:var(--ink)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:var(--ink2);cursor:pointer;position:relative;flex:none;text-decoration:none}
.ib:hover{background:var(--s2);color:var(--ink)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:16px;height:16px}
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:6px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;flex:none}
.utab{display:inline-flex;align-items:center;min-height:44px;padding:0 2px;border-bottom:3px solid transparent;color:var(--ink2);text-decoration:none;font-size:15px;font-weight:700;flex:none}
.utab-on,.utab-on:hover{color:var(--ink);border-bottom-color:var(--p)}
.av{display:flex;align-items:center;justify-content:center;flex:none;font-weight:800}
.av-p{background:var(--pSoft);color:var(--pInk)}.av-a{background:var(--aSoft);color:var(--aOn)}.av-a2{background:var(--a2Soft);color:var(--ink)}.av-ok{background:var(--okSoft);color:var(--ok)}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
.num{font-family:'Outfit',sans-serif;font-variant-numeric:tabular-nums}
.rl{display:flex;align-items:center;gap:12px;width:100%;padding:16px;border-radius:24px;border:2px solid var(--line);background:var(--s);font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.rl-on{border-color:var(--p);box-shadow:0 0 0 3px var(--pSoft)}
.pm{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--s);font:inherit;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap}
.pm:disabled{cursor:not-allowed}
.pm-on{background:var(--pSoft);border-color:transparent;color:var(--pInk)}
.pm-bad{background:var(--badSoft);border-color:transparent;color:var(--bad)}
.tg{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
.tg::after{content:'';position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.tg:checked{background:var(--p)}
.tg:checked::after{transform:translateX(20px)}
.tg:disabled{cursor:not-allowed}
.bar{height:6px;border-radius:999px;background:var(--s2);overflow:hidden}
.bar span{display:block;height:100%;border-radius:999px;background:var(--p)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px;padding-top:6px;color:var(--ink2);text-decoration:none;font-size:11px;font-weight:600}
.tab .tb{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:999px}
.tab-on{color:var(--pInk)}.tab-on .tb{background:var(--pSoft)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
.hs{scrollbar-width:none;-ms-overflow-style:none}.hs::-webkit-scrollbar{display:none}
</style>
</helmet>
<div class="root th-{{palette}}-{{mode}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div class="hs" style="flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 120px">
    <header style="display: flex; align-items: flex-end; gap: 6px; padding: 22px 12px 8px 20px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.01em">用户与权限</h1>
        <div style="font-size: 13px; color: var(--ink2)">4 个角色 · 点一个角色编辑权限</div>
      </div>
      <button class="ib" aria-label="切换深浅色" onClick="{{toggleDark}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{modeIcon}}"></path></svg></button>
      <button class="ib" aria-label="新建角色"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.plus}}"></path></svg></button>
    </header>
    <nav class="hs" aria-label="用户与权限分类" style="display: flex; gap: 24px; padding: 0 20px; border-bottom: 1px solid var(--line); overflow-x: auto">
      <a class="utab" href="UsersMobile.dc.html">用户 8</a>
      <a class="utab utab-on" href="RolesMobile.dc.html" aria-current="page">角色 4</a>
      <a class="utab" href="MenusMobile.dc.html">菜单</a>
    </nav>
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px">
      <sc-for list="{{roles}}" as="ro" hint-placeholder-count="4">
        <button class="rl {{ro.cls}}" aria-pressed="{{ro.on}}" onClick="{{ro.pick}}">
          <span class="av {{ro.av}}" style="width: 48px; height: 48px; border-radius: 16px; font-size: 19px; transform: rotate({{ro.rot}})">{{ro.l}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
            <span style="display: flex; align-items: center; gap: 6px">
              <span style="font-size: 16px; font-weight: 800">{{ro.t}}</span>
              <sc-if value="{{ro.builtin}}" hint-placeholder-val="{{false}}"><span class="tag">内置</span></sc-if>
              <sc-if value="{{ro.dirty}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 700; color: var(--warn)">● 未保存</span></sc-if>
            </span>
            <span style="font-size: 12px; color: var(--ink2); line-height: 1.4">{{ro.desc}}</span>
            <span style="display: flex; align-items: center; gap: 8px">
              <span class="bar" style="flex: 1"><span style="width: {{ro.pct}}"></span></span>
              <span class="num" style="font-size: 12px; font-weight: 700; color: var(--ink2)">{{ro.onN}} 项 · {{ro.members}} 人</span>
            </span>
          </span>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ink2)"><path d="{{i.chevR}}"></path></svg>
        </button>
      </sc-for>
    </div>
  </div>

  <nav aria-label="底部导航" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; padding: 6px 8px 22px; background: var(--s); border-top: 1px solid var(--line)">
    <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="5">
      <a class="tab {{tb.cls}}" href="{{tb.href}}"><span class="tb"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{tb.d}}"></path></svg></span>{{tb.t}}</a>
    </sc-for>
  </nav>

  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{true}}">
    <button aria-label="关闭权限编辑" onClick="{{closeSheet}}" style="position: absolute; inset: 0; border: 0; padding: 0; background: rgba(12, 6, 18, 0.5); cursor: pointer"></button>
    <section role="dialog" aria-label="{{cur.t}} 权限" style="position: absolute; left: 0; right: 0; bottom: 0; top: 56px; background: var(--bg); border-radius: 30px 30px 0 0; display: flex; flex-direction: column; overflow: hidden">
      <div style="flex: none; background: var(--s); border-bottom: 1px solid var(--line); padding: 10px 12px 12px 16px; display: flex; flex-direction: column; gap: 10px">
        <div style="align-self: center; width: 44px; height: 5px; border-radius: 999px; background: var(--line)"></div>
        <div style="display: flex; align-items: center; gap: 12px">
          <span class="av {{cur.av}}" style="width: 44px; height: 44px; border-radius: 15px; font-size: 18px; transform: rotate(-5deg)">{{cur.l}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="display: flex; align-items: center; gap: 6px"><span style="font-size: 19px; font-weight: 800">{{cur.t}}</span><sc-if value="{{cur.builtin}}" hint-placeholder-val="{{false}}"><span class="tag">内置</span></sc-if></span>
            <span class="num" style="font-size: 12px; color: var(--ink2)">已开启 {{onTotal}} / {{allTotal}} 项 · {{memberN}} 名成员</span>
          </span>
          <button class="ib" aria-label="关闭" onClick="{{closeSheet}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.x}}"></path></svg></button>
        </div>
        <sc-if value="{{locked}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 14px; background: var(--s2); font-size: 13px; color: var(--ink2)"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.lock}}"></path></svg>{{lockText}}</div>
        </sc-if>
      </div>

      <div class="hs" style="flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{modules}}" as="m" hint-placeholder-count="6">
          <section class="card" aria-label="{{m.t}} 权限" style="padding: 14px 14px 6px 16px; flex: none">
            <div style="display: flex; align-items: center; gap: 10px; padding-bottom: 8px">
              <span class="av {{m.av}}" style="width: 36px; height: 36px; border-radius: 12px; transform: rotate({{m.rot}})"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{m.d}}"></path></svg></span>
              <span style="flex: 1; display: flex; flex-direction: column">
                <span style="font-size: 16px; font-weight: 800">{{m.t}}</span>
                <span class="num" style="font-size: 12px; color: var(--ink2)">{{m.onN}} / {{m.total}}</span>
              </span>
              <label style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 13px; font-weight: 700; color: var(--ink2)">全选
                <input class="tg" type="checkbox" role="switch" aria-label="{{m.t}} 全选" checked="{{m.allOn}}" disabled="{{locked}}" onChange="{{m.toggleAll}}">
              </label>
            </div>
            <sc-for list="{{m.pages}}" as="p" hint-placeholder-count="3">
              <div style="padding: 10px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px">
                <div style="display: flex; align-items: baseline; gap: 8px">
                  <span style="font-size: 14px; font-weight: 700">{{p.t}}</span>
                  <span class="mono" style="flex: 1; min-width: 0; font-size: 11px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{p.path}}</span>
                  <span class="num" style="font-size: 12px; font-weight: 700; color: var(--ink2)">{{p.pn}}/{{p.ptotal}}</span>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 6px">
                  <sc-for list="{{p.acts}}" as="a" hint-placeholder-count="4">
                    <button class="pm {{a.cls}}" aria-pressed="{{a.on}}" disabled="{{locked}}" onClick="{{a.toggle}}" aria-label="{{p.t}} · {{a.t}}"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.6"><path d="{{a.d}}"></path></svg>{{a.t}}</button>
                  </sc-for>
                </div>
              </div>
            </sc-for>
          </section>
        </sc-for>
      </div>

      <div style="flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 16px 26px; background: var(--s); border-top: 1px solid var(--line)">
        <span style="width: 9px; height: 9px; border-radius: 50%; background: {{saveDot}}; flex: none"></span>
        <span style="flex: 1; min-width: 0; font-size: 13px; font-weight: 700">{{saveText}}</span>
        <button class="btn btn-s" disabled="{{noDirty}}" onClick="{{discard}}">放弃</button>
        <button class="btn btn-p" disabled="{{noDirty}}" onClick="{{save}}">保存</button>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>

};
