<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Web SSH 终端 · PC</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--pInk)}a:hover{color:var(--ink)}
.th-sakura-light{--p:#D6245F;--pOn:#FFFFFF;--pInk:#C8195A;--pSoft:#FFE3EE;--a:#FFC93C;--aOn:#2A1630;--aSoft:#FFF3CC;--a2:#7B5CFF;--a2Soft:#ECE6FF;--bg:#FFF6F9;--s:#FFFFFF;--s2:#FFF0F5;--line:#F6DCE6;--ink:#2A1630;--ink2:#6E5A72;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#B25E00;--warnSoft:#FFF0D9;--bad:#D21F3C;--badSoft:#FFE2E6}
.th-sakura-dark{--p:#FF4F8B;--pOn:#1A0B14;--pInk:#FF85AE;--pSoft:#3A1A2C;--a:#FFD25A;--aOn:#1A0B14;--aSoft:#3A3016;--a2:#A08BFF;--a2Soft:#2A2245;--bg:#140E17;--s:#1E1622;--s2:#271D2C;--line:#33263A;--ink:#F8EEF4;--ink2:#B9A6BE;--ok:#3DDC97;--okSoft:#123326;--warn:#FFB547;--warnSoft:#3A2A12;--bad:#FF6B81;--badSoft:#3A1720}
.th-mint-light{--p:#00805F;--pOn:#FFFFFF;--pInk:#007A5A;--pSoft:#D9F7EC;--a:#FFE14D;--aOn:#0F2A21;--aSoft:#FFF8CC;--a2:#2E9BFF;--a2Soft:#E0F0FF;--bg:#F3FBF7;--s:#FFFFFF;--s2:#EAF7F1;--line:#D3EDE2;--ink:#0F2A21;--ink2:#4F6B61;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#A35B00;--warnSoft:#FFF2D6;--bad:#D2263B;--badSoft:#FFE3E6}
.th-mint-dark{--p:#1FD3A0;--pOn:#0C1512;--pInk:#4BE3B6;--pSoft:#0F3329;--a:#FFE14D;--aOn:#0C1512;--aSoft:#33300F;--a2:#5BB4FF;--a2Soft:#12283A;--bg:#0C1512;--s:#13201B;--s2:#192A23;--line:#22362E;--ink:#EAF7F2;--ink2:#9DB8AE;--ok:#4BE3B6;--okSoft:#0F3329;--warn:#FFC14D;--warnSoft:#3A2E12;--bad:#FF6B7D;--badSoft:#3A1820}
.th-volt-light{--p:#3450FF;--pOn:#FFFFFF;--pInk:#2A44E6;--pSoft:#E3E8FF;--a:#FF7A1A;--aOn:#11163A;--aSoft:#FFE9D9;--a2:#00B8A9;--a2Soft:#D9F6F3;--bg:#F4F6FF;--s:#FFFFFF;--s2:#EDF0FF;--line:#DDE2F7;--ink:#11163A;--ink2:#555C80;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#B4530A;--warnSoft:#FFEBD9;--bad:#D32448;--badSoft:#FFE2E8}
.th-volt-dark{--p:#5B74FF;--pOn:#0D1024;--pInk:#8C9DFF;--pSoft:#1C2350;--a:#FF8A33;--aOn:#0D1024;--aSoft:#3A2312;--a2:#2FD9C8;--a2Soft:#10302F;--bg:#0D1024;--s:#161A35;--s2:#1D2242;--line:#272D52;--ink:#EEF0FF;--ink2:#A3A9CC;--ok:#3EDC9A;--okSoft:#113024;--warn:#FFAA55;--warnSoft:#3A2812;--bad:#FF6B86;--badSoft:#3A1626}
.th-grape-light{--p:#7C3AED;--pOn:#FFFFFF;--pInk:#6D28D9;--pSoft:#EFE6FF;--a:#FFD23F;--aOn:#1F1436;--aSoft:#FFF6CC;--a2:#E8457A;--a2Soft:#FFE3EC;--bg:#F8F5FF;--s:#FFFFFF;--s2:#F2ECFF;--line:#E4DAFA;--ink:#1F1436;--ink2:#625878;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#A35B00;--warnSoft:#FFF2D6;--bad:#D2263B;--badSoft:#FFE3E6}
.th-grape-dark{--p:#A78BFA;--pOn:#120C1F;--pInk:#C4B1FF;--pSoft:#2A1F4A;--a:#FFD23F;--aOn:#120C1F;--aSoft:#37300F;--a2:#FF7BA6;--a2Soft:#3A1A2A;--bg:#120C1F;--s:#1B1430;--s2:#241B3D;--line:#30264D;--ink:#F2EEFF;--ink2:#B2A8CC;--ok:#3DDC97;--okSoft:#123326;--warn:#FFB547;--warnSoft:#3A2A12;--bad:#FF6B81;--badSoft:#3A1720}
.th-sunset-light{--p:#C2410C;--pOn:#FFFFFF;--pInk:#B23A0A;--pSoft:#FFE6D6;--a:#FFC93C;--aOn:#2B1708;--aSoft:#FFF3CC;--a2:#2F6FED;--a2Soft:#E1EBFF;--bg:#FFF7F0;--s:#FFFFFF;--s2:#FFF0E5;--line:#F7DFCC;--ink:#2B1708;--ink2:#735A4B;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#9A5A00;--warnSoft:#FFF2D6;--bad:#C81E3A;--badSoft:#FFE3E6}
.th-sunset-dark{--p:#FF7A3D;--pOn:#1A0F08;--pInk:#FFA06E;--pSoft:#3A2114;--a:#FFD25A;--aOn:#1A0F08;--aSoft:#3A3016;--a2:#6EA0FF;--a2Soft:#172440;--bg:#150E09;--s:#22160E;--s2:#2C1D13;--line:#3A281B;--ink:#FFF1E8;--ink2:#C7AE9E;--ok:#3DDC97;--okSoft:#123326;--warn:#FFC14D;--warnSoft:#3A2E12;--bad:#FF6B7D;--badSoft:#3A1820}
.th-classic-light{--p:#0F7F72;--pOn:#FFFFFF;--pInk:#0B7266;--pSoft:#DDF3EF;--a:#FFB020;--aOn:#1B2333;--aSoft:#FFF1D6;--a2:#5B6CFF;--a2Soft:#E6E9FF;--bg:#F3F5F9;--s:#FFFFFF;--s2:#EEF1F6;--line:#E2E7EE;--ink:#1B2333;--ink2:#5F6878;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#A35B00;--warnSoft:#FFF2D6;--bad:#D2263B;--badSoft:#FFE3E6}
.th-classic-dark{--p:#2CC4AE;--pOn:#0E1116;--pInk:#5ED8C5;--pSoft:#12302C;--a:#FFB020;--aOn:#0E1116;--aSoft:#3A2E12;--a2:#8C98FF;--a2Soft:#1E2348;--bg:#0E1116;--s:#171B22;--s2:#1C212B;--line:#2B323D;--ink:#E8EBF1;--ink2:#9AA2B1;--ok:#3DDC97;--okSoft:#123326;--warn:#FFC14D;--warnSoft:#3A2E12;--bad:#FF6B7D;--badSoft:#3A1820}
.root{font-family:'Outfit','HarmonyOS Sans SC','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.root *{box-sizing:border-box}
.card{background:var(--s);border:1px solid var(--line);border-radius:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:0;font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;transition:transform .15s,filter .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--p);color:var(--pOn)}.btn-p:hover{filter:brightness(1.08);color:var(--pOn)}
.btn-s{background:var(--s2);color:var(--ink)}.btn-s:hover{background:var(--pSoft);color:var(--pInk)}
.btn-stop{background:var(--badSoft);color:var(--bad)}.btn-stop:hover{filter:brightness(.97)}
.btn-sm{min-height:36px;padding:0 14px;font-size:13px}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:var(--ink2);cursor:pointer;position:relative;flex:none;text-decoration:none}
.ib:hover{background:var(--s2);color:var(--ink)}
.ib-sm{width:36px;height:36px;border-radius:12px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.ok{background:var(--okSoft);color:var(--ok)}.bad{background:var(--badSoft);color:var(--bad)}
.nav{display:flex;align-items:center;gap:12px;min-height:42px;padding:0 12px;border-radius:14px;color:var(--ink2);text-decoration:none;font-size:14px;font-weight:500}
.nav:hover{background:var(--s2);color:var(--ink)}
.nav-on,.nav-on:hover{background:var(--pSoft);color:var(--pInk);font-weight:700}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink2)}
.inp{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border-radius:999px;background:var(--s);border:1.5px solid var(--line);color:var(--ink2)}
.inp:focus-within{border-color:var(--p)}
.inp input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);outline:none}
.inp input::placeholder{color:var(--ink2)}
.kbd{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--s2);color:var(--ink2)}
.av{display:flex;align-items:center;justify-content:center;flex:none;font-weight:800}
.av-a{background:var(--aSoft);color:var(--aOn)}.av-a2{background:var(--a2Soft);color:var(--ink)}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
.num{font-family:'Outfit',sans-serif;font-variant-numeric:tabular-nums}
.dot{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--p);border:2px solid var(--s)}
.tt{display:inline-flex;align-items:center;gap:2px;height:40px;padding:0 4px 0 14px;border-radius:14px;color:var(--ink2);flex:none}
.tt-on{background:var(--ink);color:var(--bg)}
.tt-btn{display:inline-flex;align-items:center;gap:8px;height:40px;border:0;background:transparent;color:inherit;font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:0 4px 0 0}
.tt-x{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:10px;border:0;background:transparent;color:inherit;cursor:pointer}
.tt-x:hover{background:color-mix(in srgb, currentColor 16%, transparent)}
.fsz{display:inline-flex;align-items:center;gap:2px;padding:2px;border-radius:999px;background:var(--s2)}
.fsz button{display:inline-flex;align-items:center;justify-content:center;width:34px;height:32px;border-radius:999px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;font-weight:800;cursor:pointer}
.fsz button:hover{background:var(--s)}
.term{background:#0F0B14;color:#E8E3EE;border-radius:18px;font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;line-height:1.5;position:relative;overflow:hidden}
.ln{white-space:pre;min-height:1.5em}
.cur{display:inline-block;width:.62em;height:1.15em;vertical-align:-.2em;background:#E8E3EE;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.cur{animation:none}}
.sb{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
.hs{scrollbar-width:none;-ms-overflow-style:none}.hs::-webkit-scrollbar{display:none}
</style>
</helmet>
<div class="root th-{{palette}}-{{mode}}" style="min-height: 1100px; display: flex; flex-wrap: wrap; align-items: stretch">

  <aside style="flex: 1 1 248px; max-width: 100%; background: var(--s); border-right: 1px solid var(--line); padding: 20px 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 4px 8px">
      <div style="width: 40px; height: 40px; border-radius: 13px; background: var(--p); color: var(--pOn); display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 800; transform: rotate(-6deg)">M</div>
      <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.01em">Momoko</span>
    </div>
    <button style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 8px 12px; border-radius: 16px; border: 1.5px dashed var(--line); background: var(--bg); font: inherit; color: var(--ink); cursor: pointer; text-align: left">
      <span class="av av-a2" style="width: 36px; height: 36px; border-radius: 11px"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.server}}"></path></svg></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-size: 11px; font-weight: 700; color: var(--ok)">● 本机 · 在线</span>
        <span style="font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">DESKTOP-K5K9BBC</span>
      </span>
      <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ink2)"><path d="{{i.updown}}"></path></svg>
    </button>
    <nav aria-label="主导航" style="display: flex; flex-direction: column; gap: 14px; flex: 1">
      <sc-for list="{{nav}}" as="g" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <sc-if value="{{g.title}}" hint-placeholder-val="{{true}}">
            <div class="lbl" style="padding: 0 12px 4px">{{g.title}}</div>
          </sc-if>
          <sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
            <a class="nav {{n.cls}}" href="{{n.href}}">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{n.d}}"></path></svg>
              <span>{{n.t}}</span>
            </a>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 18px; background: var(--bg)">
      <span class="av av-a" style="width: 40px; height: 40px; border-radius: 50%; font-size: 16px">超</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-size: 14px; font-weight: 700">超级管理员</span>
        <span style="font-size: 12px; color: var(--ink2)">设置 · 语言 · 退出</span>
      </span>
      <button class="ib ib-sm" aria-label="账号菜单"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="{{i.more}}"></path></svg></button>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; padding: 24px 32px 32px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
      <label class="inp" style="flex: 1 1 320px; max-width: 520px">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.search}}"></path></svg>
        <input type="search" placeholder="搜索页面、应用、容器、文件…" aria-label="全局搜索">
        <span class="kbd">Ctrl K</span>
      </label>
      <span style="flex: 1"></span>
      <button class="ib" aria-label="切换深浅色" onClick="{{toggleDark}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{modeIcon}}"></path></svg></button>
      <button class="ib" aria-label="通知，3 条未读"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.bell}}"></path></svg><span class="dot"></span></button>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
      <a class="ib" href="SSHPC.dc.html" aria-label="返回 SSH 主机"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.chevL}}"></path></svg></a>
      <div style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 13px; font-weight: 600; color: var(--ink2)"><a href="SSHPC.dc.html" style="text-decoration: none; color: var(--ink2)">SSH 主机</a> / {{cur.host}}</div>
        <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.01em">Web 终端</h1>
      </div>
      <button class="btn btn-s btn-sm"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.bolt}}"></path></svg>快捷命令</button>
      <a class="btn btn-s btn-sm" href="FilesPC.dc.html"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.folder}}"></path></svg>SFTP 文件</a>
    </div>

    <section class="card" aria-label="终端会话" style="flex: 1; min-height: 0; padding: 8px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 8px; padding: 2px 2px 0 2px">
        <div class="hs" role="tablist" aria-label="已打开的会话" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; overflow-x: auto">
          <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
            <div class="tt {{t.cls}}">
              <button class="tt-btn" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{t.dot}}"></span><span class="mono">{{t.label}}</span></button>
              <button class="tt-x" aria-label="关闭 {{t.label}}" onClick="{{t.close}}"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px"><path d="{{i.x}}"></path></svg></button>
            </div>
          </sc-for>
          <a class="ib ib-sm" href="SSHPC.dc.html" aria-label="新建会话"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.plus}}"></path></svg></a>
        </div>
        <div role="toolbar" aria-label="终端工具" style="display: flex; align-items: center; gap: 4px">
          <button class="btn btn-s btn-sm" style="padding: 0 12px"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.copy}}"></path></svg>复制</button>
          <button class="btn btn-s btn-sm" style="padding: 0 12px"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.paste}}"></path></svg>粘贴</button>
          <div class="fsz" role="group" aria-label="字号" style="margin: 0 4px">
            <button aria-label="减小字号" onClick="{{fsDown}}">−</button>
            <span class="num" style="min-width: 44px; text-align: center; font-size: 13px; font-weight: 700">{{fs}} px</span>
            <button aria-label="增大字号" onClick="{{fsUp}}">+</button>
          </div>
          <button class="ib ib-sm" aria-label="全屏"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.full}}"></path></svg></button>
          <button class="btn {{connBtnCls}} btn-sm" onClick="{{toggleConn}}" style="padding: 0 12px"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.power}}"></path></svg>{{connBtn}}</button>
        </div>
      </div>

      <div class="term hs" role="log" aria-label="{{cur.host}} 终端输出" style="flex: 1; min-height: 600px; padding: 18px 20px; font-size: {{fs}}px; overflow: auto">
        <sc-for list="{{cur.lines}}" as="ln" hint-placeholder-count="20">
          <div class="ln"><sc-for list="{{ln.s}}" as="sg" hint-placeholder-count="2"><span style="color: {{sg.c}}; font-weight: {{sg.w}}">{{sg.t}}</span></sc-for></div>
        </sc-for>
        <div class="ln"><span style="color: #7EE787; font-weight: 700">{{cur.user}}</span><span>:</span><span style="color: #79C0FF; font-weight: 700">{{cur.cwd}}</span><span>{{cur.sign}} </span><sc-if value="{{connected}}" hint-placeholder-val="{{true}}"><span class="cur"></span></sc-if></div>
        <sc-if value="{{disconnected}}" hint-placeholder-val="{{false}}">
          <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(15, 11, 20, 0.78)">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; font-family: 'Outfit', sans-serif; text-align: center">
              <span style="font-size: 20px; font-weight: 800; color: #E8E3EE">连接已断开</span>
              <span style="font-size: 14px; color: #B8B0C2">会话记录保留在本页，重新连接后可继续操作</span>
              <button class="btn btn-p" onClick="{{toggleConn}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.restart}}"></path></svg>重新连接</button>
            </div>
          </div>
        </sc-if>
      </div>

      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 18px; min-height: 36px; padding: 0 12px 2px">
        <span class="pill {{connCls}}">{{connT}}</span>
        <span class="sb mono">{{cur.addr}}</span>
        <span class="sb">xterm-256color · UTF-8</span>
        <span class="sb num"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px"><path d="{{i.size}}"></path></svg>120×36</span>
        <span class="sb num"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px"><path d="{{i.pulse}}"></path></svg>延迟 {{cur.ms}}ms</span>
        <span style="flex: 1"></span>
        <span class="sb num">会话时长 {{cur.dur}}</span>
        <span class="sb">{{cur.auth}}</span>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["sakura","mint","volt","grape","sunset","classic"],"default":"sakura"},"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1100}}'>
const IC = {
