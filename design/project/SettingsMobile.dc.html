<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>系统设置 · 手机</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--pInk)}a:hover{color:var(--ink)}
.th-sakura-light{--p:#D6245F;--pOn:#FFFFFF;--pInk:#C8195A;--pSoft:#FFE3EE;--a:#FFC93C;--aOn:#2A1630;--aSoft:#FFF3CC;--a2:#7B5CFF;--a2Soft:#ECE6FF;--bg:#FFF6F9;--s:#FFFFFF;--s2:#FFF0F5;--line:#F6DCE6;--ink:#2A1630;--ink2:#6E5A72;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#B25E00;--warnSoft:#FFF0D9;--bad:#D21F3C;--badSoft:#FFE2E6}
.th-sakura-dark{--p:#FF4F8B;--pOn:#1A0B14;--pInk:#FF85AE;--pSoft:#3A1A2C;--a:#FFD25A;--aOn:#1A0B14;--aSoft:#3A3016;--a2:#A08BFF;--a2Soft:#2A2245;--bg:#140E17;--s:#1E1622;--s2:#271D2C;--line:#33263A;--ink:#F8EEF4;--ink2:#B9A6BE;--ok:#3DDC97;--okSoft:#123326;--warn:#FFB547;--warnSoft:#3A2A12;--bad:#FF6B81;--badSoft:#3A1720}
.th-mint-light{--p:#00805F;--pOn:#FFFFFF;--pInk:#007A5A;--pSoft:#D9F7EC;--a:#FFE14D;--aOn:#0F2A21;--aSoft:#FFF8CC;--a2:#2E9BFF;--a2Soft:#E0F0FF;--bg:#F3FBF7;--s:#FFFFFF;--s2:#EAF7F1;--line:#D3EDE2;--ink:#0F2A21;--ink2:#4F6B61;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#A35B00;--warnSoft:#FFF2D6;--bad:#D2263B;--badSoft:#FFE3E6}
.th-mint-dark{--p:#1FD3A0;--pOn:#0C1512;--pInk:#4BE3B6;--pSoft:#0F3329;--a:#FFE14D;--aOn:#0C1512;--aSoft:#33300F;--a2:#5BB4FF;--a2Soft:#12283A;--bg:#0C1512;--s:#13201B;--s2:#192A23;--line:#22362E;--ink:#EAF7F2;--ink2:#9DB8AE;--ok:#4BE3B6;--okSoft:#0F3329;--warn:#FFC14D;--warnSoft:#3A2E12;--bad:#FF6B7D;--badSoft:#3A1820}
.th-volt-light{--p:#3450FF;--pOn:#FFFFFF;--pInk:#2A44E6;--pSoft:#E3E8FF;--a:#FF7A1A;--aOn:#11163A;--aSoft:#FFE9D9;--a2:#00B8A9;--a2Soft:#D9F6F3;--bg:#F4F6FF;--s:#FFFFFF;--s2:#EDF0FF;--line:#DDE2F7;--ink:#11163A;--ink2:#555C80;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#B4530A;--warnSoft:#FFEBD9;--bad:#D32448;--badSoft:#FFE2E8}
.th-volt-dark{--p:#5B74FF;--pOn:#0D1024;--pInk:#8C9DFF;--pSoft:#1C2350;--a:#FF8A33;--aOn:#0D1024;--aSoft:#3A2312;--a2:#2FD9C8;--a2Soft:#10302F;--bg:#0D1024;--s:#161A35;--s2:#1D2242;--line:#272D52;--ink:#EEF0FF;--ink2:#A3A9CC;--ok:#3EDC9A;--okSoft:#113024;--warn:#FFAA55;--warnSoft:#3A2812;--bad:#FF6B86;--badSoft:#3A1626}
.th-grape-light{--p:#7C3AED;--pOn:#FFFFFF;--pInk:#6D28D9;--pSoft:#EFE6FF;--a:#FFD23F;--aOn:#1F1436;--aSoft:#FFF6CC;--a2:#E8457A;--a2Soft:#FFE3EC;--bg:#F8F5FF;--s:#FFFFFF;--s2:#F2ECFF;--line:#E4DAFA;--ink:#1F1436;--ink2:#625878;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#A35B00;--warnSoft:#FFF2D6;--bad:#D2263B;--badSoft:#FFE3E6}
.th-grape-dark{--p:#A78BFA;--pOn:#120C1F;--pInk:#C4B1FF;--pSoft:#2A1F4A;--a:#FFD23F;--aOn:#120C1F;--aSoft:#37300F;--a2:#FF7BA6;--a2Soft:#3A1A2A;--bg:#120C1F;--s:#1B1430;--s2:#241B3D;--line:#30264D;--ink:#F2EEFF;--ink2:#B2A8CC;--ok:#3DDC97;--okSoft:#123326;--warn:#FFB547;--warnSoft:#3A2A12;--bad:#FF6B81;--badSoft:#3A1720}
.th-sunset-light{--p:#C2410C;--pOn:#FFFFFF;--pInk:#B23A0A;--pSoft:#FFE6D6;--a:#FFC93C;--aOn:#2B1708;--aSoft:#FFF3CC;--a2:#2F6FED;--a2Soft:#E1EBFF;--bg:#FFF7F0;--s:#FFFFFF;--s2:#FFF0E5;--line:#F7DFCC;--ink:#2B1708;--ink2:#735A4B;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#9A5A00;--warnSoft:#FFF2D6;--bad:#C81E3A;--badSoft:#FFE3E6}
.th-sunset-dark{--p:#FF7A3D;--pOn:#1A0F08;--pInk:#FFA06E;--pSoft:#3A2114;--a:#FFD25A;--aOn:#1A0F08;--aSoft:#3A3016;--a2:#6EA0FF;--a2Soft:#172440;--bg:#150E09;--s:#22160E;--s2:#2C1D13;--line:#3A281B;--ink:#FFF1E8;--ink2:#C7AE9E;--ok:#3DDC97;--okSoft:#123326;--warn:#FFC14D;--warnSoft:#3A2E12;--bad:#FF6B7D;--badSoft:#3A1820}
.th-classic-light{--p:#0F7F72;--pOn:#FFFFFF;--pInk:#0B7266;--pSoft:#DDF3EF;--a:#FFB020;--aOn:#1B2333;--aSoft:#FFF1D6;--a2:#5B6CFF;--a2Soft:#E6E9FF;--bg:#F3F5F9;--s:#FFFFFF;--s2:#EEF1F6;--line:#E2E7EE;--ink:#1B2333;--ink2:#5F6878;--ok:#0B7F57;--okSoft:#DDF5EA;--warn:#A35B00;--warnSoft:#FFF2D6;--bad:#D2263B;--badSoft:#FFE3E6}
.th-classic-dark{--p:#2CC4AE;--pOn:#0E1116;--pInk:#5ED8C5;--pSoft:#12302C;--a:#FFB020;--aOn:#0E1116;--aSoft:#3A2E12;--a2:#8C98FF;--a2Soft:#1E2348;--bg:#0E1116;--s:#171B22;--s2:#1C212B;--line:#2B323D;--ink:#E8EBF1;--ink2:#9AA2B1;--ok:#3DDC97;--okSoft:#123326;--warn:#FFC14D;--warnSoft:#3A2E12;--bad:#FF6B7D;--badSoft:#3A1820}
.root{font-family:'Outfit','HarmonyOS Sans SC','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.root *{box-sizing:border-box}
.card{background:var(--s);border:1px solid var(--line);border-radius:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:0;font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn:disabled{cursor:not-allowed;transform:none}
.btn-p{background:var(--p);color:var(--pOn)}
.btn-p:disabled{background:var(--s2);color:var(--ink2)}
.btn-s{background:var(--s2);color:var(--ink)}
.btn-o{background:var(--s);color:var(--ink);border:1.5px solid var(--line)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:var(--ink2);cursor:pointer;position:relative;flex:none;text-decoration:none}
.ib:hover{background:var(--s2);color:var(--ink)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.ok{background:var(--okSoft);color:var(--ok)}
.var{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:6px;background:var(--a2Soft);color:var(--ink);font-size:11px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--s);color:var(--ink2);font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none;text-decoration:none}
.chip-on,.chip-on:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.utab{display:inline-flex;align-items:center;min-height:44px;padding:0 2px;border-bottom:3px solid transparent;color:var(--ink2);text-decoration:none;font-size:15px;font-weight:700;flex:none}
.utab-on,.utab-on:hover{color:var(--ink);border-bottom-color:var(--p)}
.seg{display:flex;padding:4px;border-radius:999px;background:var(--s2);gap:2px}
.seg button{flex:1;min-height:40px;padding:0 10px;border-radius:999px;border:0;background:transparent;font:inherit;font-size:14px;font-weight:700;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg .on{background:var(--s);color:var(--ink);box-shadow:0 1px 3px rgba(20,10,30,.12)}
.tg{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
.tg::after{content:'';position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.tg:checked{background:var(--p)}
.tg:checked::after{transform:translateX(20px)}
.mr{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.mr-sw{flex-direction:row;align-items:center;gap:14px;cursor:pointer}
.mt{font-size:15px;font-weight:700}
.md{font-size:12px;color:var(--ink2);line-height:1.5}
.fld{width:100%;min-height:48px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--s);font:inherit;font-size:15px;color:var(--ink);outline:none}
.fld:focus{border-color:var(--p)}
.grp{display:flex;align-items:center;min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--s);overflow:hidden}
.grp:focus-within{border-color:var(--p)}
.grp input{flex:1;min-width:0;height:45px;padding:0 12px;border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);outline:none}
.grp .u{display:flex;align-items:center;align-self:stretch;padding:0 12px;background:var(--s2);color:var(--ink2);font-size:13px;font-weight:700;white-space:nowrap}
.av{display:flex;align-items:center;justify-content:center;flex:none;font-weight:800}
.av-p{background:var(--pSoft);color:var(--pInk)}.av-a{background:var(--aSoft);color:var(--aOn)}.av-a2{background:var(--a2Soft);color:var(--ink)}.av-ok{background:var(--okSoft);color:var(--ok)}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
.num{font-family:'Outfit',sans-serif;font-variant-numeric:tabular-nums}
.tpl{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
.hs{scrollbar-width:none;-ms-overflow-style:none}.hs::-webkit-scrollbar{display:none}
</style>
</helmet>
<div class="root th-{{palette}}-{{mode}}" style="width: 390px; min-height: 2720px; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 4px; padding: 14px 12px 4px 8px">
    <a class="ib" href="MoreMobile.dc.html" aria-label="返回更多" style="color: var(--ink)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.back}}"></path></svg></a>
    <div style="flex: 1; display: flex; flex-direction: column">
      <h1 style="margin: 0; font-size: 22px; font-weight: 800">系统设置</h1>
      <span style="font-size: 12px; color: var(--ink2)">对所有用户生效</span>
    </div>
    <button class="ib" aria-label="切换深浅色" onClick="{{toggleDark}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{modeIcon}}"></path></svg></button>
  </header>
  <nav class="hs" aria-label="系统设置分类" style="display: flex; gap: 24px; padding: 0 20px; border-bottom: 1px solid var(--line); overflow-x: auto">
    <a class="utab utab-on" href="SettingsMobile.dc.html" aria-current="page">常规 · 登录 · 邮件</a>
    <a class="utab" href="OIDCMobile.dc.html">OIDC 身份提供方</a>
  </nav>

  <nav class="hs" aria-label="本页目录" style="position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; background: var(--bg)">
    <sc-for list="{{secs}}" as="s" hint-placeholder-count="4">
      <a class="chip {{s.cls}}" href="#{{s.id}}" onClick="{{s.pick}}" aria-current="{{s.cur}}">{{s.t}}<sc-if value="{{s.dirty}}" hint-placeholder-val="{{false}}"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--warn)" aria-label="有修改"></span></sc-if></a>
    </sc-for>
  </nav>

  <div style="display: flex; flex-direction: column; gap: 16px; padding: 4px 16px 24px">

    <section id="m-general" class="card" aria-labelledby="mh-general" style="padding: 16px 16px 4px">
      <div style="display: flex; align-items: center; gap: 12px; padding-bottom: 12px">
        <span class="av av-p" style="width: 38px; height: 38px; border-radius: 13px; transform: rotate(-4deg)"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.settings}}"></path></svg></span>
        <h2 id="mh-general" style="margin: 0; font-size: 18px; font-weight: 800">常规</h2>
      </div>
      <div class="mr">
        <label class="mt" for="m-name">站点名称</label>
        <input id="m-name" class="fld" type="text" value="Momoko" onChange="{{markGeneral}}">
      </div>
      <div class="mr">
        <label class="mt" for="m-url">对外地址</label>
        <input id="m-url" class="fld mono" type="url" value="https://[你的域名]" style="font-size: 14px" onChange="{{markGeneral}}">
        <span class="md">分享链接、邮件跳转和 OIDC 回调都用这个地址</span>
      </div>
      <div class="mr">
        <span class="mt">默认语言</span>
        <div class="seg" role="group" aria-label="默认语言">
          <sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
            <button class="{{l.cls}}" aria-pressed="{{l.on}}" onClick="{{l.pick}}">{{l.t}}</button>
          </sc-for>
        </div>
      </div>
    </section>

    <section id="m-login" class="card" aria-labelledby="mh-login" style="padding: 16px 16px 4px">
      <div style="display: flex; align-items: center; gap: 12px; padding-bottom: 12px">
        <span class="av av-a2" style="width: 38px; height: 38px; border-radius: 13px; transform: rotate(3deg)"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.login}}"></path></svg></span>
        <h2 id="mh-login" style="margin: 0; font-size: 18px; font-weight: 800">登录</h2>
      </div>
      <label class="mr mr-sw">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span class="mt">允许注册</span><span class="md">关闭后只能由管理员创建用户</span></span>
        <input class="tg" type="checkbox" role="switch" aria-label="允许注册" checked="{{allowReg}}" onChange="{{flipReg}}">
      </label>
      <label class="mr mr-sw">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span class="mt">邮箱验证码登录</span><span class="md">需要先配好邮件服务</span></span>
        <input class="tg" type="checkbox" role="switch" aria-label="邮箱验证码登录" checked="{{codeLogin}}" onChange="{{flipCode}}">
      </label>
      <div class="mr">
        <span class="mt">令牌有效期</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <label style="display: flex; flex-direction: column; gap: 6px"><span class="md">访问令牌</span><span class="grp"><input class="num" type="number" value="120" aria-label="访问令牌有效期" onChange="{{markLogin}}"><span class="u">分钟</span></span></label>
          <label style="display: flex; flex-direction: column; gap: 6px"><span class="md">刷新令牌</span><span class="grp"><input class="num" type="number" value="30" aria-label="刷新令牌有效期" onChange="{{markLogin}}"><span class="u">天</span></span></label>
        </div>
      </div>
      <div class="mr">
        <span class="mt">登录失败锁定</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <label style="display: flex; flex-direction: column; gap: 6px"><span class="md">连续失败</span><span class="grp"><input class="num" type="number" value="5" aria-label="失败次数" onChange="{{markLogin}}"><span class="u">次</span></span></label>
          <label style="display: flex; flex-direction: column; gap: 6px"><span class="md">锁定</span><span class="grp"><input class="num" type="number" value="15" aria-label="锁定时长" onChange="{{markLogin}}"><span class="u">分钟</span></span></label>
        </div>
        <span class="md">按账号 + IP 计数</span>
      </div>
    </section>

    <section id="m-mail" class="card" aria-labelledby="mh-mail" style="padding: 16px 16px 6px">
      <div style="display: flex; align-items: center; gap: 12px; padding-bottom: 12px">
        <span class="av av-a" style="width: 38px; height: 38px; border-radius: 13px; transform: rotate(-3deg)"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.mail}}"></path></svg></span>
        <h2 id="mh-mail" style="margin: 0; flex: 1; font-size: 18px; font-weight: 800">邮件</h2>
        <span class="pill ok">已连通</span>
      </div>
      <div class="mr">
        <span class="mt">SMTP 服务器</span>
        <div style="display: flex; gap: 10px">
          <input class="fld mono" type="text" value="smtp.qq.com" aria-label="SMTP 主机" style="flex: 1; font-size: 14px" onChange="{{markMail}}">
          <label class="grp" style="width: 112px"><span class="u">端口</span><input class="num" type="number" value="{{port}}" aria-label="SMTP 端口" onChange="{{markMail}}"></label>
        </div>
      </div>
      <div class="mr">
        <span class="mt">加密</span>
        <div class="seg" role="group" aria-label="加密方式">
          <sc-for list="{{encs}}" as="e" hint-placeholder-count="3">
            <button class="{{e.cls}}" aria-pressed="{{e.on}}" onClick="{{e.pick}}">{{e.t}}</button>
          </sc-for>
        </div>
        <span class="md">{{encHint}}</span>
      </div>
      <div class="mr">
        <label class="mt" for="m-from">发件人</label>
        <input id="m-from" class="fld" type="text" value="Momoko &lt;noreply@[你的域名]&gt;" onChange="{{markMail}}">
      </div>
      <div class="mr">
        <label class="mt" for="m-user">账号</label>
        <input id="m-user" class="fld mono" type="text" value="noreply@[你的域名]" style="font-size: 14px" onChange="{{markMail}}">
      </div>
      <div class="mr">
        <label class="mt" for="m-pwd">密码 / 授权码</label>
        <div class="grp">
          <input id="m-pwd" class="mono" type="{{pwdType}}" value="xkqmvbpzrtlwncsd" onChange="{{markMail}}">
          <button class="ib" aria-label="{{pwdLabel}}" onClick="{{flipPwd}}"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{pwdIcon}}"></path></svg></button>
        </div>
        <span class="md">QQ、163 邮箱填「授权码」，不是登录密码</span>
      </div>
      <div class="mr">
        <button class="btn btn-o" onClick="{{sendTest}}" style="min-height: 48px"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.send}}"></path></svg>发送测试邮件到 admin@momoko.local</button>
        <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink2)"><span class="pill ok">{{testPill}}</span>{{testText}}</span>
      </div>

      <div style="padding: 16px 0 4px; border-top: 1px solid var(--line)">
        <h3 style="margin: 0; font-size: 15px; font-weight: 800">邮件模板</h3>
      </div>
      <sc-for list="{{tpls}}" as="tp" hint-placeholder-count="5">
        <div class="tpl">
          <span class="av {{tp.av}}" style="width: 36px; height: 36px; border-radius: 12px; transform: rotate({{tp.rot}})"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{tp.d}}"></path></svg></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <span style="display: flex; align-items: center; gap: 6px"><span style="font-size: 15px; font-weight: 700">{{tp.t}}</span><sc-if value="{{tp.custom}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 700; color: var(--pInk)">已自定义</span></sc-if></span>
            <span style="display: flex; flex-wrap: wrap; gap: 4px">
              <sc-for list="{{tp.vars}}" as="v" hint-placeholder-count="2">
                <span class="var mono">{{v}}</span>
              </sc-for>
            </span>
          </span>
          <button class="ib" aria-label="编辑模板 {{tp.t}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.edit}}"></path></svg></button>
        </div>
      </sc-for>
    </section>

    <section id="m-update" class="card" aria-labelledby="mh-update" style="padding: 16px 16px 4px">
      <div style="display: flex; align-items: center; gap: 12px; padding-bottom: 12px">
        <span class="av av-ok" style="width: 38px; height: 38px; border-radius: 13px; transform: rotate(4deg)"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.download}}"></path></svg></span>
        <h2 id="mh-update" style="margin: 0; font-size: 18px; font-weight: 800">版本更新</h2>
      </div>
      <div style="background: var(--p); color: var(--pOn); border-radius: 20px; padding: 18px; position: relative; overflow: hidden; margin-bottom: 6px">
        <div aria-hidden="true" style="position: absolute; right: -40px; bottom: -60px; width: 150px; height: 150px; border-radius: 50%; background: var(--a)"></div>
        <div aria-hidden="true" style="position: absolute; right: 90px; top: -22px; width: 54px; height: 54px; border-radius: 50%; border: 9px solid var(--a2)"></div>
        <div style="position: relative; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 12px; font-weight: 700">当前版本</span>
          <span class="num" style="font-size: 32px; font-weight: 800; line-height: 1.1">[版本号]</span>
          <span style="font-size: 12px; font-weight: 600">{{checkText}}</span>
          <button class="btn" onClick="{{check}}" style="align-self: flex-start; margin-top: 10px; background: var(--pOn); color: var(--p)"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.restart}}"></path></svg>检查更新</button>
        </div>
      </div>
      <label class="mr mr-sw">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span class="mt">自动检查更新</span><span class="md">每天 08:00 检查，有新版本时通知，不自动安装</span></span>
        <input class="tg" type="checkbox" role="switch" aria-label="自动检查更新" checked="{{autoCheck}}" onChange="{{flipAuto}}">
      </label>
      <div class="mr">
        <span class="mt">更新通道</span>
        <div class="seg" role="group" aria-label="更新通道">
          <sc-for list="{{chans}}" as="c" hint-placeholder-count="2">
            <button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.t}}</button>
          </sc-for>
        </div>
      </div>
    </section>
  </div>

  <div style="position: sticky; bottom: 0; margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 16px 26px; background: var(--s); border-top: 1px solid var(--line)">
    <span style="width: 9px; height: 9px; border-radius: 50%; background: {{saveDot}}; flex: none"></span>
    <span style="flex: 1; min-width: 0; font-size: 13px; font-weight: 700">{{saveText}}</span>
    <button class="btn btn-s" disabled="{{clean}}" onClick="{{discard}}">放弃</button>
    <button class="btn btn-p" disabled="{{clean}}" onClick="{{save}}">保存</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["sakura","mint","volt","grape","sunset","classic"],"default":"sakura"},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":2720}}'>
const IC = {

  sun: 'M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',
  moon: 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z',
  login: 'M10 17l5-5-5-5M15 12H3M14 3h6v18h-6',
  mail: 'M3 6h18v12H3zM3 7l9 6 9-6',
  send: 'M21 3 10 14M21 3l-7 18-4-7-7-4z',
  download: 'M12 3v12M7 10l5 5 5-5M4 20h16',
  key: 'M14.5 3a6.5 6.5 0 1 1-4.6 11.1L8 16v2H6v2H3v-3l6.9-6.9A6.5 6.5 0 0 1 14.5 3zM16.5 7.5h.01',
  shield: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',

  eyeOff: 'M3 3l18 18M10.6 6.1A10 10 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3.2 3.8M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7c1.8 0 3.4-.5 4.7-1.2M9.9 9.9a3 3 0 0 0 4.2 4.2',
  restart: 'M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7',
  edit: 'M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4'
};
const TPLS = [
  { t: '注册验证码', vars: ['${code}', '${minutes}'], d: IC.user, av: 'av-p' },
  { t: '登录验证码', vars: ['${code}', '${ip}'], d: IC.key, av: 'av-a2', custom: true },
  { t: '重置密码', vars: ['${link}', '${user}'], d: IC.shield, av: 'av-a' },

const ENC = { ssl: ['SSL', 465, 'SSL 一般用 465 端口，最省心'], starttls: ['STARTTLS', 587, 'STARTTLS 一般用 587 端口'], none: ['无', 25, '不加密，只建议在内网使用'] };
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const palette = this.props.palette ?? 'sakura';

    const dirty = st.dirty || { login: true };

    const codeLogin = st.codeLogin != null ? st.codeLogin : true;
    const autoCheck = st.autoCheck != null ? st.autoCheck : true;
    const showPwd = !!st.showPwd;
    const tested = !!st.tested;
    const checked = !!st.checked;
    const mark = (k, extra) => this.setState({ ...(extra || {}), dirty: { ...dirty, [k]: true } });
    const dirtyN = Object.keys(dirty).filter((k) => dirty[k]).length;
    return {
      palette,
      mode: dark ? 'dark' : 'light',
      i: IC,
      modeIcon: dark ? IC.sun : IC.moon,
      toggleDark: () => this.setState({ dark: !dark }),
      secs: [['general', '常规'], ['login', '登录'], ['mail', '邮件'], ['update', '更新']].map(([k, t]) => ({ id: 'm-' + k, t, cls: k === sec ? 'chip-on' : '', cur: k === sec ? 'true' : null, dirty: !!dirty[k], pick: () => this.setState({ sec: k }) })),

}
