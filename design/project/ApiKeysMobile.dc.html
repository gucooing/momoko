.root{font-family:'Outfit','HarmonyOS Sans SC','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.root *{box-sizing:border-box}
.card{background:var(--s);border:1px solid var(--line);border-radius:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:0;font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--p);color:var(--pOn)}
.btn-s{background:var(--s2);color:var(--ink)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:var(--ink2);cursor:pointer;position:relative;flex:none;text-decoration:none}
.ib:hover{background:var(--s2);color:var(--ink)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.ok{background:var(--okSoft);color:var(--ok)}.off{background:var(--s2);color:var(--ink2)}.warn{background:var(--warnSoft);color:var(--warn)}.bad{background:var(--badSoft);color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--s);color:var(--ink2);font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.chip-on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{font-size:12px;opacity:.7}
.utab{display:inline-flex;align-items:center;min-height:44px;padding:0 2px;border-bottom:3px solid transparent;color:var(--ink2);text-decoration:none;font-size:15px;font-weight:700;flex:none}
.utab-on,.utab-on:hover{color:var(--ink);border-bottom-color:var(--p)}
.inp{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 16px;border-radius:999px;background:var(--s);border:1.5px solid var(--line);color:var(--ink2)}
.inp:focus-within{border-color:var(--p)}
.inp input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);outline:none}
.inp input::placeholder{color:var(--ink2)}
.scope{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:8px;font-size:12px;font-weight:600;white-space:nowrap}
.sc-node{background:var(--a2Soft);color:var(--ink)}
.sc-all{background:var(--pSoft);color:var(--pInk)}
.av{display:flex;align-items:center;justify-content:center;flex:none;font-weight:800}
.av-p{background:var(--pSoft);color:var(--pInk)}.av-a{background:var(--aSoft);color:var(--aOn)}.av-a2{background:var(--a2Soft);color:var(--ink)}.av-ok{background:var(--okSoft);color:var(--ok)}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
.num{font-family:'Outfit',sans-serif;font-variant-numeric:tabular-nums}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px;padding-top:6px;color:var(--ink2);text-decoration:none;font-size:11px;font-weight:600}
.tab .tb{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:999px}
.tab-on{color:var(--pInk)}.tab-on .tb{background:var(--pSoft)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
.hs{scrollbar-width:none;-ms-overflow-style:none}.hs::-webkit-scrollbar{display:none}
</style>
</helmet>
<div class="root th-{{palette}}-{{mode}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div class="hs" style="flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 170px">
    <header style="display: flex; align-items: center; gap: 4px; padding: 14px 12px 4px 8px">
      <a class="ib" href="MoreMobile.dc.html" aria-label="返回更多"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.back}}"></path></svg></a>
      <div style="flex: 1; display: flex; flex-direction: column">
        <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.01em">节点与 API Key</h1>
      </div>
      <button class="ib" aria-label="切换深浅色" onClick="{{toggleDark}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{modeIcon}}"></path></svg></button>
    </header>
    <nav class="hs" aria-label="节点分类" style="display: flex; gap: 24px; padding: 0 20px; border-bottom: 1px solid var(--line); overflow-x: auto">
      <a class="utab" href="NodesMobile.dc.html">节点 3</a>
      <a class="utab utab-on" href="ApiKeysMobile.dc.html" aria-current="page">API Key 6</a>
    </nav>
    <div style="padding: 14px 16px 10px">
      <label class="inp">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.search}}"></path></svg>
        <input type="search" placeholder="名称、前缀或所属用户" aria-label="搜索 API Key">
      </label>
    </div>
    <div class="hs" role="tablist" aria-label="按状态筛选" style="display: flex; gap: 8px; padding: 2px 16px 14px; overflow-x: auto">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button class="chip {{f.cls}}" role="tab" aria-selected="{{f.on}}" onClick="{{f.pick}}">{{f.t}} <span class="n num">{{f.n}}</span></button>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 0 16px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
        <article class="card" style="padding: 16px 12px 6px 16px; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; align-items: center; gap: 12px; padding-right: 4px">
            <span class="av {{r.av}}" style="width: 44px; height: 44px; border-radius: 15px; transform: rotate({{r.rot}})"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.key}}"></path></svg></span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 16px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.n}}</span>
              <span class="mono" style="font-size: 12px; color: var(--ink2)">{{r.masked}}</span>
            </span>
            <span class="pill {{r.stCls}}">{{r.stT}}</span>
          </div>
          <dl style="margin: 0 4px 0 0; padding: 10px 12px; border-radius: 14px; background: var(--s2); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px">
            <div style="min-width: 0">
              <dt style="font-size: 11px; font-weight: 700; color: var(--ink2)">所属用户</dt>
              <dd style="margin: 2px 0 0; font-size: 13px; font-weight: 700">{{r.owner}}</dd>
            </div>
            <div style="min-width: 0">
              <dt style="font-size: 11px; font-weight: 700; color: var(--ink2)">有效期</dt>
              <dd class="num" style="margin: 2px 0 0; font-size: 13px; font-weight: 700; color: {{r.expC}}">{{r.exp}}</dd>
            </div>
            <div style="min-width: 0">
              <dt style="font-size: 11px; font-weight: 700; color: var(--ink2)">最后使用</dt>
              <dd class="num" style="margin: 2px 0 0; font-size: 13px; font-weight: 700">{{r.last}}</dd>
            </div>
            <div style="min-width: 0">
              <dt style="font-size: 11px; font-weight: 700; color: var(--ink2)">创建于</dt>
              <dd class="num" style="margin: 2px 0 0; font-size: 13px; font-weight: 700">{{r.created}}</dd>
            </div>
            <div style="grid-column: 1 / -1; min-width: 0">
              <dt style="font-size: 11px; font-weight: 700; color: var(--ink2)">来源 IP</dt>
              <dd class="mono" style="margin: 2px 0 0; font-size: 12px">{{r.ip}}</dd>
            </div>
          </dl>
          <div style="display: flex; align-items: center; gap: 2px; padding-top: 6px; border-top: 1px solid var(--line)">
            <div style="flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px">
              <sc-for list="{{r.scopes}}" as="sc" hint-placeholder-count="1">
                <span class="scope {{sc.cls}}">{{sc.t}}</span>
              </sc-for>
            </div>
            <button class="ib" aria-label="复制 {{r.n}} 的密钥前缀"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.copy}}"></path></svg></button>
            <button class="ib" aria-label="刷新 {{r.n}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.restart}}"></path></svg></button>
            <button class="ib" aria-label="编辑 {{r.n}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.edit}}"></path></svg></button>
            <button class="ib" aria-label="删除 {{r.n}}" style="color: var(--bad)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.trash}}"></path></svg></button>
          </div>
        </article>
      </sc-for>
    </div>
  </div>

  <button class="btn btn-p" aria-label="新建密钥" onClick="{{openSheet}}" style="position: absolute; right: 16px; bottom: 100px; width: 60px; height: 60px; padding: 0; border-radius: 20px; box-shadow: 0 12px 28px -10px var(--p)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 26px; height: 26px"><path d="{{i.plus}}"></path></svg></button>

  <nav aria-label="底部导航" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; padding: 6px 8px 22px; background: var(--s); border-top: 1px solid var(--line)">
    <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="5">
      <a class="tab {{tb.cls}}" href="{{tb.href}}"><span class="tb"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{tb.d}}"></path></svg></span>{{tb.t}}</a>
    </sc-for>
  </nav>

  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{true}}">
    <button aria-label="关闭" onClick="{{closeSheet}}" style="position: absolute; inset: 0; border: 0; padding: 0; background: rgba(12, 6, 18, 0.5); cursor: pointer"></button>
    <section role="dialog" aria-label="密钥已创建" style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--s); border-radius: 30px 30px 0 0; padding: 10px 16px 28px; display: flex; flex-direction: column; gap: 16px">
      <div style="align-self: center; width: 44px; height: 5px; border-radius: 999px; background: var(--line)"></div>
      <div style="display: flex; align-items: center; gap: 14px">
        <span class="av av-ok" style="width: 52px; height: 52px; border-radius: 17px; transform: rotate(-6deg)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 26px; height: 26px; stroke-width: 2.4"><path d="{{i.check}}"></path></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 20px; font-weight: 800">密钥已创建</span>
          <span style="font-size: 13px; color: var(--ink2)">备份脚本 · 2027-05-03 到期</span>
        </span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <span class="scope sc-node">DESKTOP-K5K9BBC</span>
        <span class="scope sc-node">nas-home</span>
        <span class="scope" style="background: var(--aSoft); color: var(--aOn)">所属 超级管理员</span>
      </div>
      <div class="mono" style="padding: 14px 16px; border-radius: 16px; background: var(--s2); border: 1.5px dashed var(--line); font-size: 15px; font-weight: 600; line-height: 1.5; word-break: break-all">{{fullKey}}</div>
      <button class="btn btn-p" onClick="{{copyNew}}" style="min-height: 52px; font-size: 15px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{copyIcon}}"></path></svg>{{copyText}}</button>
      <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 16px; background: var(--warnSoft); color: var(--warn); font-size: 13px; font-weight: 600; line-height: 1.5">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="margin-top: 1px"><path d="{{i.alert}}"></path></svg>
        <span><b style="font-weight: 800">只显示这一次。</b>关闭后无法再次查看完整密钥，丢失只能「刷新」重新生成。</span>
      </div>
      <button class="btn btn-s" onClick="{{closeSheet}}" style="min-height: 52px; font-size: 15px">我已保存</button>
    </section>
  </sc-if>
</div>
</x-dc>
