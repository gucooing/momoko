<div class="root th-{{palette}}-{{mode}}" style="min-height: 1440px; display: flex; flex-wrap: wrap; align-items: stretch">

  <aside class="shell" style="flex: 1 1 248px; max-width: 100%; background: var(--s); border-right: 1px solid var(--line); padding: 20px 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 4px 8px">
      <div style="width: 40px; height: 40px; border-radius: 13px; background: var(--p); color: var(--pOn); display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 800; transform: rotate(-6deg)">M</div>
      <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.01em">Momoko</span>
    </div>
    <div style="position: relative">
    <button aria-haspopup="menu" aria-expanded="{{nodeOn}}" onClick="{{toggleNode}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 8px 12px; border-radius: 16px; border: 1.5px dashed var(--line); background: var(--bg); font: inherit; color: var(--ink); cursor: pointer; text-align: left">
      <span class="av av-a2" style="width: 36px; height: 36px; border-radius: 11px"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.server}}"></path></svg></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-size: 11px; font-weight: 700; color: var(--ok)">{{nodeS}}</span>
        <span style="font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{nodeN}}</span>
      </span>
      <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ink2)"><path d="{{i.updown}}"></path></svg>
    </button>
      <sc-if value="{{nodeOn}}" hint-placeholder-val="{{false}}">

  { n: 'go-style', d: 'Go 代码的命名、错误处理和分层约定。', src: '从服务器导入', scope: '全部工作区', files: 2, on: false }
];
const AVS = ['av-p', 'av-a2', 'av-a', 'av-ok'];

const DFILES = [
  [0, 'file', 'SKILL.md', 1],
  [0, 'dir', 'scripts'],
  [1, 'file', 'explain.sh'],
  [0, 'dir', 'references'],
  [1, 'file', 'index-rules.md']
];
const DTEXT = [
  ['---', 2],
  ['name: sql-review', 2],
  ['description: 检查查询有没有把筛选、分页、计数都放进 SQL', 2],
  ['---', 2],
  [''],
  ['# SQL 检查'],
  [''],
  ['改到数据查询的时候用。'],
  [''],
  ['1. 找出这次改动涉及的每一条查询'],
  ['2. 筛选、搜索、分页、计数、统计都必须写在 SQL 里'],
  ['3. 不要把数据查出来再在内存里过滤或切片'],
  ['4. 运行 scripts/explain.sh 看执行计划，确认用到了索引'],
  ['5. 索引的取舍见 references/index-rules.md'],
  [''],
  ['最后给出一份清单：哪些查询合格，哪些要改，怎么改。']
];
const NODES = [['DESKTOP-K5K9BBC', '本机', 1], ['hk-relay-01', '远程', 1], ['home-nas', '远程', 0]];
const NOTES = [['「文章列表加分页和标签筛选」在等你批准', 'Claude Code 想运行 pnpm test · 刚刚', 'Main.dc.html'], ['「升级依赖并修掉 lint 报错」还在运行', 'Codex · 已经 12 分钟', 'AgentSessionsPC.dc.html'], ['OpenAI · 主账号 登录已过期', '重新登录后才能继续用它开会话 · 今天 09:40', 'AgentProvidersPC.dc.html']];
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const shellPop = st.shellPop || '';
    const nodeI = st.node || 0;
    const unread = st.unread != null ? st.unread : true;
    const say = (m) => this.setState({ toast: m });
    const rail = RAIL.map(([t, d, sep, href]) => ({ t, d: IC[d], sep: !!sep, href: href || '#', cls: d === 'bot' ? 'rl-on' : '' }));
    const palette = this.props.palette ?? 'sakura';
    const dark = st.dark != null ? st.dark : (this.props.dark ?? false);
    const on = st.on || {};
    const nav = NAV.map(([title, items]) => ({ title, items: items.map(([t, d, href, cur]) => ({ t, d: IC[d], href: href || '#', cls: cur ? 'nav-on' : '' })) }));
    const gone = st.gone || {};
    const list = st.list || SKILLS;
    const F = st.form || null;
    const setF = (patch) => this.setState({ form: { ...F, ...patch } });
    const inp = (k) => ({ v: F ? F[k] : '', set: (e) => setF({ [k]: e.target.value }) });
    const mdOf = (n, d) => ['---', 'name: ' + n, 'description: ' + d, '---', '', '# ' + (n || '新技能'), '', '什么时候用、按什么步骤做，写在这里。'].join('\n');
    const formOf = (x, cur) => {
      const files = x.n === 'sql-review'
        ? [['SKILL.md', DTEXT.map((r) => r[0]).join('\n')], ['scripts/explain.sh', '#!/bin/sh\n# 打印一条查询的执行计划\npsql "$PG_DSN" -c "EXPLAIN ANALYZE $1"'], ['references/index-rules.md', '# 索引取舍\n\n- 高频筛选列建索引\n- 排序列和筛选列放进同一个联合索引\n- 写多读少的表少建索引']]
        : [['SKILL.md', mdOf(x.n, x.d)]].concat(Array.from({ length: Math.max(0, x.files - 1) }, (u, q) => ['references/note-' + (q + 1) + '.md', '# 参考 ' + (q + 1) + '\n']));
      return { mode: 'edit', key: x.n, name: x.n, desc: x.d, files, cur: 0, on: cur };
    };
    const blankForm = () => ({ mode: 'add', key: '', name: '', desc: '', files: [['SKILL.md', mdOf('', '')]], cur: 0, on: true });
    const curFile = F ? F.files[F.cur] : ['', ''];
    const setFile = (q, v) => setF({ files: F.files.map((x, w) => (w === F.cur ? (q === 0 ? [v, x[1]] : [x[0], v]) : x)) });
    const treeOf = () => {
      const rows = [];
      const seen = {};
      F.files.forEach((x, q) => {
        const at = x[0].lastIndexOf('/');
        const dir = at < 0 ? '' : x[0].slice(0, at);
        if (dir && !seen[dir]) { seen[dir] = true; rows.push({ dir: true, file: false, t: dir }); }
        rows.push({ dir: false, file: true, t: at < 0 ? x[0] : x[0].slice(at + 1), pad: dir ? '26px' : '10px', cls: q === F.cur ? 'fr-on' : '', cur: q === F.cur ? 'true' : 'false', pick: () => setF({ cur: q }) });
      });
      return rows;
    };
    const saveForm = () => {
      const n = F.name.trim();
      if (!n) { say('先填一个名称'); return; }
      const old = list.find((x) => x.n === F.key);
      const row = { n, d: F.desc.trim() || '没有说明', src: old ? old.src : '在这里写的', files: F.files.length, on: F.on };
      const { [F.key]: drop, ...rest } = on;
      this.setState({ list: old ? list.map((x) => (x.n === old.n ? row : x)) : list.concat([row]), on: { ...rest, [n]: F.on }, form: null, toast: (old ? '已保存技能 ' : '已新建技能 ') + n });

    const skills = list.map((s, idx) => {
      const cur = on[s.n] != null ? on[s.n] : s.on;
      return { ...s, av: AVS[idx % 4], rot: ROTS[idx % 4], on: cur, toggle: () => this.setState({ on: { ...on, [s.n]: !cur } }), edit: () => this.setState({ form: formOf(s, cur) }), del: () => this.setState({ list: list.filter((x) => x.n !== s.n), toast: '已删除技能 ' + s.n }) };
    });
    const fvs = st.fv || {};
    const fldOf = (k, def) => { const key = k + ':' + def; return { v: fvs[key] != null ? fvs[key] : def, set: (e) => this.setState({ fv: { ...fvs, [key]: e.target.value } }) }; };
    const fv = { k0: fldOf('k0', "sql-review"), k1: fldOf('k1', "检查查询有没有把筛选、分页、计数都放进 SQL，有没有漏掉索引") };
    const swOn = st.sw != null ? st.sw : true;
    return {
      palette,
      mode: dark ? 'dark' : 'light',
      i: IC,
      nodeOn: shellPop === 'node',
      toggleNode: () => this.setState({ shellPop: shellPop === 'node' ? '' : 'node' }),
      nodeN: NODES[nodeI][0],
      nodeS: '● ' + NODES[nodeI][1] + ' · 在线',
      nodeTip: NODES[nodeI][1] + ' · ' + NODES[nodeI][0],
      nodes: NODES.map(([n, s, ok], idx) => ({ n, s: ok ? s : '离线', c: ok ? 'var(--ok)' : 'var(--line)', on: idx === nodeI, cls: idx === nodeI ? 'shi-on' : '', pick: () => this.setState(ok ? { node: idx, shellPop: '', toast: '已切换到 ' + n } : { shellPop: '', toast: n + ' 现在离线，连不上' }) })),
      bellOn: shellPop === 'bell',
      toggleBell: () => this.setState({ shellPop: shellPop === 'bell' ? '' : 'bell' }),
      hasUnread: unread,
      readAll: () => this.setState({ unread: false, shellPop: '' }),
      notes: NOTES.map(([t, s, href]) => ({ t, s, href, w: unread ? '700' : '500' })),
      acctOn: shellPop === 'acct',
      toggleAcct: () => this.setState({ shellPop: shellPop === 'acct' ? '' : 'acct' }),
      langT: st.lang === 'en' ? 'English' : '简体中文',
      toggleLang: () => this.setState({ lang: st.lang === 'en' ? 'zh' : 'en' }),
      logout: () => this.setState({ shellPop: '', toast: '已退出登录' }),
      fv,
      sw: { on: swOn, flip: () => this.setState({ sw: !swOn }) },
      rail,
      hasToast: !!st.toast,
      toast: st.toast || '',
      closeToast: () => this.setState({ toast: '' }),
      impOn: !!st.imp,
      toggleImp: () => this.setState({ imp: !st.imp }),
      imps: ['上传压缩包', '从 Git 地址', '服务器上已有的目录'].map((t) => ({ t, pick: () => this.setState({ imp: false, toast: '已导入技能（' + t + '）' }) })),
      modeIcon: dark ? IC.sun : IC.moon,
      toggleDark: () => this.setState({ dark: !dark }),
      nav,
      tabs: TABS.map(([t, href, n], idx) => ({ t, href, n, d: IC[SIDE[idx]], cls: idx === 4 ? 'utab-on' : '' })),
      skills,
      onCount: skills.filter((s) => s.on).length,
      t: true,
      dlgOn: !!F,
      openDlg: () => this.setState({ form: blankForm() }),
      saveForm,
      f: {
        title: F && F.mode === 'edit' ? '编辑技能' : '新建技能',
        name: inp('name'), desc: inp('desc'),
        tree: F ? treeOf() : [],
        path: { v: curFile[0], set: (e) => setFile(0, e.target.value) },
        text: { v: curFile[1], set: (e) => setFile(1, e.target.value) },
        canDrop: !!F && F.files.length > 1,
        dropFile: () => setF({ files: F.files.filter((x, q) => q !== F.cur), cur: 0 }),
        addFile: () => setF({ files: F.files.concat([['references/new-' + F.files.length + '.md', '']]), cur: F.files.length }),
        on: !!F && F.on, flipOn: () => setF({ on: !F.on })
      },
      closeDlg: () => this.setState({ form: null }),
      files: DFILES.map(([lv, kind, t, cur]) => ({ t, d: kind === 'dir' ? IC.folder : IC.file, pad: (10 + lv * 18) + 'px', cls: cur ? 'fr-on' : '', cur: cur ? 'true' : 'false' })),
      lines: DTEXT.map(([t, dim], idx) => ({ n: idx + 1, t, c: dim ? 'var(--ink2)' : 'var(--ink)' })),
    };
  }
}
</script>
