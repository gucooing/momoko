server:
  http:
    addr: 0.0.0.0:22633
    timeout: 15s
  grpc:
    addr: 0.0.0.0:22733
    timeout: 15s
passport:
  # 用户通行证（玩家端）独立端口；后台接口在这个端口上不存在
  enabled: true
  addr: 0.0.0.0:22634
  timeout: 15s
  # 对外地址：OIDC issuer 与邮件链接使用；留空按请求的 Host 推断
  public_url: ""
data:
  database:
    driver: sqlite3
    source: file:./data/momoko.db?_pragma=foreign_keys(1)
auth:
  # JWT 签名与敏感数据加密的主密钥，必须为高强度随机字符串（建议 ≥32 字符）。
  # 留空或使用弱/默认密钥将导致服务拒绝启动；全新部署时初始化向导会自动生成。
  secret: "momoko:jwt:hs256:v1"