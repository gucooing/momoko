syntax = "proto3";
package kratos.api;

option go_package = "kratos-admin/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Auth auth = 3;
  Passport passport = 4;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
    // TLS 证书文件（PEM）；与 tls_key_file 同时配置时节点 gRPC 端口启用 TLS
    string tls_cert_file = 4;
    // TLS 私钥文件（PEM）
    string tls_key_file = 5;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  Database database = 1;
}

message Auth {
  string secret = 1;
}

// 用户通行证：玩家端独立 HTTP server，只注册玩家路由。
message Passport {
  // 是否启用；不写时默认启用
  optional bool enabled = 1;
  // 监听地址，默认 0.0.0.0:22634
  string addr = 2;
  // 对外地址（OIDC issuer、邮件里的链接），例如 https://passport.example.com；空时按请求的 Host 推断
  string public_url = 3;
  google.protobuf.Duration timeout = 4;
}
