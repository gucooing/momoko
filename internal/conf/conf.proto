syntax = "proto3";
package kratos.api;

option go_package = "kratos-admin/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Auth auth = 3;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
    // TLS 证书文件（PEM）；与 tls_key_file 同时配置时节点 gRPC 端口启用 TLS
    string tls_cert_file = 4;
    // TLS 私钥文件（PEM）
    string tls_key_file = 5;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  Database database = 1;
}

message Auth {
  string secret = 1;
}