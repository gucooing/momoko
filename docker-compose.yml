services:
  momoko:
    image: ${MOMOKO_IMAGE:-gucooing/momoko:latest}
    container_name: momoko
    restart: unless-stopped
    # depends_on:
    #   mysql:
    #     condition: service_healthy
    network_mode: host
    volumes:
      - ./configs:/app/configs
      - ./data:/app/data
      - ./servers:/app/servers
    command: ["/app/momoko"]

